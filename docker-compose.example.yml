services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mewdeko
      POSTGRES_USER: mewdeko
      POSTGRES_PASSWORD: replace-this-database-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mewdeko -d mewdeko"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mewdeko:
    image: sylveondeko/mewdeko:nightly
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - mewdeko-data:/app/data
      - mewdeko-logs:/app/logs

  dashboard:
    image: sylveondeko/mewdash:nightly
    restart: unless-stopped
    depends_on:
      - mewdeko
    env_file:
      - ./dashboard.env
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
  mewdeko-data:
  mewdeko-logs:
