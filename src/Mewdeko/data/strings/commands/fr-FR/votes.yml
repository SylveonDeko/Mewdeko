votechannel:
  args:
    - channel
  desc: >-
    Définit le canal texte spécifié comme canal de vote où toutes les
    confirmations de vote seront envoyées.
  params:
    - &ref_646
      desc: 'Le canal texte à définir comme canal de vote.'
      name: channel
      optional: false
      type: ITextChannel
