votemessage:
  args:
    - '[message]'
  desc: >-
    Définit un message personnalisé à envoyer quand un utilisateur vote ou
    prévisualise le message de vote actuel.
  params:
    - desc: 'Le message personnalisé pour les votes. Utilisez "-" pour réinitialiser au message par défaut. Si nul, prévisualise le message de vote actuel.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: >-
    Lance un processus de confirmation pour définir un nouveau mot de passe de
    vote, avertissant l''utilisateur de sa sécurité.
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: >-
    Ajoute un rôle à accorder aux utilisateurs quand ils votent, avec une
    durée optionnelle pour que le rôle soit automatiquement supprimé.
  params:
    - desc: 'Le rôle à ajouter comme récompense de vote.'
      name: role
      optional: false
      type: role
    - desc: 'La durée pour laquelle le rôle sera accordé. Nul pour indéfini.'
      name: time
      optional: true
      type: duration
