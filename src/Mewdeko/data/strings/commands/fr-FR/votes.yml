votemessage:
  args:
    - '[message]'
  desc: 'Définit un message personnalisé envoyé lorsqu''un utilisateur vote, ou pour prévisualiser le message de vote actuel.'
  params:
    - desc: 'Le message personnalisé à définir pour les votes. Utilisez "-" pour revenir au message par défaut. Si null, prévisualise le message de vote actuel.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: 'Lance une procédure de confirmation pour définir un nouveau mot de passe de vote, en avertissant l''utilisateur de sa sécurité.'
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: 'Ajoute un rôle attribué aux utilisateurs lorsqu''ils votent, avec une durée facultative au terme de laquelle le rôle est retiré automatiquement.'
  params:
    - desc: 'Le rôle à ajouter comme récompense de vote.'
      name: role
      optional: false
      type: role
    - desc: 'La durée pendant laquelle le rôle sera attribué. Null pour une durée indéfinie.'
      name: time
      optional: true
      type: duration
