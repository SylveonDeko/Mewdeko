votes:
  args:
    - '[@user]'
  desc: >-
    Affiche le nombre total de votes émis par un utilisateur spécifique ou
    l''invocateur de la commande.
  params:
    - desc: 'L''utilisateur dont les votes doivent être comptés. Si nul, compte les votes de l''invocateur de la commande.'
      name: user
      optional: true
      type: user
votesleaderboard:
  args:
    - false
  desc: >-
    Affiche un classement des utilisateurs basé sur leur nombre de votes,
    filtrant optionnellement les votes du mois en cours.
  params:
    - desc: >-
        Affiche un classement des utilisateurs basé sur leur nombre de votes,
