votes:
  args:
    - '[@user]'
  desc: 'Affiche le nombre total de votes émis par un utilisateur précis ou par la personne qui exécute la commande.'
  params:
    - desc: 'L''utilisateur dont compter les votes. Si null, compte les votes de la personne qui exécute la commande.'
      name: user
      optional: true
      type: user
