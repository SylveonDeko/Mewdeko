votechannel:
  args:
    - channel
  desc: 'Définit le salon textuel indiqué comme salon de vote où seront envoyées toutes les confirmations de vote.'
  params:
    - &ref_646
      desc: 'Le salon textuel à définir comme salon de vote.'
      name: channel
      optional: false
      type: ITextChannel
