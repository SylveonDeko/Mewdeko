    - &ref_228
      desc: 'L''utilisateur à qui attribuer de la réputation.'
      name: target
      optional: true
      type: IGuildUser
    - &ref_229
      desc: 'Le type de réputation à attribuer.'
      name: repType
      optional: true
      type: string
    - &ref_230
      desc: 'Raison ou commentaire facultatif pour l''attribution de réputation.'
      name: reason
      optional: true
      type: string
checkrep:
  args:
    - '@user'
  desc: 'Vérifie la réputation d''un utilisateur.'
  params:
