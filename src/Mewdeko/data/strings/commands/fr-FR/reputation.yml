      name: target
      optional: false
      type: string
reprole:
  args:
    - ''
    - detailed
    - '@role'
    - '@role 100'
    - '@role 100 false #channel true 50'
  desc: 'Gère les récompenses de rôle pour les paliers de réputation. Utilisez sans paramètres pour afficher toutes les récompenses, ou indiquez un rôle et une réputation pour ajouter ou modifier une récompense avec des paramètres avancés facultatifs.'
  params:
    - &ref_437
      desc: 'Le rôle à attribuer (facultatif pour l''affichage).'
      name: role
      optional: true
      type: IRole
    - desc: 'La réputation requise pour obtenir ce rôle (facultatif pour l''affichage).'
      name: reputation
      optional: true
      type: int
    - desc: 'Indique s''il faut retirer le rôle si la réputation baisse.'
      name: removeOnDrop
      optional: true
      type: bool
    - desc: 'Salon facultatif pour annoncer l''attribution des rôles.'
      name: announceChannel
      optional: true
      type: ITextChannel
    - desc: 'Indique s''il faut envoyer des notifications par MP.'
      name: announceDm
      optional: true
      type: bool
    - desc: 'Récompense d''XP facultative pour l''atteinte du palier.'
      name: xpReward
      optional: true
      type: int
    - desc: 'Affiche des informations détaillées lors de l''affichage de la liste (utilisez ''detailed'' comme premier paramètre).'
      name: detailed
      optional: true
      type: string
reprolechannel:
  args:
    - role channel
  desc: 'Définit le salon d''annonces pour une récompense de rôle.'
  params:
    - desc: 'Le rôle à configurer.'
      name: role
      optional: false
      type: IRole
    - desc: 'Le salon des annonces (null pour désactiver).'
      name: channel
      optional: true
      type: ITextChannel
reproleremove:
  args:
    - '@role'
  desc: 'Supprime la configuration d''une récompense de rôle.'
  params:
