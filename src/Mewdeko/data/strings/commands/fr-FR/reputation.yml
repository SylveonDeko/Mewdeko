repanonymous:
  args:
    - enabled
  desc: 'Active ou désactive l''attribution anonyme de réputation.'
  params:
    - desc: 'True pour activer la réputation anonyme.'
      name: enabled
      optional: false
      type: bool
repchannel:
  args:
    - '#channel state number'
  desc: 'Configure les paramètres de réputation propres à un salon.'
  params:
    - desc: 'Le salon à configurer.'
      name: channel
      optional: false
      type: ITextChannel
    - desc: 'L''état à définir (enabled/disabled/readonly).'
      name: state
      optional: true
      type: string
    - desc: 'Le multiplicateur de réputation pour ce salon.'
      name: multiplier
      optional: true
      type: decimal
repcheck:
  args:
    - '@user'
  desc: 'Vérifie la réputation d''un utilisateur.'
  params:
    - desc: 'L''utilisateur dont vérifier la réputation. Si null, vérifie la réputation de l''auteur de la commande.'
      name: target
      optional: true
      type: IGuildUser
repcommandbypass:
  args:
    - commandname '@role'
  desc: 'Définit les rôles pouvant contourner une condition de commande.'
  params:
    - &ref_426
      desc: 'Le nom de la commande.'
      name: commandName
      optional: false
      type: string
    - desc: 'Les rôles pouvant contourner la condition.'
      name: roles
      optional: false
      type: IRole[]
repcommandinfo:
  args:
    - commandname
  desc: 'Affiche les conditions de réputation d''une commande précise.'
  params:
    - desc: 'La commande à vérifier.'
      name: commandName
      optional: false
      type: string
repcommandreq:
  args:
    - commandname 50
    - commandname 50 helper
    - 'commandname 50 helper #channel1 #channel2'
  desc: 'Définit les conditions de réputation d''une commande, éventuellement limitées à certains salons.'
  params:
    - desc: 'Le nom de la commande.'
      name: commandName
      optional: false
      type: string
    - desc: 'La réputation minimale requise.'
      name: minReputation
      optional: false
      type: int
    - desc: 'Le type de réputation précis requis (facultatif, total par défaut).'
      name: repType
      optional: true
      type: string
    - desc: 'Salons facultatifs où s''applique cette condition (si aucun n''est indiqué, elle s''applique globalement).'
      name: channels
      optional: true
      type: ITextChannel[]
repcommandreqlist:
  args:
    - ''
  desc: 'Liste toutes les conditions de commande du serveur.'
  params: [ ]
repcommandreqremove:
  args:
    - commandname
  desc: 'Supprime les conditions de réputation d''une commande.'
  params:
    - desc: 'Le nom de la commande.'
      name: commandName
      optional: false
      type: string
repconfig:
  args:
    - ''
  desc: 'Ouvre l''interface interactive de configuration de la réputation.'
  params: [ ]
repcooldown:
  args:
    - minutes
  desc: 'Définit le délai d''attente par défaut entre deux attributions de réputation.'
  params:
    - desc: 'Délai d''attente en minutes (1-1440).'
      name: minutes
      optional: false
      type: int
repdailylimit:
  args:
    - limit
  desc: 'Définit la limite quotidienne d''attribution de réputation.'
  params:
    - desc: 'Limite quotidienne (1-100).'
      name: limit
      optional: false
      type: int
repdecay:
  args:
    - enabled
  desc: 'Active ou désactive la dégradation de la réputation pour les utilisateurs inactifs.'
  params:
    - desc: 'True pour activer la dégradation.'
      name: enabled
      optional: false
      type: bool
repdecayamount:
  args:
    - amount
  desc: 'Définit le montant de la dégradation.'
  params:
    - desc: 'Le montant de la dégradation (1-100).'
      name: amount
      optional: false
      type: int
repdecayinactive:
  args:
    - days
  desc: 'Définit le nombre de jours d''inactivité avant le début de la dégradation.'
  params:
    - desc: 'Jours d''inactivité (1-365).'
      name: days
      optional: false
      type: int
repdecaytype:
  args:
    - type
  desc: 'Définit le type de dégradation (daily, weekly, monthly).'
  params:
    - desc: 'Le type de dégradation.'
      name: type
      optional: false
      type: string
repenable:
  args:
    - enabled
  desc: 'Active ou désactive le système de réputation pour ce serveur.'
  params:
    - desc: 'True pour activer, false pour désactiver.'
      name: enabled
      optional: true
      type: bool
repeventcreate:
  args:
    - name multiplier duration
  desc: 'Crée un événement de multiplicateur de réputation.'
  params:
    - desc: 'Nom de l''événement.'
      name: name
      optional: false
      type: string
    - desc: 'Multiplicateur de réputation.'
      name: multiplier
      optional: false
      type: decimal
    - desc: 'Durée en heures.'
      name: duration
      optional: false
      type: int
repeventend:
  args:
    - name
  desc: 'Termine prématurément un événement de réputation.'
  params:
    - desc: 'Nom de l''événement à terminer.'
      name: name
      optional: false
      type: string
repexport:
  args:
    - ''
  desc: 'Exporte la configuration actuelle de la réputation au format JSON.'
  params: [ ]
