  args:
    - '@user reptype text'
  desc: 'Attribue de la réputation à un utilisateur précis.'
  params:
    - desc: 'L''utilisateur à qui attribuer de la réputation.'
      name: target
      optional: true
      type: IGuildUser
    - desc: 'Le type de réputation à attribuer.'
      name: repType
      optional: true
      type: string
    - desc: 'Raison ou commentaire facultatif pour l''attribution de réputation.'
      name: reason
      optional: true
      type: string
rephistory:
  args:
    - '@user'
  desc: 'Affiche l''historique de réputation d''un utilisateur.'
