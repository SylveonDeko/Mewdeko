    - desc: 'L''utilisateur dont afficher l''historique. Si null, affiche l''historique de l''auteur de la commande.'
      name: target
      optional: true
      type: IGuildUser
repimport:
  args:
    - ''
  desc: 'Importe la configuration de la réputation depuis un fichier JSON envoyé.'
