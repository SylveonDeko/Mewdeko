afktimeout:
  args:
    - time
  desc: >-
    Definit la duree d''inactivite avant qu''un utilisateur ne soit plus
    considere comme AFK. Se declenche lorsqu''un utilisateur envoie un message
    ou ecrit dans un canal.
  params:
    - &ref_53
      desc: 'La duree d''expiration pour le statut AFK.'
      name: time
      optional: false
      type: StoopidTime
