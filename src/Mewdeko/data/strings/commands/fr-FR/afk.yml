customafkmessage:
  args:
    - text
  desc: >-
    Definit un embed AFK personnalise qui s''affichera lorsqu''un utilisateur
    est AFK. Utilisez "-" pour reinitialiser a l''embed par defaut. Consultez
    https://eb.mewdeko.tech pour le constructeur d''embeds et
    http://mewdeko.tech/placeholders pour les espaces reservees.
  params:
    - &ref_175
      desc: 'Le message personnalise a definir. Utilisez "-" pour reinitialiser au message par defaut.'
      name: embedCode
      optional: false
      type: string
