mcstatus:
  args:
    - '[server name or address]'
  desc: 'Vérifie le statut d''un serveur Minecraft. Utilisez un nom de serveur enregistré, une adresse directe, ou laissez vide pour le serveur par défaut.'
  params:
    - desc: 'Le nom de serveur enregistré ou l''adresse directe (par ex. play.example.com:25565).'
      name: serverName
      optional: true
      type: string
mcadd:
  args:
    - name address
  desc: 'Ajoute un serveur Minecraft au serveur Discord. Préfixez l''adresse avec bedrock: pour les serveurs Bedrock.'
  params:
    - desc: 'Un libellé pour le serveur.'
      name: name
      optional: false
      type: string
    - desc: 'L''adresse du serveur, avec le port facultatif (par ex. play.example.com:25565 ou bedrock:play.example.com).'
      name: address
      optional: false
      type: string
mcremove:
  args:
    - name
  desc: 'Retire un serveur Minecraft du serveur Discord.'
  params:
    - desc: 'Le nom du serveur à retirer.'
      name: name
      optional: false
      type: string
mclist:
  args:
    - ''
  desc: 'Liste tous les serveurs Minecraft enregistrés pour ce serveur Discord.'
  params: [ ]
mcdefault:
  args:
    - name
  desc: 'Définit un serveur comme serveur par défaut pour les commandes de statut.'
  params:
    - desc: 'Le nom du serveur à définir par défaut.'
      name: name
      optional: false
      type: string
mcwatch:
  args:
    - name '#channel'
  desc: 'Définit un salon qui reçoit des mises à jour périodiques du statut d''un serveur. Omettez le salon pour désactiver.'
  params:
    - desc: 'Le nom du serveur à surveiller.'
      name: serverName
      optional: false
      type: string
    - desc: 'Le salon où publier les mises à jour.'
      name: channel
      optional: true
      type: ITextChannel
mcwatchmode:
  args:
    - name embed|topic|both
  desc: 'Définit l''affichage du statut du serveur : embed (modifié sur place), sujet du salon, ou les deux.'
  params:
    - desc: 'Le nom du serveur.'
      name: serverName
      optional: false
      type: string
    - desc: 'Le mode de surveillance : Embed, ChannelTopic ou Both.'
      name: mode
      optional: false
      type: McWatchMode
mcembed:
  args:
    - name template
  desc: 'Définit un modèle d''embed personnalisé pour un serveur surveillé. Utilisez "-" pour revenir au défaut. Placeholders : %mc.server.name%, %mc.players.online%, %mc.players.max%, %mc.motd%, %mc.version%, %mc.latency%, %mc.online%, %mc.favicon%.'
  params:
    - desc: 'Le nom du serveur.'
      name: serverName
      optional: false
      type: string
    - desc: 'Le JSON du modèle d''embed, ou "-" pour revenir au défaut.'
      name: template
      optional: true
      type: string
mcplayer:
  args:
    - username
  desc: 'Recherche un joueur Minecraft par pseudo et affiche son profil et son skin.'
  params:
    - desc: 'Le pseudo Minecraft à rechercher.'
      name: username
      optional: false
      type: string
mcskin:
  args:
    - username
  desc: 'Affiche le rendu du skin d''un joueur Minecraft.'
  params:
    - desc: 'Le pseudo Minecraft.'
      name: username
      optional: false
      type: string
mcrcon:
  args:
    - name command
  desc: 'Envoie une commande RCON à un serveur Minecraft enregistré. RCON doit être configuré via le tableau de bord.'
  params:
    - desc: 'Le nom du serveur.'
      name: serverName
      optional: false
      type: string
    - desc: 'La commande à exécuter sur le serveur.'
      name: command
      optional: false
      type: string
mcwhitelist:
  args:
    - name add|remove|list|on|off|reload [player]
  desc: 'Gère la liste blanche (whitelist) d''un serveur Minecraft via RCON. RCON doit être configuré.'
  params:
    - desc: 'Le nom du serveur.'
      name: serverName
      optional: false
      type: string
    - desc: 'L''action : add, remove, list, on, off, reload.'
      name: action
      optional: false
      type: string
    - desc: 'Le nom du joueur (pour add/remove).'
      name: playerName
      optional: true
      type: string
