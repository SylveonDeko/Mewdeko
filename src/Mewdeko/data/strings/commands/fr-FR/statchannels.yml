statchannelcreate:
  args:
    - 'TotalMembers [template]'
  desc: 'Crée un nouveau salon vocal verrouillé affichant une statistique du serveur. Le bot créera et gérera le salon.'
  params:
    - desc: 'Le type de statistique à afficher.'
      name: type
      optional: false
      type: StatChannelType
    - desc: 'Le modèle d''affichage. Utilisez %count% pour la valeur.'
      name: template
      optional: true
      type: string
statchanneladd:
  args:
    - '#voice-channel TotalMembers [template]'
  desc: 'Ajoute un salon vocal comme salon de statistiques. Types : TotalMembers, HumanMembers, BotCount, OnlineMembers, ChannelCount, RoleCount, BoostCount, BoostLevel, EmojiCount.'
  params:
    - desc: 'Le salon vocal à utiliser.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Le type de statistique à afficher.'
      name: type
      optional: false
      type: StatChannelType
    - desc: 'Le modèle d''affichage. Utilisez %count% pour la valeur.'
      name: template
      optional: true
      type: string
statchannelrole:
  args:
    - '#voice-channel @role [template]'
  desc: 'Ajoute un salon de statistiques indiquant le nombre de membres possédant un rôle précis.'
  params:
    - desc: 'Le salon vocal à utiliser.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Le rôle dont compter les membres.'
      name: role
      optional: false
      type: IRole
    - desc: 'Le modèle d''affichage. Utilisez %count% et %role.name%.'
      name: template
      optional: true
      type: string
statchannelcountdown:
  args:
    - '#voice-channel 2026-12-31 [template]'
  desc: 'Ajoute un salon de statistiques de compte à rebours. Utilisez les espaces réservés %days% et %hours%.'
  params:
    - desc: 'Le salon vocal à utiliser.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'La date cible du compte à rebours.'
      name: date
      optional: false
      type: DateTime
    - desc: 'Le modèle d''affichage. Utilisez %days% et %hours%.'
      name: template
      optional: true
      type: string
statchannelgoal:
  args:
    - '#voice-channel 1000 [template]'
  desc: 'Ajoute un salon de statistiques d''objectif de membres. Utilisez %count%, %goal% et %goal.percent%.'
  params:
    - desc: 'Le salon vocal à utiliser.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Le nombre de membres visé.'
      name: goal
      optional: false
      type: int
    - desc: 'Le modèle d''affichage. Utilisez %count%, %goal%, %goal.percent%.'
      name: template
      optional: true
      type: string
statchannelremove:
  args:
    - '#voice-channel'
  desc: 'Supprime un salon de statistiques.'
  params:
    - desc: 'Le salon vocal à supprimer.'
      name: channel
      optional: false
      type: IVoiceChannel
statchannellist:
  args:
    - ''
  desc: 'Affiche tous les salons de statistiques de ce serveur.'
  params: [ ]
statchanneltwitchcounter:
  args:
    - '#voice-channel counter [template]'
  desc: 'Configure un salon de statistiques pour afficher un compteur Twitch.'
statchannelmechanism:
  args:
    - '#voice-channel Rename|Recreate|Auto [interval-minutes]'
  desc: 'Définit le mécanisme de mise à jour d''un salon de statistiques.'
statchannelstyle:
  args:
    - '#voice-channel Plain|Comma|Abbreviated|ProgressBar'
  desc: 'Définit le style d''affichage d''un salon de statistiques.'
statchanneldefaults:
  args:
    - '[Rename|Recreate|Auto] [interval-minutes] [Plain|Comma|Abbreviated|ProgressBar]'
  desc: 'Affiche les paramètres par défaut des salons de statistiques.'
statchanneltypes:
  args:
    - ''
  desc: 'Affiche les types de salons de statistiques disponibles.'
