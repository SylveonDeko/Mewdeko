todoadd:
  args:
    - listId
    - title
    - description
  desc: 'Ajoute un nouvel élément à faire dans une liste donnée'
  params:
    - desc: 'L''ID de la liste de tâches.'
      name: listId
      optional: false
      type: int
    - desc: 'Le titre de l''élément à faire.'
      name: title
      optional: false
      type: string
    - desc: 'Description facultative de l''élément.'
      name: description
      optional: true
      type: string
todoaddpriority:
  args:
    - listId
    - priority
    - title
    - description
  desc: 'Ajoute un élément à faire avec une priorité et une date limite facultative'
  params:
    - desc: 'L''ID de la liste de tâches.'
      name: listId
      optional: false
      type: int
    - desc: 'Niveau de priorité (1=Faible, 2=Moyenne, 3=Élevée, 4=Critique).'
      name: priority
      optional: false
      type: int
    - desc: 'Le titre de l''élément à faire.'
      name: title
      optional: false
      type: string
    - desc: 'Description facultative de l''élément.'
      name: description
      optional: true
      type: string
todoaddtag:
  args:
    - itemId
    - tag
  desc: 'Ajoute un tag à un élément à faire'
  params:
    - desc: 'L''ID de l''élément à faire.'
      name: itemId
      optional: false
      type: int
    - desc: 'Le tag à ajouter.'
      name: tag
      optional: false
      type: string
todocleardue:
  args:
    - itemId
  desc: 'Supprime la date limite d''un élément à faire'
  params:
    - desc: 'L''ID de l''élément à faire.'
      name: itemId
      optional: false
      type: int
todoclearreminder:
  args:
    - itemId
  desc: 'Supprime le rappel d''un élément à faire'
  params:
    - desc: 'L''ID de l''élément à faire.'
      name: itemId
      optional: false
      type: int
todocomplete:
  args:
    - itemId
  desc: 'Marque un élément à faire comme terminé'
  params:
    - desc: 'L''ID de l''élément à faire.'
      name: itemId
      optional: false
      type: int
todocreatelist:
  args:
    - name
    - description
  desc: 'Crée une nouvelle liste de tâches'
  params:
    - desc: 'Le nom de la liste de tâches.'
      name: name
      optional: false
      type: string
    - desc: 'Description facultative de la liste.'
      name: description
      optional: true
      type: string
todocreateserverlist:
  args:
    - name
    - description
  desc: 'Crée une nouvelle liste de tâches à l''échelle du serveur (réservé aux administrateurs)'
  params:
    - desc: 'Le nom de la liste de tâches du serveur.'
      name: name
      optional: false
      type: string
    - desc: 'Description facultative de la liste.'
      name: description
      optional: true
      type: string
tododelete:
  args:
    - itemId
  desc: 'Supprime un élément à faire'
  params:
    - desc: 'L''ID de l''élément à faire.'
      name: itemId
      optional: false
      type: int
tododeletelist:
  args:
    - listId
  desc: 'Supprime une liste de tâches entière'
  params:
    - desc: 'L''ID de la liste de tâches.'
      name: listId
      optional: false
      type: int
todoedit:
  args:
    - itemId
    - title
    - description
  desc: 'Modifie le titre et la description d''un élément à faire'
  params:
    - desc: 'L''ID de l''élément à faire.'
      name: itemId
      optional: false
      type: int
    - desc: 'Le nouveau titre.'
      name: title
      optional: false
      type: string
    - desc: 'La nouvelle description.'
      name: description
      optional: true
      type: string
todofilter:
  args:
    - listId
    - filter
    - value
  desc: 'Filtre les éléments à faire par tag ou priorité'
  params:
    - desc: 'L''ID de la liste de tâches.'
      name: listId
      optional: false
      type: int
    - desc: 'Type de filtre (tag ou priority).'
      name: filter
      optional: false
      type: string
    - desc: 'La valeur à filtrer.'
      name: value
      optional: true
      type: string
todogrant:
  args:
    - listId
    - '@user'
    - permissions
  desc: 'Accorde des permissions à un utilisateur sur une liste de tâches (réservé au propriétaire ou à l''administrateur de la liste)'
  params:
    - desc: 'L''ID de la liste de tâches.'
      name: listId
      optional: false
      type: int
    - desc: 'L''utilisateur auquel accorder les permissions.'
      name: user
      optional: false
      type: IUser
    - desc: 'Permissions séparées par des virgules (view,add,edit,complete,delete,manage,all).'
      name: permissions
      optional: false
      type: string
todolists:
  args:
    - includeServer
  desc: 'Affiche toutes les listes de tâches accessibles à l''utilisateur'
  params:
    - desc: 'Indique s''il faut inclure les listes à l''échelle du serveur.'
      name: includeServer
      optional: true
      type: bool
todopermissions:
  args:
    - listId
  desc: 'Affiche toutes les permissions d''une liste de tâches'
  params:
    - desc: 'L''ID de la liste de tâches.'
      name: listId
      optional: false
      type: int
todoremovetag:
  args:
    - itemId
    - tag
  desc: 'Supprime un tag d''un élément à faire'
  params:
    - desc: 'L''ID de l''élément à faire.'
      name: itemId
      optional: false
      type: int
    - desc: 'Le tag à supprimer.'
      name: tag
      optional: false
      type: string
todoreorder:
  args:
    - itemId
    - newPosition
  desc: 'Déplace un élément à faire à une nouvelle position'
  params:
    - desc: 'L''ID de l''élément à faire.'
      name: itemId
      optional: false
      type: int
    - desc: 'La nouvelle position (à partir de 1).'
      name: newPosition
      optional: false
      type: int
todorevoke:
  args:
    - listId
    - '@user'
  desc: 'Révoque toutes les permissions d''un utilisateur sur une liste de tâches'
  params:
    - desc: 'L''ID de la liste de tâches.'
      name: listId
      optional: false
      type: int
    - desc: 'L''utilisateur dont révoquer les permissions.'
      name: user
      optional: false
      type: IUser
todosearch:
  args:
    - listId
    - query
  desc: 'Recherche des éléments à faire dans une liste'
  params:
    - desc: 'L''ID de la liste de tâches.'
      name: listId
      optional: false
      type: int
    - desc: 'La requête de recherche.'
      name: query
      optional: false
      type: string
todosetcolor:
  args:
    - listId
    - color
  desc: 'Définit la couleur d''une liste de tâches'
  params:
    - desc: 'L''ID de la liste de tâches.'
      name: listId
      optional: false
      type: int
    - desc: 'Code couleur hexadécimal, par ex. #ff0000.'
      name: color
      optional: false
      type: string
todosetdue:
  args:
    - itemId
    - dateString
  desc: 'Définit la date limite d''un élément à faire'
  params:
    - desc: 'L''ID de l''élément à faire.'
      name: itemId
      optional: false
      type: int
    - desc: 'La date et l''heure limites.'
      name: dateString
      optional: false
      type: string
todosetreminder:
  args:
    - itemId
    - dateString
  desc: 'Définit une heure de rappel pour un élément à faire'
  params:
    - desc: 'L''ID de l''élément à faire.'
      name: itemId
      optional: false
      type: int
    - desc: 'La date et l''heure du rappel.'
      name: dateString
      optional: false
      type: string
todoshow:
  args:
    - listId
    - includeCompleted
  desc: 'Affiche tous les éléments d''une liste de tâches'
  params:
    - desc: 'L''ID de la liste de tâches.'
      name: listId
      optional: false
      type: int
    - desc: 'Indique s''il faut inclure les éléments terminés.'
      name: includeCompleted
      optional: true
      type: bool
todotoggleprivacy:
  args:
    - listId
  desc: 'Active ou désactive le paramètre de confidentialité d''une liste de tâches'
  params:
    - desc: 'L''ID de la liste de tâches.'
      name: listId
      optional: false
      type: int