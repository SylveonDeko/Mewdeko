countingban:
  args:
    - user channel duration reason
  desc: 'Bannit un utilisateur du comptage dans un salon précis.'
  params:
    - desc: 'L''utilisateur à bannir du comptage.'
      name: user
      optional: false
      type: guild user
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Durée du bannissement (par ex. 1h, 1d). Laissez vide pour un bannissement permanent.'
      name: duration
      optional: true
      type: stoopid time
    - desc: 'La raison du bannissement.'
      name: reason
      optional: true
      type: string
countingconfig:
  args:
    - channel
  desc: 'Configure les paramètres d''un salon de comptage.'
  params:
    - desc: 'Le salon dont afficher la configuration. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
countingcooldown:
  args:
    - channel seconds
  desc: 'Définit le délai d''attente entre les nombres de chaque utilisateur.'
  params:
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Délai d''attente en secondes (0-300).'
      name: seconds
      optional: true
      type: int
countingdisable:
  args:
    - channel purgeData reason
  desc: 'Désactive le comptage dans un salon et, facultativement, purge toutes les données.'
  params:
    - desc: 'Le salon où désactiver le comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Indique s''il faut supprimer toutes les données de comptage de ce salon. Par défaut, false.'
      name: purgeData
      optional: true
      type: bool
    - desc: 'La raison de la désactivation du comptage.'
      name: reason
      optional: true
      type: string
countingfailurechannel:
  args:
    - countingChannel failureChannel
  desc: 'Définit le salon où les échecs de comptage sont journalisés.'
  params:
    - desc: 'Le salon de comptage.'
      name: countingChannel
      optional: true
      type: text channel
    - desc: 'Le salon des logs d''échecs. Utilisez null pour désactiver.'
      name: failureChannel
      optional: true
      type: text channel
countingfailuremessage:
  args:
    - channel embed
  desc: 'Définit un message personnalisé pour les comptages erronés.'
  params:
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Le modèle de message. Utilisez "-" pour revenir au message par défaut.'
      name: embed
      optional: true
      type: string
countingfailurethreshold:
  args:
    - channel threshold
  desc: 'Définit le seuil d''échecs avant les conséquences.'
  params:
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Nombre d''échecs avant une action (1-10).'
      name: threshold
      optional: true
      type: int
countingleaderboard:
  args:
    - type channel
  desc: 'Affiche le classement d''un salon de comptage.'
  params:
    - desc: 'Le type de classement (contributions, streak, accuracy, totalnumbers).'
      name: type
      optional: true
      type: string
    - desc: 'Le salon dont afficher le classement. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
countinglist:
  args:
    - ''
  desc: 'Liste tous les salons de comptage actifs du serveur.'
  params: [ ]
countingmilestonechannel:
  args:
    - countingChannel milestoneChannel
  desc: 'Définit le salon où les jalons atteints sont annoncés.'
  params:
    - desc: 'Le salon de comptage.'
      name: countingChannel
      optional: true
      type: text channel
    - desc: 'Le salon des annonces de jalons. Utilisez null pour désactiver.'
      name: milestoneChannel
      optional: true
      type: text channel
countingmilestonemessage:
  args:
    - channel embed
  desc: 'Définit un message personnalisé pour les jalons atteints.'
  params:
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Le modèle de message. Utilisez "-" pour revenir au message par défaut.'
      name: embed
      optional: true
      type: string
countingmilestones:
  args:
    - channel milestones
  desc: 'Définit des nombres de jalons personnalisés.'
  params:
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Nombres de jalons séparés par des virgules (par ex. 50,100,250,500,1000).'
      name: milestones
      optional: true
      type: string
countingreset:
  args:
    - channel newNumber reason
  desc: 'Réinitialise le comptage d''un salon à un nombre précis.'
  params:
    - desc: 'Le salon à réinitialiser. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Le nombre auquel revenir. Par défaut 0.'
      name: newNumber
      optional: true
      type: long
    - desc: 'La raison de la réinitialisation.'
      name: reason
      optional: true
      type: string
countingrestore:
  args:
    - saveId channel
  desc: 'Restaure le comptage à partir d''un point de sauvegarde précédent.'
  params:
    - desc: 'L''ID du point de sauvegarde à restaurer.'
      name: saveId
      optional: false
      type: int
    - desc: 'Le salon à restaurer. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
countingsave:
  args:
    - channel reason
  desc: 'Crée un point de sauvegarde de la progression actuelle du comptage.'
  params:
    - desc: 'Le salon à sauvegarder. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'La raison de la création du point de sauvegarde.'
      name: reason
      optional: true
      type: string
countingsetup:
  args:
    - channel startNumber increment
  desc: 'Configure le comptage dans le salon actuel ou dans un salon indiqué.'
  params:
    - desc: 'Le salon où configurer le comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Le nombre à partir duquel commencer à compter. Par défaut 1.'
      name: startNumber
      optional: true
      type: long
    - desc: 'L''incrément à chaque comptage. Par défaut 1.'
      name: increment
      optional: true
      type: int
countingstats:
  args:
    - user channel
  desc: 'Affiche les statistiques de comptage d''un utilisateur ou d''un salon.'
  params:
    - desc: 'L''utilisateur dont afficher les statistiques. Par défaut, vous.'
      name: user
      optional: true
      type: user
    - desc: 'Le salon où consulter les statistiques. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
countingstatus:
  args:
    - channel
  desc: 'Affiche le statut actuel du comptage dans un salon.'
  params:
    - desc: 'Le salon à vérifier. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
countingsuccessmessage:
  args:
    - channel embed
  desc: 'Définit un message personnalisé pour les comptages réussis.'
  params:
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Le modèle de message. Utilisez "-" pour revenir au message par défaut.'
      name: embed
      optional: true
      type: string
countingtimeout:
  args:
    - user duration channel reason
  desc: 'Met temporairement un utilisateur en timeout pour le comptage.'
  params:
    - desc: 'L''utilisateur à mettre en timeout pour le comptage.'
      name: user
      optional: false
      type: guild user
    - desc: 'Durée du timeout (par ex. 30m, 2h).'
      name: duration
      optional: false
      type: stoopid time
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'La raison du timeout.'
      name: reason
      optional: true
      type: string
countingunban:
  args:
    - user channel reason
  desc: 'Lève le bannissement d''un utilisateur du comptage dans un salon précis.'
  params:
    - desc: 'L''utilisateur dont lever le bannissement du comptage.'
      name: user
      optional: false
      type: guild user
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'La raison de la levée du bannissement.'
      name: reason
      optional: true
      type: string
countmodbanned:
  args:
    - channel roles...
  desc: 'Définit les rôles bannis du comptage.'
  params:
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Rôles bannis du comptage.'
      name: roles
      optional: true
      type: role
countmodclear:
  args:
    - user channel
  desc: 'Efface les comptages erronés d''un utilisateur dans un salon de comptage.'
  params:
    - desc: 'L''utilisateur dont effacer les comptages erronés.'
      name: user
      optional: false
      type: user
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
countmodclearall:
  args:
    - channel
  desc: 'Efface les comptages erronés de tous les utilisateurs dans un salon de comptage.'
  params:
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
countmoddefaults:
  args:
    - enabled threshold windowHours punishment durationMinutes punishmentRole
  desc: 'Définit les paramètres de modération par défaut pour l''ensemble du serveur.'
  params:
    - desc: 'Indique si la modération est activée par défaut.'
      name: enabled
      optional: false
      type: bool
    - desc: 'Seuil de comptages erronés par défaut avant sanction.'
      name: threshold
      optional: true
      type: int
    - desc: 'Fenêtre temporelle par défaut, en heures, pour suivre les comptages erronés.'
      name: windowHours
      optional: true
      type: int
    - desc: 'Action de sanction par défaut à appliquer.'
      name: punishment
      optional: true
      type: punishment action
    - desc: 'Durée par défaut des sanctions temporisées, en minutes.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Rôle par défaut pour le type de sanction AddRole.'
      name: punishmentRole
      optional: true
      type: role
countmodedits:
  args:
    - punish delete channel
  desc: 'Configure la protection contre la modification des messages pour un salon de comptage.'
  params:
    - desc: 'Indique s''il faut sanctionner les modifications de messages comme des infractions.'
      name: punish
      optional: false
      type: bool
    - desc: 'Indique s''il faut supprimer les messages modifiés.'
      name: delete
      optional: true
      type: bool
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
countmodenable:
  args:
    - enabled channel
  desc: 'Active ou désactive la modération pour un salon de comptage précis.'
  params:
    - desc: 'Indique s''il faut activer ou désactiver la modération.'
      name: enabled
      optional: false
      type: bool
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
countmodignore:
  args:
    - deleteMessages channel roles...
  desc: 'Définit les rôles à ignorer pour le comptage.'
  params:
    - desc: 'Indique s''il faut supprimer les messages des rôles ignorés.'
      name: deleteMessages
      optional: false
      type: bool
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Rôles à ignorer pour le comptage.'
      name: roles
      optional: true
      type: role
countmodnonnumbers:
  args:
    - punish delete channel
  desc: 'Configure la gestion des messages qui ne sont pas des nombres pour un salon de comptage.'
  params:
    - desc: 'Indique s''il faut sanctionner les messages qui ne sont pas des nombres comme des infractions.'
      name: punish
      optional: false
      type: bool
    - desc: 'Indique s''il faut supprimer les messages qui ne sont pas des nombres.'
      name: delete
      optional: true
      type: bool
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
countmodpunish:
  args:
    - count punishment durationMinutes role channel
  desc: 'Définit une sanction progressive pour un nombre de comptage erroné précis.'
  params:
    - desc: 'Le nombre de comptage erroné qui déclenche cette sanction.'
      name: count
      optional: false
      type: int
    - desc: 'L''action de sanction à appliquer.'
      name: punishment
      optional: false
      type: punishment action
    - desc: 'Durée des sanctions temporisées, en minutes.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Rôle pour le type de sanction AddRole.'
      name: role
      optional: true
      type: role
    - desc: 'Le salon de comptage (NULL pour les valeurs par défaut du serveur).'
      name: channel
      optional: true
      type: text channel
countmodpunishlist:
  args:
    - channel
  desc: 'Liste toutes les sanctions progressives du serveur ou d''un salon précis.'
  params:
    - desc: 'Le salon de comptage (NULL pour les valeurs par défaut du serveur).'
      name: channel
      optional: true
      type: text channel
countmodpunishment:
  args:
    - punishment durationMinutes role channel
  desc: 'Définit la sanction pour les comptages erronés.'
  params:
    - desc: 'L''action de sanction à appliquer.'
      name: punishment
      optional: false
      type: punishment action
    - desc: 'Durée des sanctions temporisées, en minutes.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Rôle pour le type de sanction AddRole.'
      name: role
      optional: true
      type: role
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
countmodrequired:
  args:
    - channel roles...
  desc: 'Définit les rôles requis pour compter.'
  params:
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Rôles requis pour compter.'
      name: roles
      optional: true
      type: role
countmodreset:
  args:
    - channel
  desc: 'Réinitialise un salon pour utiliser les valeurs par défaut du serveur.'
  params:
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
countmodshow:
  args:
    - channel
  desc: 'Affiche la configuration de modération actuelle du salon de comptage ou les valeurs par défaut du serveur.'
  params:
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
countmodthreshold:
  args:
    - threshold channel
  desc: 'Définit le seuil de comptages erronés pour un salon de comptage.'
  params:
    - desc: 'Nombre de comptages erronés avant sanction (1-100).'
      name: threshold
      optional: false
      type: int
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel
countmodunpunish:
  args:
    - count channel
  desc: 'Retire une sanction progressive pour un nombre de comptage erroné précis.'
  params:
    - desc: 'Le nombre de comptage erroné dont retirer la sanction.'
      name: count
      optional: false
      type: int
    - desc: 'Le salon de comptage (NULL pour les valeurs par défaut du serveur).'
      name: channel
      optional: true
      type: text channel
countmodwindow:
  args:
    - hours channel
  desc: 'Définit la fenêtre temporelle de suivi des comptages erronés.'
  params:
    - desc: 'Fenêtre temporelle en heures (1-168).'
      name: hours
      optional: false
      type: int
    - desc: 'Le salon de comptage. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: text channel