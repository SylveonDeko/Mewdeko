banprune:
  args:
    - ''
  desc: 'Affiche la purge qu''un bannissement dans ce salon utiliserait, ainsi que tous les paramètres configurés.'
  params:
    - { }
banpruneset:
  args:
    - '<action> <days> [#channel]'
  desc: 'Définit le nombre de jours de messages supprimés par une action de bannissement. Utilisez "all" pour toutes les actions, et indiquez un salon ou une catégorie pour ne modifier que cette portée.'
  params:
    - desc: 'La clé de l''action, ou "all" pour couvrir toutes les actions'
      name: action
      optional: false
      type: string
    - desc: 'La purge en jours, de 0 à 7'
      name: days
      optional: false
      type: int
    - desc: 'Un salon ou une catégorie auquel limiter le paramètre, ou rien pour la valeur par défaut du serveur'
      name: target
      optional: true
      type: channel
banpruneclear:
  args:
    - '<action> [#channel]'
  desc: 'Supprime un paramètre de purge pour que l''action revienne à une portée plus large ou à sa valeur par défaut.'
  params:
    - desc: 'La clé de l''action, ou "all" pour le paramètre couvrant toutes les actions'
      name: action
      optional: false
      type: string
    - desc: 'Le salon ou la catégorie concerné par le paramètre, ou rien pour la valeur par défaut du serveur'
      name: target
      optional: true
      type: channel
banprunereset:
  args:
    - ''
  desc: 'Supprime tous les paramètres de purge du serveur.'
  params:
    - { }
ban:
  args:
    - '<pruneTime> <time> [@user] [msg]'
    - time time
  desc: 'Bannit un utilisateur avec la raison indiquée et le nombre de jours de messages à purger.'
  params:
    - desc: 'Bannit un utilisateur avec la raison indiquée et le nombre de jours de messages à purger.'
      name: pruneTime
      optional: false
      type: duration
    - desc: 'La durée de purge des messages'
      name: time
      optional: false
      type: duration
    - desc: 'L''utilisateur à bannir'
      name: user
      optional: true
      type: user
    - desc: 'La raison du bannissement'
      name: msg
      optional: true
      type: string
