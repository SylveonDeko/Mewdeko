adsarm:
  args:
    - ''
  desc: 'Active ou désactive la suppression automatique des messages de publicité du serveur.'
  params: [ ]
antialt:
  args:
    - ''
  desc: 'Configure la protection Anti-Alt du serveur en définissant l''âge minimum du compte et l''action de sanction, avec une sanction basée sur un rôle.'
  params: [ ]
antipattern:
  args:
    - ''
  desc: 'Configure la protection Anti-Pattern du serveur en définissant l''action de sanction, avec une sanction basée sur un rôle.'
  params: [ ]
antipattern_PunishmentAction_=:
  args:
    - '<action> [punishTime]'
    - action
  desc: 'Configure la protection Anti-Pattern du serveur en définissant l''action de sanction, avec une sanction basée sur un rôle.'
  params:
    - desc: 'L''action de sanction à appliquer aux correspondances de motifs détectées.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'La durée de la sanction, le cas échéant.'
      name: punishTime
      optional: true
      type: StoopidTime
antipattern_PunishmentAction_IRole:
  args:
    - action @role
  desc: 'Configure la protection Anti-Pattern du serveur en définissant l''action de sanction, avec une sanction basée sur un rôle.'
  params:
    - desc: 'L''action de sanction à appliquer aux correspondances de motifs détectées.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'Le rôle attribué aux utilisateurs qui correspondent aux motifs.'
      name: role
      optional: false
      type: IRole
patternadd:
  args:
    - '<pattern> [name] [checkUsername] [checkDisplayName]'
    - pattern
  desc: 'Ajoute un motif regex à la protection Anti-Pattern.'
  params:
    - desc: 'Le motif regex à comparer aux noms d''utilisateur et d''affichage.'
      name: pattern
      optional: false
      type: string
    - desc: 'Nom facultatif du motif.'
      name: name
      optional: true
      type: string
    - desc: 'Vérifier ou non les noms d''utilisateur avec ce motif (par défaut true).'
      name: checkUsername
      optional: true
      type: bool
    - desc: 'Vérifier ou non les noms d''affichage avec ce motif (par défaut true).'
      name: checkDisplayName
      optional: true
      type: bool
patternremove:
  args:
    - number
  desc: 'Supprime un motif de la protection Anti-Pattern.'
  params:
    - desc: 'L''ID du motif à supprimer.'
      name: patternId
      optional: false
      type: int
patternlist:
  args:
    - ''
  desc: 'Liste tous les motifs configurés pour la protection Anti-Pattern.'
  params: [ ]
patternconfig:
  args:
    - ''
  desc: 'Affiche la configuration actuelle de l''Anti-Pattern.'
  params: [ ]
patternconfig_string_string:
  args:
    - setting value
  desc: 'Affiche la configuration actuelle de l''Anti-Pattern.'
  params:
    - desc: 'Le paramètre à configurer.'
      name: setting
      optional: false
      type: string
    - desc: 'La valeur à définir.'
      name: value
      optional: false
      type: string
antialt_StoopidTime_PunishmentAction_=:
  args:
