antiimagehash:
  args:
    - ''
    - 'Ban'
    - 'Delete 31'
    - 'Timeout 31 1d'
  desc: 'Active la protection Anti-Image-Hash, qui sanctionne quiconque republie une image de la liste des images bloquées, y compris les copies redimensionnées, retournées, réimportées en qualité inférieure ou entourées d''une bordure. Exécutez la commande sans argument pour la désactiver. La tolérance facultative (de 0 à 64, par défaut 31) définit à quel point une image publiée peut différer tout en restant considérée comme bloquée.'
  params: [ ]
antiimagehashignore:
  args:
    - '<role>'
    - '<channel>'
  desc: 'Active ou désactive l''exemption d''un rôle ou d''un salon de la protection Anti-Image-Hash.'
  params: [ ]
antiexternalapp:
  args:
    - ''
    - 'Timeout'
    - 'Timeout 5 5 1h'
    - 'Kick 3 0'
  desc: 'Active la protection Anti-External-App, qui surveille les messages envoyés par les membres via des applications ajoutées à leur propre compte. Un message est supprimé et le membre ayant utilisé l''application est sanctionné lorsqu''il mentionne trop de personnes ou de rôles (par défaut 5, 0 désactive cette option), mentionne everyone, contient un lien d''invitation, ou lorsque le membre utilise des applications plus souvent que le nombre autorisé en 10 secondes (par défaut 5, 0 désactive cette option). Les applications ajoutées au serveur lui-même ne sont pas vérifiées. Exécutez la commande sans argument pour la désactiver.'
  params: [ ]
blockimage:
  args:
    - ''
    - 'mrbeast crypto scam'
    - 'Delete nsfw meme'
    - 'https://example.com/scam.png mrbeast crypto scam'
  desc: 'Bloque une image afin que quiconque la republie soit sanctionné, y compris les copies redimensionnées, recompressées, miroir ou bordées. Joignez l''image, répondez à un message la contenant ou indiquez son URL. Une action indiquée avant le libellé remplace la valeur par défaut du serveur uniquement pour cette image.'
  params: [ ]
unblockimage:
  args:
    - '<id>'
  desc: 'Retire une image de la liste des images bloquées par son ID, tel qu''affiché par blockedimages.'
  params: [ ]
blockedimages:
  args:
    - ''
  desc: 'Liste les images bloquées ainsi que le nombre de fois où chacune a été détectée.'
  params: [ ]
imagehash:
  args:
    - ''
    - 'https://example.com/scam.png'
  desc: 'Affiche le hash perceptuel d''une image sans la bloquer.'
  params: [ ]
antiimagehashpreset:
  args:
    - ''
  desc: 'Active ou désactive la liste des images d''arnaque connues fournie avec Mewdeko : les fausses images de casinos crypto et de giveaways actuellement diffusées sur Discord. Elles sont bloquées en plus de votre propre liste. Activé par défaut lorsque Anti-Image-Hash est activé.'
  params: [ ]
