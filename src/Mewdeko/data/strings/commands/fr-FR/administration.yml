    - ''
  desc: 'Configure la protection Anti-Mass-Mention du serveur en définissant le seuil de mentions pour un seul message, la fenêtre temporelle de suivi des mentions, le nombre maximum de mentions autorisées dans cette fenêtre et l''action de sanction avec une sanction basée sur un rôle.'
  params: [ ]
antimassmention_int_int_int_bool_PunishmentAction_=:
  args:
    - '<mentionThreshold> <timeWindowSeconds> <maxMentionsInTimeWindow> <ignoreBots> <action> [punishTime]'
    - number number number true|false action
  desc: 'Configure la protection Anti-Mass-Mention du serveur en définissant le seuil de mentions pour un seul message, la fenêtre temporelle de suivi des mentions, le nombre maximum de mentions autorisées dans cette fenêtre et l''action de sanction avec une sanction basée sur un rôle.'
  params:
    - desc: 'Le nombre de mentions autorisées dans un seul message avant le déclenchement de la protection.'
      name: mentionThreshold
      optional: false
      type: int
    - desc: 'La fenêtre temporelle (en secondes) pour observer les mentions.'
      name: timeWindowSeconds
      optional: false
      type: int
    - desc: 'Le nombre maximum de mentions autorisées dans la fenêtre temporelle indiquée.'
      name: maxMentionsInTimeWindow
      optional: false
      type: int
    - desc: 'Ignorer ou non les comptes de bots lors du suivi des mentions.'
      name: ignoreBots
      optional: false
      type: bool
    - desc: 'L''action de sanction à appliquer aux utilisateurs qui dépassent les limites de mentions.'
      name: action
      optional: false
      type: punishment
    - desc: 'Configure la protection Anti-Mass-Mention du serveur en définissant le seuil de mentions pour un seul message, la fenêtre temporelle de suivi des mentions, le nombre maximum de mentions autorisées dans cette fenêtre et l''action de sanction avec une sanction basée sur un rôle.'
