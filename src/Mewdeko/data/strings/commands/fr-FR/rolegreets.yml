    - '<id> [message]'
    - number
  desc: 'Met a jour le contenu du message d''un salut de role. Si aucun message n''est fourni, presente des options pour previsualiser le message tel quel ou le voir en texte normal.'
  params:
    - desc: 'L''ID du salut de role a mettre a jour, base sur sa position dans la liste de tous les saluts de role.'
      name: id
      optional: false
      type: int
    - desc: 'Le nouveau contenu du message. Optionnel.'
      name: message
      optional: true
      type: string
