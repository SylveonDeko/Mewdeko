rolegreetadd:
  args:
    - '@role [@channel]'
    - '@role'
  desc: 'Ajoute un nouveau message de bienvenue de role pour un role specifique. Si aucun salon n''est specifie, le salon actuel est utilise.'
  params:
    - desc: 'Le role pour lequel le message de bienvenue est defini.'
      name: role
      optional: false
      type: role
    - desc: 'Le salon textuel ou le message de bienvenue sera envoye. Optionnel.'
      name: channel
      optional: true
      type: channel
