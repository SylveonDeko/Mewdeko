rolegreetadd:
  args:
    - '@role [@channel]'
    - '@role'
  desc: 'Ajoute un nouveau message d''accueil de rôle pour le rôle indiqué. Si aucun salon n''est indiqué, le salon actuel est utilisé.'
  params:
    - desc: 'Le rôle pour lequel définir le message d''accueil.'
      name: role
      optional: false
      type: role
    - desc: 'Le salon textuel où le message d''accueil sera envoyé. Facultatif.'
      name: channel
      optional: true
      type: channel
