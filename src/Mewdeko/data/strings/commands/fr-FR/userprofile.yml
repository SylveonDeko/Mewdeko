greetdmoptout:
  args:
    - ''
  desc: 'Permet a un utilisateur de basculer la desactivation des messages de bienvenue en DM. Fonctionne uniquement si le serveur qu''il rejoint utilise mewdeko pour les salutations par DM.'
  params: [ ]
