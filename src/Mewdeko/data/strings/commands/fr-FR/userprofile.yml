deleteuserstatsdata:
  args:
    - ''
  desc: 'Supprime les données de statistiques d''utilisation des commandes de l''utilisateur.'
  params: [ ]
greetdmoptout:
  args:
    - ''
  desc: 'Permet à un utilisateur d''activer ou de désactiver la réception des MP d''accueil. Ne fonctionne que si le serveur qu''il rejoint utilise Mewdeko pour les MP d''accueil.'
  params: [ ]
profile:
  args:
    - '[@user]'
  desc: 'Affiche le profil de l''utilisateur, ou celui d''un autre utilisateur s''il est indiqué.'
  params:
    - desc: 'L''utilisateur dont afficher le profil. Si vide, affiche le profil de la personne qui exécute la commande.'
      name: user
      optional: true
      type: user
