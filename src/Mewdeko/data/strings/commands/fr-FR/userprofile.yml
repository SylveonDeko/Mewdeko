  args:
    - '@user true|false text'
    - true|false text
  desc: 'Efface de force les pronoms d''un utilisateur à partir de son ID, en le marquant éventuellement comme désactivé pour cause d''abus.'
  params:
    - &ref_356
      desc: 'L''ID de l''utilisateur dont effacer les pronoms.'
      name: user
      optional: true
      type: IUser
    - &ref_357
      desc: 'Indique si les pronoms sont désactivés pour cause d''abus.'
      name: pronounsDisabledAbuse
