commands:
  args:
    - '[module]'
    - '[module] [search]'
  desc: 'Affiche les commandes d''un module précis, éventuellement filtrées par un terme de recherche. Si null, équivaut à modules, qui est lui-même un alias de help.'
  params:
    - desc: 'Le module à consulter, éventuellement suivi d''un terme pour filtrer ses commandes'
      name: module
      optional: true
      type: string
