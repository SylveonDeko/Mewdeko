serveractivity:
  args:
    - '[days]'
    - '7'
    - '0'
  desc: 'Affiche le résumé d''activité du serveur sur une période : messages, temps en vocal, contributeurs, arrivées et départs, ainsi que le membre et les salons les plus actifs. Utilisez 0 pour toute la durée.'
  params:
    - desc: 'La période en jours, 0 pour toute la durée, ou omis pour la valeur par défaut du serveur.'
      name: days
      optional: true
      type: int
useractivity:
  args:
    - '[@user] [days]'
    - '@user 30'
  desc: 'Affiche le résumé d''activité d''un membre sur une période : messages et temps en vocal avec classements, totaux depuis l''arrivée et ses salons les plus utilisés.'
  params:
    - desc: 'Le membre, ou omis pour vous-même.'
      name: user
      optional: true
      type: IGuildUser
    - desc: 'La période en jours, 0 pour toute la durée, ou omis pour la valeur par défaut du serveur.'
      name: days
      optional: true
      type: int
channelactivity:
  args:
    - '[#channel] [days]'
  desc: 'Affiche le résumé d''activité d''un salon sur une période : messages, temps en vocal, contributeurs et membres les plus actifs.'
  params:
    - desc: 'Le salon, ou omis pour le salon actuel.'
      name: channel
      optional: true
      type: IGuildChannel
    - desc: 'La période en jours, 0 pour toute la durée, ou omis pour la valeur par défaut du serveur.'
      name: days
      optional: true
      type: int
activitytop:
  args:
    - '[Messages|Voice] [days] [@role]'
    - 'Voice 7'
  desc: 'Classe les membres par messages ou temps en vocal sur une période, éventuellement uniquement les membres disposant d''un rôle.'
  params:
    - desc: 'Messages ou Voice.'
      name: kind
      optional: true
      type: StatKind
    - desc: 'La période en jours, 0 pour toute la durée, ou omis pour la valeur par défaut du serveur.'
      name: days
      optional: true
      type: int
    - desc: 'N''inclure que les membres disposant de ce rôle.'
      name: role
      optional: true
      type: IRole
activitytopchannels:
  args:
    - '[Messages|Voice] [days]'
  desc: 'Classe les salons par messages ou temps en vocal sur une période.'
  params:
    - desc: 'Messages ou Voice.'
      name: kind
      optional: true
      type: StatKind
    - desc: 'La période en jours, 0 pour toute la durée, ou omis pour la valeur par défaut du serveur.'
      name: days
      optional: true
      type: int
activitychart:
  args:
    - '[Messages|Voice|Members|Status|Joins|Leaves|Growth|InVoice] [days]'
    - 'Members 30'
  desc: 'Trace un graphique des messages, des heures en vocal, du nombre de membres, du statut des membres, des arrivées, des départs, de la croissance ou des membres en vocal sur une période.'
  params:
    - desc: 'Ce qu''il faut représenter sur le graphique.'
      name: kind
      optional: true
      type: StatChartKind
    - desc: 'La période en jours, de 1 à 90, ou omis pour la valeur par défaut du serveur.'
      name: days
      optional: true
      type: int
activityexport:
  args:
    - '[Messages|Voice] [days]'
  desc: 'Exporte le classement des membres par messages ou temps en vocal dans un fichier CSV.'
  params:
    - desc: 'Messages ou Voice.'
      name: kind
      optional: true
      type: StatKind
    - desc: 'La période en jours, 0 pour toute la durée, ou omis pour la valeur par défaut du serveur.'
      name: days
      optional: true
      type: int
statssettings:
  args:
    - ''
  desc: 'Affiche les paramètres de suivi des statistiques d''activité.'
  params: [ ]
statslookback:
  args:
    - '14'
  desc: 'Définit la période par défaut en jours utilisée par les commandes de statistiques lorsqu''aucune n''est indiquée.'
  params:
    - desc: 'La période en jours, de 1 à 90.'
      name: days
      optional: false
      type: int
statscooldown:
  args:
    - '30'
  desc: 'Définit le nombre de secondes qui doivent s''écouler entre deux messages comptabilisés d''un même membre. 0 comptabilise chaque message.'
  params:
    - desc: 'Le délai d''attente en secondes, de 0 à 300.'
      name: seconds
      optional: false
      type: int
statstrackvoice:
  args:
    - ''
  desc: 'Active ou désactive le suivi du temps en vocal pour les statistiques d''activité.'
  params: [ ]
statstracksnapshots:
  args:
    - ''
  desc: 'Active ou désactive les instantanés horaires des membres et des statuts utilisés pour les graphiques de membres et de statuts.'
  params: [ ]
statscountbots:
  args:
    - ''
  desc: 'Active ou désactive la prise en compte des bots dans les statistiques d''activité.'
  params: [ ]
statsignorevoicestate:
  args:
    - 'SelfMuted'
    - 'Afk'
  desc: 'Active ou désactive la prise en compte, dans les statistiques vocales, du temps passé dans un état vocal (SelfMuted, SelfDeafened, ServerMuted, ServerDeafened, Afk, Alone, Streaming, Video).'
  params:
    - desc: 'L''état à activer ou désactiver.'
      name: state
      optional: false
      type: VoiceStateFlags
statsignore:
  args:
    - '#channel'
    - '@role'
    - '@user'
  desc: 'Active ou désactive l''exclusion d''un salon, de chaque détenteur d''un rôle ou d''un membre des statistiques d''activité.'
  params:
    - desc: 'Le salon à activer ou désactiver.'
      name: channel
      optional: false
      type: IGuildChannel
    - desc: 'Le rôle à basculer.'
      name: role
      optional: false
      type: IRole
    - desc: 'Le membre à activer ou désactiver.'
      name: user
      optional: false
      type: IGuildUser
statsignored:
  args:
    - ''
  desc: 'Affiche les salons, rôles et membres exclus des statistiques d''activité.'
  params: [ ]
statsprivacy:
  args:
    - ''
  desc: 'Vous exclut des statistiques d''activité sur tous les serveurs en supprimant définitivement vos statistiques de messages et de vocal, ou vous réintègre.'
  params: [ ]
topgames:
  args:
    - '[days]'
    - '30'
  desc: 'Classe les jeux et applications dans lesquels les membres passent le plus de temps sur une période, avec le nombre de joueurs. Nécessite l''activation du suivi des jeux.'
  params:
    - desc: 'La période en jours, 0 pour toute la durée, ou omis pour la valeur par défaut du serveur.'
      name: days
      optional: true
      type: int
whoplays:
  args:
    - 'Minecraft'
  desc: 'Affiche qui joue à un jeu ou utilise une application : combien de membres y sont actuellement et les membres y ayant passé le plus de temps.'
  params:
    - desc: 'Le nom du jeu ou de l''application.'
      name: game
      optional: false
      type: string
statstrackactivities:
  args:
    - ''
  desc: 'Active ou désactive le suivi des jeux et applications utilisés par les membres (jeu, diffusion, écoute, visionnage, compétition). Désactivé par défaut.'
  params: [ ]
statsverifyactivities:
  args:
    - ''
  desc: 'Active ou désactive la prise en compte uniquement des activités liées à une application Discord, à Spotify ou à un flux, ce qui bloque les présences falsifiées par des clients personnalisés.'
  params: [ ]
statsactivityfiltermode:
  args:
    - 'Whitelist'
    - 'Blacklist'
  desc: 'Définit si la liste de filtres d''activités n''autorise que les jeux listés (Whitelist) ou les ignore (Blacklist).'
  params:
    - desc: 'Whitelist ou Blacklist.'
      name: mode
      optional: false
      type: ActivityFilterMode
statsactivityfilter:
  args:
    - 'Spotify'
  desc: 'Ajoute ou retire un nom de jeu ou d''application de la liste de filtres d''activités.'
  params:
    - desc: 'Le nom de l''activité.'
      name: name
      optional: false
      type: string
statsactivityfilters:
  args:
    - ''
  desc: 'Affiche le filtre d''activités et indique s''il s''agit d''une liste blanche ou d''une liste noire.'
  params: [ ]
liveboardadd:
  args:
    - '#channel InviteLeaderboard [Weekly] [entries] [intervalMinutes]'
    - '#stats GrowthChart Monthly'
  desc: 'Publie un classement, un graphique ou une vue d''ensemble que le bot actualise en continu et épingle. Types : InviteLeaderboard, MessageLeaderboard, VoiceLeaderboard, JoinsChart, LeavesChart, GrowthChart, MembersChart, MessagesChart, ServerOverview, InviteStats.'
  params:
    - desc: 'Le salon où publier.'
      name: channel
      optional: false
      type: ITextChannel
    - desc: 'Ce qu''il faut afficher.'
      name: kind
      optional: false
      type: LiveBoardKind
    - desc: 'La période : AllTime, Daily, Weekly ou Monthly.'
      name: range
      optional: true
      type: StatsRange
    - desc: 'Lignes pour les classements, de 3 à 25.'
      name: entries
      optional: true
      type: int
    - desc: 'Fréquence d''actualisation, au minimum 5 minutes.'
      name: intervalMinutes
      optional: true
      type: int
liveboardlist:
  args:
    - ''
  desc: 'Affiche les tableaux en direct.'
  params: [ ]
liveboardremove:
  args:
    - '3'
  desc: 'Supprime un tableau en direct et son message.'
  params:
    - desc: 'L''ID du tableau, tel qu''affiché dans la liste.'
      name: id
      optional: false
      type: int
liveboardrefresh:
  args:
    - ''
  desc: 'Actualise immédiatement tous les tableaux en direct.'
  params: [ ]
serverreportchannel:
  args:
    - '[#channel]'
  desc: 'Définit le salon qui reçoit les rapports de serveur programmés et les active. Omettez le salon pour désactiver les rapports.'
  params:
    - desc: 'Le salon, ou omis pour désactiver.'
      name: channel
      optional: true
      type: ITextChannel
serverreportfrequency:
  args:
    - 'Weekly'
  desc: 'Définit la fréquence de publication des rapports de serveur : Daily, Weekly ou Monthly.'
  params:
    - desc: 'Daily, Weekly ou Monthly.'
      name: frequency
      optional: false
      type: ReportFrequency
serverreportnow:
  args:
    - '[Weekly]'
  desc: 'Publie immédiatement un rapport de serveur dans le salon actuel, couvrant la période indiquée ou celle configurée.'
  params:
    - desc: 'La période à couvrir, ou omise pour la période configurée.'
      name: frequency
      optional: true
      type: ReportFrequency
