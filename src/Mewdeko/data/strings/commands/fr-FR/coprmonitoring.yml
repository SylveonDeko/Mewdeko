coprmonitoradd:
  args:
    - '<ownerProject> [channel] [packages]'
    - '<ownerProject> [channel] [packages]'
    - ownerProject
  desc: 'Ajoute une surveillance d''un projet COPR au serveur.'
  params:
    - desc: 'Le projet COPR au format propriétaire/projet (par ex. linux4switch/l4s).'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Salon facultatif pour les notifications. Par défaut, le salon actuel.'
      name: channel
      optional: true
      type: ITextChannel
    - desc: 'Liste facultative de paquets à surveiller, séparés par des virgules (par ex. mesa,kernel).'
      name: packages
      optional: true
      type: string
coprmonitorremove:
  args:
    - '<ownerProject> [channel]'
    - ownerProject
  desc: 'Retire la surveillance d''un projet COPR du serveur.'
  params:
    - desc: 'Le projet COPR au format propriétaire/projet.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Salon facultatif dont retirer une surveillance précise.'
      name: channel
      optional: true
      type: ITextChannel
coprmonitorlist:
  args:
    - ''
  desc: 'Liste toutes les surveillances COPR configurées sur le serveur.'
  params: [ ]
coprmonitortoggle:
  args:
    - ownerProject
  desc: 'Active ou désactive une surveillance COPR.'
  params:
    - desc: 'Le projet COPR au format propriétaire/projet.'
      name: ownerProject
      optional: false
      type: string
coprnotify:
  args:
    - ownerProject status enabled
  desc: 'Configure les statuts de build qui déclenchent des notifications pour une surveillance.'
  params:
    - desc: 'Le projet COPR au format propriétaire/projet.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Le statut de build à configurer.'
      name: status
      optional: false
      type: CoprBuildStatus
    - desc: 'Activer ou désactiver les notifications pour ce statut.'
      name: enabled
      optional: false
      type: bool
coprfilter:
  args:
    - ownerProject text
  desc: 'Définit le filtre de paquets d''une surveillance COPR.'
  params:
    - desc: 'Le projet COPR au format propriétaire/projet.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Liste de paquets séparés par des virgules, ou "all" pour tout surveiller.'
      name: packages
      optional: false
      type: string
coprsucceededmessage:
