coprmonitoradd:
  args:
    - '<ownerProject> [channel] [packages]'
    - '<ownerProject> [channel] [packages]'
    - ownerProject
  desc: 'Ajoute un moniteur de projet COPR au serveur.'
  params:
    - desc: 'Le projet COPR au format owner/project (ex. linux4switch/l4s).'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Canal optionnel pour les notifications. Par défaut le canal actuel.'
      name: channel
      optional: true
      type: ITextChannel
    - desc: 'Liste optionnelle de paquets à surveiller séparés par des virgules (ex. mesa,kernel).'
      name: packages
      optional: true
      type: string
coprmonitorremove:
  args:
    - '<ownerProject> [channel]'
    - ownerProject
  desc: 'Supprime un moniteur de projet COPR du serveur.'
  params:
    - desc: 'Le projet COPR au format owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Canal optionnel pour supprimer un moniteur spécifique.'
      name: channel
      optional: true
      type: ITextChannel
coprmonitorlist:
  args:
    - ''
  desc: 'Liste tous les moniteurs COPR configurés sur le serveur.'
  params: [ ]
coprmonitortoggle:
  args:
    - ownerProject
  desc: 'Active ou désactive un moniteur COPR.'
  params:
    - desc: 'Le projet COPR au format owner/project.'
      name: ownerProject
      optional: false
      type: string
coprnotify:
  args:
    - ownerProject status enabled
  desc: 'Configure quels statuts de build déclenchent des notifications pour un moniteur.'
  params:
    - desc: 'Le projet COPR au format owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Le statut de build à configurer.'
      name: status
      optional: false
      type: CoprBuildStatus
    - desc: 'Activer ou désactiver les notifications pour ce statut.'
      name: enabled
      optional: false
      type: bool
coprfilter:
  args:
    - ownerProject text
  desc: 'Définit le filtre de paquets pour un moniteur COPR.'
  params:
    - desc: 'Le projet COPR au format owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Liste de paquets séparés par des virgules, ou "all" pour tout surveiller.'
      name: packages
      optional: false
      type: string
coprsucceededmessage:
  args:
    - ownerProject text
  desc: 'Définit le message affiché quand un build COPR réussit.'
  params:
    - desc: 'Le projet COPR au format owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Le message ou code d''embed. Utilisez "-" pour réinitialiser par défaut.'
      name: message
      optional: false
      type: string
