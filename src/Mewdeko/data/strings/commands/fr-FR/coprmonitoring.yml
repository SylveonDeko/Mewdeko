  desc: 'Définit le message affiché lorsqu''un build COPR réussit.'
  params:
    - desc: 'Le projet COPR au format propriétaire/projet.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Le message ou le code d''embed. Utilisez "-" pour revenir au message par défaut.'
      name: message
      optional: false
      type: string
