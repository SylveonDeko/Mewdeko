highlight:
  args:
    - '<action> [words]'
    - add|list|delete
    - add
    - list
    - delete
  desc: 'Ajoute, liste, supprime ou vérifie des mots-clés de surveillance (highlights).'
  params:
    - desc: 'L''action à effectuer : add, list, delete ou match.'
      name: action
      optional: false
      type: highlightactions
