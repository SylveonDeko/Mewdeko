      optional: false
      type: int
removebonusinvites:
  args:
    - '@user 10'
  desc: 'Takes bonus invites away from a user.'
  params:
    - desc: 'The user.'
      name: user
      optional: false
      type: IGuildUser
    - desc: 'How many to remove.'
      name: amount
      optional: false
      type: int
addfakeinvites:
  args:
    - '@user 3'
  desc: 'Marks some of a user''s invites as fake, lowering their total.'
