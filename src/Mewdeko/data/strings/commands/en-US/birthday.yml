birthdayannouncements:
  args:
    - ''
  desc: 'Toggles birthday announcements for the user.'
  params: [ ]
birthdaychannel:
  args:
    - '#channel'
  desc: 'Sets the birthday announcement channel.'
  params:
    - desc: >-
        The text channel to use for announcements. Defaults to the current
        channel if not specified.
      name: channel
      optional: true
      type: ITextChannel
birthdayconfig:
  args:
    - ''
  desc: 'Views the current birthday configuration.'
  params: [ ]
birthdaylist:
  args:
    - days
  desc: 'Shows upcoming birthdays in the server.'
  params:
    - desc: How many days to look ahead. Default is 7, max is 30.
      name: days
      optional: true
      type: int
birthdaymessage:
  args:
    - message
  desc: 'Sets a custom birthday message template.'
  params:
    - desc: >-
        The message template. Use {user} to mention the user. Shows the current
        message if left empty.
      name: message
      optional: true
      type: string
birthdaypingrole:
  args:
    - '@role'
  desc: 'Sets the role to ping when announcing birthdays.'
  params:
    - desc: The role to ping. Provide no role to disable it.
      name: role
      optional: true
      type: IRole
birthdayrole:
  args:
    - '@role'
  desc: 'Sets the birthday role that users get on their birthday.'
  params:
    - desc: The role to assign on a user's birthday. Provide no role to disable it.
      name: role
      optional: true
      type: IRole
birthdaytimezone:
  args:
    - timezone
  desc: 'Sets the user''s timezone for birthday calculations.'
  params:
    - desc: The timezone to set (e.g., "America/New_York").
      name: timezone
      optional: false
      type: string
birthdaytoday:
  args:
    - ''
  desc: 'Shows today''s birthdays.'
  params: [ ]
birthdayhour:
  args:
    - hour
  desc: 'Sets the hour of the day birthdays are announced, in the server''s timezone.'
  params:
    - desc: 'The hour from 0 to 23.'
      name: hour
      optional: false
      type: int
birthdayagemessage:
  args:
    - message
  desc: 'Sets the message announced for members who shared their birth year. Leave it out to clear it.'
  params:
    - desc: 'The message. %birthday.age% is the member''s age.'
      name: message
      optional: true
      type: string
birthdayyearrule:
  args:
    - rule
  desc: 'Sets whether members may share their birth year: not allowed, optional or required.'
  params:
    - desc: 'NotAllowed, Optional or Required.'
      name: rule
      optional: false
      type: BirthYearRule
birthdayadminset:
  args:
    - user date
  desc: 'Sets a member''s birthday.'
  params:
    - desc: 'The member.'
      name: user
      optional: false
      type: IUser
    - desc: 'The birthday.'
      name: date
      optional: false
      type: DateTime
birthdayadminremove:
  args:
    - user
  desc: 'Removes a member''s birthday.'
  params:
    - desc: 'The member.'
      name: user
      optional: false
      type: IUser
birthdayforget:
  args:
    - ''
  desc: 'Deletes your birthday and every birthday setting stored for you.'
  params: [ ]