rolemenus:
  args:
    - ''
  desc: 'Lists every role menu in this server with its channel, type, number of options, and status.'
  params: [ ]
rolemenuinfo:
  args:
    - 3
  desc: 'Shows everything about one role menu: channel, type, picking rules, required role, confirmation, and options.'
  params:
    - desc: The menu ID from rolemenus.
      name: menuId
      optional: false
      type: int
rolemenucreate:
  args:
    - '#roles dropdown @He/Him @She/Her @They/Them'
    - '#colors buttons @Red @Blue'
  desc: 'Posts a new role menu in a channel with one option per role. Members pick from a dropdown or a row of buttons to get or drop those roles.'
  params:
    - desc: The channel to post the menu in.
      name: channel
      optional: false
      type: ITextChannel
    - desc: dropdown or buttons.
      name: style
      optional: false
      type: RoleMenuStyle
    - desc: One or more roles, up to 25.
      name: roles
      optional: false
      type: IRole[]
rolemenuusetemplate:
  args:
    - 'colors #roles'
    - 'pronouns #roles buttons'
  desc: 'Previews a premade menu with its roles. The templates are colors, pronouns, pings, regions, ages and verification. Edit the name, message and roles (one per line as an emoji, a name and an optional #RRGGBB colour), then post to create the roles and the menu together.'
  params:
    - desc: colors, pronouns, pings, regions, ages or verification.
      name: template
      optional: false
      type: RoleMenuTemplateKind
    - desc: The channel to post the menu in.
      name: channel
      optional: false
      type: ITextChannel
    - desc: dropdown, buttons or reactions. Defaults to the template's own.
      name: style
      optional: true
      type: RoleMenuStyle
rolemenuadd:
  args:
    - '3 @Blue 🔵 Blue'
    - '3 @Gamer'
  desc: 'Adds a role to a menu, with an optional emoji and name, and updates the posted message.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: The role the new option gives.
      name: role
      optional: false
      type: IRole
    - desc: An optional emoji followed by the name shown on the menu. Defaults to the role name.
      name: emojiAndLabel
      optional: true
      type: string
rolemenuremove:
  args:
    - '3 @Blue'
  desc: 'Removes a role from a menu and updates the posted message.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: The role to take off the menu.
      name: role
      optional: false
      type: IRole
rolemenuname:
  args:
    - '3 Pronouns'
  desc: 'Renames a menu. The name titles the default message and shows in lists.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: The new name, up to 100 characters.
      name: name
      optional: false
      type: string
rolemenumessage:
  args:
    - '3'
    - '3 Pick the pronouns you go by.'
    - '3 clear'
  desc: 'Sets the text above a menu, as plain text or embed JSON from the embed builder. Send only the ID to see the current message, or "clear" to go back to the default list of options.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: The message, "clear", or nothing to view.
      name: message
      optional: true
      type: string
rolemenustyle:
  args:
    - '3 buttons'
  desc: 'Switches a menu between a dropdown, buttons, and emoji reactions. Reaction menus need an emoji on every role and hold up to 20 roles.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: dropdown, buttons or reactions.
      name: style
      optional: false
      type: RoleMenuStyle
rolemenumode:
  args:
    - '3 exclusive'
    - '3 multi'
    - '3 verify'
    - '3 removeonly'
    - '3 reverse'
  desc: 'Sets how picking works: one role at a time (picking another swaps it), any number of roles, add only (picking again keeps the role), remove only, or reverse (the first pick takes the role away and the second pick gives it back).'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: exclusive, multi, verify, removeonly or reverse.
      name: mode
      optional: false
      type: RoleMenuMode
rolemenulimits:
  args:
    - '3 0 2'
    - '3 1 0'
  desc: 'Sets how many roles from a menu a member must keep and can hold. A maximum of 0 means no limit.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: The fewest roles a member must keep once they pick.
      name: min
      optional: false
      type: int
    - desc: The most roles a member can hold, 0 for no limit.
      name: max
      optional: false
      type: int
rolemenurequire:
  args:
    - '3 @Verified'
    - '3'
  desc: 'Only lets members with a role use the menu. Leave the role out to let anyone use it.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: The role needed to use the menu. Omit to clear.
      name: role
      optional: true
      type: IRole
rolemenureply:
  args:
    - '3 private'
    - '3 silent'
  desc: 'Chooses whether members get a private note listing the roles they gained and lost, or no note at all.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: private or silent.
      name: mode
      optional: false
      type: RoleMenuReplyMode
rolemenupause:
  args:
    - '3'
  desc: 'Pauses a menu, greying out its dropdown or buttons, or resumes it if it is paused.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
rolemenurepost:
  args:
    - '3'
    - '3 #roles'
  desc: 'Posts a fresh copy of a menu, in the same or another channel, and deletes the old message.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: Where to post it. Defaults to its current channel.
      name: channel
      optional: true
      type: ITextChannel
rolemenudelete:
  args:
    - '3'
  desc: 'Deletes a menu and its message. Members keep the roles they already picked.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
rolemenuimport:
  args:
    - '1122334455667788990'
    - '1122334455667788990 buttons'
  desc: 'Moves an older emoji role setup on a message into a new role menu in the same channel, then retires the old setup.'
  params:
    - desc: The ID of the message with the older setup.
      name: messageId
      optional: false
      type: ulong
    - desc: dropdown or buttons. Defaults to dropdown.
      name: style
      optional: true
      type: RoleMenuStyle
rolemenutemp:
  args:
    - '3 12h'
    - '3'
  desc: 'Takes back roles picked from a menu after a set time. Leave the time out to let members keep them.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: How long roles last, such as 12h or 7d. Omit to clear.
      name: duration
      optional: true
      type: StoopidTime
rolemenuroletemp:
  args:
    - '3 @Event 2h'
    - '3 @Event'
  desc: 'Takes back one role on a menu after a set time, instead of the menu''s setting. Leave the time out to follow the menu.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: The role on the menu.
      name: role
      optional: false
      type: IRole
    - desc: How long the role lasts. Omit to follow the menu.
      name: duration
      optional: true
      type: StoopidTime
rolemenucap:
  args:
    - '3 @Event 50'
    - '3 @Event 0'
  desc: 'Limits how many members can hold a role through a menu. Picking it when full says it is full. A limit of 0 means no limit.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: The role on the menu.
      name: role
      optional: false
      type: IRole
    - desc: The most members who can hold it, 0 for no limit.
      name: cap
      optional: true
      type: int
rolemenublock:
  args:
    - '3 @Muted @Banned'
    - '3'
  desc: 'Stops members with any of the roles from using a menu. Leave the roles out to clear the list.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: The blocked roles. Omit to clear.
      name: roles
      optional: true
      type: IRole[]
rolemenugroup:
  args:
    - '3 Colours'
    - '3'
  desc: 'Links a menu into a group. Menus in a group share one limit, so picking a role in one can take the role from the others. A new group lets members hold one role at a time. Leave the name out to unlink the menu.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: The group name. Omit to unlink.
      name: name
      optional: true
      type: string
rolemenugroupmax:
  args:
    - '1 Colours'
    - '2 Colours'
    - '0 Colours'
  desc: 'Sets how many roles a member can hold across all menus in a group. 1 swaps the role when they pick another, 0 means no limit.'
  params:
    - desc: The most roles, 0 for no limit.
      name: max
      optional: false
      type: int
    - desc: The group name.
      name: name
      optional: false
      type: string
rolemenugroupdelete:
  args:
    - 'Colours'
  desc: 'Deletes a role menu group and unlinks its menus. The menus and members'' roles stay as they are.'
  params:
    - desc: The group name.
      name: name
      optional: false
      type: string
rolemenugroups:
  args:
    - ''
  desc: 'Lists the role menu groups with their limits and menus.'
  params: []
rolemenucolor:
  args:
    - '3 #5865F2'
    - '3 red'
    - '3'
  desc: 'Sets the colour of a menu''s default message. Leave the colour out to go back to the default.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: A colour name or hex code. Omit to clear.
      name: color
      optional: true
      type: string
rolemenubuttonstyle:
  args:
    - '3 green'
    - '3'
  desc: 'Sets the button colour used for options that have no colour of their own. Leave it out to go back to grey.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: blurple, grey, green or red. Omit for grey.
      name: color
      optional: true
      type: RoleMenuButtonColor
rolemenuchannel:
  args:
    - 'roles'
    - 'roles buttons @Red @Blue'
  desc: 'Creates a channel for role menus where members can read, react and click but not send messages, and the bot can post. Give roles to post a menu in it right away.'
  params:
    - desc: The channel name.
      name: name
      optional: false
      type: string
    - desc: dropdown or buttons. Defaults to dropdown.
      name: style
      optional: true
      type: RoleMenuStyle
    - desc: The roles to offer in a menu posted there. Omit to only create the channel.
      name: roles
      optional: true
      type: IRole[]
rolemenuexpire:
  args:
    - '3 7d'
    - '3'
  desc: 'Makes a menu delete its message and turn itself off after a set time. Leave the time out to clear it.'
  params:
    - desc: The menu ID.
      name: menuId
      optional: false
      type: int
    - desc: How long from now, such as 12h or 7d. Omit to never expire.
      name: duration
      optional: true
      type: StoopidTime
