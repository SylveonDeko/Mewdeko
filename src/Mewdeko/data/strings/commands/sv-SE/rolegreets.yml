rolegreetadd:
  args:
    - '@role [@channel]'
    - '@role'
  desc: 'Laggar till ett nytt rollhalsningsmeddeland for en specifik roll. Om ingen kanal anges anvands den aktuella kanalen.'
  params:
    - desc: 'Rollen som halsningsmeddelandet stalls in for.'
