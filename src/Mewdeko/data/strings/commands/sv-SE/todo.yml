todoedit:
  args:
    - itemId
    - title
    - description
  desc: 'Redigerar titeln och beskrivningen av ett uppgiftsobjekt'
  params:
    - desc: 'IDt for uppgiftsobjektet.'
      name: itemId
      optional: false
      type: int
    - desc: 'Den nya titeln.'
      name: title
      optional: false
      type: string
    - desc: 'Den nya beskrivningen.'
      name: description
      optional: true
      type: string
todofilter:
  args:
    - listId
    - filter
    - value
  desc: 'Filtrerar uppgiftsobjekt efter tagg eller prioritet'
  params:
