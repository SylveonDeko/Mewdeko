todoadd:
  args:
    - listId
    - title
    - description
  desc: 'Lagger till ett nytt uppgiftsobjekt i en specificerad lista'
  params:
    - desc: 'IDt for uppgiftslistan.'
      name: listId
      optional: false
      type: int
    - desc: 'Titeln pa uppgiftsobjektet.'
      name: title
      optional: false
      type: string
    - desc: 'Valfri beskrivning av objektet.'
      name: description
      optional: true
      type: string
todoaddpriority:
  args:
    - listId
    - priority
    - title
    - description
  desc: 'Lagger till ett uppgiftsobjekt med prioritet och valfritt forfallodatum'
  params:
    - desc: 'IDt for uppgiftslistan.'
      name: listId
      optional: false
      type: int
    - desc: 'Prioritetsniva (1=Lag, 2=Medel, 3=Hog, 4=Kritisk).'
      name: priority
      optional: false
      type: int
    - desc: 'Titeln pa uppgiftsobjektet.'
      name: title
      optional: false
      type: string
    - desc: 'Valfri beskrivning av objektet.'
      name: description
      optional: true
      type: string
todoaddtag:
  args:
    - itemId
    - tag
  desc: 'Lagger till en tagg pa ett uppgiftsobjekt'
  params:
    - desc: 'IDt for uppgiftsobjektet.'
      name: itemId
      optional: false
      type: int
    - desc: 'Taggen att lagga till.'
      name: tag
      optional: false
      type: string
todocleardue:
  args:
    - itemId
  desc: 'Tar bort forfallodatumet fran ett uppgiftsobjekt'
  params:
    - desc: 'IDt for uppgiftsobjektet.'
      name: itemId
      optional: false
      type: int
todoclearreminder:
  args:
    - itemId
  desc: 'Tar bort paminnelsen fran ett uppgiftsobjekt'
  params:
    - desc: 'IDt for uppgiftsobjektet.'
