      optional: false
      type: int
todocomplete:
  args:
    - itemId
  desc: 'Markerar ett uppgiftsobjekt som klart'
  params:
    - desc: 'IDt for uppgiftsobjektet.'
      name: itemId
      optional: false
      type: int
todocreatelist:
  args:
    - name
    - description
  desc: 'Skapar en ny uppgiftslista'
  params:
    - desc: 'Namnet pa uppgiftslistan.'
      name: name
      optional: false
      type: string
    - desc: 'Valfri beskrivning av listan.'
      name: description
      optional: true
      type: string
todocreateserverlist:
  args:
    - name
    - description
  desc: 'Skapar en ny serveromfattande uppgiftslista (endast admins)'
  params:
    - desc: 'Namnet pa server-uppgiftslistan.'
      name: name
      optional: false
      type: string
    - desc: 'Valfri beskrivning av listan.'
      name: description
      optional: true
      type: string
