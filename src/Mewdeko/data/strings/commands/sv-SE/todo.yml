  args:
    - itemId
  desc: 'Tar bort ett uppgiftsobjekt'
  params:
    - desc: 'IDt for uppgiftsobjektet.'
      name: itemId
      optional: false
      type: int
tododeletelist:
  args:
    - listId
  desc: 'Tar bort en hel uppgiftslista'
  params:
