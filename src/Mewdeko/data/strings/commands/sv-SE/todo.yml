      name: listId
      optional: false
      type: int
    - desc: 'Filtertyp (tagg eller prioritet).'
      name: filter
      optional: false
      type: string
    - desc: 'Vardet att filtrera pa.'
      name: value
      optional: true
      type: string
todogrant:
  args:
    - listId
    - '@user'
    - permissions
  desc: 'Ger en anvandare behorigheter for en uppgiftslista (endast listaagare/admin)'
  params:
    - desc: 'IDt for uppgiftslistan.'
      name: listId
      optional: false
      type: int
    - desc: 'Anvandaren som far behorigheter.'
      name: user
      optional: false
      type: IUser
    - desc: 'Kommaseparerade behorigheter (view,add,edit,complete,delete,manage,all).'
      name: permissions
      optional: false
      type: string
todolists:
  args:
