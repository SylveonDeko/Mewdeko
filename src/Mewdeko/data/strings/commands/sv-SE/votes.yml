votemessage:
  args:
    - '[message]'
  desc: >-
    Ställer in ett anpassat meddelande som skickas när en användare röstar,
    eller förhandsgranskar det aktuella röstningsmeddelandet.
  params:
    - desc: 'Det anpassade meddelandet för röstningar. Använd "-" för att återställa till standard. Om tomt visas det aktuella röstningsmeddelandet.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: >-
    Startar en bekräftelseprocess för att ange ett nytt röstningslösenord och
    varnar användaren om säkerheten.
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: >-
    Lägger till en roll som ges till användare när de röstar, med en valfri
    varaktighet för automatisk borttagning av rollen.
  params:
    - desc: 'Rollen att lägga till som röstningsbelöning.'
      name: role
      optional: false
      type: role
    - desc: 'Varaktigheten för vilken rollen ges. Null för obegränsad tid.'
      name: time
      optional: true
      type: duration
