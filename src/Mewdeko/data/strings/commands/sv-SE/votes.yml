votechannel:
  args:
    - channel
  desc: >-
    Ställer in den angivna textkanalen som röstningskanal där alla
    röstningsbekräftelser skickas.
  params:
    - &ref_646
      desc: 'Textkanalen att ställa in som röstningskanal.'
      name: channel
      optional: false
      type: ITextChannel
