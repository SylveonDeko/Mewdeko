      name: threshold
      optional: true
      type: int
    - desc: 'Standard tidsfoenster i timmar for att spara felaktiga rakningar.'
      name: windowHours
      optional: true
      type: int
    - desc: 'Standard straffatgard att tillampas.'
      name: punishment
      optional: true
      type: punishment action
    - desc: 'Standard varaktighet for tidsbestamda straff i minuter.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Standardroll for strafftypen LaggTillRoll.'
      name: punishmentRole
      optional: true
      type: role
