countmodbanned:
  args:
    - channel roles...
  desc: 'Anger roller som ar forbjudna fran att rakna.'
  params:
    - desc: 'Raknikanalen. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Roller forbjudna fran att rakna.'
      name: roles
      optional: true
      type: role
countmodclear:
  args:
    - user channel
  desc: 'Rensar felaktiga rakningar for en anvandare i en raknikanal.'
