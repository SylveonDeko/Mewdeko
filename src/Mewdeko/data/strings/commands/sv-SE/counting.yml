countingban:
  args:
    - user channel duration reason
  desc: 'Forbjuder en anvandare fran att rakna i en specifik kanal.'
  params:
    - desc: 'Anvandaren som forbjuds fran att rakna.'
      name: user
      optional: false
      type: guild user
    - desc: 'Raknikanalen. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Forbudets varaktighet (t.ex. 1h, 1d). Lamna tomt for permanent.'
      name: duration
      optional: true
      type: stoopid time
    - desc: 'Anledningen till forbudet.'
      name: reason
      optional: true
      type: string
countingconfig:
  args:
    - channel
  desc: 'Konfigurerar installningarna for en raknikanal.'
  params:
    - desc: 'Kanalen for att visa konfigurationen. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
countingcooldown:
  args:
    - channel seconds
  desc: 'Anger vanetiden mellan anvandarnas rakningar.'
  params:
    - desc: 'Raknikanalen. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Vanetid i sekunder (0-300).'
      name: seconds
      optional: true
      type: int
countingdisable:
  args:
    - channel purgeData reason
  desc: 'Inaktiverar rakning i en kanal och tar eventuellt bort all data.'
  params:
    - desc: 'Kanalen dar rakning ska inaktiveras. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Om all rakningsdata for denna kanal ska tas bort. Standard ar false.'
      name: purgeData
      optional: true
      type: bool
    - desc: 'Anledningen till att inaktivera rakning.'
      name: reason
      optional: true
      type: string
countingfailurechannel:
  args:
    - countingChannel failureChannel
  desc: 'Anger kanalen dar rakningsfel loggas.'
  params:
    - desc: 'Raknikanalen.'
      name: countingChannel
      optional: true
      type: text channel
    - desc: 'Kanalen for felloggar. Anvand null for att inaktivera.'
      name: failureChannel
      optional: true
      type: text channel
countingfailuremessage:
  args:
    - channel embed
  desc: 'Anger ett anpassat meddelande for misslyckade rakningar.'
  params:
    - desc: 'Raknikanalen. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Meddelandemallen. Anvand "-" for att aterstalla till standard.'
      name: embed
      optional: true
      type: string
countingfailurethreshold:
  args:
    - channel threshold
  desc: 'Anger feltroskeln fore konsekvenser.'
  params:
    - desc: 'Raknikanalen. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Antal fel fore atgard (1-10).'
      name: threshold
      optional: true
      type: int
countingleaderboard:
  args:
    - type channel
  desc: 'Visar topplistan for en raknikanal.'
  params:
    - desc: 'Typen av topplista (contributions, streak, accuracy, totalnumbers).'
      name: type
      optional: true
      type: string
    - desc: 'Kanalen for att visa topplistan. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
countinglist:
  args:
    - ''
  desc: 'Listar alla aktiva raknikanaler pa servern.'
  params: [ ]
countingmilestonechannel:
  args:
    - countingChannel milestoneChannel
  desc: 'Anger kanalen dar milstolpeprestationer tillkannages.'
  params:
    - desc: 'Raknikanalen.'
      name: countingChannel
      optional: true
      type: text channel
    - desc: 'Kanalen for milstolpemeddelanden. Anvand null for att inaktivera.'
      name: milestoneChannel
      optional: true
      type: text channel
countingmilestonemessage:
  args:
    - channel embed
  desc: 'Anger ett anpassat meddelande for milstolpeprestationer.'
  params:
    - desc: 'Raknikanalen. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Meddelandemallen. Anvand "-" for att aterstalla till standard.'
      name: embed
      optional: true
      type: string
countingmilestones:
  args:
    - channel milestones
  desc: 'Anger anpassade milstolpetal.'
  params:
    - desc: 'Raknikanalen. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Kommaseparerade milstolpetal (t.ex. 50,100,250,500,1000).'
      name: milestones
      optional: true
      type: string
countingreset:
  args:
    - channel newNumber reason
  desc: 'Aterstaller rakningen i en kanal till ett specifikt tal.'
  params:
    - desc: 'Kanalen som ska aterstallas. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Talet att aterstalla till. Standard ar 0.'
      name: newNumber
      optional: true
      type: long
    - desc: 'Anledningen till aterstaallningen.'
      name: reason
      optional: true
      type: string
countingrestore:
  args:
    - saveId channel
  desc: 'Aterstaller rakningen fran en tidigare sparningspunkt.'
  params:
    - desc: 'ID:t for sparningspunkten att aterstalla fran.'
      name: saveId
      optional: false
      type: int
    - desc: 'Kanalen att aterstalla. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
countingsave:
  args:
    - channel reason
  desc: 'Skapar en sparningspunkt for den aktuella rakningsframstegen.'
  params:
    - desc: 'Kanalen att spara. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Anledningen till att skapa sparningspunkten.'
      name: reason
      optional: true
      type: string
countingsetup:
  args:
    - channel startNumber increment
  desc: 'Konfigurerar rakning i den aktuella eller en angiven kanal.'
  params:
    - desc: 'Kanalen dar rakning ska konfigureras. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Talet att borja rakna fran. Standard ar 1.'
      name: startNumber
      optional: true
      type: long
    - desc: 'Okningen for varje rakning. Standard ar 1.'
      name: increment
      optional: true
      type: int
countingstats:
  args:
    - user channel
  desc: 'Visar rakningsstatistik for en anvandare eller kanal.'
  params:
    - desc: 'Anvandaren att visa statistik for. Standard ar du.'
      name: user
      optional: true
      type: user
    - desc: 'Kanalen att kontrollera statistik i. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
countingstatus:
  args:
    - channel
  desc: 'Visar den aktuella rakningsstatusen i en kanal.'
  params:
    - desc: 'Kanalen att kontrollera. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
countingsuccessmessage:
  args:
    - channel embed
  desc: 'Anger ett anpassat meddelande for lyckade rakningar.'
  params:
    - desc: 'Raknikanalen. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Meddelandemallen. Anvand "-" for att aterstalla till standard.'
      name: embed
      optional: true
      type: string
countingtimeout:
  args:
    - user duration channel reason
  desc: 'Tystar tillfallgt en anvandare fran rakning.'
  params:
    - desc: 'Anvandaren att tysta fran rakning.'
      name: user
      optional: false
      type: guild user
    - desc: 'Varaktigheten for tystningen (t.ex. 30m, 2h).'
      name: duration
      optional: false
      type: stoopid time
    - desc: 'Raknikanalen. Standard ar den aktuella kanalen.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Anledningen till tystningen.'
      name: reason
      optional: true
      type: string
countingunban:
  args:
    - user channel reason
  desc: 'Havar forbudet for en anvandare fran att rakna i en specifik kanal.'
