coprmonitoradd:
  args:
    - '<ownerProject> [channel] [packages]'
    - '<ownerProject> [channel] [packages]'
    - ownerProject
  desc: 'Lägger till en COPR-projektmonitor på servern.'
  params:
    - desc: 'COPR-projektet i formatet owner/project (t.ex. linux4switch/l4s).'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Valfri kanal för aviseringar. Standard är den aktuella kanalen.'
      name: channel
      optional: true
      type: ITextChannel
    - desc: 'Valfri kommaseparerad lista med paket att övervaka (t.ex. mesa,kernel).'
      name: packages
      optional: true
      type: string
coprmonitorremove:
  args:
    - '<ownerProject> [channel]'
    - ownerProject
  desc: 'Tar bort en COPR-projektmonitor från servern.'
  params:
    - desc: 'COPR-projektet i formatet owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Valfri kanal för att ta bort en specifik monitor.'
      name: channel
      optional: true
      type: ITextChannel
coprmonitorlist:
  args:
    - ''
  desc: 'Listar alla COPR-monitorer konfigurerade på servern.'
  params: [ ]
coprmonitortoggle:
  args:
    - ownerProject
  desc: 'Slår på eller av en COPR-monitor.'
  params:
    - desc: 'COPR-projektet i formatet owner/project.'
      name: ownerProject
      optional: false
      type: string
coprnotify:
  args:
    - ownerProject status enabled
  desc: 'Konfigurerar vilka byggstatus som utlöser aviseringar för en monitor.'
  params:
    - desc: 'COPR-projektet i formatet owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Byggstatusen att konfigurera.'
      name: status
      optional: false
      type: CoprBuildStatus
    - desc: 'Om aviseringar ska aktiveras eller inaktiveras för denna status.'
      name: enabled
      optional: false
      type: bool
coprfilter:
  args:
    - ownerProject text
  desc: 'Ställer in paketfiltret för en COPR-monitor.'
  params:
    - desc: 'COPR-projektet i formatet owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Kommaseparerad lista med paket, eller "all" för att övervaka allt.'
      name: packages
      optional: false
      type: string
coprsucceededmessage:
  args:
    - ownerProject text
  desc: 'Ställer in meddelandet som visas när ett COPR-bygge lyckas.'
  params:
    - desc: 'COPR-projektet i formatet owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Meddelandet eller embed-kod. Använd "-" för att återställa till standard.'
      name: message
      optional: false
      type: string
