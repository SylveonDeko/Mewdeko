highlight:
  args:
    - '<action> [words]'
    - add|list|delete
    - add
    - list
    - delete
  desc: 'Menambahkan, mendaftar, menghapus, atau mencocokkan highlight.'
  params:
    - desc: '<see cref="HighlightActions" />'
      name: action
      optional: false
      type: highlightactions
    - desc: 'Parameter untuk tindakan yang dipilih'
