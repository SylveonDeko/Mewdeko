  desc: 'Nastaví výchozí zprávu pro všechny ostatní stavy sestavení.'
  params:
    - desc: 'COPR projekt ve formátu owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Zpráva nebo kód vložení. Použijte "-" pro reset na výchozí.'
      name: message
      optional: false
      type: string
