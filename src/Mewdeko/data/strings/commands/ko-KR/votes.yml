votechannel:
  args:
    - channel
  desc: >-
    지정된 텍스트 채널을 모든 투표 확인이 전송되는 투표 채널로
    설정합니다.
  params:
    - &ref_646
      desc: '투표 채널로 설정할 텍스트 채널입니다.'
      name: channel
      optional: false
      type: ITextChannel
