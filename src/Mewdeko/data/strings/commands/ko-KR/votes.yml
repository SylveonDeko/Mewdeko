votemessage:
  args:
    - '[message]'
  desc: '사용자가 투표하거나 현재 투표 메시지를 미리 볼 때 보낼 사용자 지정 메시지를 설정해요.'
  params:
    - desc: '투표에 사용할 사용자 지정 메시지예요. "-"를 입력하면 기본 메시지로 되돌려요. null이면 현재 투표 메시지를 미리 봐요.'
