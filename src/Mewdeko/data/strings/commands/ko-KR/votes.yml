votemessage:
  args:
    - '[message]'
  desc: >-
    사용자가 투표할 때 전송되는 사용자 지정 메시지를 설정하거나 현재
    투표 메시지를 미리 봅니다.
  params:
    - desc: '투표에 설정할 사용자 지정 메시지. "-"를 사용하여 기본 메시지로 재설정. null이면 현재 투표 메시지를 미리 봅니다.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: >-
    새 투표 비밀번호를 설정하는 확인 프로세스를 시작하고 보안에 대해
    사용자에게 주의를 줍니다.
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: >-
    사용자가 투표할 때 부여되는 역할을 추가합니다. 역할이 자동으로
    제거되는 선택적 기간도 설정할 수 있습니다.
  params:
    - desc: '투표 보상으로 추가할 역할입니다.'
      name: role
      optional: false
      type: role
    - desc: '역할이 부여되는 기간. 무기한의 경우 null.'
      name: time
      optional: true
      type: duration
