  args:
    - ''
    - detailed
    - '@role'
    - '@role 100'
    - '@role 100 false #channel true 50'
  desc: '평판 마일스톤 역할 보상을 관리합니다. 매개변수 없이 사용하면 모든 보상을 나열하고, 역할과 평판을 입력하면 고급 설정과 함께 보상을 추가하거나 수정합니다.'
  params:
    - &ref_437
      desc: '지급할 역할입니다 (목록 조회 시 선택 사항).'
      name: role
      optional: true
      type: IRole
    - desc: '이 역할을 받는 데 필요한 평판입니다 (목록 조회 시 선택 사항).'
      name: reputation
      optional: true
      type: int
    - desc: '평판이 떨어지면 역할을 제거할지 여부입니다.'
      name: removeOnDrop
      optional: true
      type: bool
    - desc: '역할 지급을 알릴 채널입니다 (선택 사항).'
      name: announceChannel
      optional: true
      type: ITextChannel
    - desc: 'DM 알림을 보낼지 여부입니다.'
      name: announceDm
      optional: true
      type: bool
    - desc: '마일스톤 달성 시 지급할 XP 보상입니다 (선택 사항).'
      name: xpReward
      optional: true
      type: int
    - desc: '목록 조회 시 자세한 정보를 표시합니다 (첫 번째 매개변수로 ''detailed'' 입력).'
