mcstatus:
  args:
    - '[server name or address]'
  desc: '마인크래프트 서버의 상태를 확인합니다. 등록된 서버 이름이나 직접 주소를 입력하거나, 비워 두면 기본 서버를 확인합니다.'
  params:
    - desc: '등록된 서버 이름 또는 직접 주소입니다(예: play.example.com:25565).'
      name: serverName
      optional: true
      type: string
mcadd:
  args:
    - name address
  desc: '서버에 마인크래프트 서버를 추가합니다. 베드락 서버는 주소 앞에 bedrock:을 붙이세요.'
  params:
    - desc: '서버의 이름표입니다.'
      name: name
      optional: false
      type: string
    - desc: '서버 주소이며 포트는 선택 사항입니다(예: play.example.com:25565 또는 bedrock:play.example.com).'
      name: address
      optional: false
      type: string
mcremove:
  args:
    - name
  desc: '서버에서 마인크래프트 서버를 삭제합니다.'
  params:
    - desc: '삭제할 서버의 이름입니다.'
      name: name
      optional: false
      type: string
mclist:
  args:
    - ''
  desc: '이 서버에 등록된 모든 마인크래프트 서버를 보여줍니다.'
  params: [ ]
mcdefault:
  args:
    - name
  desc: '상태 명령어의 기본 서버로 설정합니다.'
  params:
    - desc: '기본 서버로 설정할 서버의 이름입니다.'
      name: name
      optional: false
      type: string
mcwatch:
  args:
    - name '#channel'
  desc: '서버의 주기적인 상태 업데이트를 받을 채널을 설정합니다. 채널을 생략하면 비활성화됩니다.'
  params:
    - desc: '감시할 서버의 이름입니다.'
      name: serverName
      optional: false
      type: string
    - desc: '업데이트를 게시할 채널입니다.'
      name: channel
      optional: true
      type: ITextChannel
mcwatchmode:
  args:
    - name embed|topic|both
  desc: '서버 상태 표시 방식을 임베드(제자리 수정), 채널 주제, 또는 둘 다로 설정합니다.'
  params:
    - desc: '서버의 이름입니다.'
      name: serverName
      optional: false
      type: string
    - desc: '감시 모드입니다: Embed, ChannelTopic, Both.'
      name: mode
      optional: false
      type: McWatchMode
mcembed:
  args:
    - name template
  desc: '감시 중인 서버의 사용자 지정 임베드 템플릿을 설정합니다. 기본값으로 되돌리려면 "-"를 입력하세요. 사용 가능한 자리표시자: %mc.server.name%, %mc.players.online%, %mc.players.max%, %mc.motd%, %mc.version%, %mc.latency%, %mc.online%, %mc.favicon%.'
  params:
    - desc: '서버의 이름입니다.'
      name: serverName
      optional: false
      type: string
    - desc: '임베드 템플릿 JSON이며, 기본값으로 되돌리려면 "-"를 입력하세요.'
      name: template
      optional: true
      type: string
mcplayer:
  args:
    - username
  desc: '마인크래프트 사용자 이름으로 플레이어를 찾아 프로필과 스킨을 보여줍니다.'
  params:
    - desc: '조회할 마인크래프트 사용자 이름입니다.'
      name: username
      optional: false
      type: string
mcskin:
  args:
    - username
  desc: '마인크래프트 플레이어의 스킨 렌더 이미지를 보여줍니다.'
  params:
    - desc: '마인크래프트 사용자 이름입니다.'
      name: username
      optional: false
      type: string
mcrcon:
  args:
    - name command
  desc: '등록된 마인크래프트 서버에 RCON 명령어를 보냅니다. RCON은 대시보드에서 설정해야 합니다.'
  params:
    - desc: '서버의 이름입니다.'
      name: serverName
      optional: false
      type: string
    - desc: '서버에서 실행할 명령어입니다.'
      name: command
      optional: false
      type: string
mcwhitelist:
  args:
    - name add|remove|list|on|off|reload [player]
  desc: 'RCON을 통해 마인크래프트 서버의 화이트리스트를 관리합니다. RCON 설정이 필요합니다.'
  params:
    - desc: '서버의 이름입니다.'
      name: serverName
      optional: false
      type: string
    - desc: '작업: add, remove, list, on, off, reload.'
      name: action
      optional: false
      type: string
    - desc: '플레이어 이름입니다(add/remove에 사용).'
      name: playerName
      optional: true
      type: string
