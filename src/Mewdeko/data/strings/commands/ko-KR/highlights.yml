highlight:
  args:
    - '<action> [words]'
    - add|list|delete
    - add
    - list
    - delete
  desc: '하이라이트를 추가, 나열, 제거 또는 매칭합니다.'
  params:
    - desc: '<see cref="HighlightActions" />'
      name: action
      optional: false
      type: highlightactions
    - desc: '선택한 작업의 매개변수'
      name: words
      optional: true
      type: string
