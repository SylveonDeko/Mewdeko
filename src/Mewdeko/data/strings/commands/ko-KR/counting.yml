  args:
    - channel milestones
  desc: '사용자 지정 마일스톤 숫자를 설정해요.'
  params:
    - desc: '카운팅 채널이에요. 기본값은 현재 채널이에요.'
      name: channel
      optional: true
      type: text channel
    - desc: '쉼표로 구분한 마일스톤 숫자예요. 예: 50,100,250,500,1000'
      name: milestones
      optional: true
