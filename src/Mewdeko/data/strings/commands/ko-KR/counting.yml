  desc: '실패한 카운트에 대한 사용자 정의 메시지를 설정합니다.'
  params:
    - desc: '카운트 채널. 기본값은 현재 채널.'
      name: channel
      optional: true
      type: text channel
    - desc: '메시지 템플릿. 기본값으로 재설정하려면 "-"를 사용하세요.'
      name: embed
      optional: true
