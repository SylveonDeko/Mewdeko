      optional: true
      type: text channel
    - desc: '마일스톤 알림 채널이에요. 비활성화하려면 null을 입력해요.'
      name: milestoneChannel
      optional: true
      type: text channel
countingmilestonemessage:
  args:
    - channel embed
  desc: '마일스톤 달성 시 표시할 사용자 지정 메시지를 설정해요.'
  params:
    - desc: '카운팅 채널이에요. 기본값은 현재 채널이에요.'
      name: channel
      optional: true
      type: text channel
    - desc: '메시지 템플릿이에요. 기본값으로 되돌리려면 "-"를 입력해요.'
