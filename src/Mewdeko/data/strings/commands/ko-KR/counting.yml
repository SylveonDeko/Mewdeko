countingban:
  args:
    - user channel duration reason
  desc: '특정 채널에서 사용자의 카운트를 금지합니다.'
  params:
    - desc: '카운트를 금지할 사용자.'
      name: user
      optional: false
      type: guild user
    - desc: '카운트 채널. 기본값은 현재 채널.'
      name: channel
      optional: true
      type: text channel
    - desc: '금지 기간 (예: 1h, 1d). 영구적으로는 비워두세요.'
      name: duration
      optional: true
      type: stoopid time
    - desc: '금지 이유.'
      name: reason
      optional: true
      type: string
countingconfig:
  args:
    - channel
  desc: '카운트 채널의 설정을 구성합니다.'
  params:
    - desc: '설정을 표시할 채널. 기본값은 현재 채널.'
      name: channel
      optional: true
      type: text channel
countingcooldown:
  args:
    - channel seconds
  desc: '사용자 카운트 간의 쿨다운을 설정합니다.'
  params:
    - desc: '카운트 채널. 기본값은 현재 채널.'
      name: channel
      optional: true
      type: text channel
    - desc: '쿨다운 (초, 0-300).'
      name: seconds
      optional: true
      type: int
countingdisable:
  args:
    - channel purgeData reason
  desc: '채널의 카운트를 비활성화하고 선택적으로 모든 데이터를 삭제합니다.'
  params:
    - desc: '카운트를 비활성화할 채널. 기본값은 현재 채널.'
      name: channel
      optional: true
      type: text channel
    - desc: '이 채널의 모든 카운트 데이터를 삭제할지 여부. 기본값은 false.'
      name: purgeData
      optional: true
      type: bool
    - desc: '카운트를 비활성화하는 이유.'
      name: reason
      optional: true
      type: string
