countingban:
  args:
    - user channel duration reason
  desc: '특정 채널에서 카운팅을 금지해요.'
  params:
    - desc: '카운팅을 금지할 사용자예요.'
      name: user
      optional: false
      type: guild user
    - desc: '카운팅 채널이에요. 기본값은 현재 채널이에요.'
      name: channel
      optional: true
      type: text channel
    - desc: '금지 기간이에요. 예: 1h, 1d. 영구 금지하려면 비워두세요.'
      name: duration
      optional: true
      type: stoopid time
    - desc: '금지 사유예요.'
      name: reason
      optional: true
      type: string
countingconfig:
  args:
    - channel
  desc: '카운팅 채널의 설정을 바꿔요.'
  params:
    - desc: '설정을 볼 채널이에요. 기본값은 현재 채널이에요.'
      name: channel
      optional: true
      type: text channel
countingcooldown:
  args:
    - channel seconds
  desc: '사용자 카운트 사이의 쿨다운을 설정해요.'
  params:
    - desc: '카운팅 채널이에요. 기본값은 현재 채널이에요.'
      name: channel
      optional: true
      type: text channel
    - desc: '쿨다운(초)예요. 0부터 300까지 입력할 수 있어요.'
      name: seconds
      optional: true
      type: int
countingdisable:
  args:
    - channel purgeData reason
  desc: '채널의 카운팅을 끄고, 선택적으로 모든 데이터를 삭제해요.'
  params:
    - desc: '카운팅을 끌 채널이에요. 기본값은 현재 채널이에요.'
      name: channel
      optional: true
      type: text channel
    - desc: '이 채널의 카운팅 데이터를 모두 삭제할지 여부예요. 기본값은 false예요.'
      name: purgeData
      optional: true
      type: bool
    - desc: '카운팅을 끄는 사유예요.'
      name: reason
      optional: true
      type: string
countingfailurechannel:
  args:
    - countingChannel failureChannel
  desc: '카운팅 실패를 기록할 채널을 설정해요.'
  params:
    - desc: '카운팅 채널이에요.'
      name: countingChannel
      optional: true
      type: text channel
    - desc: '실패 로그를 보낼 채널이에요. 비활성화하려면 null을 입력해요.'
      name: failureChannel
      optional: true
      type: text channel
countingfailuremessage:
  args:
    - channel embed
  desc: '틀린 카운트에 표시할 사용자 지정 메시지를 설정해요.'
  params:
    - desc: '카운팅 채널이에요. 기본값은 현재 채널이에요.'
      name: channel
      optional: true
      type: text channel
    - desc: '메시지 템플릿이에요. 기본값으로 되돌리려면 "-"를 입력해요.'
      name: embed
      optional: true
      type: string
countingfailurethreshold:
  args:
    - channel threshold
  desc: '조치를 취하기 전 실패 기준치를 설정해요.'
  params:
    - desc: '카운팅 채널이에요. 기본값은 현재 채널이에요.'
      name: channel
      optional: true
      type: text channel
    - desc: '조치 전 실패 횟수예요. 1부터 10까지 입력할 수 있어요.'
      name: threshold
      optional: true
      type: int
countingleaderboard:
  args:
    - type channel
  desc: '카운팅 채널의 리더보드를 보여줘요.'
  params:
    - desc: '리더보드 유형이에요. contributions, streak, accuracy, totalnumbers 중 하나예요.'
      name: type
      optional: true
      type: string
    - desc: '리더보드를 볼 채널이에요. 기본값은 현재 채널이에요.'
      name: channel
      optional: true
      type: text channel
