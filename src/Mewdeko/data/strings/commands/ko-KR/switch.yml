err:
  args:
    - code
  desc: 'Nintendo Switch 오류 코드를 찾아 알려진 정보를 표시합니다.'
  params:
    - desc: '오류 코드입니다. NNNN-NNNN 형식이거나 16진수 형식(예: 0x2A2)입니다.'
      name: code
      optional: false
      type: string
err2hex:
  args:
    - code
  desc: 'Nintendo Switch 오류 코드를 NNNN-NNNN 형식에서 16진수로 변환합니다.'
  params:
    - desc: '변환할 오류 코드입니다. 예: 2168-0002.'
      name: code
      optional: false
      type: string
hex2err:
  args:
    - hex
  desc: '16진수 Nintendo Switch 오류 코드를 NNNN-NNNN 형식으로 변환합니다.'
  params:
    - desc: '변환할 16진수 오류 코드입니다. 예: 0x2A2.'
      name: hex
      optional: false
      type: string
switchbrew:
  args:
    - query
  desc: 'switchbrew.org 위키를 검색하고 가장 관련 있는 문서를 표시합니다.'
  params:
    - desc: '검색어입니다.'
      name: query
      optional: false
      type: string
analyselog:
  args:
    - ''
  desc: '첨부된 Ryujinx 로그 파일을 분석하고 하드웨어, 설정, 문제 해결 정보를 알려줍니다.'
  params: [ ]
