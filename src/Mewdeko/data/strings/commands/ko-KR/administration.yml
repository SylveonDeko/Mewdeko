antiexternalapp:
  args:
    - ''
    - 'Timeout'
    - 'Timeout 5 5 1h'
    - 'Kick 3 0'
  desc: 'Anti-External-App 보호를 켜요. 사용자가 자기 계정에 추가한 앱으로 보내는 메시지를 감시해요. 메시지가 너무 많은 사람이나 역할을 언급하거나(기본값 5, 0이면 끔), @everyone을 사용하거나, 초대 링크를 포함하거나, 10초 동안 허용 횟수(기본값 5, 0이면 끔)보다 많이 앱을 실행하면 메시지를 삭제하고 앱을 실행한 사용자를 처벌해요. 서버에 추가된 앱은 검사하지 않아요. 인수 없이 실행하면 보호를 꺼요.'
  params: [ ]
