antiimagehash:
  args:
    - ''
    - 'Ban'
    - 'Delete 31'
    - 'Timeout 31 1d'
  desc: 'Anti-Image-Hash 보호를 켜요. 차단된 이미지 목록에 있는 이미지를 다시 올리는 사람을 조치해요. 크기를 바꾸거나, 뒤집거나, 화질을 낮춰 다시 올리거나, 테두리를 씌운 복사본도 포함해요. 인수 없이 실행하면 보호를 꺼요. 선택 사항인 허용 오차(0~64, 기본값 31)는 올린 이미지가 차단된 이미지와 얼마나 달라 보여도 차단 대상으로 볼지 정해요.'
  params: [ ]
antiimagehashignore:
  args:
    - '<role>'
    - '<channel>'
  desc: '역할 또는 채널을 Anti-Image-Hash 보호에서 제외할지 설정해요.'
