commands:
  args:
    - '[module]'
    - '[module] [search]'
  desc: '특정 모듈의 명령어를 보여줍니다. 검색어로 범위를 좁힐 수 있습니다. 값이 없으면 modules의 별칭으로 동작하고, modules는 help의 별칭입니다.'
  params:
    - desc: '확인할 모듈과, 명령어를 필터링할 검색어(선택)입니다.'
      name: module
      optional: true
      type: string
