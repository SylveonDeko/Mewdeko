coprmonitoradd:
  args:
    - '<ownerProject> [channel] [packages]'
    - '<ownerProject> [channel] [packages]'
    - ownerProject
  desc: '서버에 COPR 프로젝트 모니터를 추가합니다.'
  params:
    - desc: 'owner/project 형식의 COPR 프로젝트 (예: linux4switch/l4s).'
      name: ownerProject
      optional: false
      type: string
    - desc: '알림을 위한 선택적 채널. 기본값은 현재 채널입니다.'
      name: channel
      optional: true
      type: ITextChannel
    - desc: '모니터링할 패키지의 선택적 쉼표로 구분된 목록 (예: mesa,kernel).'
      name: packages
      optional: true
      type: string
coprmonitorremove:
  args:
    - '<ownerProject> [channel]'
    - ownerProject
  desc: '서버에서 COPR 프로젝트 모니터를 제거합니다.'
  params:
    - desc: 'owner/project 형식의 COPR 프로젝트.'
      name: ownerProject
      optional: false
      type: string
    - desc: '특정 모니터를 제거하기 위한 선택적 채널.'
      name: channel
      optional: true
      type: ITextChannel
coprmonitorlist:
  args:
    - ''
  desc: '서버에 구성된 모든 COPR 모니터를 나열합니다.'
  params: [ ]
coprmonitortoggle:
  args:
    - ownerProject
  desc: 'COPR 모니터를 켜거나 끕니다.'
  params:
    - desc: 'owner/project 형식의 COPR 프로젝트.'
      name: ownerProject
      optional: false
      type: string
coprnotify:
  args:
    - ownerProject status enabled
  desc: '모니터에 대한 알림을 트리거하는 빌드 상태를 구성합니다.'
  params:
    - desc: 'owner/project 형식의 COPR 프로젝트.'
      name: ownerProject
      optional: false
      type: string
    - desc: '구성할 빌드 상태.'
      name: status
      optional: false
      type: CoprBuildStatus
    - desc: '이 상태에 대한 알림을 활성화 또는 비활성화할지 여부.'
      name: enabled
      optional: false
      type: bool
coprfilter:
  args:
    - ownerProject text
  desc: 'COPR 모니터의 패키지 필터를 설정합니다.'
  params:
    - desc: 'owner/project 형식의 COPR 프로젝트.'
      name: ownerProject
      optional: false
      type: string
    - desc: '쉼표로 구분된 패키지 목록, 또는 모든 것을 모니터링하려면 "all".'
      name: packages
      optional: false
      type: string
coprsucceededmessage:
  args:
    - ownerProject text
  desc: 'COPR 빌드가 성공했을 때 표시되는 메시지를 설정합니다.'
  params:
    - desc: 'owner/project 형식의 COPR 프로젝트.'
      name: ownerProject
      optional: false
      type: string
    - desc: '메시지 또는 embed 코드. 기본값으로 재설정하려면 "-" 사용.'
      name: message
      optional: false
      type: string
coprfailedmessage:
  args:
