patreonanalytics:
  args:
    - ''
  desc: '자세한 Patreon 분석을 보여줍니다.'
  params: [ ]
patreonannounce:
  args:
    - ''
  desc: 'Patreon 공지를 수동으로 실행합니다.'
  params: [ ]
patreonch:
  args:
    - '#channel'
  desc: 'Patreon 공지 채널을 설정하거나 보여줍니다.'
  params:
    - desc: 'Patreon 공지를 보낼 채널입니다. 값이 없으면 현재 채널을 보여줍니다.'
      name: channel
      optional: true
      type: ITextChannel?
patreonconfig:
  args:
    - ''
  desc: '이 서버의 현재 Patreon 설정을 보여줍니다.'
  params: [ ]
patreonday:
  args:
    - number
  desc: 'Patreon 공지를 보낼 날짜(일)를 설정합니다.'
  params:
    - desc: '공지를 보낼 날짜(1~28일)입니다. 값이 없으면 현재 날짜를 보여줍니다.'
      name: day
      optional: true
      type: int?
patreondisable:
  args:
    - ''
  desc: '이 서버의 Patreon 공지를 비활성화합니다.'
  params: [ ]
patreonhelp:
  args:
    - ''
  desc: 'Patreon 모듈 정보와 사용 가능한 자리표시자를 보여줍니다.'
  params: [ ]
patreonlink:
  args:
    - '@user text'
  desc: 'Discord 사용자를 Patreon 후원자와 연결합니다.'
  params:
    - desc: '연결할 Discord 사용자입니다.'
      name: user
      optional: false
      type: IGuildUser
    - desc: '연결할 Patreon 사용자 ID입니다.'
      name: patreonUserId
      optional: false
      type: string
patreonmsg:
  args:
    - text
  desc: 'Patreon 공지에 사용할 사용자 지정 메시지를 설정합니다.'
  params:
    - desc: '사용자 지정 메시지입니다. %server.name%, %month% 등의 자리표시자를 사용할 수 있습니다. 기본값으로 되돌리려면 "-"를 입력하세요.'
      name: message
      optional: true
      type: string?
patreonrecognize:
  args:
    - '#channel'
  desc: '새 후원자에게 감사 메시지를 보냅니다.'
  params:
    - desc: '감사 메시지를 보낼 채널입니다.'
      name: channel
      optional: true
      type: ITextChannel?
patreonroles:
  args:
    - ''
  desc: 'Patreon 등급-역할 매핑 목록을 보여줍니다.'
  params: [ ]
patreonrolesync:
  args:
    - ''
  desc: '자동 역할 동기화를 전환합니다.'
  params: [ ]
patreonstats:
  args:
    - ''
  desc: 'Patreon 후원자 통계를 보여줍니다.'
  params: [ ]
patreonsupporters:
  args:
    - ''
  desc: '활성 Patreon 후원자 목록을 보여줍니다.'
  params: [ ]
patreonsync:
  args:
    - ''
  desc: 'Patreon OAuth 연동을 안전하게 설정합니다.'
  params: [ ]
patreonsyncall:
  args:
    - ''
  desc: '연결된 모든 후원자의 역할을 동기화합니다.'
  params: [ ]
patreontiermap:
  args:
    - text @role
  desc: 'Patreon 등급을 Discord 역할에 연결합니다.'
  params:
    - desc: 'Patreon 등급 ID입니다.'
      name: tierId
      optional: false
      type: string
    - desc: '등급에 연결할 Discord 역할입니다.'
      name: role
      optional: false
      type: IRole
patreontoggle:
  args:
    - ''
  desc: 'Patreon 공지를 켜거나 끕니다.'
  params: [ ]
patreontop:
  args:
    - number
  desc: '상위 Patreon 후원자를 보여줍니다.'
  params:
    - desc: '보여줄 상위 후원자 수입니다(1~20).'
      name: count
      optional: true
      type: int