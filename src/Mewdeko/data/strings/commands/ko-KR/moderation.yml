banprune:
  args:
    - ''
  desc: '이 채널에서 차단을 실행했을 때 사용될 메시지 삭제 설정과 모든 구성 설정을 보여줍니다.'
  params:
    - { }
banpruneset:
  args:
    - '<action> <days> [#channel]'
  desc: '차단 작업 한 번에 삭제할 메시지의 일수를 설정합니다. 모든 작업에 적용하려면 "all"을 사용하고, 채널이나 카테고리를 지정하면 해당 범위만 재정의합니다.'
  params:
    - desc: '작업 키이며, 모든 작업에 적용하려면 "all"을 입력합니다.'
      name: action
      optional: false
      type: string
    - desc: '삭제할 일수입니다(0~7).'
      name: days
      optional: false
      type: int
    - desc: '설정을 적용할 채널 또는 카테고리입니다. 비워 두면 서버 기본값이 적용됩니다.'
      name: target
      optional: true
      type: channel
banpruneclear:
  args:
    - '<action> [#channel]'
  desc: '메시지 삭제 설정을 제거하여 작업이 더 넓은 범위나 기본값을 따르도록 합니다.'
  params:
    - desc: '작업 키이며, 모든 작업에 적용되는 설정은 "all"을 입력합니다.'
      name: action
      optional: false
      type: string
    - desc: '설정이 적용된 채널 또는 카테고리입니다. 비워 두면 서버 기본값입니다.'
      name: target
      optional: true
      type: channel
banprunereset:
  args:
    - ''
  desc: '서버의 모든 메시지 삭제 설정을 제거합니다.'
  params:
    - { }
ban:
  args:
    - '<pruneTime> <time> [@user] [msg]'
    - time time
  desc: '지정한 사유와 메시지 삭제 일수로 사용자를 차단합니다.'
  params:
    - desc: '지정한 사유와 메시지 삭제 일수로 사용자를 차단합니다.'
      name: pruneTime
      optional: false
      type: duration
    - desc: '메시지를 삭제할 기간입니다.'
      name: time
      optional: false
      type: duration
    - desc: '차단할 사용자입니다.'
      name: user
      optional: true
      type: user
    - desc: '차단 사유입니다.'
      name: msg
      optional: true
      type: string
