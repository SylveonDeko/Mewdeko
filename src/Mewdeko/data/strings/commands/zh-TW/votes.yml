votemessage:
  args:
    - '[message]'
  desc: >-
    設定用戶投票時發送的自訂訊息，或預覽目前的投票訊息。
  params:
    - desc: '要為投票設定的自訂訊息。使用"-"重置為預設訊息。如果為空，則預覽目前的投票訊息。'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: >-
    啟動設定新投票密碼的確認流程，並提醒用戶注意其安全性。
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: >-
    新增用戶投票時將獲得的身分組，並可選設定自動移除該身分組的時長。
  params:
    - desc: '要作為投票獎勵新增的身分組。'
      name: role
      optional: false
      type: role
    - desc: '身分組被授予的時長。填null表示永久。'
      name: time
      optional: true
      type: duration
