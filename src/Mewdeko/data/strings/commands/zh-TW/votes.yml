votechannel:
  args:
    - channel
  desc: >-
    將指定的文字頻道設定為投票頻道，所有投票確認將在此頻道發送。
  params:
    - &ref_646
      desc: '要設定為投票頻道的文字頻道。'
      name: channel
      optional: false
      type: ITextChannel
