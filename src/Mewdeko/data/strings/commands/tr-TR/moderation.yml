banprune:
  args:
    - ''
  desc: 'Bu kanalda verilen bir yasaklamanın kullanacağı temizliği ve yapılandırılmış tüm ayarları gösterir.'
  params:
    - { }
banpruneset:
  args:
    - '<action> <days> [#channel]'
  desc: 'Tek bir yasaklama işleminin kaç gün mesajı temizleyeceğini ayarlar. Tüm işlemler için "all" kullanın; yalnızca bu kapsamı geçersiz kılmak için bir kanal ya da kategori belirtin.'
  params:
    - desc: 'İşlem anahtarı ya da tüm işlemleri kapsamak için "all".'
      name: action
      optional: false
      type: string
    - desc: 'Gün cinsinden temizlik, 0 ile 7 arasında'
      name: days
      optional: false
      type: int
    - desc: 'Ayarın uygulanacağı bir kanal veya kategori; sunucu varsayılanı için boş bırakın'
      name: target
      optional: true
      type: channel
banpruneclear:
  args:
    - '<action> [#channel]'
  desc: 'Temizleme ayarını kaldırır; böylece işlem daha geniş bir kapsama veya varsayılana döner.'
  params:
    - desc: 'İşlem anahtarı ya da tüm işlemleri kapsayan ayar için "all"'
      name: action
      optional: false
      type: string
    - desc: 'Ayarın bulunduğu kanal veya kategori; sunucu varsayılanı için boş bırakın'
      name: target
      optional: true
      type: channel
banprunereset:
  args:
    - ''
  desc: 'Sunucudaki tüm temizleme ayarlarını kaldırır.'
  params:
    - { }
ban:
  args:
    - '<pruneTime> <time> [@user] [msg]'
    - time time
  desc: 'Bir kullanıcıyı belirtilen sebep ve mesaj temizleme gün sayısıyla yasaklar.'
  params:
    - desc: 'Bir kullanıcıyı belirtilen sebep ve mesaj temizleme gün sayısıyla yasaklar.'
      name: pruneTime
      optional: false
      type: duration
    - desc: 'Mesajları temizlemek için süre'
      name: time
      optional: false
      type: duration
    - desc: 'Yasaklanacak kullanıcı'
      name: user
      optional: true
      type: user
    - desc: 'Yasağın sebebi'
      name: msg
      optional: true
      type: string
