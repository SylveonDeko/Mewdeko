birthdayannouncements:
  args:
    - ''
  desc: 'Kullanıcı için doğum günü duyurularını açar veya kapatır.'
  params: [ ]
birthdaychannel:
  args:
    - '#channel'
  desc: 'Doğum günü duyuru kanalını ayarlar.'
  params:
    - desc: 'Duyurular için metin kanalı. Belirtilmezse mevcut kanal kullanılır.'
      name: channel
      optional: true
      type: ITextChannel
birthdayconfig:
  args:
    - ''
  desc: 'Mevcut doğum günü ayarlarını gösterir.'
  params: [ ]
birthdaylist:
  args:
    - days
  desc: 'Sunucudaki yaklaşan doğum günlerini gösterir.'
  params:
    - desc: 'Kaç gün ileriye bakılacağı. Varsayılan 7, en fazla 30.'
      name: days
      optional: true
      type: int
birthdaymessage:
  args:
    - message
  desc: 'Özel doğum günü mesajı şablonu ayarlar.'
  params:
    - desc: 'Mesaj şablonu. Kullanıcıyı etiketlemek için {user} kullan. Boş bırakılırsa mevcut mesaj gösterilir.'
      name: message
      optional: true
      type: string
birthdaypingrole:
  args:
    - '@role'
  desc: 'Doğum günü duyurularında etiketlenecek rolü ayarlar.'
  params:
    - desc: 'Etiketlenecek rol. Devre dışı bırakmak için rol verme.'
      name: role
      optional: true
      type: IRole
birthdayrole:
  args:
    - '@role'
  desc: 'Kullanıcıların doğum gününde alacağı doğum günü rolünü ayarlar.'
  params:
    - desc: 'Kullanıcının doğum gününde verilecek rol. Devre dışı bırakmak için rol verme.'
      name: role
      optional: true
      type: IRole
birthdaytimezone:
  args:
    - timezone
  desc: 'Doğum günü hesapları için kullanıcının saat dilimini ayarlar.'
  params:
    - desc: 'Ayarlanacak saat dilimi (ör. "America/New_York").'
      name: timezone
      optional: false
      type: string
birthdaytoday:
  args:
    - ''
  desc: 'Bugünkü doğum günlerini gösterir.'
  params: [ ]