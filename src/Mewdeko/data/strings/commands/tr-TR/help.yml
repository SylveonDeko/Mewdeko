commands:
  args:
    - '[module]'
    - '[module] [search]'
  desc: >-
    Belirli bir modülün komutlarını gösterir, isteğe bağlı olarak bir arama terimiyle daraltılır. Null ise modules için bir takma addır, o da help için bir takma addır.
  params:
    - desc: 'İncelenecek modül, isteğe bağlı olarak komutlarını süzmek için bir terim eklenebilir'
      name: module
      optional: true
      type: string
