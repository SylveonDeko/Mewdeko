    - action
  desc: 'Sunucunun Anti-Pattern korumasını ayarlar: rol bazlı ceza eylemini belirler.'
  params:
    - desc: 'Tespit edilen desen eşleşmelerine uygulanacak ceza eylemi.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'Cezanın süresi, uygulanabiliyorsa.'
      name: punishTime
      optional: true
      type: StoopidTime
