    - desc: 'Tespit edilen desen eşleşmelerine uygulanacak ceza eylemi.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'Desenle eşleşen kullanıcılara verilecek rol.'
      name: role
      optional: false
      type: IRole
patternadd:
  args:
    - '<pattern> [name] [checkUsername] [checkDisplayName]'
    - pattern
  desc: 'Anti-Pattern korumasına bir regex deseni ekler.'
  params:
    - desc: 'Kullanıcı adları/görünen adlarla eşleştirilecek regex deseni.'
      name: pattern
      optional: false
      type: string
    - desc: 'Desen için isteğe bağlı ad.'
      name: name
      optional: true
      type: string
    - desc: 'Bu deseni kullanıcı adlarında kontrol edip etmeyeceği (varsayılan true).'
      name: checkUsername
      optional: true
      type: bool
    - desc: 'Bu deseni görünen adlarda kontrol edip etmeyeceği (varsayılan true).'
      name: checkDisplayName
      optional: true
      type: bool
patternremove:
  args:
    - number
  desc: 'Anti-Pattern korumasından bir deseni kaldırır.'
  params:
    - desc: 'Kaldırılacak desenin ID''si.'
      name: patternId
      optional: false
      type: int
patternlist:
