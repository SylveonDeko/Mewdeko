mcstatus:
  args:
    - '[server name or address]'
  desc: 'Bir Minecraft sunucusunun durumunu kontrol eder. Kayıtlı bir sunucu adı, doğrudan bir adres kullanın ya da varsayılan sunucu için boş bırakın.'
  params:
    - desc: 'Kayıtlı sunucu adı ya da doğrudan adres (ör. play.example.com:25565).'
      name: serverName
      optional: true
      type: string
mcadd:
  args:
    - name address
  desc: 'Sunucuya bir Minecraft sunucusu ekler. Bedrock sunucuları için adresin başına bedrock: yazın.'
  params:
    - desc: 'Sunucu için bir etiket.'
      name: name
      optional: false
      type: string
    - desc: 'Sunucu adresi, isteğe bağlı olarak port ile (ör. play.example.com:25565 veya bedrock:play.example.com).'
      name: address
      optional: false
      type: string
mcremove:
  args:
    - name
  desc: 'Sunucudan bir Minecraft sunucusunu kaldırır.'
  params:
    - desc: 'Kaldırılacak sunucunun adı.'
      name: name
      optional: false
      type: string
mclist:
  args:
    - ''
  desc: 'Bu sunucu için kayıtlı tüm Minecraft sunucularını listeler.'
  params: [ ]
mcdefault:
  args:
    - name
  desc: 'Bir sunucuyu durum komutları için varsayılan olarak ayarlar.'
  params:
    - desc: 'Varsayılan olarak ayarlanacak sunucunun adı.'
      name: name
      optional: false
      type: string
mcwatch:
  args:
    - name '#channel'
  desc: 'Bir sunucu için periyodik durum güncellemelerini alacak bir kanal ayarlar. Devre dışı bırakmak için kanalı atlayın.'
  params:
    - desc: 'İzlenecek sunucunun adı.'
      name: serverName
      optional: false
      type: string
    - desc: 'Güncellemelerin paylaşılacağı kanal.'
      name: channel
      optional: true
      type: ITextChannel
mcwatchmode:
  args:
    - name embed|topic|both
  desc: 'Sunucu durumunun nasıl gösterileceğini ayarlar: embed (yerinde düzenlenir), kanal konusu veya ikisi birden.'
  params:
    - desc: 'Sunucunun adı.'
      name: serverName
      optional: false
      type: string
    - desc: 'İzleme modu: Embed, ChannelTopic veya Both.'
      name: mode
      optional: false
      type: McWatchMode
mcembed:
  args:
    - name template
  desc: 'İzlenen bir sunucu için özel embed şablonu ayarlar. Sıfırlamak için "-" kullanın. Yer tutucular: %mc.server.name%, %mc.players.online%, %mc.players.max%, %mc.motd%, %mc.version%, %mc.latency%, %mc.online%, %mc.favicon%.'
  params:
    - desc: 'Sunucunun adı.'
      name: serverName
      optional: false
      type: string
    - desc: 'Embed şablonu JSON''u ya da varsayılana sıfırlamak için "-".'
      name: template
      optional: true
      type: string
mcplayer:
  args:
    - username
  desc: 'Bir Minecraft oyuncusunu kullanıcı adıyla arar ve profilini ve skinini gösterir.'
  params:
    - desc: 'Aranacak Minecraft kullanıcı adı.'
      name: username
      optional: false
      type: string
mcskin:
  args:
    - username
  desc: 'Bir Minecraft oyuncusunun skin görüntüsünü gösterir.'
  params:
    - desc: 'Minecraft kullanıcı adı.'
      name: username
      optional: false
      type: string
mcrcon:
  args:
    - name command
  desc: 'Kayıtlı bir Minecraft sunucusuna RCON komutu gönderir. RCON, kontrol paneli üzerinden yapılandırılmış olmalıdır.'
  params:
    - desc: 'Sunucunun adı.'
      name: serverName
      optional: false
      type: string
    - desc: 'Sunucuda çalıştırılacak komut.'
      name: command
      optional: false
      type: string
mcwhitelist:
  args:
    - name add|remove|list|on|off|reload [player]
  desc: 'RCON üzerinden bir Minecraft sunucusundaki beyaz listeyi yönetir. RCON''un yapılandırılmış olmasını gerektirir.'
  params:
    - desc: 'Sunucunun adı.'
      name: serverName
      optional: false
      type: string
    - desc: 'İşlem: add, remove, list, on, off, reload.'
      name: action
      optional: false
      type: string
    - desc: 'Oyuncu adı (add/remove için).'
      name: playerName
      optional: true
      type: string
