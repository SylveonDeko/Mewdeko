patreonanalytics:
  args:
    - ''
  desc: 'Ayrıntılı Patreon analizlerini gösterir'
  params: [ ]
patreonannounce:
  args:
    - ''
  desc: 'Bir Patreon duyurusunu elle tetikler.'
  params: [ ]
patreonch:
  args:
    - '#channel'
  desc: 'Patreon duyuru kanalını ayarlar ya da gösterir.'
  params:
    - desc: 'Patreon duyuruları için ayarlanacak kanal. Boşsa mevcut kanalı gösterir.'
      name: channel
      optional: true
      type: ITextChannel?
patreonconfig:
  args:
    - ''
  desc: 'Bu sunucunun mevcut Patreon yapılandırmasını gösterir.'
  params: [ ]
patreonday:
  args:
    - number
  desc: 'Patreon duyuruları için ayın gününü ayarlar.'
  params:
    - desc: 'Duyurular için ayın günü (1-28). Boşsa mevcut günü gösterir.'
      name: day
      optional: true
      type: int?
patreondisable:
  args:
    - ''
  desc: 'Bu sunucu için Patreon duyurularını devre dışı bırakır.'
  params: [ ]
patreonhelp:
  args:
    - ''
  desc: 'Patreon modülü bilgilerini ve kullanılabilir yer tutucuları gösterir.'
  params: [ ]
patreonlink:
  args:
    - '@user text'
  desc: 'Bir Discord kullanıcısını bir Patreon destekçisine bağlar'
  params:
    - desc: 'Bağlanacak Discord kullanıcısı.'
      name: user
      optional: false
      type: IGuildUser
    - desc: 'Bağlanacak Patreon kullanıcı kimliği.'
      name: patreonUserId
      optional: false
      type: string
patreonmsg:
  args:
    - text
  desc: 'Patreon duyuruları için özel bir mesaj ayarlar.'
  params:
    - desc: 'Özel mesaj. %server.name%, %month% gibi yer tutucuları kullanın. Varsayılana dönmek için "-" kullanın.'
      name: message
      optional: true
      type: string?
patreonrecognize:
  args:
    - '#channel'
  desc: 'Yeni destekçiler için teşekkür mesajları gönderir'
  params:
    - desc: 'Teşekkür mesajlarının gönderileceği kanal.'
      name: channel
      optional: true
      type: ITextChannel?
patreonroles:
  args:
    - ''
  desc: 'Patreon kademe-rol eşleşmelerini listeler'
  params: [ ]
patreonrolesync:
  args:
    - ''
  desc: 'Otomatik rol senkronizasyonunu açıp kapatır'
  params: [ ]
patreonstats:
  args:
    - ''
  desc: 'Patreon destekçi istatistiklerini gösterir'
  params: [ ]
patreonsupporters:
  args:
    - ''
  desc: 'Aktif Patreon destekçilerini listeler'
  params: [ ]
patreonsync:
  args:
    - ''
  desc: 'Patreon OAuth entegrasyonunu güvenli bir şekilde kurar'
  params: [ ]
patreonsyncall:
  args:
    - ''
  desc: 'Bağlı tüm destekçiler için rolleri senkronize eder'
  params: [ ]
patreontiermap:
  args:
    - text @role
  desc: 'Bir Patreon kademesini bir Discord rolüne eşler'
  params:
    - desc: 'Patreon kademe kimliği.'
      name: tierId
      optional: false
      type: string
    - desc: 'Kademeye eşlenecek Discord rolü.'
      name: role
      optional: false
      type: IRole
patreontoggle:
  args:
    - ''
  desc: 'Patreon duyurularını açar ya da kapatır.'
  params: [ ]
patreontop:
  args:
    - number
  desc: 'En iyi Patreon destekçilerini gösterir'
  params:
    - desc: 'Gösterilecek en iyi destekçi sayısı (1-20).'
      name: count
      optional: true
      type: int