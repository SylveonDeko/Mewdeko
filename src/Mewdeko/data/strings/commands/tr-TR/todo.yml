todoadd:
  args:
    - listId
    - title
    - description
  desc: 'Belirtilen listeye yeni bir yapılacak öğesi ekler'
  params:
    - desc: 'Yapılacaklar listesinin ID''si.'
      name: listId
      optional: false
      type: int
    - desc: 'Yapılacak öğenin başlığı.'
      name: title
      optional: false
      type: string
    - desc: 'Öğe için isteğe bağlı açıklama.'
      name: description
      optional: true
      type: string
todoaddpriority:
  args:
    - listId
    - priority
    - title
    - description
  desc: 'Öncelik ve isteğe bağlı son tarihle yapılacak öğesi ekler'
  params:
    - desc: 'Yapılacaklar listesinin ID''si.'
      name: listId
      optional: false
      type: int
    - desc: 'Öncelik seviyesi (1=Düşük, 2=Orta, 3=Yüksek, 4=Kritik).'
      name: priority
      optional: false
      type: int
    - desc: 'Yapılacak öğenin başlığı.'
      name: title
      optional: false
      type: string
    - desc: 'Öğe için isteğe bağlı açıklama.'
      name: description
      optional: true
      type: string
todoaddtag:
  args:
    - itemId
    - tag
  desc: 'Bir yapılacak öğesine etiket ekler'
  params:
    - desc: 'Yapılacak öğesinin ID''si.'
      name: itemId
      optional: false
      type: int
    - desc: 'Eklenecek etiket.'
      name: tag
      optional: false
      type: string
todocleardue:
  args:
    - itemId
  desc: 'Bir yapılacak öğesinin son tarihini kaldırır'
  params:
    - desc: 'Yapılacak öğesinin ID''si.'
      name: itemId
      optional: false
      type: int
todoclearreminder:
  args:
    - itemId
  desc: 'Bir yapılacak öğesinin hatırlatıcısını kaldırır'
  params:
    - desc: 'Yapılacak öğesinin ID''si.'
      name: itemId
      optional: false
      type: int
todocomplete:
  args:
    - itemId
  desc: 'Bir yapılacak öğesini tamamlar'
  params:
    - desc: 'Yapılacak öğesinin ID''si.'
      name: itemId
      optional: false
      type: int
todocreatelist:
  args:
    - name
    - description
  desc: 'Yeni bir yapılacaklar listesi oluşturur'
  params:
    - desc: 'Yapılacaklar listesinin adı.'
      name: name
      optional: false
      type: string
    - desc: 'Liste için isteğe bağlı açıklama.'
      name: description
      optional: true
      type: string
todocreateserverlist:
  args:
    - name
    - description
  desc: 'Sunucuya özel yeni bir yapılacaklar listesi oluşturur (yalnızca yönetici)'
  params:
    - desc: 'Sunucu yapılacaklar listesinin adı.'
      name: name
      optional: false
      type: string
    - desc: 'Liste için isteğe bağlı açıklama.'
      name: description
      optional: true
      type: string
tododelete:
  args:
    - itemId
  desc: 'Bir yapılacak öğesini siler'
  params:
    - desc: 'Yapılacak öğesinin ID''si.'
      name: itemId
      optional: false
      type: int
tododeletelist:
  args:
    - listId
  desc: 'Tüm yapılacaklar listesini siler'
  params:
    - desc: 'Yapılacaklar listesinin ID''si.'
      name: listId
      optional: false
      type: int
todoedit:
  args:
    - itemId
    - title
    - description
  desc: 'Bir yapılacak öğesinin başlığını ve açıklamasını düzenler'
  params:
    - desc: 'Yapılacak öğesinin ID''si.'
      name: itemId
      optional: false
      type: int
    - desc: 'Yeni başlık.'
      name: title
      optional: false
      type: string
    - desc: 'Yeni açıklama.'
      name: description
      optional: true
      type: string
todofilter:
  args:
    - listId
    - filter
    - value
  desc: 'Yapılacak öğelerini etikete veya önceliğe göre filtreler'
  params:
    - desc: 'Yapılacaklar listesinin ID''si.'
      name: listId
      optional: false
      type: int
    - desc: 'Filtre türü (tag veya priority).'
      name: filter
      optional: false
      type: string
    - desc: 'Filtrelenecek değer.'
      name: value
      optional: true
      type: string
todogrant:
  args:
    - listId
    - '@user'
    - permissions
  desc: 'Bir yapılacaklar listesi için bir kullanıcıya izin verir (yalnızca liste sahibi/yöneticisi)'
  params:
    - desc: 'Yapılacaklar listesinin ID''si.'
      name: listId
      optional: false
      type: int
    - desc: 'İzin verilecek kullanıcı.'
      name: user
      optional: false
      type: IUser
    - desc: 'Virgülle ayrılmış izinler (view,add,edit,complete,delete,manage,all).'
      name: permissions
      optional: false
      type: string
todolists:
  args:
    - includeServer
  desc: 'Kullanıcının erişebildiği tüm yapılacaklar listelerini listeler'
  params:
    - desc: 'Sunucu genelindeki listeler de dahil edilsin mi.'
      name: includeServer
      optional: true
      type: bool
todopermissions:
  args:
    - listId
  desc: 'Bir yapılacaklar listesinin tüm izinlerini gösterir'
  params:
    - desc: 'Yapılacaklar listesinin ID''si.'
      name: listId
      optional: false
      type: int
todoremovetag:
  args:
    - itemId
    - tag
  desc: 'Bir yapılacak öğesinden etiketi kaldırır'
  params:
    - desc: 'Yapılacak öğesinin ID''si.'
      name: itemId
      optional: false
      type: int
    - desc: 'Kaldırılacak etiket.'
      name: tag
      optional: false
      type: string
todoreorder:
  args:
    - itemId
    - newPosition
  desc: 'Bir yapılacak öğesini yeni bir konuma taşır'
  params:
    - desc: 'Yapılacak öğesinin ID''si.'
      name: itemId
      optional: false
      type: int
    - desc: 'Yeni konum (1''den başlar).'
      name: newPosition
      optional: false
      type: int
todorevoke:
  args:
    - listId
    - '@user'
  desc: 'Bir kullanıcının yapılacaklar listesindeki tüm izinlerini iptal eder'
  params:
    - desc: 'Yapılacaklar listesinin ID''si.'
      name: listId
      optional: false
      type: int
    - desc: 'İzinleri iptal edilecek kullanıcı.'
      name: user
      optional: false
      type: IUser
todosearch:
  args:
    - listId
    - query
  desc: 'Bir liste içinde yapılacak öğelerini arar'
  params:
    - desc: 'Yapılacaklar listesinin ID''si.'
      name: listId
      optional: false
      type: int
    - desc: 'Arama sorgusu.'
      name: query
      optional: false
      type: string
todosetcolor:
  args:
    - listId
    - color
  desc: 'Bir yapılacaklar listesinin rengini ayarlar'
  params:
    - desc: 'Yapılacaklar listesinin ID''si.'
      name: listId
      optional: false
      type: int
    - desc: 'Hex renk kodu, örn. #ff0000.'
      name: color
      optional: false
      type: string
todosetdue:
  args:
    - itemId
    - dateString
  desc: 'Bir yapılacak öğesinin son tarihini ayarlar'
  params:
    - desc: 'Yapılacak öğesinin ID''si.'
      name: itemId
      optional: false
      type: int
    - desc: 'Son tarih ve saat.'
      name: dateString
      optional: false
      type: string
todosetreminder:
  args:
    - itemId
    - dateString
  desc: 'Bir yapılacak öğesi için hatırlatma zamanı ayarlar'
  params:
    - desc: 'Yapılacak öğesinin ID''si.'
      name: itemId
      optional: false
      type: int
    - desc: 'Hatırlatma tarihi ve saati.'
      name: dateString
      optional: false
      type: string
todoshow:
  args:
    - listId
    - includeCompleted
  desc: 'Bir yapılacaklar listesindeki tüm öğeleri gösterir'
  params:
    - desc: 'Yapılacaklar listesinin ID''si.'
      name: listId
      optional: false
      type: int
    - desc: 'Tamamlanmış öğeler de dahil edilsin mi.'
      name: includeCompleted
      optional: true
      type: bool
todotoggleprivacy:
  args:
    - listId
  desc: 'Bir yapılacaklar listesinin gizlilik ayarını değiştirir'
  params:
    - desc: 'Yapılacaklar listesinin ID''si.'
      name: listId
      optional: false
      type: int