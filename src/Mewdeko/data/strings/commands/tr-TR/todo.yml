todoadd:
  args:
    - listId
    - title
    - description
  desc: 'Belirtilen listeye yeni bir gorev ogesi ekler'
  params:
    - desc: 'Gorev listesinin IDsi.'
      name: listId
      optional: false
      type: int
    - desc: 'Gorev ogesinin basligi.'
      name: title
      optional: false
      type: string
    - desc: 'Oge icin ihtiyari aciklama.'
      name: description
      optional: true
      type: string
todoaddpriority:
  args:
    - listId
    - priority
    - title
    - description
  desc: 'Oncelik ve ihtiyari son tarihle bir gorev ogesi ekler'
  params:
    - desc: 'Gorev listesinin IDsi.'
      name: listId
      optional: false
      type: int
    - desc: 'Oncelik seviyesi (1=Dusuk, 2=Orta, 3=Yuksek, 4=Kritik).'
      name: priority
      optional: false
      type: int
    - desc: 'Gorev ogesinin basligi.'
      name: title
      optional: false
      type: string
    - desc: 'Oge icin ihtiyari aciklama.'
      name: description
      optional: true
      type: string
