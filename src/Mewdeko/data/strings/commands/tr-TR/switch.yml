err:
  args:
    - code
  desc: 'Bir Nintendo Switch hata kodunu arar ve hakkında bilinenleri gösterir.'
  params:
    - desc: 'Hata kodu; NNNN-NNNN biçiminde veya onaltılık olarak (ör. 0x2A2).'
      name: code
      optional: false
      type: string
err2hex:
  args:
    - code
  desc: 'Nintendo Switch hata kodunu NNNN-NNNN biçiminden onaltılık sisteme çevirir.'
  params:
    - desc: 'Çevrilecek hata kodu, ör. 2168-0002.'
      name: code
      optional: false
      type: string
hex2err:
  args:
    - hex
  desc: 'Onaltılık Nintendo Switch hata kodunu NNNN-NNNN biçimine çevirir.'
  params:
    - desc: 'Çevrilecek onaltılık hata kodu, ör. 0x2A2.'
      name: hex
      optional: false
      type: string
switchbrew:
  args:
    - query
  desc: 'switchbrew.org wiki''sinde arama yapar ve en iyi eşleşen sayfaları gösterir.'
  params:
    - desc: 'Arama sorgusu.'
      name: query
      optional: false
      type: string
analyselog:
  args:
    - ''
  desc: 'Eklenmiş bir Ryujinx günlük dosyasını analiz eder ve donanım, ayarlar ve sorun giderme bilgilerini raporlar.'
  params: [ ]
