statchannelcreate:
  args:
    - 'TotalMembers [template]'
  desc: 'Bir sunucu istatistiğini gösteren yeni bir kilitli ses kanalı oluşturur. Kanalı bot oluşturur ve yönetir.'
  params:
    - desc: 'Gösterilecek istatistik türü.'
      name: type
      optional: false
      type: StatChannelType
    - desc: 'Görüntüleme şablonu. Değer için %count% kullan.'
      name: template
      optional: true
      type: string
statchanneladd:
  args:
    - '#voice-channel TotalMembers [template]'
  desc: 'Bir ses kanalını istatistik kanalı olarak ekler. Türler: TotalMembers, HumanMembers, BotCount, OnlineMembers, ChannelCount, RoleCount, BoostCount, BoostLevel, EmojiCount.'
  params:
    - desc: 'Kullanılacak ses kanalı.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Gösterilecek istatistik türü.'
      name: type
      optional: false
      type: StatChannelType
    - desc: 'Görüntüleme şablonu. Değer için %count% kullan.'
      name: template
      optional: true
      type: string
statchannelrole:
  args:
    - '#voice-channel @role [template]'
  desc: 'Belirli bir role sahip üye sayısını gösteren bir istatistik kanalı ekler.'
  params:
    - desc: 'Kullanılacak ses kanalı.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Üye sayısı hesaplanacak rol.'
      name: role
      optional: false
      type: IRole
    - desc: 'Görüntüleme şablonu. %count% ve %role.name% kullan.'
      name: template
      optional: true
      type: string
statchannelcountdown:
  args:
    - '#voice-channel 2026-12-31 [template]'
  desc: 'Geri sayım istatistik kanalı ekler. %days% ve %hours% yer tutucularını kullan.'
  params:
    - desc: 'Kullanılacak ses kanalı.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Geri sayımın hedef tarihi.'
      name: date
      optional: false
      type: DateTime
    - desc: 'Görüntüleme şablonu. %days% ve %hours% kullan.'
      name: template
      optional: true
      type: string
statchannelgoal:
  args:
    - '#voice-channel 1000 [template]'
  desc: 'Üye hedefi istatistik kanalı ekler. %count%, %goal% ve %goal.percent% kullan.'
  params:
    - desc: 'Kullanılacak ses kanalı.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Hedef üye sayısı.'
      name: goal
      optional: false
      type: int
    - desc: 'Görüntüleme şablonu. %count%, %goal%, %goal.percent% kullan.'
      name: template
      optional: true
      type: string
statchannelremove:
  args:
    - '#voice-channel'
  desc: 'Bir istatistik kanalını kaldırır.'
  params:
    - desc: 'Kaldırılacak ses kanalı.'
      name: channel
      optional: false
      type: IVoiceChannel
statchannellist:
  args:
    - ''
  desc: 'Bu sunucudaki tüm istatistik kanallarını listeler.'
  params: [ ]
statchanneltwitchcounter:
  args:
    - '#voice-channel counter [template]'
  desc: 'Bir istatistik kanalını Twitch sayacı gösterecek şekilde ayarlar.'
statchannelmechanism:
  args:
    - '#voice-channel Rename|Recreate|Auto [interval-minutes]'
  desc: 'Bir istatistik kanalı için güncelleme mekanizmasını ayarlar.'
statchannelstyle:
  args:
    - '#voice-channel Plain|Comma|Abbreviated|ProgressBar'
  desc: 'Bir istatistik kanalı için görüntü stilini ayarlar.'
statchanneldefaults:
  args:
    - '[Rename|Recreate|Auto] [interval-minutes] [Plain|Comma|Abbreviated|ProgressBar]'
  desc: 'İstatistik kanalları için varsayılan ayarları gösterir.'
statchanneltypes:
  args:
    - ''
  desc: 'Kullanılabilir istatistik kanalı türlerini listeler.'
