countingban:
  args:
    - user channel duration reason
  desc: 'Bir kullanıcıyı belirli bir kanalda sayımdan yasaklar.'
  params:
    - desc: 'Sayımdan yasaklanacak kullanıcı.'
      name: user
      optional: false
      type: guild user
    - desc: 'Sayım kanalı. Varsayılan olarak mevcut kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Yasağın süresi (ör. 1h, 1d). Kalıcı için boş bırak.'
      name: duration
      optional: true
      type: stoopid time
    - desc: 'Yasağın nedeni.'
      name: reason
      optional: true
      type: string
countingconfig:
  args:
    - channel
  desc: 'Bir sayım kanalının ayarlarını yapılandırır.'
  params:
    - desc: 'Ayarları gösterilecek kanal. Varsayılan olarak mevcut kanal.'
      name: channel
      optional: true
      type: text channel
countingcooldown:
  args:
    - channel seconds
  desc: 'Kullanıcıların sayıları arasındaki bekleme süresini ayarlar.'
  params:
    - desc: 'Sayım kanalı. Varsayılan olarak mevcut kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Saniye cinsinden bekleme süresi (0-300).'
      name: seconds
      optional: true
      type: int
countingdisable:
  args:
    - channel purgeData reason
  desc: 'Bir kanalda sayımı kapatır ve isteğe bağlı olarak tüm verileri temizler.'
  params:
    - desc: 'Sayımın kapatılacağı kanal. Varsayılan olarak mevcut kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Bu kanalın tüm sayım verilerinin silinip silinmeyeceği. Varsayılan false.'
      name: purgeData
      optional: true
      type: bool
    - desc: 'Sayımın kapatılma nedeni.'
      name: reason
      optional: true
      type: string
countingfailurechannel:
  args:
    - countingChannel failureChannel
  desc: 'Sayım hatalarının kaydedileceği kanalı ayarlar.'
  params:
    - desc: 'Sayım kanalı.'
      name: countingChannel
      optional: true
      type: text channel
    - desc: 'Hata logları için kanal. Kapatmak için null kullan.'
      name: failureChannel
      optional: true
      type: text channel
countingfailuremessage:
  args:
    - channel embed
  desc: 'Hatalı sayımlar için özel mesaj ayarlar.'
  params:
    - desc: 'Sayım kanalı. Varsayılan olarak mevcut kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Mesaj şablonu. Varsayılana dönmek için "-" kullan.'
      name: embed
      optional: true
      type: string
countingfailurethreshold:
  args:
    - channel threshold
  desc: 'Cezalardan önceki hata eşiğini ayarlar.'
  params:
    - desc: 'Sayım kanalı. Varsayılan olarak mevcut kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Eylemden önceki hata sayısı (1-10).'
      name: threshold
      optional: true
      type: int
countingleaderboard:
  args:
    - type channel
  desc: 'Bir sayım kanalının sıralamasını gösterir.'
  params:
    - desc: 'Sıralama türü (contributions, streak, accuracy, totalnumbers).'
      name: type
      optional: true
      type: string
    - desc: 'Sıralamanın gösterileceği kanal. Varsayılan olarak mevcut kanal.'
      name: channel
      optional: true
      type: text channel
countinglist:
  args:
