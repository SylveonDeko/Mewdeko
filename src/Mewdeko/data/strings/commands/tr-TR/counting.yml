  args:
    - channel
  desc: 'Bir sayim kanalinin ayarlarini yapilandirir.'
  params:
    - desc: 'Yapilandirmayi gostermek icin kanal. Varsayilan mevcut kanaldir.'
      name: channel
      optional: true
      type: text channel
countingcooldown:
  args:
    - channel seconds
  desc: 'Kullanici sayimlari arasindaki bekleme suresini ayarlar.'
  params:
    - desc: 'Sayim kanali. Varsayilan mevcut kanaldir.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Saniye cinsinden bekleme suresi (0-300).'
      name: seconds
      optional: true
      type: int
countingdisable:
  args:
    - channel purgeData reason
  desc: 'Bir kanalda saymay devre disi birakir ve isteege bagli olarak tum verileri siler.'
  params:
    - desc: 'Sayimin devre disi birakilacagi kanal. Varsayilan mevcut kanaldir.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Bu kanalin tum sayim verilerinin silinip silinmeyecegi. Varsayilan false.'
      name: purgeData
      optional: true
      type: bool
    - desc: 'Sayimi devre disi birakmanin nedeni.'
      name: reason
      optional: true
      type: string
