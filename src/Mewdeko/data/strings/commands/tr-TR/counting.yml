countingban:
  args:
    - user channel duration reason
  desc: 'Bir kullanicinin belirli bir kanalda saymasini yasaklar.'
  params:
    - desc: 'Saymasi yasaklanacak kullanici.'
      name: user
      optional: false
      type: guild user
    - desc: 'Sayim kanali. Varsayilan mevcut kanaldir.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Yasak suresi (ornegin 1h, 1d). Kalici icin bos birakin.'
      name: duration
      optional: true
      type: stoopid time
    - desc: 'Yasagin nedeni.'
      name: reason
      optional: true
      type: string
