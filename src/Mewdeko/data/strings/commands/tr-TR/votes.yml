votemessage:
  args:
    - '[message]'
  desc: >-
    Bir kullanıcı oy verdiğinde gönderilecek özel mesajı ayarlar veya mevcut
    oy mesajını önizler.
  params:
    - desc: 'Oylar için ayarlanacak özel mesaj. Varsayılan mesaja sıfırlamak için "-" kullanın. Null ise mevcut oy mesajını önizler.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: >-
    Yeni bir oy şifresi belirlemek için bir onay süreci başlatır ve kullanıcıyı
    güvenliği konusunda uyarır.
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: >-
    Kullanıcılar oy verdiğinde verilecek bir rol ekler, isteğe bağlı olarak
    rolün otomatik kaldırılma süresiyle birlikte.
  params:
    - desc: 'Oy ödülü olarak eklenecek rol.'
      name: role
      optional: false
      type: role
    - desc: 'Rolün verileceği süre. Süresiz için null.'
      name: time
      optional: true
      type: duration
