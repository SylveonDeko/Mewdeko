coprmonitoradd:
  args:
    - '<ownerProject> [channel] [packages]'
    - '<ownerProject> [channel] [packages]'
    - ownerProject
  desc: 'Sunucuya bir COPR projesi izleyicisi ekler.'
  params:
    - desc: 'owner/project biçimindeki COPR projesi (ör. linux4switch/l4s).'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Bildirimler için isteğe bağlı kanal. Varsayılan olarak mevcut kanal.'
      name: channel
      optional: true
      type: ITextChannel
    - desc: 'İzlenecek paketlerin isteğe bağlı, virgülle ayrılmış listesi (ör. mesa,kernel).'
      name: packages
      optional: true
      type: string
coprmonitorremove:
  args:
    - '<ownerProject> [channel]'
    - ownerProject
  desc: 'Sunucudan bir COPR projesi izleyicisini kaldırır.'
  params:
    - desc: 'owner/project biçimindeki COPR projesi.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Belirli bir izleyicinin kaldırılacağı isteğe bağlı kanal.'
      name: channel
      optional: true
      type: ITextChannel
coprmonitorlist:
  args:
    - ''
  desc: 'Sunucuda ayarlanmış tüm COPR izleyicilerini listeler.'
  params: [ ]
coprmonitortoggle:
  args:
    - ownerProject
  desc: 'Bir COPR izleyicisini açar veya kapatır.'
  params:
    - desc: 'owner/project biçimindeki COPR projesi.'
      name: ownerProject
      optional: false
      type: string
coprnotify:
  args:
    - ownerProject status enabled
  desc: 'Bir izleyici için hangi derleme durumlarının bildirim tetikleyeceğini ayarlar.'
  params:
    - desc: 'owner/project biçimindeki COPR projesi.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Ayarlanacak derleme durumu.'
      name: status
      optional: false
      type: CoprBuildStatus
    - desc: 'Bu durum için bildirimlerin açılıp kapatılacağı.'
      name: enabled
      optional: false
      type: bool
coprfilter:
  args:
    - ownerProject text
  desc: 'Bir COPR izleyicisi için paket filtresini ayarlar.'
  params:
    - desc: 'owner/project biçimindeki COPR projesi.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Virgülle ayrılmış paket listesi veya her şeyi izlemek için "all".'
      name: packages
      optional: false
      type: string
coprsucceededmessage:
  args:
    - ownerProject text
  desc: 'Bir COPR derlemesi başarılı olduğunda gösterilecek mesajı ayarlar.'
  params:
    - desc: 'owner/project biçimindeki COPR projesi.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Mesaj veya embed kodu. Varsayılana dönmek için "-" kullan.'
      name: message
      optional: false
      type: string
