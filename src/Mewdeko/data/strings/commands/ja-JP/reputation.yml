      type: string
myrep:
  args:
    - ''
  desc: '現在のユーザーの評判を確認します。'
  params: [ ]
rep:
  args:
    - '@user reptype text'
  desc: '指定したユーザーに評判を与えます。'
  params:
    - desc: '評判を与えるユーザーです。'
      name: target
