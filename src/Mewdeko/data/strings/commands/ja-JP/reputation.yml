      type: string
repanon:
  args:
    - '@user reptype text'
  desc: '指定したユーザーに匿名で評判を与えます。'
  params:
    - desc: '評判を与えるユーザーです。'
      name: target
      optional: true
      type: IGuildUser
    - desc: '与える評判の種類です。'
      name: repType
      optional: true
      type: string
    - desc: '評判を与える理由またはコメント（任意）です。'
      name: reason
      optional: true
      type: string
repanonymous:
  args:
    - enabled
  desc: '匿名での評判付与を有効または無効にします。'
  params:
    - desc: '匿名の評判を有効にする場合は true です。'
      name: enabled
      optional: false
      type: bool
repchannel:
  args:
    - '#channel state number'
  desc: 'チャンネル単位の評判設定を行います。'
  params:
    - desc: '設定するチャンネルです。'
      name: channel
      optional: false
      type: ITextChannel
    - desc: '設定する状態です（enabled/disabled/readonly）。'
      name: state
      optional: true
      type: string
    - desc: 'このチャンネルの評判の倍率です。'
      name: multiplier
      optional: true
      type: decimal
repcheck:
  args:
    - '@user'
  desc: 'ユーザーの評判を確認します。'
  params:
    - desc: '評判を確認するユーザーです。null の場合は、コマンドを実行したユーザーの評判を確認します。'
      name: target
      optional: true
      type: IGuildUser
repcommandbypass:
  args:
    - commandname '@role'
  desc: 'コマンドの要件に対するバイパスロールを設定します。'
  params:
    - &ref_426
      desc: 'コマンド名です。'
      name: commandName
      optional: false
      type: string
    - desc: '要件をバイパスできるロールです。'
      name: roles
      optional: false
      type: IRole[]
repcommandinfo:
  args:
    - commandname
  desc: '特定のコマンドの評判の要件を表示します。'
  params:
    - desc: '確認するコマンドです。'
      name: commandName
      optional: false
      type: string
repcommandreq:
  args:
    - commandname 50
    - commandname 50 helper
    - 'commandname 50 helper #channel1 #channel2'
  desc: 'コマンドの評判要件を設定します。必要に応じて特定のチャンネルに限定できます。'
  params:
    - desc: 'コマンド名です。'
      name: commandName
      optional: false
      type: string
    - desc: '必要な最低評判です。'
      name: minReputation
      optional: false
      type: int
    - desc: '必要な特定の評判の種類です（任意。デフォルトは total）。'
      name: repType
      optional: true
      type: string
    - desc: 'この要件が適用されるチャンネル（任意。指定しない場合はグローバルに適用されます）。'
      name: channels
      optional: true
      type: ITextChannel[]
repcommandreqlist:
  args:
    - ''
  desc: 'サーバーのすべてのコマンド要件を一覧表示します。'
  params: [ ]
repcommandreqremove:
  args:
    - commandname
  desc: 'コマンドから評判の要件を削除します。'
  params:
    - desc: 'コマンド名です。'
      name: commandName
      optional: false
      type: string
repconfig:
  args:
    - ''
  desc: 'インタラクティブな評判の設定画面を開きます。'
  params: [ ]
repcooldown:
  args:
    - minutes
  desc: '評判を与えるまでのデフォルトのクールダウンを設定します。'
  params:
    - desc: 'クールダウン（分、1〜1440）です。'
      name: minutes
      optional: false
      type: int
repdailylimit:
  args:
    - limit
  desc: '評判を与えられる1日あたりの上限を設定します。'
  params:
    - desc: '1日の上限（1〜100）です。'
      name: limit
      optional: false
      type: int
repdecay:
  args:
    - enabled
  desc: '非アクティブなユーザーの評判の減少を有効または無効にします。'
  params:
    - desc: '減少を有効にする場合は true です。'
      name: enabled
      optional: false
      type: bool
repdecayamount:
  args:
    - amount
  desc: '減少量を設定します。'
  params:
    - desc: '減少量（1〜100）です。'
      name: amount
      optional: false
      type: int
repdecayinactive:
  args:
    - days
  desc: '減少が始まるまでの非アクティブ日数を設定します。'
  params:
    - desc: '非アクティブな日数（1〜365）です。'
      name: days
      optional: false
      type: int
repdecaytype:
  args:
    - type
  desc: '減少の種類を設定します（daily、weekly、monthly）。'
  params:
    - desc: '減少の種類です。'
      name: type
      optional: false
      type: string
repenable:
  args:
    - enabled
  desc: 'このサーバーの評判システムを有効または無効にします。'
  params:
    - desc: '有効にする場合は true、無効にする場合は false です。'
      name: enabled
      optional: true
      type: bool
repeventcreate:
  args:
    - name multiplier duration
  desc: '評判の倍率イベントを作成します。'
  params:
    - desc: 'イベントの名前です。'
      name: name
      optional: false
      type: string
    - desc: '評判の倍率です。'
      name: multiplier
      optional: false
      type: decimal
    - desc: '期間（時間）です。'
      name: duration
      optional: false
      type: int
repeventend:
  args:
    - name
  desc: '評判イベントを早期に終了します。'
  params:
    - desc: '終了するイベントの名前です。'
      name: name
      optional: false
      type: string
repexport:
  args:
    - ''
  desc: '現在の評判の設定を JSON にエクスポートします。'
  params: [ ]
repfreeze:
  args:
    - '@user'
  desc: 'ユーザーの評判を凍結し、評判の獲得や減少を防ぎます。'
  params:
    - &ref_438
      desc: '凍結するユーザーです。'
      name: user
      optional: false
      type: IGuildUser
repgive:
  args:
    - '@user reptype text'
  desc: '指定したユーザーに評判を与えます。'
  params:
    - desc: '評判を与えるユーザーです。'
      name: target
      optional: true
      type: IGuildUser
    - desc: '与える評判の種類です。'
