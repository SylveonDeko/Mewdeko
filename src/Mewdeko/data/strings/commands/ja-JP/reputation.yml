      optional: false
      type: IGuildUser
    - desc: '失われたロールです。'
      name: role
      optional: false
      type: IRole
    - desc: '評判のしきい値です。'
      name: threshold
      optional: false
      type: int
repminage:
  args:
    - days
  desc: '評判を与えるために必要な最低アカウント年齢を設定します。'
  params:
    - desc: '最低アカウント年齢（日、0〜365）です。'
      name: days
