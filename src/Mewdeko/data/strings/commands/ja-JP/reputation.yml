represet:
  args:
    - text
  desc: 'ユーザーまたはサーバー内の全ユーザーの評価をリセットします。'
  params:
    - desc: 'リセットするユーザーです。全員をリセットする場合は "all" を指定します。'
      name: target
      optional: false
      type: string
reprole:
  args:
    - ''
    - detailed
    - '@role'
    - '@role 100'
    - '@role 100 false #channel true 50'
  desc: '評価のマイルストーンに対するロール報酬を管理します。パラメーターなしで使用するとすべての報酬を一覧表示します。ロールと評価を指定すると、詳細設定付きで報酬を追加または更新します。'
  params:
    - &ref_437
      desc: '付与するロールです（一覧表示の場合は省略可能）。'
      name: role
      optional: true
      type: IRole
    - desc: 'このロールを獲得するために必要な評価です（一覧表示の場合は省略可能）。'
      name: reputation
      optional: true
      type: int
    - desc: '評価が下がった場合にロールを削除するかどうかです。'
      name: removeOnDrop
      optional: true
      type: bool
    - desc: 'ロール付与をお知らせするチャンネルです（省略可能）。'
      name: announceChannel
      optional: true
      type: ITextChannel
    - desc: 'DM で通知を送信するかどうかです。'
      name: announceDm
      optional: true
      type: bool
    - desc: 'マイルストーン到達時に付与する XP 報酬です（省略可能）。'
      name: xpReward
      optional: true
      type: int
    - desc: '一覧表示時に詳細情報を表示します（最初のパラメーターに ''detailed'' を指定します）。'
      name: detailed
      optional: true
      type: string
reprolechannel:
  args:
    - role channel
  desc: 'ロール報酬のお知らせチャンネルを設定します。'
  params:
    - desc: '設定するロールです。'
      name: role
      optional: false
      type: IRole
    - desc: 'お知らせを送信するチャンネルです（無効にする場合は null）。'
      name: channel
      optional: true
      type: ITextChannel
reproleremove:
  args:
    - '@role'
  desc: 'ロール報酬の設定を削除します。'
  params:
    - desc: '報酬から削除するロールです。'
      name: role
      optional: true
      type: IRole
repset:
  args:
    - '@user number'
  desc: 'ユーザーの評価を指定した値に設定します。'
  params:
    - desc: '評価を設定するユーザーです。'
      name: user
      optional: false
      type: IGuildUser
    - desc: '評価を設定する値です。'
      name: amount
      optional: false
      type: int
repstats:
  args:
    - '@user'
  desc: 'ユーザーの評価に関する詳細な統計を表示します。'
  params:
    - desc: '統計を表示するユーザーです。null の場合は、コマンド実行者の統計を表示します。'
      name: target
      optional: true
      type: IGuildUser
repstatus:
  args:
    - ''
  desc: '現在の評価設定を詳細な埋め込みで表示します。'
  params: [ ]
reptake:
  args:
    - '@user number'
  desc: 'ユーザーの評価を削除します。'
  params:
    - desc: '評価を削除するユーザーです。'
      name: user
      optional: false
      type: IGuildUser
    - desc: '削除する評価の量です。'
      name: amount
      optional: true
      type: int
reptop:
  args:
    - number
  desc: 'サーバーの評判のリーダーボードを表示します。'
  params:
    - desc: '表示するページ番号です。'
      name: page
      optional: true
      type: int
reptypeadd:
  args:
    - typeName displayName
  desc: 'カスタムの評価の種類を追加します。'
  params:
    - desc: '評価の種類の名前です。'
      name: typeName
      optional: false
      type: string
    - desc: 'この種類の表示名です。'
      name: displayName
      optional: false
      type: string
reptypelist:
  args:
    - ''
  desc: 'このサーバーのカスタム評価の種類をすべて一覧表示します。'
  params: [ ]
reptyperemove:
  args:
    - typeName
  desc: 'カスタムの評価の種類を削除します。'
  params:
    - desc: '削除する評価の種類の名前です。'
      name: typeName
      optional: false
      type: string
repunfreeze:
  args:
    - '@user'
  desc: 'ユーザーの評価の凍結を解除し、再び評価を獲得・減少できるようにします。'
  params:
    - desc: '凍結を解除するユーザーです。'
      name: user
      optional: false
      type: IGuildUser
repweeklylimit:
  args:
    - limit
  desc: '評価を付与できる週間上限を設定します（省略可能）。'
  params:
    - desc: '週間上限です（無効にする場合は null、1〜500）。'
      name: limit
      optional: true
      type: int
toprep:
  args:
    - number
  desc: 'サーバーの評判のリーダーボードを表示します。'
  params:
    - desc: '表示するページ番号です。'
      name: page
      optional: true
      type: int