todoadd:
  args:
    - listId
    - title
    - description
  desc: '指定したリストに新しい ToDo 項目を追加します'
  params:
    - desc: 'ToDo リストの ID です。'
      name: listId
      optional: false
      type: int
    - desc: 'ToDo 項目のタイトルです。'
      name: title
      optional: false
      type: string
    - desc: '項目の省略可能な説明です。'
      name: description
      optional: true
      type: string
todoaddpriority:
  args:
    - listId
    - priority
    - title
    - description
  desc: '優先度と省略可能な期限を指定して ToDo 項目を追加します'
  params:
    - desc: 'ToDo リストの ID です。'
      name: listId
      optional: false
      type: int
    - desc: '優先度レベル（1=低、2=中、3=高、4=緊急）です。'
      name: priority
      optional: false
      type: int
    - desc: 'ToDo 項目のタイトルです。'
      name: title
      optional: false
      type: string
    - desc: '項目の省略可能な説明です。'
      name: description
      optional: true
      type: string
todoaddtag:
  args:
    - itemId
    - tag
  desc: 'ToDo 項目にタグを追加します'
  params:
    - desc: 'ToDo 項目の ID です。'
      name: itemId
      optional: false
      type: int
    - desc: '追加するタグです。'
      name: tag
      optional: false
      type: string
todocleardue:
  args:
    - itemId
  desc: 'ToDo 項目から期限を削除します'
  params:
    - desc: 'ToDo 項目の ID です。'
      name: itemId
      optional: false
      type: int
todoclearreminder:
  args:
    - itemId
  desc: 'ToDo 項目からリマインダーを削除します'
  params:
    - desc: 'ToDo 項目の ID です。'
      name: itemId
      optional: false
      type: int
todocomplete:
  args:
    - itemId
  desc: 'ToDo 項目を完了します'
  params:
    - desc: 'ToDo 項目の ID です。'
      name: itemId
      optional: false
      type: int
todocreatelist:
  args:
    - name
    - description
  desc: '新しい ToDo リストを作成します'
  params:
    - desc: 'ToDo リストの名前です。'
      name: name
      optional: false
      type: string
    - desc: 'リストの省略可能な説明です。'
      name: description
      optional: true
      type: string
todocreateserverlist:
  args:
    - name
    - description
  desc: 'サーバー全体の新しい ToDo リストを作成します（管理者のみ）'
  params:
    - desc: 'サーバーの ToDo リストの名前です。'
      name: name
      optional: false
      type: string
    - desc: 'リストの省略可能な説明です。'
      name: description
      optional: true
      type: string
tododelete:
  args:
    - itemId
  desc: 'ToDo 項目を削除します'
  params:
    - desc: 'ToDo 項目の ID です。'
      name: itemId
      optional: false
      type: int
tododeletelist:
  args:
    - listId
  desc: 'ToDo リスト全体を削除します'
  params:
    - desc: 'ToDo リストの ID です。'
      name: listId
      optional: false
      type: int
todoedit:
  args:
    - itemId
    - title
    - description
  desc: 'ToDo 項目のタイトルと説明を編集します'
  params:
    - desc: 'ToDo 項目の ID です。'
      name: itemId
      optional: false
      type: int
    - desc: '新しいタイトルです。'
      name: title
      optional: false
      type: string
    - desc: '新しい説明です。'
      name: description
      optional: true
      type: string
todofilter:
  args:
    - listId
    - filter
    - value
  desc: 'タグまたは優先度で ToDo 項目を絞り込みます'
  params:
    - desc: 'ToDo リストの ID です。'
      name: listId
      optional: false
      type: int
    - desc: '絞り込みの種類（tag または priority）です。'
      name: filter
      optional: false
      type: string
    - desc: '絞り込みに使用する値です。'
      name: value
      optional: true
      type: string
todogrant:
  args:
    - listId
    - '@user'
    - permissions
  desc: 'ToDo リストの権限をユーザーに付与します（リストの所有者または管理者のみ）'
  params:
    - desc: 'ToDo リストの ID です。'
      name: listId
      optional: false
      type: int
    - desc: '権限を付与するユーザーです。'
      name: user
      optional: false
      type: IUser
    - desc: 'カンマ区切りの権限（view、add、edit、complete、delete、manage、all）です。'
      name: permissions
      optional: false
      type: string
todolists:
  args:
    - includeServer
  desc: 'ユーザーがアクセスできるすべての ToDo リストを一覧表示します'
  params:
    - desc: 'サーバー全体のリストを含めるかどうかです。'
      name: includeServer
      optional: true
      type: bool
todopermissions:
  args:
    - listId
  desc: 'ToDo リストのすべての権限を表示します'
  params:
    - desc: 'ToDo リストの ID です。'
      name: listId
      optional: false
      type: int
todoremovetag:
  args:
    - itemId
    - tag
  desc: 'ToDo 項目からタグを削除します'
  params:
    - desc: 'ToDo 項目の ID です。'
      name: itemId
      optional: false
      type: int
    - desc: '削除するタグです。'
      name: tag
      optional: false
      type: string
todoreorder:
  args:
    - itemId
    - newPosition
  desc: 'ToDo 項目を新しい位置に並べ替えます'
  params:
    - desc: 'ToDo 項目の ID です。'
      name: itemId
      optional: false
      type: int
    - desc: '新しい位置です（1 から始まる）。'
      name: newPosition
      optional: false
      type: int
todorevoke:
  args:
    - listId
    - '@user'
  desc: 'ToDo リストに対するユーザーのすべての権限を取り消します'
  params:
    - desc: 'ToDo リストの ID です。'
      name: listId
      optional: false
      type: int
    - desc: '権限を取り消すユーザーです。'
      name: user
      optional: false
      type: IUser
todosearch:
  args:
    - listId
    - query
  desc: 'ToDo リスト内の ToDo 項目を検索します'
  params:
    - desc: 'ToDo リストの ID です。'
      name: listId
      optional: false
      type: int
    - desc: '検索クエリです。'
      name: query
      optional: false
      type: string
todosetcolor:
  args:
    - listId
    - color
  desc: 'ToDo リストの色を設定します'
  params:
    - desc: 'ToDo リストの ID です。'
      name: listId
      optional: false
      type: int
    - desc: '16進数のカラーコード（例: #ff0000）。'
      name: color
      optional: false
      type: string
todosetdue:
  args:
    - itemId
    - dateString
  desc: 'ToDo 項目の期限を設定します'
  params:
    - desc: 'ToDo 項目の ID です。'
      name: itemId
      optional: false
      type: int
    - desc: '期限の日付と時刻です。'
      name: dateString
      optional: false
      type: string
todosetreminder:
  args:
    - itemId
    - dateString
  desc: 'ToDo 項目のリマインダー時刻を設定します'
  params:
    - desc: 'ToDo 項目の ID です。'
      name: itemId
      optional: false
      type: int
    - desc: 'リマインダーの日付と時刻です。'
      name: dateString
      optional: false
      type: string
todoshow:
  args:
    - listId
    - includeCompleted
  desc: 'ToDo リストのすべての項目を表示します'
  params:
    - desc: 'ToDo リストの ID です。'
      name: listId
      optional: false
      type: int
    - desc: '完了済みの項目を含めるかどうかです。'
      name: includeCompleted
      optional: true
      type: bool
todotoggleprivacy:
  args:
    - listId
  desc: 'ToDo リストの公開設定を切り替えます'
  params:
    - desc: 'ToDo リストの ID です。'
      name: listId
      optional: false
      type: int