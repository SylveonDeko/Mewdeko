banprune:
  args:
    - ''
  desc: 'このチャンネルで BAN を実行した場合に使用されるメッセージ削除の設定を、設定済みのすべての項目とともに表示します。'
  params:
    - { }
banpruneset:
  args:
    - '<action> <days> [#channel]'
  desc: '1回の BAN 操作で、何日分のメッセージを削除するかを設定します。すべての操作に適用するには "all" を指定し、チャンネルまたはカテゴリを指定すると、その範囲だけを上書きできます。'
  params:
    - desc: '操作のキー、またはすべての操作を対象にする "all" です。'
      name: action
      optional: false
      type: string
    - desc: '削除する日数（0〜7）です。'
      name: days
      optional: false
      type: int
    - desc: '設定の対象とするチャンネルまたはカテゴリです。サーバーのデフォルトを使う場合は省略します。'
      name: target
      optional: true
      type: channel
banpruneclear:
  args:
    - '<action> [#channel]'
  desc: 'メッセージ削除の設定を削除し、操作がより広い範囲の設定またはデフォルトに戻るようにします。'
  params:
    - desc: '操作のキー、またはすべての操作を対象にする設定の場合は "all" です。'
      name: action
      optional: false
      type: string
    - desc: '設定が適用されているチャンネルまたはカテゴリです。サーバーのデフォルトを使う場合は省略します。'
      name: target
      optional: true
      type: channel
banprunereset:
  args:
    - ''
  desc: 'サーバー内のすべてのメッセージ削除の設定を削除します。'
  params:
    - { }
ban:
  args:
    - '<pruneTime> <time> [@user] [msg]'
    - time time
  desc: '指定した理由と、メッセージを削除する日数を指定してユーザーを BAN します。'
  params:
    - desc: '指定した理由と、メッセージを削除する日数を指定してユーザーを BAN します。'
      name: pruneTime
      optional: false
      type: duration
    - desc: 'メッセージを削除する期間です。'
      name: time
      optional: false
      type: duration
    - desc: 'BAN するユーザーです。'
      name: user
      optional: true
      type: user
    - desc: 'BAN の理由です。'
      name: msg
      optional: true
      type: string
