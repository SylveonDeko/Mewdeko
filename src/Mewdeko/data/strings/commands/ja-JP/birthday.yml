birthdayannouncements:
  args:
    - ''
  desc: 'ユーザーの誕生日のお知らせを切り替えます。'
  params: [ ]
birthdaychannel:
  args:
    - '#channel'
  desc: '誕生日のお知らせチャンネルを設定します。'
  params:
    - desc: 'お知らせに使うテキストチャンネルです。指定しない場合は現在のチャンネルになります。'
      name: channel
      optional: true
      type: ITextChannel
birthdayconfig:
  args:
    - ''
  desc: '現在の誕生日の設定を表示します。'
  params: [ ]
birthdaylist:
  args:
    - days
  desc: 'サーバーの今後の誕生日を表示します。'
  params:
    - desc: '先の何日分を表示するかです。デフォルトは7日、最大は30日です。'
      name: days
      optional: true
      type: int
birthdaymessage:
  args:
    - message
  desc: 'カスタムの誕生日メッセージのテンプレートを設定します。'
  params:
    - desc: 'メッセージのテンプレートです。ユーザーをメンションするには {user} を使います。空の場合は現在のメッセージを表示します。'
      name: message
      optional: true
      type: string
birthdaypingrole:
  args:
    - '@role'
  desc: '誕生日のお知らせでメンションするロールを設定します。'
  params:
    - desc: 'メンションするロールです。指定しない場合は無効になります。'
      name: role
      optional: true
      type: IRole
birthdayrole:
  args:
    - '@role'
  desc: 'ユーザーの誕生日に付与される誕生日ロールを設定します。'
  params:
    - desc: 'ユーザーの誕生日に付与するロールです。指定しない場合は無効になります。'
      name: role
      optional: true
      type: IRole
birthdaytimezone:
  args:
    - timezone
  desc: '誕生日の計算に使うユーザーのタイムゾーンを設定します。'
  params:
    - desc: '設定するタイムゾーンです（例: "America/New_York"）。'
      name: timezone
      optional: false
      type: string
birthdaytoday:
  args:
    - ''
  desc: '今日の誕生日を表示します。'
  params: [ ]