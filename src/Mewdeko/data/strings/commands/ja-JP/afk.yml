customafkmessage:
  args:
    - text
  desc: >-
    ユーザーがAFK中に表示されるカスタムAFKエンベッドを設定します。
    デフォルトのエンベッドにリセットするには"-"を使用してください。
    エンベッドビルダーは https://eb.mewdeko.tech 、
    プレースホルダーは http://mewdeko.tech/placeholders を参照してください。
  params:
    - &ref_175
      desc: '設定するカスタムメッセージ。デフォルトメッセージにリセットするには"-"を使用してください。'
      name: embedCode
      optional: false
      type: string
