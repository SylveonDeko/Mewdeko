coprmonitoradd:
  args:
    - '<ownerProject> [channel] [packages]'
    - '<ownerProject> [channel] [packages]'
    - ownerProject
  desc: 'サーバーに COPR プロジェクトの監視を追加します。'
  params:
    - desc: 'owner/project 形式の COPR プロジェクトです（例: linux4switch/l4s）。'
      name: ownerProject
      optional: false
      type: string
    - desc: '通知に使う任意のチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: ITextChannel
    - desc: '監視するパッケージのカンマ区切りの一覧です（任意。例: mesa,kernel）。'
      name: packages
      optional: true
      type: string
coprmonitorremove:
  args:
    - '<ownerProject> [channel]'
    - ownerProject
  desc: 'サーバーから COPR プロジェクトの監視を削除します。'
  params:
    - desc: 'owner/project 形式の COPR プロジェクトです。'
      name: ownerProject
      optional: false
      type: string
    - desc: '特定の監視を削除する任意のチャンネルです。'
      name: channel
      optional: true
      type: ITextChannel
coprmonitorlist:
  args:
    - ''
  desc: 'サーバーに設定されているすべての COPR 監視を一覧表示します。'
  params: [ ]
coprmonitortoggle:
  args:
    - ownerProject
  desc: 'COPR 監視を有効または無効にします。'
  params:
    - desc: 'owner/project 形式の COPR プロジェクトです。'
      name: ownerProject
      optional: false
      type: string
coprnotify:
  args:
    - ownerProject status enabled
  desc: '監視でどのビルドステータスが通知をトリガーするかを設定します。'
  params:
    - desc: 'owner/project 形式の COPR プロジェクトです。'
      name: ownerProject
      optional: false
      type: string
    - desc: '設定するビルドステータスです。'
      name: status
      optional: false
      type: CoprBuildStatus
    - desc: 'このステータスの通知を有効にするか無効にするかです。'
      name: enabled
      optional: false
      type: bool
coprfilter:
  args:
    - ownerProject text
  desc: 'COPR 監視のパッケージフィルターを設定します。'
  params:
    - desc: 'owner/project 形式の COPR プロジェクトです。'
      name: ownerProject
      optional: false
      type: string
    - desc: 'カンマ区切りのパッケージ一覧です。すべてを監視する場合は "all" を指定します。'
      name: packages
      optional: false
      type: string
coprsucceededmessage:
  args:
    - ownerProject text
  desc: 'COPR のビルドが成功したときに表示するメッセージを設定します。'
  params:
    - desc: 'owner/project 形式の COPR プロジェクトです。'
      name: ownerProject
      optional: false
      type: string
    - desc: 'メッセージまたは埋め込みのコードです。デフォルトに戻す場合は "-" を指定します。'
      name: message
      optional: false
      type: string
coprfailedmessage:
