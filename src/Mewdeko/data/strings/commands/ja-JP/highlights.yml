highlights:
  args:
    - action word
  desc: 'ユーザーのハイライトを管理します。'
  params:
    - desc: 'ハイライトに対して実行する操作です。'
      name: action
      optional: false
      type: string
    - desc: 'ハイライトする単語です。'
      name: word
      optional: true
      type: string