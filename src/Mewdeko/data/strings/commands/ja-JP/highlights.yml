highlights:
  args:
    - action word
  desc: ユーザーのハイライトを管理します。
  params:
    - desc: ハイライトで実行するアクション。
      name: action
      optional: false
      type: string
    - desc: ハイライトする単語。
      name: word
      optional: true
      type: string
