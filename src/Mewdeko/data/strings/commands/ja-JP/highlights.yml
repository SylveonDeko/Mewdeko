highlight:
  args:
    - '<action> [words]'
    - add|list|delete
    - add
    - list
    - delete
  desc: 'ハイライトを追加、一覧表示、削除、または照合します。'
  params:
    - desc: '実行するアクション: add、list、delete、match。'
      name: action
      optional: false
      type: highlightactions
    - desc: '選択した操作のパラメーターです。'
      name: words
      optional: true
      type: string
