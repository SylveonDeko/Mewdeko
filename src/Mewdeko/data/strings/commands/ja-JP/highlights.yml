highlight:
  args:
    - '<action> [words]'
    - add|list|delete
    - add
    - list
    - delete
  desc: 'ハイライトを追加、一覧表示、削除、またはマッチします。'
  params:
    - desc: '<see cref="HighlightActions" />'
      name: action
      optional: false
      type: highlightactions
    - desc: '選択したアクションのパラメータ'
      name: words
      optional: true
      type: string
