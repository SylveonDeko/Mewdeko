adsarm:
  args:
    - ''
  desc: 'サーバー広告メッセージの自動削除を切り替えます。'
  params: [ ]
antialt:
  args:
    - ''
  desc: 'サーバーの Anti-Alt 保護を設定します。アカウントの最低年齢と、ロールを使った処罰アクションを指定します。'
  params: [ ]
antipattern:
  args:
    - ''
  desc: 'サーバーの Anti-Pattern 保護を設定します。ロールを使った処罰アクションを指定します。'
  params: [ ]
antipattern_PunishmentAction_=:
  args:
    - '<action> [punishTime]'
    - action
  desc: 'サーバーの Anti-Pattern 保護を設定します。ロールを使った処罰アクションを指定します。'
  params:
    - desc: '検出されたパターンに一致したユーザーに対して実行する処罰アクションです。'
      name: action
      optional: false
      type: PunishmentAction
    - desc: '処罰の期間です（該当する場合）。'
      name: punishTime
      optional: true
      type: StoopidTime
antipattern_PunishmentAction_IRole:
  args:
    - action @role
  desc: 'サーバーの Anti-Pattern 保護を設定します。ロールを使った処罰アクションを指定します。'
  params:
    - desc: '検出されたパターンに一致したユーザーに対して実行する処罰アクションです。'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'パターンに一致したユーザーに付与するロールです。'
      name: role
      optional: false
      type: IRole
patternadd:
  args:
    - '<pattern> [name] [checkUsername] [checkDisplayName]'
    - pattern
  desc: 'Anti-Pattern 保護に正規表現パターンを追加します。'
  params:
    - desc: 'ユーザー名や表示名と照合する正規表現パターンです。'
      name: pattern
      optional: false
      type: string
    - desc: 'パターンの任意の名前です。'
      name: name
      optional: true
      type: string
    - desc: 'ユーザー名をこのパターンで確認するかどうかです（デフォルトは true）。'
      name: checkUsername
      optional: true
      type: bool
    - desc: '表示名をこのパターンで確認するかどうかです（デフォルトは true）。'
      name: checkDisplayName
      optional: true
      type: bool
patternremove:
  args:
    - number
  desc: 'Anti-Pattern 保護からパターンを削除します。'
  params:
    - desc: '削除するパターンの ID です。'
      name: patternId
      optional: false
      type: int
patternlist:
  args:
    - ''
  desc: 'Anti-Pattern 保護に設定されているすべてのパターンを一覧表示します。'
  params: [ ]
patternconfig:
  args:
    - ''
  desc: '現在の Anti-Pattern の設定を表示します。'
  params: [ ]
patternconfig_string_string:
  args:
    - setting value
  desc: '現在の Anti-Pattern の設定を表示します。'
  params:
    - desc: '設定する項目です。'
      name: setting
      optional: false
      type: string
    - desc: '設定する値です。'
      name: value
      optional: false
      type: string
antialt_StoopidTime_PunishmentAction_=:
  args:
    - '<minAge> <action> [punishTime]'
    - minage action
  desc: 'サーバーの Anti-Alt 保護を設定します。アカウントの最低年齢と、ロールを使った処罰アクションを指定します。'
  params:
    - desc: 'アカウントを Alt とみなすための最低年齢（分）です。'
