antimassmention:
  args:
    - ''
  desc: 'サーバーの Anti-Mass-Mention 保護を設定します。1件のメッセージで許可するメンション数のしきい値、メンションを追跡する時間枠、その時間枠内で許可するメンションの最大数、ロールを使った処罰アクションを指定します。'
  params: [ ]
antimassmention_int_int_int_bool_PunishmentAction_=:
  args:
    - '<mentionThreshold> <timeWindowSeconds> <maxMentionsInTimeWindow> <ignoreBots> <action> [punishTime]'
    - number number number true|false action
  desc: 'サーバーの Anti-Mass-Mention 保護を設定します。1件のメッセージで許可するメンション数のしきい値、メンションを追跡する時間枠、その時間枠内で許可するメンションの最大数、ロールを使った処罰アクションを指定します。'
  params:
    - desc: '保護が発動するまでに、1件のメッセージで許可されるメンション数です。'
      name: mentionThreshold
      optional: false
      type: int
    - desc: 'メンションを監視する時間枠（秒）です。'
      name: timeWindowSeconds
      optional: false
      type: int
    - desc: '指定した時間枠内で許可するメンションの最大数です。'
      name: maxMentionsInTimeWindow
      optional: false
      type: int
    - desc: 'メンションを追跡する際にボットアカウントを無視するかどうかです。'
      name: ignoreBots
      optional: false
      type: bool
    - desc: 'メンション制限を超えたユーザーに対して実行する処罰アクションです。'
      name: action
      optional: false
      type: punishment
    - desc: 'サーバーの Anti-Mass-Mention 保護を設定します。1件のメッセージで許可するメンション数のしきい値、メンションを追跡する時間枠、その時間枠内で許可するメンションの最大数、ロールを使った処罰アクションを指定します。'
