statroleadd:
  args:
    - '@role Messages 500 [lookbackDays] [name]'
    - '@role VoiceMinutes 600 30 Voice Regular'
    - '@role Invites 10'
  desc: 'しきい値型の統計ロールを作成します。最低値（Messages、VoiceMinutes、Invites、JoinedDays、AccountDays、ActivityMinutes）以上のメンバーにロールが付与され、永続設定にしない限り、値がしきい値を下回るとロールは削除されます。ActivityMinutes の場合は、「statroleset <id> activity <name>」でゲームを設定するか、任意のゲームのままにします。'
  params:
    - desc: '管理するロールです。'
      name: role
      optional: false
      type: IRole
    - desc: '計測する対象です: Messages、VoiceMinutes、Invites、JoinedDays、AccountDays、ActivityMinutes。'
      name: stat
      optional: false
      type: StatRoleStat
    - desc: '最低値です。'
      name: minimum
      optional: false
      type: long
    - desc: '日数で指定する期間です。全期間の場合は 0 です。'
      name: lookbackDays
      optional: true
      type: int
    - desc: '表示名です。'
      name: name
      optional: true
      type: string
statroletop:
  args:
    - '@role Messages 10 [lookbackDays] [name]'
    - '@role VoiceMinutes 3 7'
  desc: '順位の統計ロールを作成します。指定した順位までの 1 位から順位内のメンバーにロールが付与されます。'
  params:
    - desc: '管理するロールです。'
      name: role
      optional: false
      type: IRole
    - desc: '計測する対象です。'
      name: stat
      optional: false
      type: StatRoleStat
    - desc: '条件を満たす最も低い順位です。'
      name: topEnd
      optional: false
      type: int
    - desc: '日数で指定する期間です。全期間の場合は 0 です。'
      name: lookbackDays
      optional: true
      type: int
    - desc: '表示名です。'
      name: name
      optional: true
      type: string
statrolepercent:
  args:
    - '@role Messages 10 [lookbackDays] [name]'
  desc: '上位パーセント型の統計ロールを作成します。ランク付けされたメンバーの上位指定パーセント以内のメンバーにロールが付与されます。'
  params:
    - desc: '管理するロールです。'
      name: role
      optional: false
      type: IRole
    - desc: '計測する対象です。'
      name: stat
      optional: false
      type: StatRoleStat
    - desc: 'パーセンタイルの基準値（1〜100）です。'
      name: topPercent
      optional: false
      type: int
    - desc: '日数で指定する期間です。全期間の場合は 0 です。'
      name: lookbackDays
      optional: true
      type: int
    - desc: '表示名です。'
      name: name
      optional: true
      type: string
statrolestreak:
  args:
    - '@role Messages 5 7 [lookbackDays] [name]'
  desc: '連続日数の統計ロールを作成します。期間内で必要な日数以上、1 日あたりの最低値に達したメンバーにロールが付与されます。'
  params:
    - desc: '管理するロールです。'
      name: role
      optional: false
      type: IRole
    - desc: 'Messages（メッセージ）または VoiceMinutes（ボイス時間）です。'
      name: stat
      optional: false
      type: StatRoleStat
    - desc: '1 日あたりの最低値です。'
      name: perDay
      optional: false
      type: long
    - desc: 'その値を満たす必要がある期間内の日数です。'
      name: requiredDays
      optional: false
      type: int
    - desc: '期間（日数）です。'
      name: lookbackDays
      optional: true
      type: int
    - desc: '表示名です。'
      name: name
      optional: true
      type: string
statrolelist:
  args:
    - ''
  desc: '統計ロールを条件とともに一覧表示します。'
  params: [ ]
statroleinfo:
  args:
    - '3'
  desc: '統計ロールの完全な設定を表示します。条件、フィルター、通知、スケジュールが含まれます。'
  params:
    - desc: '統計ロールの ID です。'
      name: id
      optional: false
      type: int
statroleremove:
  args:
    - '3'
  desc: '統計ロールを削除します。メンバーは現在保持しているロールを維持します。'
  params:
    - desc: '統計ロールの ID です。'
      name: id
      optional: false
      type: int
statroletoggle:
  args:
    - '3'
  desc: '統計ロールを有効または無効にします。'
  params:
    - desc: '統計ロールの ID です。'
      name: id
      optional: false
      type: int
statrolepreview:
  args:
    - '3'
  desc: '何も変更せずに、次回の実行でロールを付与・削除される対象者を表示します。'
  params:
    - desc: '統計ロールの ID です。'
      name: id
      optional: false
      type: int
statrolerun:
  args:
    - '3'
  desc: 'スケジュールを待たずに、統計ロールを今すぐ評価して適用します。'
  params:
    - desc: '統計ロールの ID です。'
      name: id
      optional: false
      type: int
statroleset:
  args:
    - '3 permanent true'
    - '3 lookback 30'
    - '3 notifychannel #announcements'
    - '3 message %user% just %action% %role%!'
    - '3 activity Minecraft'
  desc: '統計ロールの設定を 1 つ変更します。設定: name、min、max、lookback、topstart、topend、days、permanent、invert、bots、group、interval、notifychannel、notifydm、message、activity（ゲーム名、または ActivityMinutes の統計では "any"）。max、group、notifychannel、message を消去するには "none" を使用します。'
  params:
    - desc: '統計ロールの ID です。'
      name: id
      optional: false
      type: int
    - desc: '設定名です。'
      name: setting
      optional: false
      type: string
    - desc: '新しい値です。'
      name: value
      optional: false
      type: string
statrolefilter:
  args:
    - '3 #channel'
    - '3 @role'
    - '3 @role true'
    - '3 @user'
  desc: '統計ロールのフィルターを切り替えます。統計を制限するチャンネル、メンバーが必要とするロール（true の場合は持っていてはならないロール）、またはロールが一切影響を与えないメンバーを指定できます。'
  params:
    - desc: '統計ロールの ID です。'
      name: id
      optional: false
      type: int
    - desc: '統計を制限するチャンネルです。'
      name: channel
      optional: false
      type: IGuildChannel
    - desc: '必要とする、または除外するロールです。'
      name: role
      optional: false
      type: IRole
    - desc: 'ホワイトリストの代わりにロールのブラックリストを切り替える場合は true を指定します。'
      name: blacklist
      optional: true
      type: bool
    - desc: '統計ロールが一切影響を与えないメンバーです。'
      name: user
      optional: false
      type: IGuildUser
