    - '@role [@channel]'
    - '@role'
  desc: '指定したロールに新しいロール挨拶メッセージを追加します。チャンネルが指定されない場合は現在のチャンネルが使用されます。'
  params:
    - desc: '挨拶メッセージを設定するロール。'
      name: role
      optional: false
      type: role
    - desc: '挨拶メッセージを送信するテキストチャンネル。省略可能。'
      name: channel
      optional: true
      type: channel
