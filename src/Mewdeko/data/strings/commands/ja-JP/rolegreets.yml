  args:
    - '<id> [name] [avatar]'
    - number
  desc: 'ロール挨拶メッセージ用のWebhookを設定します。名前とアバターをカスタマイズできます。名前を指定しない場合、Webhook は無効になります。'
  params:
    - desc: 'Webhook を設定するロール挨拶の ID です。すべてのロール挨拶の一覧における位置で指定します。'
      name: id
      optional: false
      type: int
    - desc: 'Webhook の名前です（省略可能）。'
      name: name
      optional: true
      type: string
    - desc: 'Webhook のアバター画像の URL です（省略可能）。'
      name: avatar
      optional: true
