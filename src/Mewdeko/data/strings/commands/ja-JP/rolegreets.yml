    - number
  desc: 'ロール挨拶のメッセージ内容を更新します。メッセージが指定されない場合は、現在のメッセージをプレビューするかプレーンテキストとして表示するオプションが提示されます。'
  params:
    - desc: '更新するロール挨拶のID（全ロール挨拶リストの位置に基づく）。'
      name: id
      optional: false
      type: int
    - desc: '新しいメッセージ内容。省略可能。'
      name: message
      optional: true
      type: string
