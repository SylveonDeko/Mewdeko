countingban:
  args:
    - user channel duration reason
  desc: '特定のチャンネルでのカウントから、ユーザーを BAN します。'
  params:
    - desc: 'カウントから BAN するユーザーです。'
      name: user
      optional: false
      type: guild user
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: 'BAN の期間（例: 1h、1d）。永久に BAN する場合は空にします。'
      name: duration
      optional: true
      type: stoopid time
    - desc: 'BAN の理由です。'
      name: reason
      optional: true
      type: string
countingconfig:
  args:
    - channel
  desc: 'カウントチャンネルの設定を行います。'
  params:
    - desc: '設定を表示するチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
countingcooldown:
  args:
    - channel seconds
  desc: 'ユーザーのカウント間のクールダウンを設定します。'
  params:
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: 'クールダウン（秒、0〜300）です。'
      name: seconds
      optional: true
      type: int
countingdisable:
  args:
    - channel purgeData reason
  desc: 'チャンネルでのカウントを無効にし、必要に応じてすべてのデータを削除します。'
  params:
    - desc: 'カウントを無効にするチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: 'このチャンネルのカウントデータをすべて削除するかどうかです。デフォルトは false です。'
      name: purgeData
      optional: true
      type: bool
    - desc: 'カウントを無効にする理由です。'
      name: reason
      optional: true
      type: string
countingfailurechannel:
  args:
    - countingChannel failureChannel
  desc: 'カウントの失敗を記録するチャンネルを設定します。'
  params:
    - desc: 'カウントチャンネルです。'
      name: countingChannel
      optional: true
      type: text channel
    - desc: '失敗ログのチャンネルです。無効にする場合は null を指定します。'
      name: failureChannel
      optional: true
      type: text channel
countingfailuremessage:
  args:
    - channel embed
  desc: 'カウントが失敗したときのカスタムメッセージを設定します。'
  params:
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: 'メッセージのテンプレートです。デフォルトに戻す場合は "-" を指定します。'
      name: embed
      optional: true
      type: string
countingfailurethreshold:
  args:
    - channel threshold
  desc: '処置が行われるまでの失敗のしきい値を設定します。'
  params:
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: '処置が行われるまでの失敗回数（1〜10）です。'
      name: threshold
      optional: true
      type: int
countingleaderboard:
  args:
    - type channel
  desc: 'カウントチャンネルのリーダーボードを表示します。'
  params:
    - desc: 'リーダーボードの種類（contributions、streak、accuracy、totalnumbers）です。'
      name: type
      optional: true
      type: string
    - desc: 'リーダーボードを表示するチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
countinglist:
  args:
    - ''
  desc: 'サーバー内のアクティブなすべてのカウントチャンネルを一覧表示します。'
  params: [ ]
countingmilestonechannel:
  args:
    - countingChannel milestoneChannel
  desc: 'マイルストーンの達成を通知するチャンネルを設定します。'
  params:
    - desc: 'カウントチャンネルです。'
      name: countingChannel
      optional: true
      type: text channel
    - desc: 'マイルストーンのお知らせチャンネルです。無効にする場合は null を指定します。'
      name: milestoneChannel
      optional: true
      type: text channel
countingmilestonemessage:
  args:
    - channel embed
  desc: 'マイルストーン達成時のカスタムメッセージを設定します。'
  params:
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: 'メッセージのテンプレートです。デフォルトに戻す場合は "-" を指定します。'
      name: embed
      optional: true
      type: string
countingmilestones:
  args:
    - channel milestones
  desc: 'カスタムのマイルストーン数を設定します。'
  params:
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: 'カンマ区切りのマイルストーン数です（例: 50,100,250,500,1000）。'
      name: milestones
      optional: true
      type: string
countingreset:
  args:
    - channel newNumber reason
  desc: 'チャンネルのカウントを特定の数字にリセットします。'
  params:
    - desc: 'リセットするチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: 'リセット後の数字です。デフォルトは 0 です。'
      name: newNumber
      optional: true
      type: long
    - desc: 'リセットする理由です。'
      name: reason
      optional: true
      type: string
countingrestore:
  args:
    - saveId channel
  desc: '以前のセーブポイントからカウントを復元します。'
  params:
    - desc: '復元元となるセーブポイントの ID です。'
      name: saveId
      optional: false
      type: int
    - desc: '復元するチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
countingsave:
  args:
    - channel reason
  desc: '現在のカウントの進行状況のセーブポイントを作成します。'
  params:
    - desc: '保存するチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: 'セーブポイントを作成する理由です。'
      name: reason
      optional: true
      type: string
countingsetup:
  args:
    - channel startNumber increment
  desc: '現在のチャンネルまたは指定したチャンネルでカウントをセットアップします。'
  params:
    - desc: 'カウントをセットアップするチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: 'カウントを開始する数字です。デフォルトは 1 です。'
      name: startNumber
      optional: true
      type: long
    - desc: 'カウントごとの増分です。デフォルトは 1 です。'
      name: increment
      optional: true
      type: int
countingstats:
  args:
    - user channel
  desc: 'ユーザーまたはチャンネルのカウント統計を表示します。'
  params:
    - desc: '統計を表示するユーザーです。デフォルトは自分です。'
      name: user
      optional: true
      type: user
    - desc: '統計を確認するチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
countingstatus:
  args:
    - channel
  desc: 'チャンネルのカウントの現在の状態を表示します。'
  params:
    - desc: '確認するチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
countingsuccessmessage:
  args:
    - channel embed
  desc: 'カウント成功時のカスタムメッセージを設定します。'
  params:
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: 'メッセージのテンプレートです。デフォルトに戻す場合は "-" を指定します。'
      name: embed
      optional: true
      type: string
countingtimeout:
  args:
    - user duration channel reason
  desc: 'ユーザーのカウントを一時的にタイムアウトします。'
  params:
    - desc: 'カウントからタイムアウトするユーザーです。'
      name: user
      optional: false
      type: guild user
    - desc: 'タイムアウトの期間（例: 30m、2h）。'
      name: duration
      optional: false
      type: stoopid time
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: 'タイムアウトの理由です。'
      name: reason
      optional: true
      type: string
countingunban:
  args:
    - user channel reason
  desc: '特定のチャンネルでのカウントの BAN を解除します。'
  params:
    - desc: 'カウントの BAN を解除するユーザーです。'
      name: user
      optional: false
      type: guild user
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: 'BAN を解除する理由です。'
      name: reason
      optional: true
      type: string
countmodbanned:
  args:
    - channel roles...
  desc: 'カウントを禁止するロールを設定します。'
  params:
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: 'カウントを禁止されているロールです。'
      name: roles
      optional: true
      type: role
countmodclear:
  args:
    - user channel
  desc: 'カウントチャンネルで、ユーザーの誤ったカウントをクリアします。'
  params:
    - desc: '誤ったカウントをクリアするユーザーです。'
      name: user
      optional: false
      type: user
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
countmodclearall:
  args:
    - channel
  desc: 'カウントチャンネルで、すべてのユーザーの誤ったカウントをクリアします。'
  params:
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
countmoddefaults:
  args:
    - enabled threshold windowHours punishment durationMinutes punishmentRole
  desc: 'サーバー全体のデフォルトのモデレーション設定を行います。'
  params:
    - desc: 'モデレーションをデフォルトで有効にするかどうかです。'
      name: enabled
      optional: false
      type: bool
    - desc: '処罰が行われるまでのデフォルトの誤カウントのしきい値です。'
      name: threshold
      optional: true
      type: int
    - desc: '誤カウントを追跡するデフォルトの時間枠（時間）です。'
      name: windowHours
      optional: true
      type: int
    - desc: '適用するデフォルトの処罰アクションです。'
      name: punishment
      optional: true
      type: punishment action
    - desc: '時間制限付きの処罰のデフォルトの期間（分）です。'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'AddRole の処罰の種類で使用するデフォルトのロールです。'
      name: punishmentRole
      optional: true
      type: role
countmodedits:
  args:
    - punish delete channel
  desc: 'カウントチャンネルのメッセージ編集の保護を設定します。'
  params:
    - desc: 'メッセージの編集を違反として処罰するかどうかです。'
      name: punish
      optional: false
      type: bool
    - desc: '編集されたメッセージを削除するかどうかです。'
      name: delete
      optional: true
      type: bool
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
countmodenable:
  args:
    - enabled channel
  desc: '特定のカウントチャンネルのモデレーションを有効または無効にします。'
  params:
    - desc: 'モデレーションを有効にするか無効にするかです。'
      name: enabled
      optional: false
      type: bool
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
countmodignore:
  args:
    - deleteMessages channel roles...
  desc: 'カウントの対象外にするロールを設定します。'
  params:
    - desc: '対象外のロールのメッセージを削除するかどうかです。'
      name: deleteMessages
      optional: false
      type: bool
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: 'カウントの対象外にするロールです。'
      name: roles
      optional: true
      type: role
countmodnonnumbers:
  args:
    - punish delete channel
  desc: 'カウントチャンネルで数字以外のメッセージの処理を設定します。'
  params:
    - desc: '数字以外のメッセージを違反として処罰するかどうかです。'
      name: punish
      optional: false
      type: bool
    - desc: '数字以外のメッセージを削除するかどうかです。'
      name: delete
      optional: true
      type: bool
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
countmodpunish:
  args:
    - count punishment durationMinutes role channel
  desc: '特定の誤カウント番号に対する段階的な処罰を設定します。'
  params:
    - desc: 'この処罰を発動させる誤カウント番号です。'
      name: count
      optional: false
      type: int
    - desc: '適用する処罰アクションです。'
      name: punishment
      optional: false
      type: punishment action
    - desc: '時間制限付きの処罰の期間（分）です。'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'AddRole の処罰の種類で使用するロールです。'
      name: role
      optional: true
      type: role
    - desc: 'カウントチャンネルです（サーバーのデフォルトを使う場合は NULL）。'
      name: channel
      optional: true
      type: text channel
countmodpunishlist:
  args:
    - channel
  desc: 'サーバーまたは特定のチャンネルの段階的な処罰をすべて一覧表示します。'
  params:
    - desc: 'カウントチャンネルです（サーバーのデフォルトを使う場合は NULL）。'
      name: channel
      optional: true
      type: text channel
countmodpunishment:
  args:
    - punishment durationMinutes role channel
  desc: '誤カウントに対する処罰を設定します。'
  params:
    - desc: '適用する処罰アクションです。'
      name: punishment
      optional: false
      type: punishment action
    - desc: '時間制限付きの処罰の期間（分）です。'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'AddRole の処罰の種類で使用するロールです。'
      name: role
      optional: true
      type: role
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
countmodrequired:
  args:
    - channel roles...
  desc: 'カウントに必要なロールを設定します。'
  params:
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
    - desc: 'カウントに必要なロールです。'
      name: roles
      optional: true
      type: role
countmodreset:
  args:
    - channel
  desc: 'チャンネルの設定をサーバーのデフォルトに戻します。'
  params:
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
countmodshow:
  args:
    - channel
  desc: 'カウントチャンネルまたはサーバーのデフォルトの現在のモデレーション設定を表示します。'
  params:
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
countmodthreshold:
  args:
    - threshold channel
  desc: 'カウントチャンネルの誤カウントのしきい値を設定します。'
  params:
    - desc: '処罰が行われるまでの誤カウント数（1〜100）です。'
      name: threshold
      optional: false
      type: int
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel
countmodunpunish:
  args:
    - count channel
  desc: '特定の誤カウント番号に対する段階的な処罰を削除します。'
  params:
    - desc: '処罰を削除する誤カウント番号です。'
      name: count
      optional: false
      type: int
    - desc: 'カウントチャンネルです（サーバーのデフォルトを使う場合は NULL）。'
      name: channel
      optional: true
      type: text channel
countmodwindow:
  args:
    - hours channel
  desc: '誤カウントを追跡する時間枠を設定します。'
  params:
    - desc: '時間枠（時間、1〜168）です。'
      name: hours
      optional: false
      type: int
    - desc: 'カウントチャンネルです。デフォルトは現在のチャンネルです。'
      name: channel
      optional: true
      type: text channel