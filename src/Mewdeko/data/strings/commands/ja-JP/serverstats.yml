serveractivity:
  args:
    - '[days]'
    - '7'
    - '0'
  desc: '指定期間のサーバーのアクティビティ概要（メッセージ数、ボイス時間、貢献者、参加・退出、最もアクティブなメンバーとチャンネル）を表示します。全期間の場合は 0 を使用します。'
  params:
    - desc: '日数で指定する期間です。全期間の場合は 0、省略するとサーバーの既定値になります。'
      name: days
      optional: true
      type: int
useractivity:
  args:
    - '[@user] [days]'
    - '@user 30'
  desc: '指定期間のメンバーのアクティビティ概要（メッセージ数とボイス時間、順位、累計、よく使うチャンネル）を表示します。'
  params:
    - desc: 'メンバーです。省略すると自分になります。'
      name: user
      optional: true
      type: IGuildUser
    - desc: '日数で指定する期間です。全期間の場合は 0、省略するとサーバーの既定値になります。'
      name: days
      optional: true
      type: int
channelactivity:
  args:
    - '[#channel] [days]'
  desc: '指定期間のチャンネルのアクティビティ概要（メッセージ数、ボイス時間、貢献者、最もアクティブなメンバー）を表示します。'
  params:
    - desc: 'チャンネルです。省略すると現在のチャンネルになります。'
      name: channel
      optional: true
      type: IGuildChannel
    - desc: '日数で指定する期間です。全期間の場合は 0、省略するとサーバーの既定値になります。'
      name: days
      optional: true
      type: int
activitytop:
  args:
    - '[Messages|Voice] [days] [@role]'
    - 'Voice 7'
  desc: '指定期間のメッセージ数またはボイス時間に基づいてメンバーをランク付けします。ロールを持つメンバーだけに絞り込むこともできます。'
  params:
    - desc: 'Messages（メッセージ）または Voice（ボイス）です。'
      name: kind
      optional: true
      type: StatKind
    - desc: '日数で指定する期間です。全期間の場合は 0、省略するとサーバーの既定値になります。'
      name: days
      optional: true
      type: int
    - desc: 'このロールを持つメンバーだけを対象にします。'
      name: role
      optional: true
      type: IRole
activitytopchannels:
  args:
    - '[Messages|Voice] [days]'
  desc: '指定期間のメッセージ数またはボイス時間に基づいてチャンネルをランク付けします。'
  params:
    - desc: 'Messages（メッセージ）または Voice（ボイス）です。'
      name: kind
      optional: true
      type: StatKind
    - desc: '日数で指定する期間です。全期間の場合は 0、省略するとサーバーの既定値になります。'
      name: days
      optional: true
      type: int
activitychart:
  args:
    - '[Messages|Voice|Members|Status|Joins|Leaves|Growth|InVoice] [days]'
    - 'Members 30'
  desc: '指定期間のメッセージ、ボイス時間、メンバー数、メンバーの状態、参加、退出、増加数、またはボイス中のメンバーのグラフを描画します。'
  params:
    - desc: 'グラフに表示する内容です。'
      name: kind
      optional: true
      type: StatChartKind
    - desc: '日数で指定する期間（1〜90）です。省略するとサーバーの既定値になります。'
      name: days
      optional: true
      type: int
activityexport:
  args:
    - '[Messages|Voice] [days]'
  desc: 'メッセージ数またはボイス時間によるメンバーのランキングを CSV ファイルとしてエクスポートします。'
  params:
    - desc: 'Messages（メッセージ）または Voice（ボイス）です。'
      name: kind
      optional: true
      type: StatKind
    - desc: '日数で指定する期間です。全期間の場合は 0、省略するとサーバーの既定値になります。'
      name: days
      optional: true
      type: int
statssettings:
  args:
    - ''
  desc: 'アクティビティ統計の追跡設定を表示します。'
  params: [ ]
statslookback:
  args:
    - '14'
  desc: '統計コマンドで期間が指定されていない場合に使用される既定の期間（日数）を設定します。'
  params:
    - desc: '日数で指定する期間（1〜90）です。'
      name: days
      optional: false
      type: int
statscooldown:
  args:
    - '30'
  desc: '同じメンバーの 2 つのカウント対象メッセージの間に経過する必要がある秒数を設定します。0 にすると、すべてのメッセージをカウントします。'
  params:
    - desc: '秒数で指定するクールダウン（0〜300）です。'
      name: seconds
      optional: false
      type: int
statstrackvoice:
  args:
    - ''
  desc: 'アクティビティ統計のボイス時間の追跡を切り替えます。'
  params: [ ]
statstracksnapshots:
  args:
    - ''
  desc: 'メンバーとステータスのグラフに使用される、1時間ごとのメンバーとステータスのスナップショットを切り替えます。'
  params: [ ]
statscountbots:
  args:
    - ''
  desc: 'アクティビティ統計にボットを含めるかどうかを切り替えます。'
  params: [ ]
statsignorevoicestate:
  args:
    - 'SelfMuted'
    - 'Afk'
  desc: 'ボイス状態（SelfMuted、SelfDeafened、ServerMuted、ServerDeafened、Afk、Alone、Streaming、Video）にいる時間を、ボイス統計にカウントするかどうかを切り替えます。'
  params:
    - desc: '切り替えるボイス状態です。'
      name: state
      optional: false
      type: VoiceStateFlags
statsignore:
  args:
    - '#channel'
    - '@role'
    - '@user'
  desc: 'チャンネル、特定のロールを持つすべてのメンバー、またはメンバーをアクティビティ統計から除外するかどうかを切り替えます。'
  params:
    - desc: '切り替えるチャンネルです。'
      name: channel
      optional: false
      type: IGuildChannel
    - desc: '切り替えるロールです。'
      name: role
      optional: false
      type: IRole
    - desc: '切り替えるメンバーです。'
      name: user
      optional: false
      type: IGuildUser
statsignored:
  args:
    - ''
  desc: 'アクティビティ統計から除外されているチャンネル、ロール、メンバーを一覧表示します。'
  params: [ ]
statsprivacy:
  args:
    - ''
  desc: 'すべてのサーバーでアクティビティ統計から除外されるように設定します。記録されたメッセージとボイスの統計は完全に削除されます。または、再び参加するように設定します。'
  params: [ ]
topgames:
  args:
    - '[days]'
    - '30'
  desc: '指定期間に、メンバーが最も長く遊んでいるゲームやアプリを、プレイヤー数とともにランク付けします。ゲーム追跡を有効にする必要があります。'
  params:
    - desc: '日数で指定する期間です。全期間の場合は 0、省略するとサーバーの既定値になります。'
      name: days
      optional: true
      type: int
whoplays:
  args:
    - 'Minecraft'
  desc: 'ゲームを遊んでいる、またはアプリを使用しているユーザーを表示します。現在その中にいるメンバーの数と、その時間が最も長いメンバーが表示されます。'
  params:
    - desc: 'ゲームまたはアプリの名前です。'
      name: game
      optional: false
      type: string
statstrackactivities:
  args:
    - ''
  desc: 'メンバーが使用しているゲームやアプリ（プレイ中、配信中、リスニング中、視聴中、競技中）の追跡を切り替えます。既定ではオフです。'
  params: [ ]
statsverifyactivities:
  args:
    - ''
  desc: 'Discord アプリケーション、Spotify、または配信に裏付けられたアクティビティのみをカウントするかどうかを切り替えます。これにより、カスタムクライアントによって偽装されたプレゼンスをブロックします。'
  params: [ ]
statsactivityfiltermode:
  args:
    - 'Whitelist'
    - 'Blacklist'
  desc: 'アクティビティフィルターリストで、リストされたゲームのみを許可する（Whitelist）か、無視する（Blacklist）かを設定します。'
  params:
    - desc: 'Whitelist（ホワイトリスト）または Blacklist（ブラックリスト）です。'
      name: mode
      optional: false
      type: ActivityFilterMode
statsactivityfilter:
  args:
    - 'Spotify'
  desc: 'ゲームまたはアプリの名前を、アクティビティフィルターリストに追加または削除します。'
  params:
    - desc: 'アクティビティの名前です。'
      name: name
      optional: false
      type: string
statsactivityfilters:
  args:
    - ''
  desc: 'アクティビティフィルターと、それがホワイトリストかブラックリストかを一覧表示します。'
  params: [ ]
liveboardadd:
  args:
    - '#channel InviteLeaderboard [Weekly] [entries] [intervalMinutes]'
    - '#stats GrowthChart Monthly'
  desc: 'ボットが定期的に更新してピン留めするリーダーボード、グラフ、または概要を投稿します。種類: InviteLeaderboard、MessageLeaderboard、VoiceLeaderboard、JoinsChart、LeavesChart、GrowthChart、MembersChart、MessagesChart、ServerOverview、InviteStats。'
  params:
    - desc: '投稿するチャンネルです。'
      name: channel
      optional: false
      type: ITextChannel
    - desc: '表示する内容です。'
      name: kind
      optional: false
      type: LiveBoardKind
    - desc: '期間です: AllTime（全期間）、Daily（日次）、Weekly（週次）、Monthly（月次）。'
      name: range
      optional: true
      type: StatsRange
    - desc: 'リーダーボードの行数（3〜25）です。'
      name: entries
      optional: true
      type: int
    - desc: '更新頻度です（最低 5 分）。'
      name: intervalMinutes
      optional: true
      type: int
liveboardlist:
  args:
    - ''
  desc: '稼働中のボードを一覧表示します。'
  params: [ ]
liveboardremove:
  args:
    - '3'
  desc: '稼働中のボードとそのメッセージを削除します。'
  params:
    - desc: '一覧にあるボードの ID です。'
      name: id
      optional: false
      type: int
liveboardrefresh:
  args:
    - ''
  desc: '稼働中のすべてのボードを今すぐ更新します。'
  params: [ ]
serverreportchannel:
  args:
    - '[#channel]'
  desc: '定期的なサーバーレポートを受け取るチャンネルを設定し、レポートを有効にします。チャンネルを省略するとレポートを無効にします。'
  params:
    - desc: 'チャンネルです。無効にする場合は省略します。'
      name: channel
      optional: true
      type: ITextChannel
serverreportfrequency:
  args:
    - 'Weekly'
  desc: 'サーバーレポートの投稿頻度を設定します: Daily（日次）、Weekly（週次）、Monthly（月次）。'
  params:
    - desc: 'Daily（日次）、Weekly（週次）、または Monthly（月次）です。'
      name: frequency
      optional: false
      type: ReportFrequency
serverreportnow:
  args:
    - '[Weekly]'
  desc: '現在のチャンネルに、指定された期間または設定された期間を対象としたサーバーレポートを今すぐ投稿します。'
  params:
    - desc: '対象とする期間です。省略すると設定された期間になります。'
      name: frequency
      optional: true
      type: ReportFrequency
