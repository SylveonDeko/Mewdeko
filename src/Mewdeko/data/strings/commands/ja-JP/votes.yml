      name: channel
      optional: false
      type: ITextChannel
votemessage:
  args:
    - '[message]'
  desc: >-
    ユーザーが投票したときに送信するカスタムメッセージを設定するか、
    現在の投票メッセージをプレビューします。
  params:
    - desc: '投票用のカスタムメッセージ。デフォルトにリセットするには"-"を使用。nullの場合は現在の投票メッセージをプレビューします。'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: >-
    新しい投票パスワードを設定するための確認プロセスを開始し、そのセキュリティ
    についてユーザーに注意を促します。
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: >-
    ユーザーが投票したときに付与されるロールを追加します。ロールを自動削除する
    オプションの期間も設定できます。
  params:
    - desc: '投票報酬として追加するロール。'
      name: role
      optional: false
      type: role
    - desc: 'ロールが付与される期間。無期限の場合はnull。'
      name: time
      optional: true
      type: duration
