votemessage:
  args:
    - '[message]'
  desc: 'ユーザーが投票したとき、または現在の投票メッセージをプレビューするときに送信するカスタムメッセージを設定します。'
  params:
    - desc: '投票に使用するカスタムメッセージです。既定のメッセージにリセットするには "-" を使用します。null の場合は、現在の投票メッセージをプレビューします。'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: '新しい投票パスワードを設定するための確認手続きを開始します。セキュリティ上の注意を表示します。'
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: '投票したユーザーに付与するロールを追加します。ロールを自動的に削除するまでの期間を指定することもできます。'
  params:
    - desc: '投票報酬として追加するロールです。'
      name: role
      optional: false
      type: role
    - desc: 'ロールが付与される期間です。null の場合は無期限です。'
      name: time
      optional: true
      type: duration
