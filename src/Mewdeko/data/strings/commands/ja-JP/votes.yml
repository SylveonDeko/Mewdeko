votechannel:
  args:
    - channel
  desc: 'すべての投票の確認が送信される投票チャンネルとして、指定したテキストチャンネルを設定します。'
  params:
    - &ref_646
      desc: '投票チャンネルとして設定するテキストチャンネルです。'
      name: channel
      optional: false
      type: ITextChannel
