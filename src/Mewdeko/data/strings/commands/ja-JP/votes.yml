votechannel:
  args:
    - channel
  desc: >-
    指定したテキストチャンネルを投票チャンネルとして設定し、すべての投票
    確認メッセージがそこに送信されます。
  params:
    - &ref_646
      desc: '投票チャンネルとして設定するテキストチャンネル。'
      name: channel
      optional: false
      type: ITextChannel
votechannel_ITextChannel:
  args:
    - channel
  desc: >-
    指定したテキストチャンネルを投票チャンネルとして設定し、すべての投票
    確認メッセージがそこに送信されます。
  params:
    - desc: '投票チャンネルとして設定するテキストチャンネル。'
      name: channel
      optional: false
      type: ITextChannel
