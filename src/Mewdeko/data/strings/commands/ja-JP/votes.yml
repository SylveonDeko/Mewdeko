voterolesclear:
  args:
    - ''
  desc: 'ユーザーが投票したときに付与されるすべてのロールをクリアします。'
  params: [ ]
voteroleslist:
  args:
    - ''
  desc: 'ユーザーが投票したときに付与されるすべてのロールを一覧表示します。'
  params: [ ]
votes:
  args:
    - '[@user]'
  desc: >-
    特定のユーザーまたはコマンド実行者が行った投票の総数を表示します。
  params:
    - desc: '投票を数えるユーザー。nullの場合はコマンド実行者の投票を数えます。'
      name: user
      optional: true
      type: user
votesleaderboard:
  args:
    - false
  desc: >-
    投票数に基づくユーザーのリーダーボードを表示します。オプションで
    今月の投票のみにフィルタリングできます。
  params:
    - desc: >-
        投票数に基づくユーザーのリーダーボードを表示します。オプションで
        今月の投票のみにフィルタリングできます。
      name: false
      optional: false
      type: '='
