patreonanalytics:
  args:
    - ''
  desc: 'Patreon の詳細な分析を表示します。'
  params: [ ]
patreonannounce:
  args:
    - ''
  desc: 'Patreon のお知らせを手動で実行します。'
  params: [ ]
patreonch:
  args:
    - '#channel'
  desc: 'Patreon のお知らせチャンネルを設定または表示します。'
  params:
    - desc: 'Patreon のお知らせに設定するチャンネルです。null の場合は現在のチャンネルを表示します。'
      name: channel
      optional: true
      type: ITextChannel?
patreonconfig:
  args:
    - ''
  desc: 'このサーバーの現在の Patreon 設定を表示します。'
  params: [ ]
patreonday:
  args:
    - number
  desc: 'Patreon のお知らせを行う日（月の日付）を設定します。'
  params:
    - desc: 'お知らせを行う月の日付（1〜28）です。null の場合は現在の日付を表示します。'
      name: day
      optional: true
      type: int?
patreondisable:
  args:
    - ''
  desc: 'このサーバーの Patreon のお知らせを無効にします。'
  params: [ ]
patreonhelp:
  args:
    - ''
  desc: 'Patreon モジュールの情報と、利用可能なプレースホルダーを表示します。'
  params: [ ]
patreonlink:
  args:
    - '@user text'
  desc: 'Discord ユーザーを Patreon のサポーターにリンクします。'
  params:
    - desc: 'リンクする Discord ユーザーです。'
      name: user
      optional: false
      type: IGuildUser
    - desc: 'リンクする Patreon ユーザーの ID です。'
      name: patreonUserId
      optional: false
      type: string
patreonmsg:
  args:
    - text
  desc: 'Patreon のお知らせ用のカスタムメッセージを設定します。'
  params:
    - desc: 'カスタムメッセージです。%server.name%、%month% などのプレースホルダーを使えます。デフォルトに戻す場合は "-" を指定します。'
      name: message
      optional: true
      type: string?
patreonrecognize:
  args:
    - '#channel'
  desc: '新しいサポーターへの感謝メッセージを送信します。'
  params:
    - desc: '感謝メッセージを送信するチャンネルです。'
      name: channel
      optional: true
      type: ITextChannel?
patreonroles:
  args:
    - ''
  desc: 'Patreon のティアとロールの対応を一覧表示します。'
  params: [ ]
patreonrolesync:
  args:
    - ''
  desc: '自動ロール同期を切り替えます。'
  params: [ ]
patreonstats:
  args:
    - ''
  desc: 'Patreon のサポーターの統計を表示します。'
  params: [ ]
patreonsupporters:
  args:
    - ''
  desc: 'アクティブな Patreon のサポーターを一覧表示します。'
  params: [ ]
patreonsync:
  args:
    - ''
  desc: 'Patreon の OAuth 連携を安全に設定します。'
  params: [ ]
patreonsyncall:
  args:
    - ''
  desc: 'リンク済みのすべてのサポーターのロールを同期します。'
  params: [ ]
patreontiermap:
  args:
    - text @role
  desc: 'Patreon のティアを Discord のロールに対応付けます。'
  params:
    - desc: 'Patreon のティアの ID です。'
      name: tierId
      optional: false
      type: string
    - desc: 'ティアに対応付ける Discord のロールです。'
      name: role
      optional: false
      type: IRole
patreontoggle:
  args:
    - ''
  desc: 'Patreon のお知らせを有効または無効にします。'
  params: [ ]
patreontop:
  args:
    - number
  desc: '上位の Patreon サポーターを表示します。'
  params:
    - desc: '表示する上位サポーターの人数（1〜20）です。'
      name: count
      optional: true
      type: int