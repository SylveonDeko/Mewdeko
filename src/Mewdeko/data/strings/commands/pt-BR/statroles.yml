statroleadd:
  args:
    - '@role Messages 500 [lookbackDays] [name]'
    - '@role VoiceMinutes 600 30 Voice Regular'
    - '@role Invites 10'
  desc: 'Cria um cargo de estatística por limite: membros com pelo menos o mínimo (Messages, VoiceMinutes, Invites, JoinedDays, AccountDays ou ActivityMinutes) recebem o cargo, e o perdem quando ficam abaixo, a menos que seja definido como permanente. Para ActivityMinutes, defina o jogo com "statroleset <id> activity <nome>" ou deixe como qualquer jogo.'
  params:
    - desc: 'O cargo a gerenciar.'
      name: role
      optional: false
      type: IRole
    - desc: 'O que medir: Messages, VoiceMinutes, Invites, JoinedDays, AccountDays ou ActivityMinutes.'
      name: stat
      optional: false
      type: StatRoleStat
    - desc: 'O valor mínimo.'
      name: minimum
      optional: false
      type: long
    - desc: 'O período em dias, ou 0 para todo o período.'
      name: lookbackDays
      optional: true
      type: int
    - desc: 'Um nome de exibição.'
      name: name
      optional: true
      type: string
statroletop:
  args:
    - '@role Messages 10 [lookbackDays] [name]'
    - '@role VoiceMinutes 3 7'
  desc: 'Cria um cargo de estatística por posição no ranking: os membros classificados do 1º até a posição informada recebem o cargo.'
  params:
    - desc: 'O cargo a gerenciar.'
      name: role
      optional: false
      type: IRole
    - desc: 'O que medir.'
      name: stat
      optional: false
      type: StatRoleStat
    - desc: 'A pior posição que ainda se qualifica.'
      name: topEnd
      optional: false
      type: int
    - desc: 'O período em dias, ou 0 para todo o período.'
      name: lookbackDays
      optional: true
      type: int
    - desc: 'Um nome de exibição.'
      name: name
      optional: true
      type: string
statrolepercent:
  args:
    - '@role Messages 10 [lookbackDays] [name]'
  desc: 'Cria um cargo de estatística por percentual: membros entre o percentual informado do topo dos membros classificados recebem o cargo.'
  params:
    - desc: 'O cargo a gerenciar.'
      name: role
      optional: false
      type: IRole
    - desc: 'O que medir.'
      name: stat
      optional: false
      type: StatRoleStat
    - desc: 'O corte percentual, de 1 a 100.'
      name: topPercent
      optional: false
      type: int
    - desc: 'O período em dias, ou 0 para todo o período.'
      name: lookbackDays
      optional: true
      type: int
    - desc: 'Um nome de exibição.'
      name: name
      optional: true
      type: string
statrolestreak:
  args:
    - '@role Messages 5 7 [lookbackDays] [name]'
  desc: 'Cria um cargo de estatística de sequência diária: membros que atingem o mínimo por dia em pelo menos o número necessário de dias dentro do período recebem o cargo.'
  params:
    - desc: 'O cargo a gerenciar.'
      name: role
      optional: false
      type: IRole
    - desc: 'Messages ou VoiceMinutes.'
      name: stat
      optional: false
      type: StatRoleStat
    - desc: 'O mínimo por dia.'
      name: perDay
      optional: false
      type: long
    - desc: 'Quantos dias no período devem atingi-lo.'
      name: requiredDays
      optional: false
      type: int
    - desc: 'O período em dias.'
      name: lookbackDays
      optional: true
      type: int
    - desc: 'Um nome de exibição.'
      name: name
      optional: true
      type: string
statrolelist:
  args:
    - ''
  desc: 'Lista os cargos de estatística com suas condições.'
  params: [ ]
statroleinfo:
  args:
    - '3'
  desc: 'Mostra a configuração completa de um cargo de estatística: condição, filtros, notificações e agendamento.'
  params:
    - desc: 'O ID do cargo de estatística.'
      name: id
      optional: false
      type: int
statroleremove:
  args:
    - '3'
  desc: 'Apaga um cargo de estatística. Os membros mantêm o que já possuem.'
  params:
    - desc: 'O ID do cargo de estatística.'
      name: id
      optional: false
      type: int
statroletoggle:
  args:
    - '3'
  desc: 'Ativa ou desativa um cargo de estatística.'
  params:
    - desc: 'O ID do cargo de estatística.'
      name: id
      optional: false
      type: int
statrolepreview:
  args:
    - '3'
  desc: 'Mostra quem ganharia e quem perderia o cargo na próxima execução, sem alterar nada.'
  params:
    - desc: 'O ID do cargo de estatística.'
      name: id
      optional: false
      type: int
statrolerun:
  args:
    - '3'
  desc: 'Avalia e aplica um cargo de estatística agora, em vez de aguardar o agendamento.'
  params:
    - desc: 'O ID do cargo de estatística.'
      name: id
      optional: false
      type: int
statroleset:
  args:
    - '3 permanent true'
    - '3 lookback 30'
    - '3 notifychannel #announcements'
    - '3 message %user% just %action% %role%!'
    - '3 activity Minecraft'
  desc: 'Altera uma configuração de um cargo de estatística. Configurações: name, min, max, lookback, topstart, topend, days, permanent, invert, bots, group, interval, notifychannel, notifydm, message, activity (nome de um jogo ou "any" para a estatística ActivityMinutes). Use "none" para limpar max, group, notifychannel ou message.'
  params:
    - desc: 'O ID do cargo de estatística.'
      name: id
      optional: false
      type: int
    - desc: 'O nome da configuração.'
      name: setting
      optional: false
      type: string
    - desc: 'O novo valor.'
      name: value
      optional: false
      type: string
statrolefilter:
  args:
    - '3 #channel'
    - '3 @role'
    - '3 @role true'
    - '3 @user'
  desc: 'Ativa ou desativa um filtro em um cargo de estatística: um canal ao qual a estatística se limita, um cargo que os membros precisam (ou, com true, não podem ter), ou um membro que o cargo nunca altera.'
  params:
    - desc: 'O ID do cargo de estatística.'
      name: id
      optional: false
      type: int
    - desc: 'Um canal ao qual limitar a estatística.'
      name: channel
      optional: false
      type: IGuildChannel
    - desc: 'Um cargo a exigir ou excluir.'
      name: role
      optional: false
      type: IRole
    - desc: 'True para alternar a lista negra de cargos em vez da lista branca.'
      name: blacklist
      optional: true
      type: bool
    - desc: 'Um membro que o cargo de estatística nunca altera.'
      name: user
      optional: false
      type: IGuildUser
