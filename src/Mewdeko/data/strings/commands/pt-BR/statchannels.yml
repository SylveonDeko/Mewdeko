statchannelcreate:
  args:
    - 'TotalMembers [template]'
  desc: 'Cria um novo canal de voz bloqueado que exibe uma estatística do servidor. O bot criará e gerenciará o canal.'
  params:
    - desc: 'O tipo de estatística a exibir.'
      name: type
      optional: false
      type: StatChannelType
    - desc: 'O modelo de exibição. Use %count% para o valor.'
      name: template
      optional: true
      type: string
statchanneladd:
  args:
    - '#voice-channel TotalMembers [template]'
  desc: 'Adiciona um canal de voz como canal de estatística. Tipos: TotalMembers, HumanMembers, BotCount, OnlineMembers, ChannelCount, RoleCount, BoostCount, BoostLevel, EmojiCount.'
  params:
    - desc: 'O canal de voz a usar.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'O tipo de estatística a exibir.'
      name: type
      optional: false
      type: StatChannelType
    - desc: 'O modelo de exibição. Use %count% para o valor.'
      name: template
      optional: true
      type: string
statchannelrole:
  args:
    - '#voice-channel @role [template]'
  desc: 'Adiciona um canal de estatística que mostra quantos membros possuem um cargo específico.'
  params:
    - desc: 'O canal de voz a usar.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'O cargo cujos membros serão contados.'
      name: role
      optional: false
      type: IRole
    - desc: 'O modelo de exibição. Use %count% e %role.name%.'
      name: template
      optional: true
      type: string
statchannelcountdown:
  args:
    - '#voice-channel 2026-12-31 [template]'
  desc: 'Adiciona um canal de estatística de contagem regressiva. Use os marcadores %days% e %hours%.'
  params:
    - desc: 'O canal de voz a usar.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'A data alvo da contagem regressiva.'
      name: date
      optional: false
      type: DateTime
    - desc: 'O modelo de exibição. Use %days% e %hours%.'
      name: template
      optional: true
      type: string
statchannelgoal:
  args:
    - '#voice-channel 1000 [template]'
  desc: 'Adiciona um canal de estatística de meta de membros. Use %count%, %goal% e %goal.percent%.'
  params:
    - desc: 'O canal de voz a usar.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'O número alvo de membros.'
      name: goal
      optional: false
      type: int
    - desc: 'O modelo de exibição. Use %count%, %goal%, %goal.percent%.'
      name: template
      optional: true
      type: string
statchannelremove:
  args:
    - '#voice-channel'
  desc: 'Remove um canal de estatística.'
  params:
    - desc: 'O canal de voz a remover.'
      name: channel
      optional: false
      type: IVoiceChannel
statchannellist:
  args:
    - ''
  desc: 'Lista todos os canais de estatística deste servidor.'
  params: [ ]
statchanneltwitchcounter:
  args:
    - '#voice-channel counter [template]'
  desc: 'Define um canal de estatística para mostrar um contador da Twitch.'
statchannelmechanism:
  args:
    - '#voice-channel Rename|Recreate|Auto [interval-minutes]'
  desc: 'Define o mecanismo de atualização de um canal de estatística.'
statchannelstyle:
  args:
    - '#voice-channel Plain|Comma|Abbreviated|ProgressBar'
  desc: 'Define o estilo de exibição de um canal de estatística.'
statchanneldefaults:
  args:
    - '[Rename|Recreate|Auto] [interval-minutes] [Plain|Comma|Abbreviated|ProgressBar]'
  desc: 'Mostra as configurações padrão dos canais de estatística.'
statchanneltypes:
  args:
    - ''
  desc: 'Lista os tipos de canais de estatística disponíveis.'
