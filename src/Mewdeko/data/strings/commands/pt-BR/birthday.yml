birthdayannouncements:
  args:
    - ''
  desc: 'Ativa ou desativa os anúncios de aniversário do usuário.'
  params: [ ]
birthdaychannel:
  args:
    - '#channel'
  desc: 'Define o canal de anúncios de aniversário.'
  params:
    - desc: 'O canal de texto para os anúncios. Padrão: o canal atual, se não for especificado.'
      name: channel
      optional: true
      type: ITextChannel
birthdayconfig:
  args:
    - ''
  desc: 'Mostra a configuração atual de aniversários.'
  params: [ ]
birthdaylist:
  args:
    - days
  desc: 'Mostra os próximos aniversários do servidor.'
  params:
    - desc: 'Quantos dias à frente consultar. Padrão: 7, máximo: 30.'
      name: days
      optional: true
      type: int
birthdaymessage:
  args:
    - message
  desc: 'Define um modelo personalizado de mensagem de aniversário.'
  params:
    - desc: 'O modelo da mensagem. Use {user} para mencionar o usuário. Mostra a mensagem atual se deixado vazio.'
      name: message
      optional: true
      type: string
birthdaypingrole:
  args:
    - '@role'
  desc: 'Define o cargo a mencionar ao anunciar aniversários.'
  params:
    - desc: 'O cargo a mencionar. Não informe um cargo para desativar.'
      name: role
      optional: true
      type: IRole
birthdayrole:
  args:
    - '@role'
  desc: 'Define o cargo de aniversário que os usuários recebem no dia do aniversário.'
  params:
    - desc: 'O cargo a atribuir no aniversário do usuário. Não informe um cargo para desativar.'
      name: role
      optional: true
      type: IRole
birthdaytimezone:
  args:
    - timezone
  desc: 'Define o fuso horário do usuário para os cálculos de aniversário.'
  params:
    - desc: 'O fuso horário a definir (ex.: "America/New_York").'
      name: timezone
      optional: false
      type: string
birthdaytoday:
  args:
    - ''
  desc: 'Mostra os aniversários de hoje.'
  params: [ ]