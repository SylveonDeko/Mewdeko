  desc: 'Lista todas as mensagens de boas-vindas por cargo configuradas no servidor, com informações detalhadas de cada uma.'
  params: [ ]
rolegreetmessage:
  args:
    - '<id> [message]'
    - number
  desc: 'Atualiza o conteúdo da mensagem de uma boas-vindas por cargo. Se nenhuma mensagem for informada, apresenta opções para visualizar a mensagem como está ou vê-la como texto comum.'
  params:
    - desc: 'O ID da mensagem de boas-vindas por cargo a atualizar, com base na posição na lista de todas as mensagens.'
      name: id
      optional: false
      type: int
    - desc: 'O novo conteúdo da mensagem. Opcional.'
      name: message
      optional: true
      type: string
