rolegreetlist:
  args:
    - ''
  desc: 'Lista todas as saudações de cargo configuradas no servidor, fornecendo informações detalhadas de cada uma.'
  params: [ ]
rolegreetmessage:
  args:
    - '<id> [message]'
    - number
  desc: 'Atualiza o conteúdo da mensagem de uma saudação de cargo. Se nenhuma mensagem for fornecida, apresenta opções para visualizar a mensagem como está ou como texto normal.'
  params:
    - desc: 'O ID da saudação de cargo a atualizar, com base em sua posição na lista de todas as saudações de cargo.'
      name: id
      optional: false
      type: int
    - desc: 'O novo conteúdo da mensagem. Opcional.'
      name: message
      optional: true
      type: string
