rolegreetwebhook:
  args:
    - '<id> [name] [avatar]'
    - number
  desc: 'Configura um webhook para uma mensagem de boas-vindas de cargo, permitindo nome e avatar personalizados. Se nenhum nome for fornecido, o webhook é desabilitado.'
  params:
    - desc: 'O ID da saudação de cargo para configurar o webhook, com base em sua posição na lista de todas as saudações de cargo.'
      name: id
      optional: false
      type: int
    - desc: 'O nome do webhook. Opcional.'
      name: name
      optional: true
      type: string
    - desc: 'A URL do avatar para o webhook. Opcional.'
      name: avatar
      optional: true
      type: string
