rolegreetadd:
  args:
    - '@role [@channel]'
    - '@role'
  desc: 'Adiciona uma nova mensagem de boas-vindas por cargo para o cargo especificado. Se nenhum canal for informado, o canal atual é usado.'
  params:
    - desc: 'O cargo para o qual a mensagem de boas-vindas está sendo definida.'
      name: role
      optional: false
      type: role
    - desc: 'O canal de texto onde a mensagem de boas-vindas será enviada. Opcional.'
      name: channel
      optional: true
      type: channel
