rolegreetwebhook:
  args:
    - '<id> [name] [avatar]'
    - number
  desc: 'Configura um webhook para uma mensagem de boas-vindas por cargo, permitindo nome e avatar personalizados. Se nenhum nome for informado, o webhook é desativado.'
  params:
    - desc: 'O ID da mensagem de boas-vindas por cargo para configurar o webhook, com base na posição na lista de todas as mensagens.'
      name: id
      optional: false
      type: int
    - desc: 'O nome do webhook. Opcional.'
      name: name
      optional: true
      type: string
    - desc: 'A URL do avatar do webhook. Opcional.'
