todoadd:
  args:
    - listId
    - title
    - description
  desc: 'Adiciona um novo item de tarefa a uma lista especificada'
  params:
    - desc: 'O ID da lista de tarefas.'
      name: listId
      optional: false
      type: int
    - desc: 'O título do item de tarefa.'
      name: title
      optional: false
      type: string
    - desc: 'Descrição opcional do item.'
      name: description
      optional: true
      type: string
todoaddpriority:
  args:
    - listId
    - priority
    - title
    - description
  desc: 'Adiciona um item de tarefa com prioridade e data de vencimento opcional'
  params:
    - desc: 'O ID da lista de tarefas.'
      name: listId
      optional: false
      type: int
    - desc: 'Nível de prioridade (1=Baixa, 2=Média, 3=Alta, 4=Crítica).'
      name: priority
      optional: false
      type: int
    - desc: 'O título do item de tarefa.'
      name: title
      optional: false
      type: string
    - desc: 'Descrição opcional do item.'
      name: description
      optional: true
      type: string
todoaddtag:
  args:
    - itemId
    - tag
  desc: 'Adiciona uma tag a um item de tarefa'
  params:
    - desc: 'O ID do item de tarefa.'
      name: itemId
      optional: false
      type: int
    - desc: 'A tag a adicionar.'
      name: tag
      optional: false
      type: string
todocleardue:
  args:
    - itemId
  desc: 'Remove a data de vencimento de um item de tarefa'
  params:
    - desc: 'O ID do item de tarefa.'
      name: itemId
      optional: false
      type: int
todoclearreminder:
  args:
    - itemId
  desc: 'Remove o lembrete de um item de tarefa'
  params:
    - desc: 'O ID do item de tarefa.'
      name: itemId
      optional: false
      type: int
todocomplete:
  args:
    - itemId
  desc: 'Conclui um item de tarefa'
  params:
    - desc: 'O ID do item de tarefa.'
      name: itemId
      optional: false
      type: int
todocreatelist:
  args:
    - name
    - description
  desc: 'Cria uma nova lista de tarefas'
  params:
    - desc: 'O nome da lista de tarefas.'
      name: name
      optional: false
      type: string
    - desc: 'Descrição opcional da lista.'
      name: description
      optional: true
      type: string
todocreateserverlist:
  args:
    - name
    - description
  desc: 'Cria uma nova lista de tarefas para todo o servidor (somente administradores)'
  params:
    - desc: 'O nome da lista de tarefas do servidor.'
      name: name
      optional: false
      type: string
    - desc: 'Descrição opcional da lista.'
      name: description
      optional: true
      type: string
tododelete:
  args:
    - itemId
  desc: 'Apaga um item de tarefa'
  params:
    - desc: 'O ID do item de tarefa.'
      name: itemId
      optional: false
      type: int
tododeletelist:
  args:
    - listId
  desc: 'Apaga uma lista de tarefas inteira'
  params:
    - desc: 'O ID da lista de tarefas.'
      name: listId
      optional: false
      type: int
todoedit:
  args:
    - itemId
    - title
    - description
  desc: 'Edita o título e a descrição de um item de tarefa'
  params:
    - desc: 'O ID do item de tarefa.'
      name: itemId
      optional: false
      type: int
    - desc: 'O novo título.'
      name: title
      optional: false
      type: string
    - desc: 'A nova descrição.'
      name: description
      optional: true
      type: string
todofilter:
  args:
    - listId
    - filter
    - value
  desc: 'Filtra os itens de tarefa por tag ou prioridade'
  params:
    - desc: 'O ID da lista de tarefas.'
      name: listId
      optional: false
      type: int
    - desc: 'Tipo de filtro (tag ou priority).'
      name: filter
      optional: false
      type: string
    - desc: 'O valor usado no filtro.'
      name: value
      optional: true
      type: string
todogrant:
  args:
    - listId
    - '@user'
    - permissions
  desc: 'Concede permissões a um usuário para uma lista de tarefas (somente dono ou administrador da lista)'
  params:
    - desc: 'O ID da lista de tarefas.'
      name: listId
      optional: false
      type: int
    - desc: 'O usuário ao qual conceder permissões.'
      name: user
      optional: false
      type: IUser
    - desc: 'Permissões separadas por vírgula (view,add,edit,complete,delete,manage,all).'
      name: permissions
      optional: false
      type: string
todolists:
  args:
    - includeServer
  desc: 'Lista todas as listas de tarefas acessíveis ao usuário'
  params:
    - desc: 'Se deve incluir as listas do servidor.'
      name: includeServer
      optional: true
      type: bool
todopermissions:
  args:
    - listId
  desc: 'Mostra todas as permissões de uma lista de tarefas'
  params:
    - desc: 'O ID da lista de tarefas.'
      name: listId
      optional: false
      type: int
todoremovetag:
  args:
    - itemId
    - tag
  desc: 'Remove uma tag de um item de tarefa'
  params:
    - desc: 'O ID do item de tarefa.'
      name: itemId
      optional: false
      type: int
    - desc: 'A tag a remover.'
      name: tag
      optional: false
      type: string
todoreorder:
  args:
    - itemId
    - newPosition
  desc: 'Reordena um item de tarefa para uma nova posição'
  params:
    - desc: 'O ID do item de tarefa.'
      name: itemId
      optional: false
      type: int
    - desc: 'A nova posição (começando em 1).'
      name: newPosition
      optional: false
      type: int
todorevoke:
  args:
    - listId
    - '@user'
  desc: 'Revoga todas as permissões de um usuário em uma lista de tarefas'
  params:
    - desc: 'O ID da lista de tarefas.'
      name: listId
      optional: false
      type: int
    - desc: 'O usuário do qual revogar as permissões.'
      name: user
      optional: false
      type: IUser
todosearch:
  args:
    - listId
    - query
  desc: 'Pesquisa itens de tarefa dentro de uma lista'
  params:
    - desc: 'O ID da lista de tarefas.'
      name: listId
      optional: false
      type: int
    - desc: 'A consulta de pesquisa.'
      name: query
      optional: false
      type: string
todosetcolor:
  args:
    - listId
    - color
  desc: 'Define a cor de uma lista de tarefas'
  params:
    - desc: 'O ID da lista de tarefas.'
      name: listId
      optional: false
      type: int
    - desc: 'Código de cor hexadecimal, por exemplo #ff0000.'
      name: color
      optional: false
      type: string
todosetdue:
  args:
    - itemId
    - dateString
  desc: 'Define a data de vencimento de um item de tarefa'
  params:
    - desc: 'O ID do item de tarefa.'
      name: itemId
      optional: false
      type: int
    - desc: 'A data e a hora de vencimento.'
      name: dateString
      optional: false
      type: string
todosetreminder:
  args:
    - itemId
    - dateString
  desc: 'Define um horário de lembrete para um item de tarefa'
  params:
    - desc: 'O ID do item de tarefa.'
      name: itemId
      optional: false
      type: int
    - desc: 'A data e a hora do lembrete.'
      name: dateString
      optional: false
      type: string
todoshow:
  args:
    - listId
    - includeCompleted
  desc: 'Mostra todos os itens de uma lista de tarefas'
  params:
    - desc: 'O ID da lista de tarefas.'
      name: listId
      optional: false
      type: int
    - desc: 'Se deve incluir os itens concluídos.'
      name: includeCompleted
      optional: true
      type: bool
todotoggleprivacy:
  args:
    - listId
  desc: 'Alterna a configuração de privacidade de uma lista de tarefas'
  params:
    - desc: 'O ID da lista de tarefas.'
      name: listId
      optional: false
      type: int