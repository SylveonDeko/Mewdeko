serveractivity:
  args:
    - '[days]'
    - '7'
    - '0'
  desc: 'Mostra o resumo de atividade do servidor em um período: mensagens, tempo em voz, contribuidores, entradas e saídas, e o membro e os canais mais ativos. Use 0 para todo o período.'
  params:
    - desc: 'O período em dias, 0 para todo o período, ou omitido para o padrão do servidor.'
      name: days
      optional: true
      type: int
useractivity:
  args:
    - '[@user] [days]'
    - '@user 30'
  desc: 'Mostra o resumo de atividade de um membro em um período: mensagens e tempo em voz com posições, totais históricos e seus canais mais usados.'
  params:
    - desc: 'O membro, ou omitido para você mesmo.'
      name: user
      optional: true
      type: IGuildUser
    - desc: 'O período em dias, 0 para todo o período, ou omitido para o padrão do servidor.'
      name: days
      optional: true
      type: int
channelactivity:
  args:
    - '[#channel] [days]'
  desc: 'Mostra o resumo de atividade de um canal em um período: mensagens, tempo em voz, contribuidores e os membros mais ativos.'
  params:
    - desc: 'O canal, ou omitido para o canal atual.'
      name: channel
      optional: true
      type: IGuildChannel
    - desc: 'O período em dias, 0 para todo o período, ou omitido para o padrão do servidor.'
      name: days
      optional: true
      type: int
activitytop:
  args:
    - '[Messages|Voice] [days] [@role]'
    - 'Voice 7'
  desc: 'Classifica os membros por mensagens ou tempo em voz em um período, opcionalmente apenas membros com um cargo.'
  params:
    - desc: 'Messages or Voice.'
      name: kind
      optional: true
      type: StatKind
    - desc: 'O período em dias, 0 para todo o período, ou omitido para o padrão do servidor.'
      name: days
      optional: true
      type: int
    - desc: 'Incluir apenas membros com este cargo.'
      name: role
      optional: true
      type: IRole
activitytopchannels:
  args:
    - '[Messages|Voice] [days]'
  desc: 'Classifica os canais por mensagens ou tempo em voz em um período.'
  params:
    - desc: 'Messages or Voice.'
      name: kind
      optional: true
      type: StatKind
    - desc: 'O período em dias, 0 para todo o período, ou omitido para o padrão do servidor.'
      name: days
      optional: true
      type: int
activitychart:
  args:
    - '[Messages|Voice|Members|Status|Joins|Leaves|Growth|InVoice] [days]'
    - 'Members 30'
  desc: 'Desenha um gráfico de mensagens, horas em voz, número de membros, status dos membros, entradas, saídas, crescimento ou membros em voz em um período.'
  params:
    - desc: 'O que incluir no gráfico.'
      name: kind
      optional: true
      type: StatChartKind
    - desc: 'O período em dias, de 1 a 90, ou omitido para o padrão do servidor.'
      name: days
      optional: true
      type: int
activityexport:
  args:
    - '[Messages|Voice] [days]'
  desc: 'Exporta uma classificação de membros por mensagens ou tempo em voz como um arquivo CSV.'
  params:
    - desc: 'Messages or Voice.'
      name: kind
      optional: true
      type: StatKind
    - desc: 'O período em dias, 0 para todo o período, ou omitido para o padrão do servidor.'
      name: days
      optional: true
      type: int
statssettings:
  args:
    - ''
  desc: 'Mostra as configurações de rastreamento das estatísticas de atividade.'
  params: [ ]
statslookback:
  args:
    - '14'
  desc: 'Define o período padrão em dias usado pelos comandos de estatísticas quando nenhum for informado.'
  params:
    - desc: 'O período em dias, de 1 a 90.'
      name: days
      optional: false
      type: int
statscooldown:
  args:
    - '30'
  desc: 'Define quantos segundos devem passar entre duas mensagens contadas do mesmo membro. 0 conta todas as mensagens.'
  params:
    - desc: 'O tempo de espera em segundos, de 0 a 300.'
      name: seconds
      optional: false
      type: int
statstrackvoice:
  args:
    - ''
  desc: 'Ativa ou desativa o rastreamento de tempo em voz nas estatísticas de atividade.'
  params: [ ]
statstracksnapshots:
  args:
    - ''
  desc: 'Ativa ou desativa os registros horários de membros e status usados nos gráficos de membros e status.'
  params: [ ]
statscountbots:
  args:
    - ''
  desc: 'Ativa ou desativa a contagem de bots nas estatísticas de atividade.'
  params: [ ]
statsignorevoicestate:
  args:
    - 'SelfMuted'
    - 'Afk'
  desc: 'Ativa ou desativa a contagem do tempo em um estado de voz (SelfMuted, SelfDeafened, ServerMuted, ServerDeafened, Afk, Alone, Streaming, Video) nas estatísticas de voz.'
  params:
    - desc: 'O estado a ativar ou desativar.'
      name: state
      optional: false
      type: VoiceStateFlags
statsignore:
  args:
    - '#channel'
    - '@role'
    - '@user'
  desc: 'Ativa ou desativa a exclusão de um canal, de todos os portadores de um cargo ou de um membro das estatísticas de atividade.'
  params:
    - desc: 'O canal a ativar ou desativar.'
      name: channel
      optional: false
      type: IGuildChannel
    - desc: 'O cargo a alternar.'
      name: role
      optional: false
      type: IRole
    - desc: 'O membro a ativar ou desativar.'
      name: user
      optional: false
      type: IGuildUser
statsignored:
  args:
    - ''
  desc: 'Lista os canais, cargos e membros excluídos das estatísticas de atividade.'
  params: [ ]
statsprivacy:
  args:
    - ''
  desc: 'Exclui você das estatísticas de atividade em todos os servidores, apagando permanentemente suas estatísticas registradas de mensagens e voz, ou faz você voltar a ser incluído.'
  params: [ ]
topgames:
  args:
    - '[days]'
    - '30'
  desc: 'Classifica os jogos e aplicativos em que os membros passam mais tempo em um período, com número de jogadores. Requer que o rastreamento de jogos esteja ativado.'
  params:
    - desc: 'O período em dias, 0 para todo o período, ou omitido para o padrão do servidor.'
      name: days
      optional: true
      type: int
whoplays:
  args:
    - 'Minecraft'
  desc: 'Mostra quem joga um jogo ou usa um aplicativo: quantos membros estão nele agora e os membros com mais tempo nele.'
  params:
    - desc: 'O nome do jogo ou aplicativo.'
      name: game
      optional: false
      type: string
statstrackactivities:
  args:
    - ''
  desc: 'Ativa ou desativa o rastreamento dos jogos e aplicativos usados pelos membros (jogando, transmitindo, ouvindo, assistindo, competindo). Desativado por padrão.'
  params: [ ]
statsverifyactivities:
  args:
    - ''
  desc: 'Ativa ou desativa a contagem apenas de atividades respaldadas por um aplicativo do Discord, pelo Spotify ou por uma transmissão, o que bloqueia presenças falsificadas por clientes personalizados.'
  params: [ ]
statsactivityfiltermode:
  args:
    - 'Whitelist'
    - 'Blacklist'
  desc: 'Define se a lista de filtros de atividade permite apenas os jogos listados (Whitelist) ou os ignora (Blacklist).'
  params:
    - desc: 'Whitelist or Blacklist.'
      name: mode
      optional: false
      type: ActivityFilterMode
statsactivityfilter:
  args:
    - 'Spotify'
  desc: 'Ativa ou desativa um nome de jogo ou aplicativo na lista de filtros de atividade.'
  params:
    - desc: 'O nome da atividade.'
      name: name
      optional: false
      type: string
statsactivityfilters:
  args:
    - ''
  desc: 'Lista o filtro de atividades e informa se ele é uma lista branca ou uma lista negra.'
  params: [ ]
liveboardadd:
  args:
    - '#channel InviteLeaderboard [Weekly] [entries] [intervalMinutes]'
    - '#stats GrowthChart Monthly'
  desc: 'Publica um ranking, gráfico ou visão geral que o bot mantém atualizado e fixa. Tipos: InviteLeaderboard, MessageLeaderboard, VoiceLeaderboard, JoinsChart, LeavesChart, GrowthChart, MembersChart, MessagesChart, ServerOverview, InviteStats.'
  params:
    - desc: 'O canal onde publicar.'
      name: channel
      optional: false
      type: ITextChannel
    - desc: 'O que exibir.'
      name: kind
      optional: false
      type: LiveBoardKind
    - desc: 'O período: AllTime, Daily, Weekly ou Monthly.'
      name: range
      optional: true
      type: StatsRange
    - desc: 'Linhas para os rankings, de 3 a 25.'
      name: entries
      optional: true
      type: int
    - desc: 'Com que frequência atualizar, no mínimo 5 minutos.'
      name: intervalMinutes
      optional: true
      type: int
liveboardlist:
  args:
    - ''
  desc: 'Lista os painéis ativos.'
  params: [ ]
liveboardremove:
  args:
    - '3'
  desc: 'Apaga um painel ativo e a sua mensagem.'
  params:
    - desc: 'O ID do painel na lista.'
      name: id
      optional: false
      type: int
liveboardrefresh:
  args:
    - ''
  desc: 'Atualiza agora todos os painéis ativos.'
  params: [ ]
serverreportchannel:
  args:
    - '[#channel]'
  desc: 'Define o canal que recebe os relatórios programados do servidor e os ativa. Omita o canal para desativar os relatórios.'
  params:
    - desc: 'O canal, ou omitido para desativar.'
      name: channel
      optional: true
      type: ITextChannel
serverreportfrequency:
  args:
    - 'Weekly'
  desc: 'Define com que frequência os relatórios do servidor são publicados: Daily, Weekly ou Monthly.'
  params:
    - desc: 'Daily, Weekly ou Monthly.'
      name: frequency
      optional: false
      type: ReportFrequency
serverreportnow:
  args:
    - '[Weekly]'
  desc: 'Publica agora um relatório do servidor no canal atual, cobrindo o período informado ou o configurado.'
  params:
    - desc: 'O período a cobrir, ou omitido para o configurado.'
      name: frequency
      optional: true
      type: ReportFrequency
