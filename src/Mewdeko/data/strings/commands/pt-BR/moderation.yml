banprune:
  args:
    - ''
  desc: 'Mostra a limpeza de mensagens que um banimento usaria neste canal, junto com todas as configurações definidas.'
  params:
    - { }
banpruneset:
  args:
    - '<action> <days> [#channel]'
  desc: 'Define quantos dias de mensagens uma ação de banimento apaga. Use "all" para todas as ações e informe um canal ou categoria para substituir apenas esse escopo.'
  params:
    - desc: 'A chave da ação, ou "all" para cobrir todas as ações'
      name: action
      optional: false
      type: string
    - desc: 'A limpeza em dias, de 0 a 7'
      name: days
      optional: false
      type: int
    - desc: 'Um canal ou categoria para limitar a configuração, ou nada para o padrão do servidor'
      name: target
      optional: true
      type: channel
banpruneclear:
  args:
    - '<action> [#channel]'
  desc: 'Remove uma configuração de limpeza para que a ação use um escopo mais amplo ou o seu padrão.'
  params:
    - desc: 'A chave da ação, ou "all" para a configuração que cobre todas as ações'
      name: action
      optional: false
      type: string
    - desc: 'O canal ou categoria onde a configuração está, ou nada para o padrão do servidor'
      name: target
      optional: true
      type: channel
banprunereset:
  args:
    - ''
  desc: 'Remove todas as configurações de limpeza do servidor.'
  params:
    - { }
ban:
  args:
    - '<pruneTime> <time> [@user] [msg]'
    - time time
  desc: 'Bane um usuário com o motivo especificado e a quantidade de dias de mensagens a apagar.'
  params:
    - desc: 'Bane um usuário com o motivo especificado e a quantidade de dias de mensagens a apagar.'
      name: pruneTime
      optional: false
      type: duration
    - desc: 'A quantidade de tempo para apagar mensagens'
      name: time
      optional: false
      type: duration
    - desc: 'O usuário a banir'
      name: user
      optional: true
      type: user
    - desc: 'O motivo do banimento'
      name: msg
      optional: true
      type: string
