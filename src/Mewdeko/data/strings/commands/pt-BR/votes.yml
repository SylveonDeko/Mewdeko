votechannel:
  args:
    - channel
  desc: >-
    Define o canal de texto especificado como canal de votos onde todas as
    confirmações de voto serão enviadas.
  params:
    - &ref_646
      desc: 'O canal de texto a definir como canal de votos.'
      name: channel
      optional: false
      type: ITextChannel
