votemessage:
  args:
    - '[message]'
  desc: >-
    Define uma mensagem personalizada a ser enviada quando um usuário vota ou
    previsualiza a mensagem de voto atual.
  params:
    - desc: 'A mensagem personalizada para votos. Use "-" para redefinir ao padrão. Se nulo, previsualiza a mensagem de voto atual.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: >-
    Inicia um processo de confirmação para definir uma nova senha de voto,
    alertando o usuário sobre sua segurança.
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: >-
    Adiciona um cargo a ser concedido aos usuários quando votarem, com uma
    duração opcional para o cargo ser removido automaticamente.
  params:
    - desc: 'O cargo a adicionar como recompensa de voto.'
      name: role
      optional: false
      type: role
    - desc: 'A duração para a qual o cargo será concedido. Nulo para indefinido.'
      name: time
      optional: true
      type: duration
