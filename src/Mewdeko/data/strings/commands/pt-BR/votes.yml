votemessage:
  args:
    - '[message]'
  desc: 'Define uma mensagem personalizada a ser enviada quando um usuário votar ou para visualizar a mensagem de voto atual.'
  params:
    - desc: 'A mensagem personalizada de votação. Use "-" para voltar à mensagem padrão. Se null, mostra a prévia da mensagem de voto atual.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: 'Inicia um processo de confirmação para definir uma nova senha de votação, alertando o usuário sobre sua segurança.'
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: 'Adiciona um cargo a ser concedido aos usuários ao votarem, com duração opcional para que o cargo seja removido automaticamente.'
  params:
    - desc: 'O cargo a adicionar como recompensa de voto.'
      name: role
      optional: false
      type: role
    - desc: 'A duração pela qual o cargo será concedido. Null para indefinido.'
      name: time
      optional: true
      type: duration
