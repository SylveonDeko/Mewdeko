votes:
  args:
    - '[@user]'
  desc: >-
    Exibe o número total de votos dados por um usuário específico ou pelo
    invocador do comando.
  params:
    - desc: 'O usuário cujos votos contar. Se nulo, conta os votos do invocador do comando.'
      name: user
      optional: true
      type: user
votesleaderboard:
  args:
