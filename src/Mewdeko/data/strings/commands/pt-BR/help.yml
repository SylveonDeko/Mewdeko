commands:
  args:
    - '[module]'
    - '[module] [search]'
  desc: 'Mostra os comandos de um módulo específico, opcionalmente filtrados por um termo de pesquisa. Se null, é um alias para modules, que por sua vez é um alias para help.'
  params:
    - desc: 'O módulo a consultar, opcionalmente seguido de um termo para filtrar os comandos'
      name: module
      optional: true
      type: string
