commands:
  args:
    - '[module]'
    - '[module] [search]'
  desc: >-
    Mostra os comandos de um módulo específico, opcionalmente filtrados por um termo de busca. Se null, é um alias para modules, que é um alias para help.
  params:
    - desc: 'O módulo a consultar, opcionalmente seguido de um termo para filtrar seus comandos'
      name: module
      optional: true
      type: string
