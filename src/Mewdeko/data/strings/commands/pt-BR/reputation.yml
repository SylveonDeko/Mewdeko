represet:
  args:
    - text
  desc: 'Redefine a reputação de um usuário ou de todos os usuários do servidor.'
  params:
    - desc: 'O usuário a redefinir, ou "all" para redefinir todos.'
      name: target
      optional: false
      type: string
reprole:
  args:
    - ''
    - detailed
    - '@role'
    - '@role 100'
    - '@role 100 false #channel true 50'
  desc: 'Gerencia as recompensas de cargo para marcos de reputação. Use sem parâmetros para listar todas as recompensas, ou informe um cargo e uma reputação para adicionar/atualizar uma recompensa, com configurações avançadas opcionais.'
  params:
    - &ref_437
      desc: 'O cargo a conceder (opcional para listagem).'
      name: role
      optional: true
      type: IRole
    - desc: 'A reputação necessária para ganhar este cargo (opcional para listagem).'
      name: reputation
      optional: true
      type: int
    - desc: 'Se o cargo deve ser removido caso a reputação diminua.'
      name: removeOnDrop
      optional: true
      type: bool
    - desc: 'Canal opcional para anunciar a concessão de cargos.'
      name: announceChannel
      optional: true
      type: ITextChannel
    - desc: 'Se deve enviar notificações por DM.'
      name: announceDm
      optional: true
      type: bool
    - desc: 'Recompensa de XP opcional ao atingir o marco.'
      name: xpReward
      optional: true
      type: int
    - desc: 'Mostra informações detalhadas na listagem (use ''detailed'' como primeiro parâmetro).'
      name: detailed
      optional: true
      type: string
reprolechannel:
  args:
    - role channel
  desc: 'Define o canal de anúncios para uma recompensa de cargo.'
  params:
    - desc: 'O cargo a configurar.'
      name: role
      optional: false
      type: IRole
    - desc: 'O canal para os anúncios (null para desativar).'
      name: channel
      optional: true
      type: ITextChannel
reproleremove:
  args:
    - '@role'
  desc: 'Remove uma configuração de recompensa de cargo.'
  params:
    - desc: 'O cargo a remover das recompensas.'
      name: role
      optional: true
      type: IRole
