  args:
    - enabled
  desc: 'Ativa ou desativa a concessão de reputação anônima.'
  params:
    - desc: 'True para ativar a reputação anônima.'
      name: enabled
      optional: false
      type: bool
repchannel:
  args:
    - '#channel state number'
  desc: 'Configura as definições de reputação específicas de canal.'
  params:
    - desc: 'O canal a configurar.'
      name: channel
      optional: false
      type: ITextChannel
    - desc: 'O estado a definir (enabled/disabled/readonly).'
      name: state
      optional: true
      type: string
    - desc: 'O multiplicador de reputação para este canal.'
      name: multiplier
      optional: true
      type: decimal
repcheck:
  args:
    - '@user'
  desc: 'Verifica a reputação de um usuário.'
  params:
    - desc: 'O usuário cuja reputação será verificada. Se nulo, verifica a reputação de quem executou o comando.'
      name: target
      optional: true
      type: IGuildUser
repcommandbypass:
  args:
    - commandname '@role'
  desc: 'Define cargos de bypass para um requisito de comando.'
  params:
    - &ref_426
      desc: 'O nome do comando.'
      name: commandName
      optional: false
      type: string
    - desc: 'Os cargos que podem ignorar o requisito.'
      name: roles
      optional: false
      type: IRole[]
repcommandinfo:
  args:
    - commandname
  desc: 'Mostra os requisitos de reputação de um comando específico.'
  params:
    - desc: 'O comando a verificar.'
      name: commandName
      optional: false
      type: string
repcommandreq:
  args:
    - commandname 50
    - commandname 50 helper
    - 'commandname 50 helper #channel1 #channel2'
  desc: 'Define requisitos de reputação para um comando, opcionalmente restritos a canais específicos.'
  params:
    - desc: 'O nome do comando.'
      name: commandName
      optional: false
      type: string
    - desc: 'A reputação mínima exigida.'
      name: minReputation
      optional: false
      type: int
    - desc: 'O tipo específico de reputação exigido (opcional, padrão: total).'
      name: repType
      optional: true
      type: string
    - desc: 'Canais opcionais onde este requisito se aplica (se nenhum for especificado, aplica-se globalmente).'
      name: channels
      optional: true
      type: ITextChannel[]
repcommandreqlist:
  args:
    - ''
  desc: 'Lista todos os requisitos de comando do servidor.'
  params: [ ]
repcommandreqremove:
  args:
    - commandname
  desc: 'Remove requisitos de reputação de um comando.'
  params:
    - desc: 'O nome do comando.'
      name: commandName
      optional: false
      type: string
repconfig:
  args:
    - ''
  desc: 'Abre a interface interativa de configuração de reputação.'
  params: [ ]
repcooldown:
  args:
    - minutes
  desc: 'Define o tempo de espera padrão entre concessões de reputação.'
  params:
    - desc: 'Tempo de espera em minutos (1-1440).'
      name: minutes
      optional: false
      type: int
repdailylimit:
  args:
    - limit
  desc: 'Define o limite diário para conceder reputação.'
  params:
    - desc: 'Limite diário (1-100).'
      name: limit
      optional: false
      type: int
repdecay:
  args:
    - enabled
  desc: 'Ativa ou desativa a perda de reputação (decay) para usuários inativos.'
  params:
    - desc: 'True para ativar a perda.'
      name: enabled
      optional: false
      type: bool
repdecayamount:
  args:
    - amount
  desc: 'Define a quantidade de perda.'
  params:
    - desc: 'A quantidade de perda (1-100).'
      name: amount
      optional: false
      type: int
repdecayinactive:
  args:
    - days
  desc: 'Define o número de dias de inatividade antes que a perda comece.'
  params:
    - desc: 'Dias de inatividade (1-365).'
      name: days
      optional: false
      type: int
repdecaytype:
  args:
    - type
  desc: 'Define o tipo de perda (daily, weekly, monthly).'
  params:
    - desc: 'O tipo de perda.'
      name: type
      optional: false
      type: string
repenable:
  args:
    - enabled
  desc: 'Ativa ou desativa o sistema de reputação deste servidor.'
  params:
    - desc: 'True para ativar, false para desativar.'
      name: enabled
      optional: true
      type: bool
repeventcreate:
  args:
    - name multiplier duration
  desc: 'Cria um evento de multiplicador de reputação.'
  params:
    - desc: 'Nome do evento.'
      name: name
      optional: false
      type: string
    - desc: 'Multiplicador de reputação.'
      name: multiplier
      optional: false
      type: decimal
    - desc: 'Duração em horas.'
      name: duration
      optional: false
      type: int
repeventend:
  args:
    - name
  desc: 'Encerra um evento de reputação antecipadamente.'
  params:
    - desc: 'Nome do evento a encerrar.'
      name: name
      optional: false
      type: string
repexport:
  args:
