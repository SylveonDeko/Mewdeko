patreonanalytics:
  args:
    - ''
  desc: 'Mostra análises detalhadas do Patreon'
  params: [ ]
patreonannounce:
  args:
    - ''
  desc: 'Dispara manualmente um anúncio do Patreon.'
  params: [ ]
patreonch:
  args:
    - '#channel'
  desc: 'Define ou mostra o canal de anúncios do Patreon.'
  params:
    - desc: 'O canal a definir para os anúncios do Patreon. Se nulo, mostra o canal atual.'
      name: channel
      optional: true
      type: ITextChannel?
patreonconfig:
  args:
    - ''
  desc: 'Mostra a configuração atual do Patreon para este servidor.'
  params: [ ]
patreonday:
  args:
    - number
  desc: 'Define o dia do mês para os anúncios do Patreon.'
  params:
    - desc: 'O dia do mês (1-28) para os anúncios. Se nulo, mostra o dia atual.'
      name: day
      optional: true
      type: int?
patreondisable:
  args:
    - ''
  desc: 'Desativa os anúncios do Patreon neste servidor.'
  params: [ ]
patreonhelp:
  args:
    - ''
  desc: 'Mostra informações do módulo Patreon e os marcadores disponíveis.'
  params: [ ]
patreonlink:
  args:
    - '@user text'
  desc: 'Vincula um usuário do Discord a um apoiador do Patreon'
  params:
    - desc: 'O usuário do Discord a vincular.'
      name: user
      optional: false
      type: IGuildUser
    - desc: 'O ID do usuário do Patreon a vincular.'
      name: patreonUserId
      optional: false
      type: string
patreonmsg:
  args:
    - text
  desc: 'Define uma mensagem personalizada para os anúncios do Patreon.'
  params:
    - desc: 'A mensagem personalizada. Use marcadores como %server.name%, %month% etc. Use "-" para voltar ao padrão.'
      name: message
      optional: true
      type: string?
patreonrecognize:
  args:
    - '#channel'
  desc: 'Envia mensagens de reconhecimento para novos apoiadores'
  params:
    - desc: 'O canal onde enviar as mensagens de reconhecimento.'
      name: channel
      optional: true
      type: ITextChannel?
patreonroles:
  args:
    - ''
  desc: 'Lista os mapeamentos de cargos por nível do Patreon'
  params: [ ]
patreonrolesync:
  args:
    - ''
  desc: 'Ativa ou desativa a sincronização automática de cargos'
  params: [ ]
patreonstats:
  args:
    - ''
  desc: 'Mostra estatísticas de apoiadores do Patreon'
  params: [ ]
patreonsupporters:
  args:
    - ''
  desc: 'Lista os apoiadores ativos do Patreon'
  params: [ ]
patreonsync:
  args:
    - ''
  desc: 'Configura com segurança a integração OAuth do Patreon'
  params: [ ]
patreonsyncall:
  args:
    - ''
  desc: 'Sincroniza os cargos de todos os apoiadores vinculados'
  params: [ ]
patreontiermap:
  args:
    - text @role
  desc: 'Mapeia um nível do Patreon para um cargo do Discord'
  params:
    - desc: 'O ID do nível do Patreon.'
      name: tierId
      optional: false
      type: string
    - desc: 'O cargo do Discord a mapear para o nível.'
      name: role
      optional: false
      type: IRole
patreontoggle:
  args:
    - ''
  desc: 'Ativa ou desativa os anúncios do Patreon.'
  params: [ ]
patreontop:
  args:
    - number
  desc: 'Mostra os principais apoiadores do Patreon'
  params:
    - desc: 'Número de principais apoiadores a mostrar (1-20).'
      name: count
      optional: true
      type: int