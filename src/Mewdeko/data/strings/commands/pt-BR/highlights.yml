highlights:
  args:
    - action word
  desc: 'Gerencia os destaques dos usuários.'
  params:
    - desc: 'A ação a executar com os destaques.'
      name: action
      optional: false
      type: string
    - desc: 'A palavra a destacar.'
      name: word
      optional: true
      type: string