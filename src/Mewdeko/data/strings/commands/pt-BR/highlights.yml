highlight:
  args:
    - '<action> [words]'
    - add|list|delete
    - add
    - list
    - delete
  desc: 'Adiciona, lista, remove ou verifica destaques.'
  params:
    - desc: 'A ação a executar: add, list, delete ou match.'
      name: action
      optional: false
      type: highlightactions
