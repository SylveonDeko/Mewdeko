countingban:
  args:
    - user channel duration reason
  desc: 'Bane um usuário de contar em um canal específico.'
  params:
    - desc: 'O usuário a banir da contagem.'
      name: user
      optional: false
      type: guild user
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Duração do banimento (ex.: 1h, 1d). Deixe vazio para permanente.'
      name: duration
      optional: true
      type: stoopid time
    - desc: 'O motivo do banimento.'
      name: reason
      optional: true
      type: string
countingconfig:
  args:
    - channel
  desc: 'Configura as definições de um canal de contagem.'
  params:
    - desc: 'O canal cuja configuração será exibida. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
countingcooldown:
  args:
    - channel seconds
  desc: 'Define o tempo de espera (cooldown) entre as contagens dos usuários.'
  params:
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Tempo de espera em segundos (0-300).'
      name: seconds
      optional: true
      type: int
countingdisable:
  args:
    - channel purgeData reason
  desc: 'Desativa a contagem em um canal e, opcionalmente, apaga todos os dados.'
  params:
    - desc: 'O canal onde a contagem será desativada. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Se todos os dados de contagem deste canal devem ser excluídos. Padrão: false.'
      name: purgeData
      optional: true
      type: bool
    - desc: 'O motivo para desativar a contagem.'
      name: reason
      optional: true
      type: string
countingfailurechannel:
  args:
    - countingChannel failureChannel
  desc: 'Define o canal onde as falhas de contagem são registradas.'
  params:
    - desc: 'O canal de contagem.'
      name: countingChannel
      optional: true
      type: text channel
    - desc: 'O canal para os logs de falhas. Use null para desativar.'
      name: failureChannel
      optional: true
      type: text channel
countingfailuremessage:
  args:
    - channel embed
  desc: 'Define uma mensagem personalizada para contagens erradas.'
  params:
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'O modelo da mensagem. Use "-" para voltar ao padrão.'
      name: embed
      optional: true
      type: string
countingfailurethreshold:
  args:
    - channel threshold
  desc: 'Define o limite de falhas antes das consequências.'
  params:
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Número de falhas antes da ação (1-10).'
      name: threshold
      optional: true
      type: int
countingleaderboard:
  args:
    - type channel
  desc: 'Mostra o ranking de um canal de contagem.'
  params:
    - desc: 'O tipo de ranking (contributions, streak, accuracy, totalnumbers).'
      name: type
      optional: true
      type: string
    - desc: 'O canal cujo ranking será exibido. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
countinglist:
  args:
    - ''
  desc: 'Lista todos os canais de contagem ativos no servidor.'
  params: [ ]
countingmilestonechannel:
  args:
    - countingChannel milestoneChannel
  desc: 'Define o canal onde as conquistas de marcos são anunciadas.'
  params:
    - desc: 'O canal de contagem.'
      name: countingChannel
      optional: true
      type: text channel
    - desc: 'O canal para os anúncios de marcos. Use null para desativar.'
      name: milestoneChannel
      optional: true
      type: text channel
countingmilestonemessage:
  args:
    - channel embed
  desc: 'Define uma mensagem personalizada para as conquistas de marcos.'
  params:
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'O modelo da mensagem. Use "-" para voltar ao padrão.'
      name: embed
      optional: true
      type: string
countingmilestones:
  args:
    - channel milestones
  desc: 'Define números de marcos personalizados.'
  params:
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Números de marcos separados por vírgula (ex.: 50,100,250,500,1000).'
      name: milestones
      optional: true
      type: string
countingreset:
  args:
    - channel newNumber reason
  desc: 'Redefine a contagem de um canal para um número específico.'
  params:
    - desc: 'O canal a redefinir. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'O número para o qual redefinir. Padrão: 0.'
      name: newNumber
      optional: true
      type: long
    - desc: 'O motivo da redefinição.'
      name: reason
      optional: true
      type: string
countingrestore:
  args:
    - saveId channel
  desc: 'Restaura a contagem a partir de um ponto de salvamento anterior.'
  params:
    - desc: 'O ID do ponto de salvamento a restaurar.'
      name: saveId
      optional: false
      type: int
    - desc: 'O canal a restaurar. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
countingsave:
  args:
    - channel reason
  desc: 'Cria um ponto de salvamento do progresso atual da contagem.'
  params:
    - desc: 'O canal a salvar. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'O motivo para criar o ponto de salvamento.'
      name: reason
      optional: true
      type: string
countingsetup:
  args:
    - channel startNumber increment
  desc: 'Configura a contagem no canal atual ou em um canal especificado.'
  params:
    - desc: 'O canal onde configurar a contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'O número inicial da contagem. Padrão: 1.'
      name: startNumber
      optional: true
      type: long
    - desc: 'O incremento de cada contagem. Padrão: 1.'
      name: increment
      optional: true
      type: int
countingstats:
  args:
    - user channel
  desc: 'Mostra estatísticas de contagem de um usuário ou canal.'
  params:
    - desc: 'O usuário cujas estatísticas serão exibidas. Padrão: você.'
      name: user
      optional: true
      type: user
    - desc: 'O canal onde verificar as estatísticas. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
countingstatus:
  args:
    - channel
  desc: 'Mostra o status atual da contagem em um canal.'
  params:
    - desc: 'O canal a verificar. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
countingsuccessmessage:
  args:
    - channel embed
  desc: 'Define uma mensagem personalizada para contagens corretas.'
  params:
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'O modelo da mensagem. Use "-" para voltar ao padrão.'
      name: embed
      optional: true
      type: string
countingtimeout:
  args:
    - user duration channel reason
  desc: 'Aplica temporariamente um timeout a um usuário na contagem.'
  params:
    - desc: 'O usuário a receber o timeout na contagem.'
      name: user
      optional: false
      type: guild user
    - desc: 'Duração do timeout (ex.: 30m, 2h).'
      name: duration
      optional: false
      type: stoopid time
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'O motivo do timeout.'
      name: reason
      optional: true
      type: string
countingunban:
  args:
    - user channel reason
  desc: 'Remove o banimento de um usuário da contagem em um canal específico.'
  params:
    - desc: 'O usuário a desbanir da contagem.'
      name: user
      optional: false
      type: guild user
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'O motivo do desbanimento.'
      name: reason
      optional: true
      type: string
countmodbanned:
  args:
    - channel roles...
  desc: 'Define os cargos banidos da contagem.'
  params:
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Cargos banidos da contagem.'
      name: roles
      optional: true
      type: role
countmodclear:
  args:
    - user channel
  desc: 'Limpa as contagens erradas de um usuário em um canal de contagem.'
  params:
    - desc: 'O usuário cujas contagens erradas serão limpas.'
      name: user
      optional: false
      type: user
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
countmodclearall:
  args:
    - channel
  desc: 'Limpa as contagens erradas de todos os usuários em um canal de contagem.'
  params:
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
countmoddefaults:
  args:
    - enabled threshold windowHours punishment durationMinutes punishmentRole
  desc: 'Define as configurações padrão de moderação do servidor.'
  params:
    - desc: 'Se a moderação está ativada por padrão.'
      name: enabled
      optional: false
      type: bool
    - desc: 'Limite padrão de contagens erradas antes da punição.'
      name: threshold
      optional: true
      type: int
    - desc: 'Janela de tempo padrão, em horas, para contar contagens erradas.'
      name: windowHours
      optional: true
      type: int
    - desc: 'Ação de punição padrão a aplicar.'
      name: punishment
      optional: true
      type: punishment action
    - desc: 'Duração padrão das punições temporizadas, em minutos.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Cargo padrão para o tipo de punição AddRole.'
      name: punishmentRole
      optional: true
      type: role
countmodedits:
  args:
    - punish delete channel
  desc: 'Configura a proteção contra edição de mensagens em um canal de contagem.'
  params:
    - desc: 'Se as edições de mensagens devem ser punidas como infrações.'
      name: punish
      optional: false
      type: bool
    - desc: 'Se as mensagens editadas devem ser excluídas.'
      name: delete
      optional: true
      type: bool
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
countmodenable:
  args:
    - enabled channel
  desc: 'Ativa ou desativa a moderação de um canal de contagem específico.'
  params:
    - desc: 'Se a moderação deve ser ativada ou desativada.'
      name: enabled
      optional: false
      type: bool
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
countmodignore:
  args:
    - deleteMessages channel roles...
  desc: 'Define os cargos a ignorar na contagem.'
  params:
    - desc: 'Se as mensagens dos cargos ignorados devem ser excluídas.'
      name: deleteMessages
      optional: false
      type: bool
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Cargos a ignorar na contagem.'
      name: roles
      optional: true
      type: role
countmodnonnumbers:
  args:
    - punish delete channel
  desc: 'Configura o tratamento de mensagens que não são números em um canal de contagem.'
  params:
    - desc: 'Se as mensagens que não são números devem ser punidas como infrações.'
      name: punish
      optional: false
      type: bool
    - desc: 'Se as mensagens que não são números devem ser excluídas.'
      name: delete
      optional: true
      type: bool
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
countmodpunish:
  args:
    - count punishment durationMinutes role channel
  desc: 'Define uma punição em níveis para um número de contagem errada específico.'
  params:
    - desc: 'O número de contagem errada que aciona esta punição.'
      name: count
      optional: false
      type: int
    - desc: 'A ação de punição a aplicar.'
      name: punishment
      optional: false
      type: punishment action
    - desc: 'Duração das punições temporizadas, em minutos.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Cargo para o tipo de punição AddRole.'
      name: role
      optional: true
      type: role
    - desc: 'O canal de contagem (NULL para os padrões do servidor).'
      name: channel
      optional: true
      type: text channel
countmodpunishlist:
  args:
    - channel
  desc: 'Lista todas as punições em níveis do servidor ou de um canal específico.'
  params:
    - desc: 'O canal de contagem (NULL para os padrões do servidor).'
      name: channel
      optional: true
      type: text channel
countmodpunishment:
  args:
    - punishment durationMinutes role channel
  desc: 'Define a punição para contagens erradas.'
  params:
    - desc: 'A ação de punição a aplicar.'
      name: punishment
      optional: false
      type: punishment action
    - desc: 'Duração das punições temporizadas, em minutos.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Cargo para o tipo de punição AddRole.'
      name: role
      optional: true
      type: role
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
countmodrequired:
  args:
    - channel roles...
  desc: 'Define os cargos necessários para contar.'
  params:
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Cargos necessários para contar.'
      name: roles
      optional: true
      type: role
countmodreset:
  args:
    - channel
  desc: 'Redefine um canal para usar os padrões do servidor.'
  params:
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
countmodshow:
  args:
    - channel
  desc: 'Mostra a configuração atual de moderação do canal de contagem ou os padrões do servidor.'
  params:
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
countmodthreshold:
  args:
    - threshold channel
  desc: 'Define o limite de contagens erradas de um canal de contagem.'
  params:
    - desc: 'Número de contagens erradas antes da punição (1-100).'
      name: threshold
      optional: false
      type: int
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel
countmodunpunish:
  args:
    - count channel
  desc: 'Remove uma punição em níveis para um número de contagem errada específico.'
  params:
    - desc: 'O número de contagem errada cuja punição será removida.'
      name: count
      optional: false
      type: int
    - desc: 'O canal de contagem (NULL para os padrões do servidor).'
      name: channel
      optional: true
      type: text channel
countmodwindow:
  args:
    - hours channel
  desc: 'Define a janela de tempo para contar contagens erradas.'
  params:
    - desc: 'Janela de tempo em horas (1-168).'
      name: hours
      optional: false
      type: int
    - desc: 'O canal de contagem. Padrão: o canal atual.'
      name: channel
      optional: true
      type: text channel