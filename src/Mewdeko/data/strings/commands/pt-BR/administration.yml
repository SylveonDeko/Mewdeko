antimassmention:
  args:
    - ''
  desc: 'Configura a proteção Anti-Mass-Mention do servidor, definindo o limite de menções em uma única mensagem, a janela de tempo para contar menções, o máximo de menções permitido nessa janela e a ação de punição com um cargo.'
  params: [ ]
antimassmention_int_int_int_bool_PunishmentAction_=:
  args:
    - '<mentionThreshold> <timeWindowSeconds> <maxMentionsInTimeWindow> <ignoreBots> <action> [punishTime]'
    - number number number true|false action
  desc: 'Configura a proteção Anti-Mass-Mention do servidor, definindo o limite de menções em uma única mensagem, a janela de tempo para contar menções, o máximo de menções permitido nessa janela e a ação de punição com um cargo.'
  params:
    - desc: 'O número de menções permitido em uma única mensagem antes de acionar a proteção.'
      name: mentionThreshold
      optional: false
      type: int
    - desc: 'A janela de tempo (em segundos) para observar menções.'
      name: timeWindowSeconds
      optional: false
      type: int
    - desc: 'O número máximo de menções permitido na janela de tempo especificada.'
      name: maxMentionsInTimeWindow
      optional: false
      type: int
    - desc: 'Se deve ignorar contas de bots ao contar menções.'
      name: ignoreBots
      optional: false
      type: bool
    - desc: 'A ação de punição a ser aplicada contra usuários que ultrapassarem os limites de menções.'
      name: action
      optional: false
      type: punishment
    - desc: 'Configura a proteção Anti-Mass-Mention do servidor, definindo o limite de menções em uma única mensagem, a janela de tempo para contar menções, o máximo de menções permitido nessa janela e a ação de punição com um cargo.'
      name: punishTime
      optional: true
      type: duration
