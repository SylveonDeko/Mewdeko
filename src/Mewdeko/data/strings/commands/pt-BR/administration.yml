      type: ITextChannel
antiimagehash:
  args:
    - ''
    - 'Ban'
    - 'Delete 31'
    - 'Timeout 31 1d'
  desc: 'Ativa a proteção Anti-Image-Hash, que age contra quem repostar uma imagem da lista de imagens bloqueadas, incluindo cópias redimensionadas, espelhadas, reenviadas com qualidade menor ou com borda. Execute sem argumentos para desativá-la. A tolerância opcional (de 0 a 64, padrão 31) define o quanto uma imagem postada pode ser diferente e ainda contar como bloqueada.'
  params: [ ]
antiimagehashignore:
  args:
    - '<role>'
    - '<channel>'
  desc: 'Ativa ou desativa um cargo ou canal como isento da proteção Anti-Image-Hash.'
  params: [ ]
antiexternalapp:
  args:
    - ''
    - 'Timeout'
    - 'Timeout 5 5 1h'
    - 'Kick 3 0'
  desc: 'Ativa a proteção Anti-External-App, que monitora mensagens enviadas por membros por meio de aplicativos adicionados às próprias contas. A mensagem é removida e o membro que usou o aplicativo é punido quando menciona pessoas ou cargos demais (padrão 5; 0 desativa), menciona @everyone, contém um link de convite, ou quando usa aplicativos mais vezes do que o permitido em 10 segundos (padrão 5; 0 desativa). Aplicativos adicionados ao próprio servidor não são verificados. Execute sem argumentos para desativá-la.'
  params: [ ]
blockimage:
  args:
    - ''
    - 'mrbeast crypto scam'
    - 'Delete nsfw meme'
    - 'https://example.com/scam.png mrbeast crypto scam'
  desc: 'Bloqueia uma imagem para que quem a repostar seja punido, incluindo cópias redimensionadas, recomprimidas, espelhadas e com borda. Anexe a imagem, responda a uma mensagem que a contenha ou informe seu URL. Uma ação informada antes do rótulo substitui o padrão do servidor apenas para esta imagem.'
  params: [ ]
unblockimage:
  args:
    - '<id>'
  desc: 'Remove uma imagem da lista de imagens bloqueadas pelo seu ID, como mostrado por blockedimages.'
  params: [ ]
blockedimages:
  args:
    - ''
  desc: 'Lista as imagens bloqueadas e quantas vezes cada uma foi detectada.'
  params: [ ]
imagehash:
  args:
    - ''
    - 'https://example.com/scam.png'
  desc: 'Mostra o hash perceptual de uma imagem sem bloqueá-la.'
  params: [ ]
antiimagehashpreset:
  args:
    - ''
  desc: 'Ativa ou desativa a lista de imagens de golpes conhecidas que vem com o Mewdeko: as imagens falsas de cassino de cripto e de sorteios que estão sendo espalhadas pelo Discord. Elas são bloqueadas junto com a sua própria lista. Ativada por padrão quando o Anti-Image-Hash está ligado.'
  params: [ ]
