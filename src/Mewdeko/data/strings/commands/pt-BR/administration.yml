adsarm:
  args:
    - ''
  desc: 'Ativa ou desativa a exclusão automática de mensagens de publicidade de servidores.'
  params: [ ]
antialt:
  args:
    - ''
  desc: 'Configura a proteção Anti-Alt do servidor, definindo a idade mínima da conta e a ação de punição com um cargo.'
  params: [ ]
antipattern:
  args:
    - ''
  desc: 'Configura a proteção Anti-Pattern do servidor, definindo a ação de punição com um cargo.'
  params: [ ]
antipattern_PunishmentAction_=:
  args:
    - '<action> [punishTime]'
    - action
  desc: 'Configura a proteção Anti-Pattern do servidor, definindo a ação de punição com um cargo.'
  params:
    - desc: 'A ação de punição a ser aplicada contra padrões detectados.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'A duração da punição, se aplicável.'
      name: punishTime
      optional: true
      type: StoopidTime
antipattern_PunishmentAction_IRole:
  args:
    - action @role
  desc: 'Configura a proteção Anti-Pattern do servidor, definindo a ação de punição com um cargo.'
  params:
    - desc: 'A ação de punição a ser aplicada contra padrões detectados.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'O cargo a ser atribuído aos usuários que correspondam aos padrões.'
      name: role
      optional: false
      type: IRole
patternadd:
  args:
    - '<pattern> [name] [checkUsername] [checkDisplayName]'
    - pattern
  desc: 'Adiciona um padrão regex à proteção Anti-Pattern.'
  params:
    - desc: 'O padrão regex a comparar com nomes de usuário e nomes de exibição.'
      name: pattern
      optional: false
      type: string
    - desc: 'Nome opcional para o padrão.'
      name: name
      optional: true
      type: string
    - desc: 'Se os nomes de usuário devem ser verificados com este padrão (padrão: true).'
      name: checkUsername
      optional: true
      type: bool
    - desc: 'Se os nomes de exibição devem ser verificados com este padrão (padrão: true).'
      name: checkDisplayName
      optional: true
      type: bool
patternremove:
  args:
    - number
  desc: 'Remove um padrão da proteção Anti-Pattern.'
  params:
    - desc: 'O ID do padrão a remover.'
      name: patternId
      optional: false
      type: int
patternlist:
  args:
    - ''
  desc: 'Lista todos os padrões configurados para a proteção Anti-Pattern.'
  params: [ ]
patternconfig:
  args:
    - ''
  desc: 'Mostra a configuração atual do anti-pattern.'
  params: [ ]
patternconfig_string_string:
  args:
    - setting value
  desc: 'Mostra a configuração atual do anti-pattern.'
  params:
    - desc: 'A configuração a ser definida.'
      name: setting
      optional: false
      type: string
    - desc: 'O valor a definir.'
      name: value
      optional: false
      type: string
