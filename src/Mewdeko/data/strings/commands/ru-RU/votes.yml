votes:
  args:
    - '[@user]'
  desc: >-
    Показывает общее количество голосов, отданных конкретным пользователем
    или вызывающим команду.
  params:
    - desc: 'Пользователь, чьи голоса нужно посчитать. Если null, считает голоса вызывающего команду.'
      name: user
      optional: true
      type: user
votesleaderboard:
