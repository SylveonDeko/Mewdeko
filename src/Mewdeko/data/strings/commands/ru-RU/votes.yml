votechannel:
  args:
    - channel
  desc: >-
    Устанавливает указанный текстовый канал как канал голосования, куда будут
    отправляться все подтверждения голосов.
  params:
    - &ref_646
      desc: 'Текстовый канал для установки в качестве канала голосования.'
      name: channel
      optional: false
      type: ITextChannel
