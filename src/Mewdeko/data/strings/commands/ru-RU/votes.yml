votemessage:
  args:
    - '[message]'
  desc: >-
    Задаёт пользовательское сообщение для отправки при голосовании или
    предпросмотра текущего сообщения голосования.
  params:
    - desc: 'Пользовательское сообщение для голосований. Используйте "-" для сброса к стандартному. Если null, показывает текущее сообщение голосования.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: >-
    Запускает процесс подтверждения для установки нового пароля голосования,
    предупреждая пользователя о его безопасности.
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: >-
    Добавляет роль, которая будет выдаваться пользователям при голосовании,
    с необязательной длительностью для автоматического удаления роли.
  params:
    - desc: 'Роль для добавления в качестве награды за голосование.'
      name: role
      optional: false
      type: role
    - desc: 'Длительность, на которую будет выдана роль. Null для бессрочной.'
      name: time
      optional: true
      type: duration
