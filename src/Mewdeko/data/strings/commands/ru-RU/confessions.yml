confessblacklist:
  args:
    - user
  desc: 'Добавляет пользователя в чёрный список признаний.'
  params:
    - desc: 'Пользователь, которого нужно занести в чёрный список признаний.'
      name: user
      optional: false
      type: IUser
confesschannel:
  args:
    - channel
  desc: 'Устанавливает канал признаний.'
  params:
    - desc: 'Канал, который нужно установить для признаний.'
      name: channel
      optional: true
      type: ITextChannel
