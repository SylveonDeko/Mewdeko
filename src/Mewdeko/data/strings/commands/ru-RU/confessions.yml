confessionchannel:
  args:
    - '[@channel]'
  desc: 'Устанавливает канал признаний для анонимных признаний.'
  params:
    - desc: 'Канал признаний (необязательно).'
      name: channel
      optional: true
      type: channel
confessionlogchannel:
  args:
    - '[@channel]'
  desc: >-
    Устанавливает канал журнала признаний для записи признаний. Неправильное
    использование этой функции приведёт к тому, что я окажусь в 2 м от твоего дома.
  params:
    - desc: 'Канал журнала признаний (необязательно).'
      name: channel
      optional: true
      type: channel
confessionunblacklist:
  args:
    - '@user'
  desc: 'Удаляет пользователя из чёрного списка признаний.'
  params:
    - desc: 'Пользователь, которого нужно удалить из чёрного списка.'
      name: user
      optional: false
      type: IUser
confesslogchannel:
  args:
    - channel
  desc: 'Устанавливает канал журнала признаний.'
  params:
    - desc: 'Канал, в который записываются признания.'
      name: channel
      optional: true
      type: ITextChannel
confessunblacklist:
  args:
    - user
  desc: 'Удаляет пользователя из чёрного списка признаний.'
  params:
    - desc: 'Пользователь, которого нужно убрать из чёрного списка признаний.'
      name: user
      optional: false
      type: IUser
