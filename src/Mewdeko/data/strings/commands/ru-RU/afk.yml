customafkmessage:
  args:
    - text
  desc: >-
    Устанавливает пользовательский AFK-эмбед, который будет отображаться, когда
    пользователь находится в AFK. Используйте "-" для сброса к стандартному
    эмбеду. Посетите https://eb.mewdeko.tech для конструктора эмбедов и
    http://mewdeko.tech/placeholders для плейсхолдеров.
  params:
    - &ref_175
      desc: 'Устанавливаемое пользовательское сообщение. Используйте "-" для сброса к стандартному.'
      name: embedCode
      optional: false
      type: string
