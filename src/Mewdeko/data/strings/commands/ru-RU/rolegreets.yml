    - '@role'
  desc: 'Добавляет новое приветственное сообщение для указанной роли. Если канал не указан, используется текущий канал.'
  params:
    - desc: 'Роль, для которой устанавливается приветственное сообщение.'
      name: role
      optional: false
      type: role
    - desc: 'Текстовый канал, в который будет отправлено приветственное сообщение. Необязательно.'
