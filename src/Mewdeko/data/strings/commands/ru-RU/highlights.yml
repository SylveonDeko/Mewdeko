highlight:
  args:
    - '<action> [words]'
    - add|list|delete
    - add
    - list
    - delete
  desc: 'Добавляет, перечисляет, удаляет или сопоставляет хайлайты.'
  params:
    - desc: '<see cref="HighlightActions" />'
      name: action
      optional: false
      type: highlightactions
    - desc: 'Параметры для выбранного действия'
      name: words
      optional: true
      type: string
