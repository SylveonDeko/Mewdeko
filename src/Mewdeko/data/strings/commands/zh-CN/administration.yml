adsarm:
  args:
    - ''
  desc: '切换自动删除服务器广告消息的功能。'
  params: [ ]
antialt:
  args:
    - ''
  desc: '配置服务器的反小号保护，设置最低账号年龄，并通过身份组设置处罚操作。'
  params: [ ]
antipattern:
  args:
    - ''
  desc: '配置服务器的反模式保护，并通过身份组设置处罚操作。'
  params: [ ]
antipattern_PunishmentAction_=:
  args:
    - '<action> [punishTime]'
    - action
  desc: '配置服务器的反模式保护，并通过身份组设置处罚操作。'
  params:
    - desc: '对检测到的模式匹配执行的处罚操作。'
      name: action
      optional: false
      type: PunishmentAction
    - desc: '处罚时长（如适用）。'
      name: punishTime
      optional: true
      type: StoopidTime
antipattern_PunishmentAction_IRole:
  args:
    - action @role
  desc: '配置服务器的反模式保护，并通过身份组设置处罚操作。'
  params:
    - desc: '对检测到的模式匹配执行的处罚操作。'
      name: action
      optional: false
      type: PunishmentAction
    - desc: '分配给匹配模式用户的身份组。'
      name: role
      optional: false
      type: IRole
patternadd:
  args:
    - '<pattern> [name] [checkUsername] [checkDisplayName]'
    - pattern
  desc: '向反模式保护中添加一个正则表达式模式。'
  params:
    - desc: '用于匹配用户名或显示名称的正则表达式模式。'
      name: pattern
      optional: false
      type: string
    - desc: '模式的可选名称。'
      name: name
      optional: true
      type: string
    - desc: '是否检查用户名是否匹配该模式（默认为 true）。'
      name: checkUsername
      optional: true
      type: bool
    - desc: '是否检查显示名称是否匹配该模式（默认为 true）。'
      name: checkDisplayName
      optional: true
      type: bool
patternremove:
  args:
    - number
  desc: '从反模式保护中移除一个模式。'
  params:
    - desc: '要移除的模式 ID。'
      name: patternId
      optional: false
      type: int
patternlist:
  args:
    - ''
  desc: '列出反模式保护中配置的所有模式。'
  params: [ ]
patternconfig:
  args:
    - ''
  desc: '显示当前的反模式配置。'
  params: [ ]
patternconfig_string_string:
  args:
    - setting value
  desc: '显示当前的反模式配置。'
  params:
    - desc: '要配置的设置项。'
      name: setting
      optional: false
      type: string
    - desc: '要设置的值。'
      name: value
      optional: false
      type: string
