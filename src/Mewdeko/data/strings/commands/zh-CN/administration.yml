      name: maxMentionsInTimeWindow
      optional: false
      type: int
    - desc: '统计提及时是否忽略机器人账号。'
      name: ignoreBots
      optional: false
      type: bool
    - desc: '对超出提及限制的用户执行的处罚操作。'
