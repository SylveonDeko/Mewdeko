countingban:
  args:
    - user channel duration reason
  desc: '禁止用户在指定频道中参与计数。'
  params:
    - desc: '要禁止参与计数的用户。'
      name: user
      optional: false
      type: guild user
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '禁令时长（例如 1h、1d）。留空则为永久禁令。'
      name: duration
      optional: true
      type: stoopid time
    - desc: '禁令原因。'
      name: reason
      optional: true
      type: string
countingconfig:
  args:
    - channel
  desc: '配置计数频道的设置。'
  params:
    - desc: '要查看配置的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countingcooldown:
  args:
    - channel seconds
  desc: '设置用户两次计数之间的冷却时间。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '冷却时间（秒，0 至 300）。'
      name: seconds
      optional: true
      type: int
countingdisable:
  args:
    - channel purgeData reason
  desc: '在某频道中禁用计数，并可选择清除所有数据。'
  params:
    - desc: '要禁用计数的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '是否删除该频道的所有计数数据。默认为 false。'
      name: purgeData
      optional: true
      type: bool
    - desc: '禁用计数的原因。'
      name: reason
      optional: true
      type: string
countingfailurechannel:
  args:
    - countingChannel failureChannel
  desc: '设置记录计数失败的频道。'
  params:
    - desc: '计数频道。'
      name: countingChannel
      optional: true
      type: text channel
    - desc: '用于记录失败的频道。使用 null 可禁用。'
      name: failureChannel
      optional: true
      type: text channel
countingfailuremessage:
  args:
    - channel embed
  desc: '设置计数失败时的自定义消息。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '消息模板。使用 "-" 可恢复默认。'
      name: embed
      optional: true
      type: string
countingfailurethreshold:
  args:
    - channel threshold
  desc: '设置触发后果前的失败次数阈值。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '触发处理前的失败次数（1 至 10）。'
      name: threshold
      optional: true
      type: int
countingleaderboard:
  args:
    - type channel
  desc: '显示计数频道的排行榜。'
  params:
    - desc: '排行榜类型（contributions、streak、accuracy、totalnumbers）。'
      name: type
      optional: true
      type: string
    - desc: '要显示排行榜的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countinglist:
  args:
    - ''
  desc: '列出服务器中所有活跃的计数频道。'
  params: [ ]
countingmilestonechannel:
  args:
    - countingChannel milestoneChannel
  desc: '设置公布里程碑成就的频道。'
  params:
    - desc: '计数频道。'
      name: countingChannel
      optional: true
      type: text channel
    - desc: '里程碑公告频道。使用 null 可禁用。'
      name: milestoneChannel
      optional: true
      type: text channel
countingmilestonemessage:
  args:
    - channel embed
  desc: '设置里程碑成就的自定义消息。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '消息模板。使用 "-" 可恢复默认。'
      name: embed
      optional: true
      type: string
countingmilestones:
  args:
    - channel milestones
  desc: '设置自定义里程碑数字。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '逗号分隔的里程碑数字（例如 50,100,250,500,1000）。'
      name: milestones
      optional: true
      type: string
countingreset:
  args:
    - channel newNumber reason
  desc: '将某频道的计数重置为指定数字。'
  params:
    - desc: '要重置的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '要重置到的数字。默认为 0。'
      name: newNumber
      optional: true
      type: long
    - desc: '重置的原因。'
      name: reason
      optional: true
      type: string
countingrestore:
  args:
    - saveId channel
  desc: '从之前的存档点恢复计数。'
  params:
    - desc: '要恢复到的存档点 ID。'
      name: saveId
      optional: false
      type: int
    - desc: '要恢复的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countingsave:
  args:
    - channel reason
  desc: '为当前计数进度创建存档点。'
  params:
    - desc: '要存档的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '创建存档点的原因。'
      name: reason
      optional: true
      type: string
countingsetup:
  args:
    - channel startNumber increment
  desc: '在当前频道或指定频道中设置计数。'
  params:
    - desc: '要设置计数的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '计数的起始数字。默认为 1。'
      name: startNumber
      optional: true
      type: long
    - desc: '每次计数的增量。默认为 1。'
      name: increment
      optional: true
      type: int
countingstats:
  args:
    - user channel
  desc: '显示某用户或频道的计数统计。'
  params:
    - desc: '要查看统计的用户。默认为你自己。'
      name: user
      optional: true
      type: user
    - desc: '要查看统计的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countingstatus:
  args:
    - channel
  desc: '显示某频道计数的当前状态。'
  params:
    - desc: '要查看的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countingsuccessmessage:
  args:
    - channel embed
  desc: '设置计数成功时的自定义消息。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '消息模板。使用 "-" 可恢复默认。'
      name: embed
      optional: true
      type: string
countingtimeout:
  args:
    - user duration channel reason
  desc: '暂时禁止用户参与计数（禁言）。'
  params:
    - desc: '要禁言的用户。'
      name: user
      optional: false
      type: guild user
    - desc: '禁言时长（例如 30m、2h）。'
      name: duration
      optional: false
      type: stoopid time
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '禁言原因。'
      name: reason
      optional: true
      type: string
countingunban:
  args:
    - user channel reason
  desc: '解除用户在指定频道的计数禁令。'
  params:
    - desc: '要解除计数禁令的用户。'
      name: user
      optional: false
      type: guild user
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '解除禁令的原因。'
      name: reason
      optional: true
      type: string
countmodbanned:
  args:
    - channel roles...
  desc: '设置禁止参与计数的身份组。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '禁止参与计数的身份组。'
      name: roles
      optional: true
      type: role
countmodclear:
  args:
    - user channel
  desc: '清除某计数频道中用户的错误计数。'
  params:
    - desc: '要清除错误计数的用户。'
      name: user
      optional: false
      type: user
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodclearall:
  args:
    - channel
  desc: '清除某计数频道中所有用户的错误计数。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmoddefaults:
  args:
    - enabled threshold windowHours punishment durationMinutes punishmentRole
  desc: '设置服务器范围的默认审核设置。'
  params:
    - desc: '是否默认启用审核。'
      name: enabled
      optional: false
      type: bool
    - desc: '处罚前的默认错误计数阈值。'
      name: threshold
      optional: true
      type: int
    - desc: '追踪错误计数的默认时间窗口（小时）。'
      name: windowHours
      optional: true
      type: int
    - desc: '要应用的默认处罚操作。'
      name: punishment
      optional: true
      type: punishment action
    - desc: '限时处罚的默认时长（分钟）。'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'AddRole 处罚类型的默认身份组。'
      name: punishmentRole
      optional: true
      type: role
countmodedits:
  args:
    - punish delete channel
  desc: '为计数频道配置消息编辑保护。'
  params:
    - desc: '是否将编辑消息视为违规并处罚。'
      name: punish
      optional: false
      type: bool
    - desc: '是否删除被编辑的消息。'
      name: delete
      optional: true
      type: bool
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodenable:
  args:
    - enabled channel
  desc: '为特定计数频道启用或禁用审核。'
  params:
    - desc: '是否启用或禁用审核。'
      name: enabled
      optional: false
      type: bool
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodignore:
  args:
    - deleteMessages channel roles...
  desc: '设置计数时忽略的身份组。'
  params:
    - desc: '是否删除被忽略身份组的消息。'
      name: deleteMessages
      optional: false
      type: bool
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '计数时忽略的身份组。'
      name: roles
      optional: true
      type: role
countmodnonnumbers:
  args:
    - punish delete channel
  desc: '为计数频道配置非数字消息的处理方式。'
  params:
    - desc: '是否将非数字消息视为违规并处罚。'
      name: punish
      optional: false
      type: bool
    - desc: '是否删除非数字消息。'
      name: delete
      optional: true
      type: bool
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodpunish:
  args:
    - count punishment durationMinutes role channel
  desc: '为特定错误计数数字设置分级处罚。'
  params:
    - desc: '触发此处罚的错误计数数字。'
      name: count
      optional: false
      type: int
    - desc: '要应用的处罚操作。'
      name: punishment
      optional: false
      type: punishment action
    - desc: '限时处罚的时长（分钟）。'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'AddRole 处罚类型的身份组。'
      name: role
      optional: true
      type: role
    - desc: '计数频道（NULL 表示使用服务器默认设置）。'
      name: channel
      optional: true
      type: text channel
countmodpunishlist:
  args:
    - channel
  desc: '列出服务器或指定频道的所有分级处罚。'
  params:
    - desc: '计数频道（NULL 表示使用服务器默认设置）。'
      name: channel
      optional: true
      type: text channel
countmodpunishment:
  args:
    - punishment durationMinutes role channel
  desc: '设置错误计数的处罚。'
  params:
    - desc: '要应用的处罚操作。'
      name: punishment
      optional: false
      type: punishment action
    - desc: '限时处罚的时长（分钟）。'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'AddRole 处罚类型的身份组。'
      name: role
      optional: true
      type: role
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodrequired:
  args:
    - channel roles...
  desc: '设置参与计数所需的身份组。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '参与计数所需的身份组。'
      name: roles
      optional: true
      type: role
countmodreset:
  args:
    - channel
  desc: '将某频道重置为使用服务器默认设置。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodshow:
  args:
    - channel
  desc: '显示计数频道或服务器默认设置的当前审核配置。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodthreshold:
  args:
    - threshold channel
  desc: '设置计数频道的错误计数阈值。'
  params:
    - desc: '触发处罚前的错误计数次数（1 至 100）。'
      name: threshold
      optional: false
      type: int
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodunpunish:
  args:
    - count channel
  desc: '移除特定错误计数数字的分级处罚。'
  params:
    - desc: '要移除处罚的错误计数数字。'
      name: count
      optional: false
      type: int
    - desc: '计数频道（NULL 表示使用服务器默认设置）。'
      name: channel
      optional: true
      type: text channel
countmodwindow:
  args:
    - hours channel
  desc: '设置追踪错误计数的时间窗口。'
  params:
    - desc: '时间窗口（小时，1 至 168）。'
      name: hours
      optional: false
      type: int
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel