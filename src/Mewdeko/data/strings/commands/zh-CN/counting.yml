countingban:
  args:
    - user channel duration reason
  desc: '禁止用户在特定频道中计数。'
  params:
    - desc: '要禁止计数的用户。'
      name: user
      optional: false
      type: guild user
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '禁止时长（例如：1h、1d）。留空为永久。'
      name: duration
      optional: true
      type: stoopid time
    - desc: '禁止的原因。'
      name: reason
      optional: true
      type: string
countingconfig:
  args:
    - channel
  desc: '配置计数频道的设置。'
  params:
    - desc: '显示配置的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countingcooldown:
  args:
    - channel seconds
  desc: '设置用户计数之间的冷却时间。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '冷却时间（秒，0-300）。'
      name: seconds
      optional: true
      type: int
countingdisable:
  args:
    - channel purgeData reason
  desc: '禁用频道中的计数，并可选择清除所有数据。'
  params:
    - desc: '要禁用计数的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '是否删除此频道的所有计数数据。默认为 false。'
      name: purgeData
      optional: true
      type: bool
    - desc: '禁用计数的原因。'
      name: reason
      optional: true
      type: string
countingfailurechannel:
  args:
    - countingChannel failureChannel
  desc: '设置记录计数失败的频道。'
  params:
    - desc: '计数频道。'
      name: countingChannel
      optional: true
      type: text channel
    - desc: '失败日志频道。使用 null 禁用。'
      name: failureChannel
      optional: true
      type: text channel
countingfailuremessage:
  args:
    - channel embed
  desc: '设置计数失败的自定义消息。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '消息模板。使用 "-" 重置为默认值。'
      name: embed
      optional: true
      type: string
countingfailurethreshold:
  args:
    - channel threshold
  desc: '设置触发后果前的失败阈值。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '触发操作前的失败次数（1-10）。'
      name: threshold
      optional: true
      type: int
countingleaderboard:
  args:
    - type channel
  desc: '显示计数频道的排行榜。'
  params:
    - desc: '排行榜类型（contributions、streak、accuracy、totalnumbers）。'
      name: type
      optional: true
      type: string
    - desc: '显示排行榜的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countinglist:
  args:
    - ''
  desc: '列出服务器中所有活跃的计数频道。'
  params: [ ]
countingmilestonechannel:
  args:
    - countingChannel milestoneChannel
  desc: '设置发布里程碑成就的频道。'
  params:
    - desc: '计数频道。'
      name: countingChannel
      optional: true
      type: text channel
    - desc: '里程碑公告频道。使用 null 禁用。'
      name: milestoneChannel
      optional: true
      type: text channel
countingmilestonemessage:
  args:
    - channel embed
  desc: '设置里程碑成就的自定义消息。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '消息模板。使用 "-" 重置为默认值。'
      name: embed
      optional: true
      type: string
countingmilestones:
  args:
    - channel milestones
  desc: '设置自定义里程碑数字。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '逗号分隔的里程碑数字（例如：50,100,250,500,1000）。'
      name: milestones
      optional: true
      type: string
countingreset:
  args:
    - channel newNumber reason
  desc: '将频道的计数重置为特定数字。'
  params:
    - desc: '要重置的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '要重置到的数字。默认为 0。'
      name: newNumber
      optional: true
      type: long
    - desc: '重置的原因。'
      name: reason
      optional: true
      type: string
countingrestore:
  args:
    - saveId channel
  desc: '从之前的存档点恢复计数。'
  params:
    - desc: '要恢复的存档点 ID。'
      name: saveId
      optional: false
      type: int
    - desc: '要恢复的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countingsave:
  args:
    - channel reason
  desc: '为当前计数进度创建存档点。'
  params:
    - desc: '要保存的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '创建存档点的原因。'
      name: reason
      optional: true
      type: string
countingsetup:
  args:
    - channel startNumber increment
  desc: '在当前或指定频道中设置计数。'
  params:
    - desc: '设置计数的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '开始计数的数字。默认为 1。'
      name: startNumber
      optional: true
      type: long
    - desc: '每次计数的增量。默认为 1。'
      name: increment
      optional: true
      type: int
countingstats:
  args:
    - user channel
  desc: '显示用户或频道的计数统计。'
  params:
    - desc: '要显示统计的用户。默认为你自己。'
      name: user
      optional: true
      type: user
    - desc: '查看统计的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countingstatus:
  args:
    - channel
  desc: '显示频道的当前计数状态。'
  params:
    - desc: '要检查的频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countingsuccessmessage:
  args:
    - channel embed
  desc: '设置计数成功的自定义消息。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '消息模板。使用 "-" 重置为默认值。'
      name: embed
      optional: true
      type: string
countingtimeout:
  args:
    - user duration channel reason
  desc: '临时禁止用户参与计数。'
  params:
    - desc: '要从计数中禁止的用户。'
      name: user
      optional: false
      type: guild user
    - desc: '禁止时长（例如：30m、2h）。'
      name: duration
      optional: false
      type: stoopid time
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '禁止的原因。'
      name: reason
      optional: true
      type: string
countingunban:
  args:
    - user channel reason
  desc: '解除特定频道中用户的计数禁止。'
  params:
    - desc: '要解除计数禁止的用户。'
      name: user
      optional: false
      type: guild user
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '解除禁止的原因。'
      name: reason
      optional: true
      type: string
countmodbanned:
  args:
    - channel roles...
  desc: '设置禁止计数的身份组。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '禁止计数的身份组。'
      name: roles
      optional: true
      type: role
countmodclear:
  args:
    - user channel
  desc: '清除计数频道中用户的错误计数。'
  params:
    - desc: '要清除错误计数的用户。'
      name: user
      optional: false
      type: user
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodclearall:
  args:
    - channel
  desc: '清除计数频道中所有用户的错误计数。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmoddefaults:
  args:
    - enabled threshold windowHours punishment durationMinutes punishmentRole
  desc: '设置全服务器默认审核设置。'
  params:
    - desc: '审核是否默认启用。'
      name: enabled
      optional: false
      type: bool
    - desc: '惩罚前的默认错误计数阈值。'
      name: threshold
      optional: true
      type: int
    - desc: '追踪错误计数的默认时间窗口（小时）。'
      name: windowHours
      optional: true
      type: int
    - desc: '要应用的默认惩罚操作。'
      name: punishment
      optional: true
      type: punishment action
    - desc: '计时惩罚的默认时长（分钟）。'
      name: durationMinutes
      optional: true
      type: int
    - desc: '添加身份组惩罚类型的默认身份组。'
      name: punishmentRole
      optional: true
      type: role
countmodedits:
  args:
    - punish delete channel
  desc: '为计数频道配置消息编辑保护。'
  params:
    - desc: '是否将消息编辑视为违规进行惩罚。'
      name: punish
      optional: false
      type: bool
    - desc: '是否删除编辑后的消息。'
      name: delete
      optional: true
      type: bool
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodenable:
  args:
    - enabled channel
  desc: '为特定计数频道启用或禁用审核。'
  params:
    - desc: '是否启用或禁用审核。'
      name: enabled
      optional: false
      type: bool
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodignore:
  args:
    - deleteMessages channel roles...
  desc: '设置从计数中忽略的身份组。'
  params:
    - desc: '是否删除被忽略身份组的消息。'
      name: deleteMessages
      optional: false
      type: bool
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '从计数中忽略的身份组。'
      name: roles
      optional: true
      type: role
countmodnonnumbers:
  args:
    - punish delete channel
  desc: '配置计数频道中非数字消息的处理方式。'
  params:
    - desc: '是否将非数字消息视为违规进行惩罚。'
      name: punish
      optional: false
      type: bool
    - desc: '是否删除非数字消息。'
      name: delete
      optional: true
      type: bool
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodpunish:
  args:
    - count punishment durationMinutes role channel
  desc: '为特定错误计数数量设置阶梯式惩罚。'
  params:
    - desc: '触发此惩罚的错误计数数量。'
      name: count
      optional: false
      type: int
    - desc: '要应用的惩罚操作。'
      name: punishment
      optional: false
      type: punishment action
    - desc: '计时惩罚的时长（分钟）。'
      name: durationMinutes
      optional: true
      type: int
    - desc: '添加身份组惩罚类型的身份组。'
      name: role
      optional: true
      type: role
    - desc: '计数频道（服务器默认值使用 NULL）。'
      name: channel
      optional: true
      type: text channel
countmodpunishlist:
  args:
    - channel
  desc: '列出服务器或特定频道的所有阶梯式惩罚。'
  params:
    - desc: '计数频道（服务器默认值使用 NULL）。'
      name: channel
      optional: true
      type: text channel
countmodpunishment:
  args:
    - punishment durationMinutes role channel
  desc: '设置错误计数的惩罚。'
  params:
    - desc: '要应用的惩罚操作。'
      name: punishment
      optional: false
      type: punishment action
    - desc: '计时惩罚的时长（分钟）。'
      name: durationMinutes
      optional: true
      type: int
    - desc: '添加身份组惩罚类型的身份组。'
      name: role
      optional: true
      type: role
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodrequired:
  args:
    - channel roles...
  desc: '设置计数所需的身份组。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
    - desc: '计数所需的身份组。'
      name: roles
      optional: true
      type: role
countmodreset:
  args:
    - channel
  desc: '重置频道以使用服务器默认值。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodshow:
  args:
    - channel
  desc: '显示计数频道或服务器默认值的当前审核配置。'
  params:
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodthreshold:
  args:
    - threshold channel
  desc: '设置计数频道的错误计数阈值。'
  params:
    - desc: '惩罚前的错误计数数量（1-100）。'
      name: threshold
      optional: false
      type: int
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
countmodunpunish:
  args:
    - count channel
  desc: '删除特定错误计数数量的阶梯式惩罚。'
  params:
    - desc: '要删除惩罚的错误计数数量。'
      name: count
      optional: false
      type: int
    - desc: '计数频道（服务器默认值使用 NULL）。'
      name: channel
      optional: true
      type: text channel
countmodwindow:
  args:
    - hours channel
  desc: '设置追踪错误计数的时间窗口。'
  params:
    - desc: '时间窗口（小时，1-168）。'
      name: hours
      optional: false
      type: int
    - desc: '计数频道。默认为当前频道。'
      name: channel
      optional: true
      type: text channel
