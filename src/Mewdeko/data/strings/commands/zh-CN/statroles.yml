statroleadd:
  args:
    - '@role Messages 500 [lookbackDays] [name]'
    - '@role VoiceMinutes 600 30 Voice Regular'
    - '@role Invites 10'
  desc: '创建阈值统计身份组：达到最低值（Messages、VoiceMinutes、Invites、JoinedDays、AccountDays 或 ActivityMinutes）的成员将获得该身份组；若低于阈值则失去该身份组，除非设为永久。对于 ActivityMinutes，可使用 "statroleset <id> activity <name>" 设置游戏，或保留为任意游戏。'
  params:
    - desc: '要管理的身份组。'
      name: role
      optional: false
      type: IRole
    - desc: '统计内容：Messages、VoiceMinutes、Invites、JoinedDays、AccountDays 或 ActivityMinutes。'
      name: stat
      optional: false
      type: StatRoleStat
    - desc: '最小值。'
      name: minimum
      optional: false
      type: long
    - desc: '时间窗口（天数），或 0 表示全部时间。'
      name: lookbackDays
      optional: true
      type: int
    - desc: '显示名称。'
      name: name
      optional: true
      type: string
statroletop:
  args:
    - '@role Messages 10 [lookbackDays] [name]'
    - '@role VoiceMinutes 3 7'
  desc: '创建排名统计身份组：排名在指定名次之内的成员将获得该身份组。'
  params:
    - desc: '要管理的身份组。'
      name: role
      optional: false
      type: IRole
    - desc: '要统计的内容。'
      name: stat
      optional: false
      type: StatRoleStat
    - desc: '仍符合条件的最低排名。'
      name: topEnd
      optional: false
      type: int
    - desc: '时间窗口（天数），或 0 表示全部时间。'
      name: lookbackDays
      optional: true
      type: int
    - desc: '显示名称。'
      name: name
      optional: true
      type: string
statrolepercent:
  args:
    - '@role Messages 10 [lookbackDays] [name]'
  desc: '创建百分比统计身份组：处于已排名成员前指定百分比的成员将获得该身份组。'
  params:
    - desc: '要管理的身份组。'
      name: role
      optional: false
      type: IRole
    - desc: '要统计的内容。'
      name: stat
      optional: false
      type: StatRoleStat
    - desc: '百分位分界线，1 至 100。'
      name: topPercent
      optional: false
      type: int
    - desc: '时间窗口（天数），或 0 表示全部时间。'
      name: lookbackDays
      optional: true
      type: int
    - desc: '显示名称。'
      name: name
      optional: true
      type: string
statrolestreak:
  args:
    - '@role Messages 5 7 [lookbackDays] [name]'
  desc: '创建每日连续统计身份组：在时间窗口内至少有指定天数达到每日最低值的成员将获得该身份组。'
  params:
    - desc: '要管理的身份组。'
      name: role
      optional: false
      type: IRole
    - desc: 'Messages 或 VoiceMinutes。'
      name: stat
      optional: false
      type: StatRoleStat
    - desc: '每日最低值。'
      name: perDay
      optional: false
      type: long
    - desc: '时间窗口内需要达到该值的天数。'
      name: requiredDays
      optional: false
      type: int
    - desc: '时间窗口（天数）。'
      name: lookbackDays
      optional: true
      type: int
    - desc: '显示名称。'
      name: name
      optional: true
      type: string
statrolelist:
  args:
    - ''
  desc: '列出统计身份组及其条件。'
  params: [ ]
statroleinfo:
  args:
    - '3'
  desc: '显示统计身份组的完整配置：条件、过滤器、通知和计划。'
  params:
    - desc: '统计身份组的 ID。'
      name: id
      optional: false
      type: int
statroleremove:
  args:
    - '3'
  desc: '删除统计身份组。成员保留其当前持有的身份组。'
  params:
    - desc: '统计身份组的 ID。'
      name: id
      optional: false
      type: int
statroletoggle:
  args:
    - '3'
  desc: '启用或禁用统计身份组。'
  params:
    - desc: '统计身份组的 ID。'
      name: id
      optional: false
      type: int
statrolepreview:
  args:
    - '3'
  desc: '显示下次运行时哪些成员将获得或失去该身份组，但不做任何更改。'
  params:
    - desc: '统计身份组的 ID。'
      name: id
      optional: false
      type: int
statrolerun:
  args:
    - '3'
  desc: '立即评估并应用统计身份组，而不是等待其计划时间。'
  params:
    - desc: '统计身份组的 ID。'
      name: id
      optional: false
      type: int
statroleset:
  args:
    - '3 permanent true'
    - '3 lookback 30'
    - '3 notifychannel #announcements'
    - '3 message %user% just %action% %role%!'
    - '3 activity Minecraft'
  desc: '更改统计身份组的一项设置。可设置项：name、min、max、lookback、topstart、topend、days、permanent、invert、bots、group、interval、notifychannel、notifydm、message、activity（游戏名称，或用 "any" 表示 ActivityMinutes 统计）。使用 "none" 清除 max、group、notifychannel 或 message。'
  params:
    - desc: '统计身份组的 ID。'
      name: id
      optional: false
      type: int
    - desc: '设置项名称。'
      name: setting
      optional: false
      type: string
    - desc: '新值。'
      name: value
      optional: false
      type: string
statrolefilter:
  args:
    - '3 #channel'
    - '3 @role'
    - '3 @role true'
    - '3 @user'
  desc: '切换统计身份组的过滤器：限定统计范围的频道、成员需要拥有（或在 true 时不得拥有）的身份组，或统计身份组永不影响的成员。'
  params:
    - desc: '统计身份组的 ID。'
      name: id
      optional: false
      type: int
    - desc: '限定统计范围的频道。'
      name: channel
      optional: false
      type: IGuildChannel
    - desc: '需要或排除的身份组。'
      name: role
      optional: false
      type: IRole
    - desc: '设为 True 则切换身份组黑名单而非白名单。'
      name: blacklist
      optional: true
      type: bool
    - desc: '统计身份组永不影响的成员。'
      name: user
      optional: false
      type: IGuildUser
