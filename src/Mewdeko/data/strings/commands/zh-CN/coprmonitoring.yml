coprmonitoradd:
  args:
    - '<ownerProject> [channel] [packages]'
    - '<ownerProject> [channel] [packages]'
    - ownerProject
  desc: '向服务器添加COPR项目监控。'
  params:
    - desc: 'COPR项目，格式为owner/project（例如linux4switch/l4s）。'
      name: ownerProject
      optional: false
      type: string
    - desc: '可选的通知频道。默认为当前频道。'
      name: channel
      optional: true
      type: ITextChannel
    - desc: '可选的逗号分隔包列表以进行监控（例如mesa,kernel）。'
      name: packages
      optional: true
      type: string
coprmonitorremove:
  args:
    - '<ownerProject> [channel]'
    - ownerProject
  desc: '从服务器删除COPR项目监控。'
  params:
    - desc: 'COPR项目，格式为owner/project。'
      name: ownerProject
      optional: false
      type: string
    - desc: '可选频道以删除特定监控。'
      name: channel
      optional: true
      type: ITextChannel
coprmonitorlist:
  args:
    - ''
  desc: '列出服务器中配置的所有COPR监控。'
  params: [ ]
coprmonitortoggle:
  args:
    - ownerProject
  desc: '打开或关闭COPR监控。'
  params:
    - desc: 'COPR项目，格式为owner/project。'
      name: ownerProject
      optional: false
      type: string
coprnotify:
  args:
    - ownerProject status enabled
  desc: '配置哪些构建状态为监控触发通知。'
  params:
    - desc: 'COPR项目，格式为owner/project。'
      name: ownerProject
      optional: false
      type: string
    - desc: '要配置的构建状态。'
      name: status
      optional: false
      type: CoprBuildStatus
    - desc: '是否启用或禁用此状态的通知。'
      name: enabled
      optional: false
      type: bool
coprfilter:
  args:
    - ownerProject text
  desc: '设置COPR监控的包过滤器。'
  params:
    - desc: 'COPR项目，格式为owner/project。'
      name: ownerProject
      optional: false
      type: string
    - desc: '逗号分隔的包列表，或"all"以监控所有内容。'
      name: packages
      optional: false
      type: string
coprsucceededmessage:
  args:
    - ownerProject text
  desc: '设置COPR构建成功时显示的消息。'
  params:
    - desc: 'COPR项目，格式为owner/project。'
      name: ownerProject
      optional: false
      type: string
    - desc: '消息或embed代码。使用"-"重置为默认值。'
      name: message
      optional: false
      type: string
