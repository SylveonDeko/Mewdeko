coprmonitoradd:
  args:
    - '<ownerProject> [channel] [packages]'
    - '<ownerProject> [channel] [packages]'
    - ownerProject
  desc: '为服务器添加 COPR 项目监控。'
  params:
    - desc: 'COPR 项目，格式为 owner/project（例如 linux4switch/l4s）。'
      name: ownerProject
      optional: false
      type: string
    - desc: '用于通知的可选频道。默认为当前频道。'
      name: channel
      optional: true
      type: ITextChannel
    - desc: '可选的逗号分隔软件包列表，用于监控（例如 mesa,kernel）。'
      name: packages
      optional: true
      type: string
coprmonitorremove:
  args:
    - '<ownerProject> [channel]'
    - ownerProject
  desc: '从服务器中移除 COPR 项目监控。'
  params:
    - desc: 'COPR 项目，格式为 owner/project。'
      name: ownerProject
      optional: false
      type: string
    - desc: '要从中移除特定监控的可选频道。'
      name: channel
      optional: true
      type: ITextChannel
coprmonitorlist:
  args:
    - ''
  desc: '列出服务器中配置的所有 COPR 监控。'
  params: [ ]
coprmonitortoggle:
  args:
    - ownerProject
  desc: '开启或关闭 COPR 监控。'
  params:
    - desc: 'COPR 项目，格式为 owner/project。'
      name: ownerProject
      optional: false
      type: string
coprnotify:
  args:
    - ownerProject status enabled
  desc: '配置哪些构建状态会触发该监控的通知。'
  params:
    - desc: 'COPR 项目，格式为 owner/project。'
      name: ownerProject
      optional: false
      type: string
    - desc: '要配置的构建状态。'
      name: status
      optional: false
      type: CoprBuildStatus
    - desc: '是否为该状态启用或禁用通知。'
      name: enabled
      optional: false
      type: bool
coprfilter:
  args:
    - ownerProject text
  desc: '设置 COPR 监控的软件包过滤器。'
  params:
    - desc: 'COPR 项目，格式为 owner/project。'
      name: ownerProject
      optional: false
      type: string
    - desc: '逗号分隔的软件包列表，或使用 "all" 监控全部。'
      name: packages
      optional: false
      type: string
coprsucceededmessage:
  args:
    - ownerProject text
  desc: '设置 COPR 构建成功时显示的消息。'
  params:
    - desc: 'COPR 项目，格式为 owner/project。'
      name: ownerProject
      optional: false
      type: string
    - desc: '消息或嵌入代码。使用 "-" 可恢复默认。'
      name: message
      optional: false
      type: string
