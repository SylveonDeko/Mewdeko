banprune:
  args:
    - ''
  desc: '显示在此频道中封禁用户将使用的清除设置，以及所有已配置的设置。'
  params:
    - { }
banpruneset:
  args:
    - '<action> <days> [#channel]'
  desc: '设置一次封禁操作清除多少天的消息。使用 "all" 表示所有操作，并可指定频道或分类以仅覆盖该范围。'
  params:
    - desc: '操作键，或使用 "all" 涵盖所有操作'
      name: action
      optional: false
      type: string
    - desc: '清除天数，0 至 7'
      name: days
      optional: false
      type: int
    - desc: '要应用该设置的频道或分类，或留空以使用服务器默认值'
      name: target
      optional: true
      type: channel
banpruneclear:
  args:
    - '<action> [#channel]'
  desc: '删除清除设置，使操作回退到更宽泛的范围或其默认值。'
  params:
    - desc: '操作键，或使用 "all" 表示涵盖所有操作的设置'
      name: action
      optional: false
      type: string
    - desc: '设置所在的频道或分类，或留空以使用服务器默认值'
      name: target
      optional: true
      type: channel
banprunereset:
  args:
    - ''
  desc: '删除服务器中的所有清除设置。'
  params:
    - { }
ban:
  args:
    - '<pruneTime> <time> [@user] [msg]'
    - time time
  desc: '封禁用户，并指定原因和清除消息的天数。'
  params:
    - desc: '封禁用户，并指定原因和清除消息的天数。'
      name: pruneTime
      optional: false
      type: duration
    - desc: '清除消息的时间范围'
      name: time
      optional: false
      type: duration
    - desc: '要封禁的用户'
      name: user
      optional: true
      type: user
    - desc: '封禁原因'
      name: msg
      optional: true
      type: string
