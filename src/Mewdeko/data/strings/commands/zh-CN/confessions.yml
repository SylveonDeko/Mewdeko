      optional: false
      type: IUser
confesslogchannel:
  args:
    - channel
  desc: '设置告白日志频道。'
  params:
    - desc: '用于记录告白的频道。'
      name: channel
      optional: true
      type: ITextChannel
confessunblacklist:
  args:
    - user
  desc: '从告白黑名单中删除用户。'
  params:
    - desc: '要从告白黑名单中解除的用户。'
      name: user
      optional: false
      type: IUser
