confessionchannel:
  args:
    - '[@channel]'
  desc: '为匿名告白设置告白频道。'
  params:
    - desc: '告白频道（可选）。'
      name: channel
      optional: true
      type: channel
confessionlogchannel:
  args:
    - '[@channel]'
  desc: >-
    设置用于记录告白的告白日志频道。滥用此功能将导致我出现在距你家2米的地方。
  params:
    - desc: '告白日志频道（可选）。'
      name: channel
      optional: true
      type: channel
confessionunblacklist:
  args:
    - '@user'
