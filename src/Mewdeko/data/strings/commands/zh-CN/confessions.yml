    - channel
  desc: '设置告白频道。'
  params:
    - desc: '要设置为告白的频道。'
      name: channel
      optional: true
      type: ITextChannel
confessionblacklist:
  args:
    - '@user'
  desc: '从告白黑名单中添加或删除用户。'
  params:
    - &ref_141
      desc: '要添加或从黑名单中删除的用户。'
      name: user
      optional: false
      type: IUser
