patreonanalytics:
  args:
    - ''
  desc: '显示详细的 Patreon 分析数据'
  params: [ ]
patreonannounce:
  args:
    - ''
  desc: '手动触发 Patreon 公告。'
  params: [ ]
patreonch:
  args:
    - '#channel'
  desc: '设置或显示 Patreon 公告频道。'
  params:
    - desc: '用于 Patreon 公告的频道。若为 null，则显示当前频道。'
      name: channel
      optional: true
      type: ITextChannel?
patreonconfig:
  args:
    - ''
  desc: '显示此服务器当前的 Patreon 配置。'
  params: [ ]
patreonday:
  args:
    - number
  desc: '设置 Patreon 公告的每月日期。'
  params:
    - desc: '公告的每月日期（1-28）。若为 null，则显示当前日期。'
      name: day
      optional: true
      type: int?
patreondisable:
  args:
    - ''
  desc: '禁用此服务器的 Patreon 公告。'
  params: [ ]
patreonhelp:
  args:
    - ''
  desc: '显示 Patreon 模块信息和可用占位符。'
  params: [ ]
patreonlink:
  args:
    - '@user text'
  desc: '将 Discord 用户与 Patreon 支持者关联'
  params:
    - desc: '要关联的 Discord 用户。'
      name: user
      optional: false
      type: IGuildUser
    - desc: '要关联到的 Patreon 用户 ID。'
      name: patreonUserId
      optional: false
      type: string
patreonmsg:
  args:
    - text
  desc: '设置 Patreon 公告的自定义消息。'
  params:
    - desc: '自定义消息。可使用 %server.name%、%month% 等占位符。使用 "-" 可重置为默认值。'
      name: message
      optional: true
      type: string?
patreonrecognize:
  args:
    - '#channel'
  desc: '为新支持者发送感谢消息'
  params:
    - desc: '用于发送感谢消息的频道。'
      name: channel
      optional: true
      type: ITextChannel?
patreonroles:
  args:
    - ''
  desc: '列出 Patreon 等级与身份组的对应关系'
  params: [ ]
patreonrolesync:
  args:
    - ''
  desc: '切换自动身份组同步'
  params: [ ]
patreonstats:
  args:
    - ''
  desc: '显示 Patreon 支持者统计数据'
  params: [ ]
patreonsupporters:
  args:
    - ''
  desc: '列出活跃的 Patreon 支持者'
  params: [ ]
patreonsync:
  args:
    - ''
  desc: '安全地设置 Patreon OAuth 集成'
  params: [ ]
patreonsyncall:
  args:
    - ''
  desc: '同步所有已关联支持者的身份组'
  params: [ ]
patreontiermap:
  args:
    - text @role
  desc: '将 Patreon 等级映射到 Discord 身份组'
  params:
    - desc: 'Patreon 等级 ID。'
      name: tierId
      optional: false
      type: string
    - desc: '要映射到该等级的 Discord 身份组。'
      name: role
      optional: false
      type: IRole
patreontoggle:
  args:
    - ''
  desc: '开启或关闭 Patreon 公告。'
  params: [ ]
patreontop:
  args:
    - number
  desc: '显示排名靠前的 Patreon 支持者'
  params:
    - desc: '要显示的排名靠前支持者数量（1-20）。'
      name: count
      optional: true
      type: int