highlights:
  args:
    - action word
  desc: 管理用户的关键词高亮。
  params:
    - desc: 要对关键词高亮执行的操作。
      name: action
      optional: false
      type: string
    - desc: 要高亮的单词。
      name: word
      optional: true
      type: string
