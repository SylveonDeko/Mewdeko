highlight:
  args:
    - '<action> [words]'
    - add|list|delete
    - add
    - list
    - delete
  desc: '添加、列出、删除或匹配高亮词。'
  params:
    - desc: '要执行的操作：add、list、delete 或 match。'
      name: action
      optional: false
      type: highlightactions
    - desc: '所选操作的参数'
      name: words
      optional: true
      type: string
