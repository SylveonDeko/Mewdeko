highlight:
  args:
    - '<action> [words]'
    - add|list|delete
    - add
    - list
    - delete
  desc: '添加、列出、移除或匹配关键词高亮。'
  params:
    - desc: '<see cref="HighlightActions" />'
      name: action
      optional: false
      type: highlightactions
    - desc: '所选操作的参数'
