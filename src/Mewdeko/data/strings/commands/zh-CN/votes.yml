  params: [ ]
votes:
  args:
    - '[@user]'
  desc: >-
    显示特定用户或命令执行者投出的总票数。
  params:
    - desc: '要统计投票的用户。如果为空，则统计命令执行者的投票。'
      name: user
      optional: true
      type: user
votesleaderboard:
  args:
