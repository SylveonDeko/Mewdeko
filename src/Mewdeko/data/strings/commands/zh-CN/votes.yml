votemessage:
  args:
    - '[message]'
  desc: >-
    设置用户投票时发送的自定义消息，或预览当前投票消息。
  params:
    - desc: '要为投票设置的自定义消息。使用"-"重置为默认消息。如果为空，则预览当前投票消息。'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: >-
    启动设置新投票密码的确认流程，并提醒用户注意其安全性。
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: >-
    添加用户投票时将获得的身份组，并可选设置自动移除该身份组的时长。
  params:
    - desc: '要作为投票奖励添加的身份组。'
      name: role
      optional: false
      type: role
    - desc: '身份组被授予的时长。填null表示永久。'
      name: time
      optional: true
      type: duration
