votechannel:
  args:
    - channel
  desc: >-
    将指定的文字频道设置为投票频道，所有投票确认将在此频道发送。
  params:
    - &ref_646
      desc: '要设置为投票频道的文字频道。'
      name: channel
      optional: false
      type: ITextChannel
votechannel_ITextChannel:
  args:
    - channel
  desc: >-
    将指定的文字频道设置为投票频道，所有投票确认将在此频道发送。
  params:
    - desc: '要设置为投票频道的文字频道。'
      name: channel
      optional: false
      type: ITextChannel
