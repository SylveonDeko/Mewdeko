votechannel:
  args:
    - channel
  desc: '将指定文字频道设为投票频道，所有投票确认消息都将发送至此。'
  params:
    - &ref_646
      desc: '要设为投票频道的文字频道。'
      name: channel
      optional: false
      type: ITextChannel
