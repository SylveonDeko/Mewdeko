votemessage:
  args:
    - '[message]'
  desc: '设置用户投票或预览当前投票消息时发送的自定义消息。'
  params:
    - desc: '投票时发送的自定义消息。使用 "-" 可恢复默认消息。若为空，则预览当前投票消息。'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: '发起设置新投票密码的确认流程，并提醒用户注意其安全性。'
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: '添加用户投票时授予的身份组，可选择设置身份组自动移除的时长。'
  params:
    - desc: '要添加为投票奖励的身份组。'
      name: role
      optional: false
      type: role
    - desc: '授予该身份组的时长。为空则表示无限期。'
      name: time
      optional: true
      type: duration
