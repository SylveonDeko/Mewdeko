  desc: '生成用户在 Last.fm 上热门专辑的图片网格。'
  params:
    - desc: '网格尺寸（size x size）。必须在 2 至 5 之间。默认为 3。'
      name: size
      optional: true
      type: int
    - desc: '时间段：week、month、quarter、half、year 或 overall（默认）。'
      name: period
      optional: true
      type: string
    - desc: '要查看的用户。默认为命令发起者。'
      name: user
      optional: true
      type: user
