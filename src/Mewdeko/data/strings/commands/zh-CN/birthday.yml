birthdayannouncements:
  args:
    - ''
  desc: '切换是否为用户发布生日公告。'
  params: [ ]
birthdaychannel:
  args:
    - '#channel'
  desc: '设置生日公告频道。'
  params:
    - desc: '用于发布公告的文字频道。未指定时默认为当前频道。'
      name: channel
      optional: true
      type: ITextChannel
birthdayconfig:
  args:
    - ''
  desc: '查看当前生日配置。'
  params: [ ]
birthdaylist:
  args:
    - days
  desc: '显示服务器即将到来的生日。'
  params:
    - desc: '向前查看的天数。默认为 7，最大为 30。'
      name: days
      optional: true
      type: int
birthdaymessage:
  args:
    - message
  desc: '设置自定义生日消息模板。'
  params:
    - desc: '消息模板。使用 {user} 来提及用户。留空则显示当前消息。'
      name: message
      optional: true
      type: string
birthdaypingrole:
  args:
    - '@role'
  desc: '设置发布生日公告时要提及的身份组。'
  params:
    - desc: '要提及的身份组。不提供身份组则关闭。'
      name: role
      optional: true
      type: IRole
birthdayrole:
  args:
    - '@role'
  desc: '设置用户生日当天获得的生日身份组。'
  params:
    - desc: '用户生日当天分配的身份组。不提供身份组则关闭。'
      name: role
      optional: true
      type: IRole
birthdaytimezone:
  args:
    - timezone
  desc: '设置用户的时区，用于计算生日。'
  params:
    - desc: '要设置的时区（例如 "America/New_York"）。'
      name: timezone
      optional: false
      type: string
birthdaytoday:
  args:
    - ''
  desc: '显示今天的生日。'
  params: [ ]