serveractivity:
  args:
    - '[days]'
    - '7'
    - '0'
  desc: '显示服务器在指定时段内的活动摘要：消息、语音时长、贡献者、加入和离开人数，以及最活跃的成员和频道。使用 0 表示全部时间。'
  params:
    - desc: '时间范围（天数）。0 表示全部时间；省略则使用服务器默认值。'
      name: days
      optional: true
      type: int
useractivity:
  args:
    - '[@user] [days]'
    - '@user 30'
  desc: '显示成员在指定时段内的活动摘要：消息和语音时长及排名、累计总量，以及其最常用的频道。'
  params:
    - desc: '要查看的成员，省略则为您自己。'
      name: user
      optional: true
      type: IGuildUser
    - desc: '时间范围（天数）。0 表示全部时间；省略则使用服务器默认值。'
      name: days
      optional: true
      type: int
channelactivity:
  args:
    - '[#channel] [days]'
  desc: '显示频道在指定时段内的活动摘要：消息、语音时长、贡献者，以及最活跃的成员。'
  params:
    - desc: '要查看的频道，省略则为当前频道。'
      name: channel
      optional: true
      type: IGuildChannel
    - desc: '时间范围（天数）。0 表示全部时间；省略则使用服务器默认值。'
      name: days
      optional: true
      type: int
activitytop:
  args:
    - '[Messages|Voice] [days] [@role]'
    - 'Voice 7'
  desc: '在指定时段内按消息数或语音时长对成员排名，可选仅限拥有某身份组的成员。'
  params:
    - desc: '消息或语音。'
      name: kind
      optional: true
      type: StatKind
    - desc: '时间范围（天数）。0 表示全部时间；省略则使用服务器默认值。'
      name: days
      optional: true
      type: int
    - desc: '仅包含拥有此身份组的成员。'
      name: role
      optional: true
      type: IRole
activitytopchannels:
  args:
    - '[Messages|Voice] [days]'
  desc: '在指定时段内按消息数或语音时长对频道排名。'
  params:
    - desc: '消息或语音。'
      name: kind
      optional: true
      type: StatKind
    - desc: '时间范围（天数）。0 表示全部时间；省略则使用服务器默认值。'
      name: days
      optional: true
      type: int
activitychart:
  args:
    - '[Messages|Voice|Members|Status|Joins|Leaves|Growth|InVoice] [days]'
    - 'Members 30'
  desc: '绘制指定时段内的消息、语音时长、成员数、成员状态、加入、离开、增长或语音中成员数的图表。'
  params:
    - desc: '要绘制的内容。'
      name: kind
      optional: true
      type: StatChartKind
    - desc: '时间范围（天数），1 至 90；省略则使用服务器默认值。'
      name: days
      optional: true
      type: int
activityexport:
  args:
    - '[Messages|Voice] [days]'
  desc: '以 CSV 文件形式导出按消息数或语音时长排序的成员排名。'
  params:
    - desc: '消息或语音。'
      name: kind
      optional: true
      type: StatKind
    - desc: '时间范围（天数）。0 表示全部时间；省略则使用服务器默认值。'
      name: days
      optional: true
      type: int
statssettings:
  args:
    - ''
  desc: '显示活动统计追踪设置。'
  params: [ ]
statslookback:
  args:
    - '14'
  desc: '设置统计命令在未指定时使用的默认时间范围（天数）。'
  params:
    - desc: '时间范围（天数），1 至 90。'
      name: days
      optional: false
      type: int
statscooldown:
  args:
    - '30'
  desc: '设置同一成员两条计入的消息之间必须间隔的秒数。0 表示统计每条消息。'
  params:
    - desc: '冷却时间（秒），0 至 300。'
      name: seconds
      optional: false
      type: int
statstrackvoice:
  args:
    - ''
  desc: '切换活动统计中的语音时长追踪。'
  params: [ ]
statstracksnapshots:
  args:
    - ''
  desc: '切换用于成员和状态图表的每小时成员及状态快照。'
  params: [ ]
statscountbots:
  args:
    - ''
  desc: '切换活动统计中是否统计机器人。'
  params: [ ]
statsignorevoicestate:
  args:
    - 'SelfMuted'
    - 'Afk'
  desc: '切换语音状态（SelfMuted、SelfDeafened、ServerMuted、ServerDeafened、Afk、Alone、Streaming、Video）下的时长是否计入语音统计。'
  params:
    - desc: '要切换的状态。'
      name: state
      optional: false
      type: VoiceStateFlags
statsignore:
  args:
    - '#channel'
    - '@role'
    - '@user'
  desc: '切换某个频道、某身份组的所有持有者或某成员是否被排除在活动统计之外。'
  params:
    - desc: '要切换的频道。'
      name: channel
      optional: false
      type: IGuildChannel
    - desc: '要切换的身份组。'
      name: role
      optional: false
      type: IRole
    - desc: '要切换的成员。'
      name: user
      optional: false
      type: IGuildUser
statsignored:
  args:
    - ''
  desc: '列出被排除在活动统计之外的频道、身份组和成员。'
  params: [ ]
statsprivacy:
  args:
    - ''
  desc: '退出所有服务器的活动统计，并永久删除您已记录的消息和语音统计数据；或让您重新加入。'
  params: [ ]
topgames:
  args:
    - '[days]'
    - '30'
  desc: '按时段排名成员花费时间最多的游戏和应用，并显示玩家数。需要先启用游戏追踪。'
  params:
    - desc: '时间范围（天数）。0 表示全部时间；省略则使用服务器默认值。'
      name: days
      optional: true
      type: int
whoplays:
  args:
    - 'Minecraft'
  desc: '显示谁在玩某款游戏或使用某个应用：当前有多少成员在使用，以及在其中花费时间最多的成员。'
  params:
    - desc: '游戏或应用名称。'
      name: game
      optional: false
      type: string
statstrackactivities:
  args:
    - ''
  desc: '切换对成员所使用游戏和应用的追踪（正在玩、直播、收听、观看、竞技）。默认关闭。'
  params: [ ]
statsverifyactivities:
  args:
    - ''
  desc: '切换是否仅统计由 Discord 应用、Spotify 或直播支持的活动，以阻止自定义客户端伪造的状态。'
  params: [ ]
statsactivityfiltermode:
  args:
    - 'Whitelist'
    - 'Blacklist'
  desc: '设置活动过滤列表是仅允许列出的游戏（白名单）还是忽略它们（黑名单）。'
  params:
    - desc: 'Whitelist 或 Blacklist。'
      name: mode
      optional: false
      type: ActivityFilterMode
statsactivityfilter:
  args:
    - 'Spotify'
  desc: '将游戏或应用名称添加到活动过滤列表，或从中移除。'
  params:
    - desc: '活动名称。'
      name: name
      optional: false
      type: string
statsactivityfilters:
  args:
    - ''
  desc: '列出活动过滤列表，以及其为白名单还是黑名单。'
  params: [ ]
liveboardadd:
  args:
    - '#channel InviteLeaderboard [Weekly] [entries] [intervalMinutes]'
    - '#stats GrowthChart Monthly'
  desc: '发布排行榜、图表或概览，机器人会持续刷新并置顶。类型：InviteLeaderboard、MessageLeaderboard、VoiceLeaderboard、JoinsChart、LeavesChart、GrowthChart、MembersChart、MessagesChart、ServerOverview、InviteStats。'
  params:
    - desc: '发布的频道。'
      name: channel
      optional: false
      type: ITextChannel
    - desc: '要显示的内容。'
      name: kind
      optional: false
      type: LiveBoardKind
    - desc: '时间窗口：AllTime、Daily、Weekly 或 Monthly。'
      name: range
      optional: true
      type: StatsRange
    - desc: '排行榜显示的行数，3 至 25。'
      name: entries
      optional: true
      type: int
    - desc: '刷新频率，至少 5 分钟。'
      name: intervalMinutes
      optional: true
      type: int
liveboardlist:
  args:
    - ''
  desc: '列出正在运行的动态看板。'
  params: [ ]
liveboardremove:
  args:
    - '3'
  desc: '删除动态看板及其消息。'
  params:
    - desc: '列表中的看板 ID。'
      name: id
      optional: false
      type: int
liveboardrefresh:
  args:
    - ''
  desc: '立即刷新所有动态看板。'
  params: [ ]
serverreportchannel:
  args:
    - '[#channel]'
  desc: '设置接收定时服务器报告的频道，并启用报告。省略频道则禁用报告。'
  params:
    - desc: '频道；省略则禁用。'
      name: channel
      optional: true
      type: ITextChannel
serverreportfrequency:
  args:
    - 'Weekly'
  desc: '设置服务器报告的发布频率：Daily、Weekly 或 Monthly。'
  params:
    - desc: 'Daily、Weekly 或 Monthly。'
      name: frequency
      optional: false
      type: ReportFrequency
serverreportnow:
  args:
    - '[Weekly]'
  desc: '立即在当前频道发布服务器报告，涵盖指定时段或已配置的时段。'
  params:
    - desc: '要涵盖的时段；省略则使用已配置的时段。'
      name: frequency
      optional: true
      type: ReportFrequency
