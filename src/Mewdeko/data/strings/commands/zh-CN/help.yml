commands:
  args:
    - '[module]'
    - '[module] [search]'
  desc: >-
    显示指定模块的命令，可选择用搜索词进一步筛选。如果为 null，则是 modules 的别名，而 modules 又是 help 的别名。
  params:
    - desc: '要查看的模块，后面可以跟一个用于筛选其命令的词'
      name: module
      optional: true
      type: string
