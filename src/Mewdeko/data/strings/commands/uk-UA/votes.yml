votemessage:
  args:
    - '[message]'
  desc: 'Встановлює власне повідомлення, яке надсилатиметься, коли користувач голосує, або показує попередній перегляд поточного повідомлення для голосування.'
  params:
    - desc: 'Власне повідомлення для голосувань. Використовуйте "-", щоб повернути повідомлення за замовчуванням. Якщо не вказано (null), показується попередній перегляд поточного повідомлення.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: 'Запускає процес підтвердження для встановлення нового пароля голосування з попередженням користувача про його безпеку.'
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: 'Додає роль, яка надаватиметься користувачам після голосування, з необов''язковою тривалістю, після якої роль буде автоматично знята.'
  params:
    - desc: 'Роль, яку потрібно додати як нагороду за голосування.'
      name: role
      optional: false
      type: role
    - desc: 'Тривалість, протягом якої надаватиметься роль. Null — безстроково.'
      name: time
      optional: true
      type: duration
