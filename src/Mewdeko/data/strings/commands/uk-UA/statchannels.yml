statchannelcreate:
  args:
    - 'TotalMembers [template]'
  desc: 'Створює новий заблокований голосовий канал, який показує статистику сервера. Бот створить канал і керуватиме ним.'
  params:
    - desc: 'Тип статистики для показу.'
      name: type
      optional: false
      type: StatChannelType
    - desc: 'Шаблон відображення. Використовуйте %count% для значення.'
      name: template
      optional: true
      type: string
statchanneladd:
  args:
    - '#voice-channel TotalMembers [template]'
  desc: 'Додає голосовий канал як канал статистики. Типи: TotalMembers, HumanMembers, BotCount, OnlineMembers, ChannelCount, RoleCount, BoostCount, BoostLevel, EmojiCount.'
  params:
    - desc: 'Голосовий канал для використання.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Тип статистики для показу.'
      name: type
      optional: false
      type: StatChannelType
    - desc: 'Шаблон відображення. Використовуйте %count% для значення.'
      name: template
      optional: true
      type: string
statchannelrole:
  args:
    - '#voice-channel @role [template]'
  desc: 'Додає канал статистики, який показує, скільки учасників мають певну роль.'
  params:
    - desc: 'Голосовий канал для використання.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Роль, для якої рахувати учасників.'
      name: role
      optional: false
      type: IRole
    - desc: 'Шаблон відображення. Використовуйте %count% і %role.name%.'
      name: template
      optional: true
      type: string
statchannelcountdown:
  args:
    - '#voice-channel 2026-12-31 [template]'
  desc: 'Додає канал статистики зі зворотним відліком. Використовуйте плейсхолдери %days% і %hours%.'
  params:
    - desc: 'Голосовий канал для використання.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Цільова дата для зворотного відліку.'
      name: date
      optional: false
      type: DateTime
    - desc: 'Шаблон відображення. Використовуйте %days% і %hours%.'
      name: template
      optional: true
      type: string
statchannelgoal:
  args:
    - '#voice-channel 1000 [template]'
  desc: 'Додає канал статистики з ціллю за кількістю учасників. Використовуйте %count%, %goal% і %goal.percent%.'
  params:
    - desc: 'Голосовий канал для використання.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Цільова кількість учасників.'
      name: goal
      optional: false
      type: int
    - desc: 'Шаблон відображення. Використовуйте %count%, %goal%, %goal.percent%.'
      name: template
      optional: true
      type: string
statchannelremove:
  args:
    - '#voice-channel'
  desc: 'Видаляє канал статистики.'
  params:
    - desc: 'Голосовий канал для видалення.'
      name: channel
      optional: false
      type: IVoiceChannel
statchannellist:
  args:
    - ''
  desc: 'Показує всі канали статистики на цьому сервері.'
  params: [ ]
statchanneltwitchcounter:
  args:
    - '#voice-channel counter [template]'
  desc: 'Встановлює для каналу статистики лічильник Twitch.'
statchannelmechanism:
  args:
    - '#voice-channel Rename|Recreate|Auto [interval-minutes]'
  desc: 'Встановлює механізм оновлення для каналу статистики.'
statchannelstyle:
  args:
    - '#voice-channel Plain|Comma|Abbreviated|ProgressBar'
  desc: 'Встановлює стиль відображення для каналу статистики.'
statchanneldefaults:
  args:
    - '[Rename|Recreate|Auto] [interval-minutes] [Plain|Comma|Abbreviated|ProgressBar]'
  desc: 'Показує стандартні налаштування для каналів статистики.'
statchanneltypes:
  args:
    - ''
  desc: 'Показує доступні типи каналів статистики.'
