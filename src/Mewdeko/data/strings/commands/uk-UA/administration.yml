adsarm:
  args:
    - ''
  desc: 'Перемикає автовидалення рекламних повідомлень сервера.'
  params: [ ]
antialt:
  args:
    - ''
  desc: 'Налаштовує захист Anti-Alt для сервера: мінімальний вік акаунта та дію покарання з покаранням через роль.'
  params: [ ]
antipattern:
  args:
    - ''
  desc: 'Налаштовує захист Anti-Pattern для сервера: дію покарання з покаранням через роль.'
  params: [ ]
antipattern_PunishmentAction_=:
  args:
    - '<action> [punishTime]'
    - action
  desc: 'Налаштовує захист Anti-Pattern для сервера: дію покарання з покаранням через роль.'
  params:
    - desc: 'Дія покарання, яка застосовується до знайдених збігів шаблону.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'Тривалість покарання, якщо це стосується.'
      name: punishTime
      optional: true
      type: StoopidTime
antipattern_PunishmentAction_IRole:
  args:
    - action @role
  desc: 'Налаштовує захист Anti-Pattern для сервера: дію покарання з покаранням через роль.'
  params:
    - desc: 'Дія покарання, яка застосовується до знайдених збігів шаблону.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'Роль, яку отримують користувачі, що відповідають шаблонам.'
      name: role
      optional: false
      type: IRole
patternadd:
  args:
    - '<pattern> [name] [checkUsername] [checkDisplayName]'
    - pattern
  desc: 'Додає шаблон regex до захисту Anti-Pattern.'
  params:
    - desc: 'Шаблон regex для перевірки імен користувачів і відображуваних імен.'
      name: pattern
      optional: false
      type: string
    - desc: 'Необов''язкова назва шаблону.'
      name: name
      optional: true
      type: string
    - desc: 'Чи перевіряти імена користувачів за цим шаблоном (за замовчуванням true).'
      name: checkUsername
      optional: true
      type: bool
    - desc: 'Чи перевіряти відображувані імена за цим шаблоном (за замовчуванням true).'
      name: checkDisplayName
      optional: true
      type: bool
patternremove:
  args:
    - number
  desc: 'Видаляє шаблон із захисту Anti-Pattern.'
  params:
    - desc: 'ID шаблону, який треба видалити.'
      name: patternId
      optional: false
      type: int
patternlist:
  args:
    - ''
  desc: 'Показує всі шаблони, налаштовані для захисту Anti-Pattern.'
  params: [ ]
patternconfig:
  args:
    - ''
  desc: 'Показує поточні налаштування anti-pattern.'
  params: [ ]
patternconfig_string_string:
  args:
    - setting value
  desc: 'Показує поточні налаштування anti-pattern.'
  params:
    - desc: 'Налаштування, яке треба змінити.'
      name: setting
      optional: false
      type: string
    - desc: 'Значення, яке треба встановити.'
      name: value
      optional: false
      type: string
