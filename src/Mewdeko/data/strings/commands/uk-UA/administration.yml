antiimagehashignore:
  args:
    - '<role>'
    - '<channel>'
  desc: 'Перемикає роль або канал як виняток із захисту Anti-Image-Hash.'
  params: [ ]
antiexternalapp:
  args:
    - ''
    - 'Timeout'
    - 'Timeout 5 5 1h'
    - 'Kick 3 0'
  desc: 'Вмикає захист Anti-External-App, який стежить за повідомленнями, які учасники надсилають через застосунки, додані до їхнього акаунта. Повідомлення видаляється, а учасник, який запустив застосунок, отримує покарання, якщо воно згадує забагато людей або ролей (за замовчуванням 5, 0 вимикає перевірку), пінгує всіх, містить посилання-запрошення або якщо учасник запускає застосунки частіше за дозволену кількість разів за 10 секунд (за замовчуванням 5, 0 вимикає перевірку). Застосунки, додані безпосередньо на сервер, не перевіряються. Запусти без аргументів, щоб вимкнути.'
  params: [ ]
blockimage:
  args:
    - ''
    - 'mrbeast crypto scam'
    - 'Delete nsfw meme'
    - 'https://example.com/scam.png mrbeast crypto scam'
  desc: 'Блокує зображення, тож кожного, хто повторно його опублікує, буде покарано, зокрема копії зі зміненим розміром, перестиснені, віддзеркалені та з рамкою. Прикріпи зображення, відповідай на повідомлення з ним або вкажи його URL. Дія, вказана перед міткою, перевизначає налаштування сервера лише для цього зображення.'
  params: [ ]
unblockimage:
  args:
    - '<id>'
  desc: 'Видаляє зображення із списку заблокованих за його ID, який показує blockedimages.'
  params: [ ]
blockedimages:
  args:
    - ''
  desc: 'Показує заблоковані зображення та скільки разів спіймано кожне з них.'
  params: [ ]
imagehash:
  args:
    - ''
    - 'https://example.com/scam.png'
  desc: 'Показує перцептивний хеш зображення без його блокування.'
  params: [ ]
antiimagehashpreset:
  args:
    - ''
  desc: 'Перемикає список відомих шахрайських зображень, який іде разом із Mewdeko: фальшиві зображення крипто-казино та розіграшів, які зараз масово розсилають у Discord. Вони блокуються разом із твоїм власним списком. Увімкнено за замовчуванням, коли ввімкнено Anti-Image-Hash.'
  params: [ ]
