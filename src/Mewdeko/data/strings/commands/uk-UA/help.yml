commands:
  args:
    - '[module]'
    - '[module] [search]'
  desc: 'Показує команди певного модуля, за потреби звужені пошуковим запитом. Якщо значення не вказано, це псевдонім для modules, який є псевдонімом для help.'
  params:
    - desc: 'Модуль, який треба переглянути, за бажанням із словом для фільтрації його команд'
