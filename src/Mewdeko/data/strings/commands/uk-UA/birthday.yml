birthdayannouncements:
  args:
    - ''
  desc: 'Перемикає оголошення про дні народження для користувача.'
  params: [ ]
birthdaychannel:
  args:
    - '#channel'
  desc: 'Встановлює канал для оголошень про дні народження.'
  params:
    - desc: 'Текстовий канал для оголошень. Якщо не вказано, використовується поточний канал.'
      name: channel
      optional: true
      type: ITextChannel
birthdayconfig:
  args:
    - ''
  desc: 'Показує поточні налаштування днів народження.'
  params: [ ]
birthdaylist:
  args:
    - days
  desc: 'Показує найближчі дні народження на сервері.'
  params:
    - desc: 'На скільки днів уперед дивитися. За замовчуванням 7, максимум 30.'
      name: days
      optional: true
      type: int
birthdaymessage:
  args:
    - message
  desc: 'Встановлює власний шаблон повідомлення про день народження.'
  params:
    - desc: 'Шаблон повідомлення. Використай {user}, щоб згадати користувача. Якщо поле порожнє, показується поточне повідомлення.'
      name: message
      optional: true
      type: string
birthdaypingrole:
  args:
    - '@role'
  desc: 'Встановлює роль, яку пінгувати під час оголошення днів народження.'
  params:
    - desc: 'Роль для пінгу. Не вказуй роль, щоб вимкнути.'
      name: role
      optional: true
      type: IRole
birthdayrole:
  args:
    - '@role'
  desc: 'Встановлює роль на день народження, яку отримує користувач у свій день народження.'
  params:
    - desc: 'Роль, яку видавати в день народження користувача. Не вказуй роль, щоб вимкнути.'
      name: role
      optional: true
      type: IRole
birthdaytimezone:
  args:
    - timezone
  desc: 'Встановлює часовий пояс користувача для розрахунку днів народження.'
  params:
    - desc: 'Часовий пояс для встановлення (наприклад, "America/New_York").'
      name: timezone
      optional: false
      type: string
birthdaytoday:
  args:
    - ''
  desc: 'Показує сьогоднішні дні народження.'
  params: [ ]