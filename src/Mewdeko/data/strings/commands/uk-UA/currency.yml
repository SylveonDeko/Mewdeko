  desc: 'Спробуй вкрасти гроші з гаманця іншого користувача. Гроші на банківському рахунку недосяжні.'
  params:
    - desc: 'Користувач, якого треба пограбувати.'
      name: target
      optional: false
      type: user
pay:
  args:
    - '@user <amount>'
  desc: 'Надсилає валюту іншому користувачеві, мінус податок на переказ, який стягує сервер.'
  params:
    - desc: 'Користувач, якому надіслати валюту.'
      name: target
      optional: false
      type: user
    - desc: 'Сума до сплати податку.'
      name: amount
      optional: false
      type: long
bank:
  args:
    - ''
    - '@user'
  desc: 'Показує баланси гаманця та банку, нараховуючи відсотки, які вже накопичилися.'
  params:
    - desc: 'Користувач, якого переглянути. За замовчуванням це ти.'
      name: user
      optional: true
      type: user
deposit:
  args:
    - '<amount|all>'
  desc: 'Переказує валюту з гаманця до банку, де вона захищена від пограбування.'
  params:
    - desc: 'Сума для внесення або "all", щоб внести весь гаманець.'
      name: amount
      optional: false
      type: string
withdraw:
  args:
    - '<amount|all>'
  desc: 'Переказує валюту з банку назад у гаманець, щоб її можна було витратити.'
  params:
    - desc: 'Сума для зняття або "all", щоб зняти все.'
      name: amount
      optional: false
      type: string
shop:
  args:
    - ''
  desc: 'Показує все, що зараз продає сервер.'
  params: [ ]
buy:
  args:
    - '<item name>'
  desc: 'Купує предмет у магазині сервера.'
  params:
    - desc: 'Назва предмета для купівлі.'
      name: name
      optional: false
      type: string
inventory:
  args:
    - ''
    - '@user'
  desc: 'Показує предмети, якими володіє користувач.'
  params:
    - desc: 'Користувач, чий інвентар показати. За замовчуванням це ти.'
      name: user
      optional: true
      type: user
use:
  args:
    - '<item name>'
  desc: 'Використовує один із твоїх предметів одноразового використання.'
  params:
    - desc: 'Назва предмета для використання.'
      name: name
      optional: false
      type: string
shopaddrole:
  args:
    - '<price> @role <name>'
  desc: 'Додає роль до магазину, щоб користувачі могли її купити.'
  params:
    - desc: 'Ціна ролі.'
      name: price
      optional: false
      type: long
    - desc: 'Роль, яка видається після покупки.'
      name: role
      optional: false
      type: role
    - desc: 'Назва позиції в магазині, яка відображається.'
      name: name
      optional: false
      type: string
shopadditem:
  args:
    - '<price> <name>'
  desc: 'Додає в магазин звичайний колекційний предмет без автоматичного ефекту після покупки.'
  params:
    - desc: 'Ціна предмета.'
      name: price
      optional: false
      type: long
    - desc: 'Назва позиції в магазині, яка відображається.'
      name: name
      optional: false
      type: string
shopremove:
  args:
    - '<item name>'
  desc: 'Видаляє предмет із магазину разом із усіма його копіями в учасників.'
  params:
    - desc: 'Назва предмета для видалення.'
      name: name
      optional: false
      type: string
shopprice:
  args:
    - '<price> <item name>'
  desc: 'Встановлює ціну наявного предмета в магазині.'
  params:
    - desc: 'Нова ціна.'
      name: price
      optional: false
      type: long
    - desc: 'Назва предмета, ціну якого треба змінити.'
      name: name
      optional: false
      type: string
shopstock:
  args:
    - '<stock> <item name>'
  desc: 'Встановлює, скільки одиниць предмета залишилося для продажу.'
  params:
    - desc: 'Залишок на складі або -1 для необмеженої кількості.'
      name: stock
      optional: false
      type: int
    - desc: 'Назва предмета, який треба поповнити на складі.'
      name: name
      optional: false
      type: string
shopdesc:
  args:
    - '<item name> | <description>'
  desc: 'Встановлює опис, який показується для предмета в магазині.'
  params:
    - desc: 'Назва предмета, далі вертикальна риска і новий опис.'
      name: name
      optional: false
      type: string
shoptoggle:
  args:
    - '<item name>'
  desc: 'Показує або приховує предмет магазину, не видаляючи його та не забираючи в користувачів уже куплені копії.'
  params:
    - desc: 'Назва предмета, який треба перемкнути.'
      name: name
      optional: false
      type: string
economyconfig:
  args:
    - ''
  desc: 'Показує всі налаштування економіки та їхні поточні значення.'
  params: [ ]
economyset:
  args:
    - '<setting> <value>'
  desc: 'Змінює одне налаштування економіки. Щоб побачити всі доступні назви налаштувань, виконай команду config.'
  params:
    - desc: 'Налаштування, яке треба змінити.'
      name: setting
      optional: false
      type: string
    - desc: 'Нове значення.'
      name: value
      optional: false
      type: string
economyreset:
  args:
    - ''
  desc: 'Відновлює всі налаштування економіки до значень за замовчуванням.'
  params: [ ]
economystats:
  args:
    - ''
  desc: 'Показує розмір і концентрацію грошової маси сервера.'
  params: [ ]
economyflow:
  args:
    - ''
    - '<days>'
  desc: 'Показує, звідки валюта надходить в обіг і куди з нього виходить.'
  params:
    - desc: 'Скільки днів назад показувати дані. За замовчуванням 7.'
      name: days
      optional: true
      type: int
gamestats:
  args:
    - ''
    - '<days>'
  desc: 'Показує, скільки кожна гра виплатила порівняно з тим, скільки з гравців забрала, щоб коефіцієнти виплат можна було налаштовувати на основі реальних результатів, а не навмання.'
  params:
    - desc: 'Скільки днів назад показувати дані. За замовчуванням 7.'
      name: days
      optional: true
      type: int
cashleaderboard:
  args:
    - ''
  desc: 'Показує таблицю лідерів користувачів з найбільшим чистим статком.'
  params: [ ]
