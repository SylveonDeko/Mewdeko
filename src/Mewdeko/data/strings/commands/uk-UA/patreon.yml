patreonanalytics:
  args:
    - ''
  desc: 'Показує детальну аналітику Patreon'
  params: [ ]
patreonannounce:
  args:
    - ''
  desc: 'Вручну запускає оголошення Patreon.'
  params: [ ]
patreonch:
  args:
    - '#channel'
  desc: 'Встановлює або показує канал для оголошень Patreon.'
  params:
    - desc: 'Канал для оголошень Patreon. Якщо значення порожнє, показується поточний канал.'
      name: channel
      optional: true
      type: ITextChannel?
patreonconfig:
  args:
    - ''
  desc: 'Показує поточну конфігурацію Patreon для цього сервера.'
  params: [ ]
patreonday:
  args:
    - number
  desc: 'Встановлює день місяця для оголошень Patreon.'
  params:
    - desc: 'День місяця (1-28) для оголошень. Якщо значення порожнє, показується поточний день.'
      name: day
      optional: true
      type: int?
patreondisable:
  args:
    - ''
  desc: 'Вимикає оголошення Patreon для цього сервера.'
  params: [ ]
patreonhelp:
  args:
    - ''
  desc: 'Показує інформацію про модуль Patreon і доступні заповнювачі.'
  params: [ ]
patreonlink:
  args:
    - '@user text'
  desc: 'Прив''язує користувача Discord до підтримувача Patreon'
  params:
    - desc: 'Користувач Discord для прив''язки.'
      name: user
      optional: false
      type: IGuildUser
    - desc: 'ID користувача Patreon для прив''язки.'
      name: patreonUserId
      optional: false
      type: string
patreonmsg:
  args:
    - text
  desc: 'Встановлює власне повідомлення для оголошень Patreon.'
  params:
    - desc: 'Власне повідомлення. Використовуй заповнювачі, наприклад %server.name%, %month% тощо. Щоб скинути до стандартного, використай «-».'
      name: message
      optional: true
      type: string?
patreonrecognize:
  args:
    - '#channel'
  desc: 'Надсилає повідомлення з подякою для нових підтримувачів'
  params:
    - desc: 'Канал, куди надсилати повідомлення з подякою.'
      name: channel
      optional: true
      type: ITextChannel?
patreonroles:
  args:
    - ''
  desc: 'Показує відповідності рівнів Patreon і ролей'
  params: [ ]
patreonrolesync:
  args:
    - ''
  desc: 'Перемикає автоматичну синхронізацію ролей'
  params: [ ]
patreonstats:
  args:
    - ''
  desc: 'Показує статистику підтримувачів Patreon'
  params: [ ]
patreonsupporters:
  args:
    - ''
  desc: 'Показує активних підтримувачів Patreon'
  params: [ ]
patreonsync:
  args:
    - ''
  desc: 'Безпечно налаштовує інтеграцію OAuth з Patreon'
  params: [ ]
patreonsyncall:
  args:
    - ''
  desc: 'Синхронізує ролі для всіх прив''язаних підтримувачів'
  params: [ ]
patreontiermap:
  args:
    - text @role
  desc: 'Призначає рівень Patreon певній ролі Discord'
  params:
    - desc: 'ID рівня Patreon.'
      name: tierId
      optional: false
      type: string
    - desc: 'Роль Discord, яку призначити рівню.'
      name: role
      optional: false
      type: IRole
patreontoggle:
  args:
    - ''
  desc: 'Вмикає або вимикає оголошення Patreon.'
  params: [ ]
patreontop:
  args:
    - number
  desc: 'Показує найактивніших підтримувачів Patreon'
  params:
    - desc: 'Кількість найактивніших підтримувачів для показу (1-20).'
      name: count
      optional: true
      type: int