banprune:
  args:
    - ''
  desc: 'Показує очищення повідомлень, яке використало б бан у цьому каналі, разом із усіма налаштуваннями.'
  params:
    - { }
banpruneset:
  args:
    - '<action> <days> [#channel]'
  desc: 'Встановлює, за скільки днів повідомлень одна дія бану їх очищає. Використай «all» для всіх дій, а канал або категорію передай, щоб перевизначити лише цю область.'
  params:
    - desc: 'Ключ дії або «all», щоб охопити всі дії'
      name: action
      optional: false
      type: string
    - desc: 'Очищення в днях, від 0 до 7'
      name: days
      optional: false
      type: int
    - desc: 'Канал або категорія, для яких діє налаштування, або нічого для типового значення сервера'
      name: target
      optional: true
      type: channel
banpruneclear:
  args:
    - '<action> [#channel]'
  desc: 'Видаляє налаштування очищення, щоб дія використовувала ширшу область або значення за замовчуванням.'
  params:
    - desc: 'Ключ дії або «all» для налаштування, яке охоплює всі дії'
      name: action
      optional: false
      type: string
    - desc: 'Канал або категорія, до яких прив''язане налаштування, або нічого для типового значення сервера'
      name: target
      optional: true
      type: channel
banprunereset:
  args:
    - ''
  desc: 'Видаляє всі налаштування очищення на сервері.'
  params:
    - { }
ban:
  args:
    - '<pruneTime> <time> [@user] [msg]'
    - time time
  desc: 'Банить користувача з вказаною причиною та кількістю днів для очищення повідомлень.'
  params:
    - desc: 'Банить користувача з вказаною причиною та кількістю днів для очищення повідомлень.'
      name: pruneTime
      optional: false
      type: duration
    - desc: 'Проміжок часу для очищення повідомлень'
      name: time
      optional: false
      type: duration
    - desc: 'Користувач, якого треба забанити'
      name: user
      optional: true
      type: user
    - desc: 'Причина бану'
      name: msg
      optional: true
      type: string
