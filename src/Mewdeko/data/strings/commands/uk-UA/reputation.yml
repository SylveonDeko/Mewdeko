  args:
    - commandname 50
    - commandname 50 helper
    - 'commandname 50 helper #channel1 #channel2'
  desc: 'Встановлює вимоги до репутації для команди, за бажанням обмежені певними каналами.'
  params:
    - desc: 'Назва команди.'
      name: commandName
      optional: false
      type: string
    - desc: 'Мінімальна необхідна репутація.'
      name: minReputation
      optional: false
      type: int
    - desc: 'Конкретний тип потрібної репутації (необов''язково, за замовчуванням total).'
      name: repType
      optional: true
      type: string
    - desc: 'Необов''язкові канали, до яких застосовується вимога (якщо не вказано, діє глобально).'
      name: channels
      optional: true
      type: ITextChannel[]
