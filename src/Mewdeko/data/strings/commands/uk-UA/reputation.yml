  args:
    - role channel
  desc: 'Встановлює канал для оголошень нагороди-ролі.'
  params:
    - desc: 'Роль для налаштування.'
      name: role
      optional: false
      type: IRole
    - desc: 'Канал для оголошень (null, щоб вимкнути).'
      name: channel
      optional: true
      type: ITextChannel
