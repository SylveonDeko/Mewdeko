reprole:
  args:
    - ''
    - detailed
    - '@role'
    - '@role 100'
    - '@role 100 false #channel true 50'
  desc: 'Керує нагородами-ролями за етапами репутації. Без параметрів показує всі нагороди; вкажіть роль і репутацію, щоб додати або оновити нагороду з додатковими налаштуваннями.'
  params:
    - &ref_437
      desc: 'Роль для видачі (необов''язково для перегляду списку).'
      name: role
      optional: true
      type: IRole
    - desc: 'Репутація, потрібна для отримання цієї ролі (необов''язково для перегляду списку).'
      name: reputation
      optional: true
      type: int
    - desc: 'Чи знімати роль, якщо репутація знизилася.'
      name: removeOnDrop
      optional: true
      type: bool
    - desc: 'Необов''язковий канал для оголошень про видачу ролей.'
      name: announceChannel
      optional: true
      type: ITextChannel
    - desc: 'Чи надсилати сповіщення в особисті повідомлення.'
      name: announceDm
      optional: true
      type: bool
    - desc: 'Необов''язкова нагорода XP за досягнення етапу.'
      name: xpReward
      optional: true
      type: int
    - desc: 'Показувати детальну інформацію під час перегляду списку (використовуйте ''detailed'' як перший параметр).'
      name: detailed
      optional: true
      type: string
