    - desc: 'Номер неправильного підрахунку, для якого видалити покарання.'
      name: count
      optional: false
      type: int
    - desc: 'Канал підрахунку (NULL — налаштування сервера за замовчуванням).'
      name: channel
      optional: true
      type: text channel
countmodwindow:
  args:
    - hours channel
  desc: 'Встановлює часове вікно для відстеження неправильних підрахунків.'
  params:
    - desc: 'Часове вікно в годинах (1–168).'
      name: hours
      optional: false
      type: int
    - desc: 'Канал для підрахунку. За замовчуванням це поточний канал.'
      name: channel
      optional: true
      type: text channel