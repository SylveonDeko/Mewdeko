      optional: true
      type: text channel
countmodpunishment:
  args:
    - punishment durationMinutes role channel
  desc: 'Встановлює покарання за неправильні підрахунки.'
  params:
    - desc: 'Дія покарання для застосування.'
      name: punishment
      optional: false
      type: punishment action
    - desc: 'Тривалість покарань з часом у хвилинах.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Роль для покарання типу AddRole.'
      name: role
      optional: true
      type: role
    - desc: 'Канал для підрахунку. За замовчуванням це поточний канал.'
      name: channel
      optional: true
      type: text channel
countmodrequired:
  args:
    - channel roles...
  desc: 'Встановлює ролі, потрібні для підрахунку.'
  params:
    - desc: 'Канал для підрахунку. За замовчуванням це поточний канал.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Ролі, потрібні для підрахунку.'
      name: roles
      optional: true
      type: role
countmodreset:
  args:
    - channel
  desc: 'Повертає канал до налаштувань сервера за замовчуванням.'
  params:
    - desc: 'Канал для підрахунку. За замовчуванням це поточний канал.'
      name: channel
      optional: true
      type: text channel
countmodshow:
  args:
    - channel
  desc: 'Показує поточні налаштування модерації для каналу підрахунку або налаштування сервера за замовчуванням.'
  params:
    - desc: 'Канал для підрахунку. За замовчуванням це поточний канал.'
      name: channel
      optional: true
      type: text channel
countmodthreshold:
  args:
    - threshold channel
  desc: 'Встановлює поріг неправильних підрахунків для каналу підрахунку.'
  params:
    - desc: 'Кількість неправильних підрахунків до покарання (1–100).'
      name: threshold
      optional: false
      type: int
    - desc: 'Канал для підрахунку. За замовчуванням це поточний канал.'
      name: channel
      optional: true
      type: text channel
countmodunpunish:
  args:
    - count channel
  desc: 'Видаляє поступове покарання для конкретного номера неправильного підрахунку.'
