highlight:
  args:
    - '<action> [words]'
    - add|list|delete
    - add
    - list
    - delete
  desc: 'Додає, показує, видаляє або перевіряє виділення.'
  params:
    - desc: 'Дія для виконання: add, list, delete або match.'
      name: action
      optional: false
      type: highlightactions
    - desc: 'Параметри для вибраної дії'
      name: words
      optional: true
      type: string
