highlights:
  args:
    - action word
  desc: 'Керує виділеними словами користувачів.'
  params:
    - desc: 'Дія, яку треба виконати з виділеннями.'
      name: action
      optional: false
      type: string
    - desc: 'Слово, яке треба виділити.'
      name: word
      optional: true
      type: string