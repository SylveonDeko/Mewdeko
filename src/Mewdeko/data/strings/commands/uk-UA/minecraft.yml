mcstatus:
  args:
    - '[server name or address]'
  desc: 'Перевіряє стан сервера Minecraft. Використай назву зареєстрованого сервера, пряму адресу або залиш поле порожнім для сервера за замовчуванням.'
  params:
    - desc: 'Назва зареєстрованого сервера або пряма адреса (наприклад, play.example.com:25565).'
      name: serverName
      optional: true
      type: string
mcadd:
  args:
    - name address
  desc: 'Додає сервер Minecraft до сервера Discord. Постав bedrock: перед адресою для серверів Bedrock.'
  params:
    - desc: 'Мітка для сервера.'
      name: name
      optional: false
      type: string
    - desc: 'Адреса сервера, за бажанням з портом (наприклад, play.example.com:25565 або bedrock:play.example.com).'
      name: address
      optional: false
      type: string
mcremove:
  args:
    - name
  desc: 'Видаляє сервер Minecraft із сервера Discord.'
  params:
    - desc: 'Назва сервера, який треба видалити.'
      name: name
      optional: false
      type: string
mclist:
  args:
    - ''
  desc: 'Показує всі зареєстровані сервери Minecraft для цього сервера Discord.'
  params: [ ]
mcdefault:
  args:
    - name
  desc: 'Встановлює сервер як типовий для команд статусу.'
  params:
    - desc: 'Назва сервера, який треба встановити як типовий.'
      name: name
      optional: false
      type: string
mcwatch:
  args:
    - name '#channel'
  desc: 'Встановлює канал для періодичних оновлень статусу сервера. Щоб вимкнути, не вказуй канал.'
  params:
    - desc: 'Назва сервера, за яким треба стежити.'
      name: serverName
      optional: false
      type: string
    - desc: 'Канал, в якому публікувати оновлення.'
      name: channel
      optional: true
      type: ITextChannel
mcwatchmode:
  args:
    - name embed|topic|both
  desc: 'Встановлює, як показувати статус сервера: embed (редагується на місці), тема каналу або обидва варіанти.'
  params:
    - desc: 'Назва сервера.'
      name: serverName
      optional: false
      type: string
    - desc: 'Режим відстеження: Embed, ChannelTopic або Both.'
      name: mode
      optional: false
      type: McWatchMode
mcembed:
  args:
    - name template
  desc: 'Встановлює власний шаблон embed для сервера, за яким ведеться спостереження. Щоб скинути, використай «-». Доступні заповнювачі: %mc.server.name%, %mc.players.online%, %mc.players.max%, %mc.motd%, %mc.version%, %mc.latency%, %mc.online%, %mc.favicon%.'
  params:
    - desc: 'Назва сервера.'
      name: serverName
      optional: false
      type: string
    - desc: 'JSON шаблону embed або «-», щоб скинути до стандартного.'
      name: template
      optional: true
      type: string
mcplayer:
  args:
    - username
  desc: 'Шукає гравця Minecraft за нікнеймом і показує його профіль та скін.'
  params:
    - desc: 'Нікнейм Minecraft для пошуку.'
      name: username
      optional: false
      type: string
mcskin:
  args:
    - username
  desc: 'Показує відрендерений скін гравця Minecraft.'
  params:
    - desc: 'Нікнейм Minecraft.'
      name: username
      optional: false
      type: string
mcrcon:
  args:
    - name command
  desc: 'Надсилає команду RCON на зареєстрований сервер Minecraft. RCON потрібно налаштувати через панель керування.'
  params:
    - desc: 'Назва сервера.'
      name: serverName
      optional: false
      type: string
    - desc: 'Команда, яку треба виконати на сервері.'
      name: command
      optional: false
      type: string
mcwhitelist:
  args:
    - name add|remove|list|on|off|reload [player]
  desc: 'Керує білим списком на сервері Minecraft через RCON. Потрібно налаштувати RCON.'
  params:
    - desc: 'Назва сервера.'
      name: serverName
      optional: false
      type: string
    - desc: 'Дія: add, remove, list, on, off, reload.'
      name: action
      optional: false
      type: string
    - desc: 'Ім''я гравця (для add/remove).'
      name: playerName
      optional: true
      type: string
