votemessage:
  args:
    - '[message]'
  desc: >-
    Setter en tilpasset melding som sendes når en bruker stemmer, eller
    forhåndsviser den gjeldende stemmemeldingen.
  params:
    - desc: 'Den tilpassede meldingen for stemmer. Bruk "-" for å tilbakestille til standard. Hvis tom, forhåndsvises den gjeldende stemmemeldingen.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: >-
    Starter en bekreftelsesprosess for å angi et nytt stemmepassord og
    advarer brukeren om sikkerheten.
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: >-
    Legger til en rolle som gis til brukere når de stemmer, med en valgfri
    varighet for automatisk fjerning av rollen.
  params:
    - desc: 'Rollen som skal legges til som stemmebelønning.'
      name: role
      optional: false
      type: role
    - desc: 'Varigheten rollen gis for. Null for ubegrenset.'
      name: time
      optional: true
      type: duration
