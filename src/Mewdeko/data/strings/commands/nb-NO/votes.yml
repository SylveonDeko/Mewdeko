votechannel:
  args:
    - channel
  desc: >-
    Setter den angitte tekstkanalen som stemmekanal der alle
    stemmebekreftelser sendes.
  params:
    - &ref_646
      desc: 'Tekstkanalen som skal settes som stemmekanal.'
      name: channel
      optional: false
      type: ITextChannel
