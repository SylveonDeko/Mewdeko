rolegreetmessage:
  args:
    - '<id> [message]'
    - number
  desc: 'Oppdaterer meldingsinnholdet i en rollehilsen. Hvis ingen melding er angitt, presenteres alternativer for å forhåndsvise meldingen eller se den som vanlig tekst.'
  params:
    - desc: 'ID-en til rollehilsenen som skal oppdateres, basert på dens posisjon i listen over alle rollehilsener.'
      name: id
      optional: false
      type: int
    - desc: 'Det nye meldingsinnholdet. Valgfritt.'
      name: message
      optional: true
      type: string
