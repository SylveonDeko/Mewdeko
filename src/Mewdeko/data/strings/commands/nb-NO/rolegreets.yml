rolegreetadd:
  args:
    - '@role [@channel]'
    - '@role'
  desc: 'Legger til en ny rollehilsenmelding for en spesifisert rolle. Hvis ingen kanal er angitt, brukes gjeldende kanal.'
  params:
    - desc: 'Rollen hilsenmeldingen settes for.'
      name: role
      optional: false
      type: role
    - desc: 'Tekstkanalen hilsenmeldingen sendes til. Valgfritt.'
      name: channel
      optional: true
      type: channel
