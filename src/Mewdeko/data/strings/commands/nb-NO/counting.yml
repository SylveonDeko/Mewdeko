      name: durationMinutes
      optional: true
      type: int
    - desc: 'Rolle for strafftypen LeggTilRolle.'
      name: role
      optional: true
      type: role
    - desc: 'Tellekanalen. Standard er gjeldende kanal.'
      name: channel
