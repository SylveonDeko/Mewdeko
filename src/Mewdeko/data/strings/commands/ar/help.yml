commands:
  args:
    - '[module]'
    - '[module] [search]'
  desc: >-
    يعرض أوامر وحدة محددة، مع إمكانية تضييق النتائج بكلمة بحث. إذا كانت null، فهو اسم بديل لـ modules والذي هو اسم بديل لـ help.
  params:
    - desc: 'الوحدة المراد الاطلاع عليها، ويمكن أن يتبعها مصطلح لتصفية أوامرها'
      name: module
      optional: true
      type: string
