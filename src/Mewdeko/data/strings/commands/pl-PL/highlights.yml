highlight:
  args:
    - '<action> [words]'
    - add|list|delete
    - add
    - list
    - delete
  desc: 'Dodaje, wyświetla, usuwa lub dopasowuje wyróżnienia.'
  params:
    - desc: 'Akcja do wykonania: add, list, delete lub match.'
      name: action
      optional: false
      type: highlightactions
