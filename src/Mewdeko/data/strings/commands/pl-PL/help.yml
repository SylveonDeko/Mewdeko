commands:
  args:
    - '[module]'
    - '[module] [search]'
  desc: >-
    Pokazuje polecenia konkretnego modułu, opcjonalnie zawężone wyszukiwaną frazą. Jeśli null, jest to alias dla modules, który jest aliasem dla help.
  params:
