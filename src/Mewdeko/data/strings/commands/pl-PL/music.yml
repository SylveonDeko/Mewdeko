      optional: false
      type: user
fmchart:
  args:
    - '[size]'
    - '[period]'
    - '[@user]'
  desc: 'Generuje obraz siatki z najpopularniejszymi albumami użytkownika z Last.fm.'
  params:
    - desc: 'Wymiary siatki (rozmiar x rozmiar). Musi być od 2 do 5. Domyślnie 3.'
      name: size
      optional: true
      type: int
    - desc: 'Okres: week, month, quarter, half, year lub overall (domyślnie).'
      name: period
      optional: true
      type: string
    - desc: 'Użytkownik do sprawdzenia. Domyślnie osoba wywołująca polecenie.'
      name: user
      optional: true
      type: user
