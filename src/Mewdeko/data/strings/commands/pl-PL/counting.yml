countingban:
  args:
    - user channel duration reason
  desc: 'Banuje użytkownika w liczeniu na określonym kanale.'
  params:
    - desc: 'Użytkownik do zbanowania w liczeniu.'
      name: user
      optional: false
      type: guild user
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Czas trwania bana (np. 1h, 1d). Pozostaw puste dla bana stałego.'
      name: duration
      optional: true
      type: stoopid time
    - desc: 'Powód bana.'
      name: reason
      optional: true
      type: string
countingconfig:
  args:
    - channel
  desc: 'Konfiguruje ustawienia kanału liczenia.'
  params:
    - desc: 'Kanał, dla którego pokazać konfigurację. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
countingcooldown:
  args:
    - channel seconds
  desc: 'Ustawia cooldown między liczeniami użytkowników.'
  params:
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Cooldown w sekundach (0–300).'
      name: seconds
      optional: true
      type: int
countingdisable:
  args:
    - channel purgeData reason
  desc: 'Wyłącza liczenie na kanale i opcjonalnie czyści wszystkie dane.'
  params:
    - desc: 'Kanał, na którym wyłączyć liczenie. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Czy usunąć wszystkie dane liczenia dla tego kanału. Domyślnie false.'
      name: purgeData
      optional: true
      type: bool
    - desc: 'Powód wyłączenia liczenia.'
      name: reason
      optional: true
      type: string
countingfailurechannel:
  args:
    - countingChannel failureChannel
  desc: 'Ustawia kanał, na który są zapisywane błędy liczenia.'
  params:
    - desc: 'Kanał liczenia.'
      name: countingChannel
      optional: true
      type: text channel
    - desc: 'Kanał dla logów błędów. Użyj null, aby wyłączyć.'
      name: failureChannel
      optional: true
      type: text channel
countingfailuremessage:
  args:
    - channel embed
  desc: 'Ustawia niestandardową wiadomość dla błędnych liczb.'
  params:
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Szablon wiadomości. Użyj „-”, aby przywrócić domyślną.'
      name: embed
      optional: true
      type: string
countingfailurethreshold:
  args:
    - channel threshold
  desc: 'Ustawia próg błędów przed konsekwencjami.'
  params:
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Liczba błędów przed działaniem (1–10).'
      name: threshold
      optional: true
      type: int
countingleaderboard:
  args:
    - type channel
  desc: 'Wyświetla ranking dla kanału liczenia.'
  params:
    - desc: 'Typ rankingu (contributions, streak, accuracy, totalnumbers).'
      name: type
      optional: true
      type: string
    - desc: 'Kanał, dla którego pokazać ranking. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
countinglist:
  args:
    - ''
  desc: 'Wyświetla wszystkie aktywne kanały liczenia na serwerze.'
  params: [ ]
countingmilestonechannel:
  args:
    - countingChannel milestoneChannel
  desc: 'Ustawia kanał, na którym ogłaszane są osiągnięcia kamieni milowych.'
  params:
    - desc: 'Kanał liczenia.'
      name: countingChannel
      optional: true
      type: text channel
    - desc: 'Kanał ogłoszeń kamieni milowych. Użyj null, aby wyłączyć.'
      name: milestoneChannel
      optional: true
      type: text channel
countingmilestonemessage:
  args:
    - channel embed
  desc: 'Ustawia niestandardową wiadomość dla osiągnięć kamieni milowych.'
  params:
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Szablon wiadomości. Użyj „-”, aby przywrócić domyślną.'
      name: embed
      optional: true
      type: string
countingmilestones:
  args:
    - channel milestones
  desc: 'Ustawia niestandardowe liczby kamieni milowych.'
  params:
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Liczby kamieni milowych rozdzielone przecinkami (np. 50,100,250,500,1000).'
      name: milestones
      optional: true
      type: string
countingreset:
  args:
    - channel newNumber reason
  desc: 'Resetuje liczenie na kanale do określonej liczby.'
  params:
    - desc: 'Kanał do zresetowania. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Liczba, do której zresetować. Domyślnie 0.'
      name: newNumber
      optional: true
      type: long
    - desc: 'Powód resetu.'
      name: reason
      optional: true
      type: string
countingrestore:
  args:
    - saveId channel
  desc: 'Przywraca liczenie z wcześniejszego punktu zapisu.'
  params:
    - desc: 'ID punktu zapisu, z którego przywrócić.'
      name: saveId
      optional: false
      type: int
    - desc: 'Kanał do przywrócenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
countingsave:
  args:
    - channel reason
  desc: 'Tworzy punkt zapisu dla bieżącego postępu liczenia.'
  params:
    - desc: 'Kanał do zapisania. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Powód utworzenia punktu zapisu.'
      name: reason
      optional: true
      type: string
countingsetup:
  args:
    - channel startNumber increment
  desc: 'Konfiguruje liczenie na bieżącym kanale lub na wskazanym kanale.'
  params:
    - desc: 'Kanał, na którym skonfigurować liczenie. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Liczba, od której zacząć liczenie. Domyślnie 1.'
      name: startNumber
      optional: true
      type: long
    - desc: 'Krok przy każdym liczeniu. Domyślnie 1.'
      name: increment
      optional: true
      type: int
countingstats:
  args:
    - user channel
  desc: 'Wyświetla statystyki liczenia dla użytkownika lub kanału.'
  params:
    - desc: 'Użytkownik, dla którego pokazać statystyki. Domyślnie ty.'
      name: user
      optional: true
      type: user
    - desc: 'Kanał, dla którego sprawdzić statystyki. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
countingstatus:
  args:
    - channel
  desc: 'Wyświetla aktualny status liczenia na kanale.'
  params:
    - desc: 'Kanał do sprawdzenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
countingsuccessmessage:
  args:
    - channel embed
  desc: 'Ustawia niestandardową wiadomość dla poprawnych liczb.'
  params:
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Szablon wiadomości. Użyj „-”, aby przywrócić domyślną.'
      name: embed
      optional: true
      type: string
countingtimeout:
  args:
    - user duration channel reason
  desc: 'Tymczasowo wycisza użytkownika w liczeniu.'
  params:
    - desc: 'Użytkownik do wyciszenia w liczeniu.'
      name: user
      optional: false
      type: guild user
    - desc: 'Czas trwania wyciszenia (np. 30m, 2h).'
      name: duration
      optional: false
      type: stoopid time
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Powód wyciszenia.'
      name: reason
      optional: true
      type: string
countingunban:
  args:
    - user channel reason
  desc: 'Odbanowuje użytkownika w liczeniu na określonym kanale.'
  params:
    - desc: 'Użytkownik do odbanowania w liczeniu.'
      name: user
      optional: false
      type: guild user
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Powód odbanowania.'
      name: reason
      optional: true
      type: string
countmodbanned:
  args:
    - channel roles...
  desc: 'Ustawia role zbanowane w liczeniu.'
  params:
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Role zbanowane w liczeniu.'
      name: roles
      optional: true
      type: role
countmodclear:
  args:
    - user channel
  desc: 'Czyści błędne liczby użytkownika na kanale liczenia.'
  params:
    - desc: 'Użytkownik, dla którego wyczyścić błędne liczby.'
      name: user
      optional: false
      type: user
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
countmodclearall:
  args:
    - channel
  desc: 'Czyści błędne liczby wszystkich użytkowników na kanale liczenia.'
  params:
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
countmoddefaults:
  args:
    - enabled threshold windowHours punishment durationMinutes punishmentRole
  desc: 'Ustawia domyślne ustawienia moderacji dla całego serwera.'
  params:
    - desc: 'Czy moderacja jest domyślnie włączona.'
      name: enabled
      optional: false
      type: bool
    - desc: 'Domyślny próg błędnych liczb przed karą.'
      name: threshold
      optional: true
      type: int
    - desc: 'Domyślne okno czasowe w godzinach do śledzenia błędnych liczb.'
      name: windowHours
      optional: true
      type: int
    - desc: 'Domyślne działanie karne do zastosowania.'
      name: punishment
      optional: true
      type: punishment action
    - desc: 'Domyślny czas trwania kar czasowych w minutach.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Domyślna rola dla kary typu AddRole.'
      name: punishmentRole
      optional: true
      type: role
countmodedits:
  args:
    - punish delete channel
  desc: 'Konfiguruje ochronę przed edycją wiadomości dla kanału liczenia.'
  params:
    - desc: 'Czy karać za edycję wiadomości jako naruszenie.'
      name: punish
      optional: false
      type: bool
    - desc: 'Czy usuwać edytowane wiadomości.'
      name: delete
      optional: true
      type: bool
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
countmodenable:
  args:
    - enabled channel
  desc: 'Włącza lub wyłącza moderację dla konkretnego kanału liczenia.'
  params:
    - desc: 'Czy włączyć, czy wyłączyć moderację.'
      name: enabled
      optional: false
      type: bool
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
countmodignore:
  args:
    - deleteMessages channel roles...
  desc: 'Ustawia role, które mają być ignorowane w liczeniu.'
  params:
    - desc: 'Czy usuwać wiadomości od ignorowanych ról.'
      name: deleteMessages
      optional: false
      type: bool
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Role do ignorowania w liczeniu.'
      name: roles
      optional: true
      type: role
countmodnonnumbers:
  args:
    - punish delete channel
  desc: 'Konfiguruje obsługę wiadomości niebędących liczbami na kanale liczenia.'
  params:
    - desc: 'Czy karać wiadomości niebędące liczbami jako naruszenia.'
      name: punish
      optional: false
      type: bool
    - desc: 'Czy usuwać wiadomości niebędące liczbami.'
      name: delete
      optional: true
      type: bool
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
countmodpunish:
  args:
    - count punishment durationMinutes role channel
  desc: 'Ustawia stopniową karę dla konkretnej błędnej liczby.'
  params:
    - desc: 'Błędna liczba, która uruchamia tę karę.'
      name: count
      optional: false
      type: int
    - desc: 'Działanie karne do zastosowania.'
      name: punishment
      optional: false
      type: punishment action
    - desc: 'Czas trwania kar czasowych w minutach.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Rola dla kary typu AddRole.'
      name: role
      optional: true
      type: role
    - desc: 'Kanał liczenia (NULL dla domyślnych ustawień serwera).'
      name: channel
      optional: true
      type: text channel
countmodpunishlist:
  args:
    - channel
  desc: 'Wyświetla wszystkie stopniowe kary dla serwera lub konkretnego kanału.'
  params:
    - desc: 'Kanał liczenia (NULL dla domyślnych ustawień serwera).'
      name: channel
      optional: true
      type: text channel
countmodpunishment:
  args:
    - punishment durationMinutes role channel
  desc: 'Ustawia karę za błędne liczby.'
  params:
    - desc: 'Działanie karne do zastosowania.'
      name: punishment
      optional: false
      type: punishment action
    - desc: 'Czas trwania kar czasowych w minutach.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Rola dla kary typu AddRole.'
      name: role
      optional: true
      type: role
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
countmodrequired:
  args:
    - channel roles...
  desc: 'Ustawia role wymagane do liczenia.'
  params:
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Role wymagane do liczenia.'
      name: roles
      optional: true
      type: role
countmodreset:
  args:
    - channel
  desc: 'Resetuje kanał, aby używał domyślnych ustawień serwera.'
  params:
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
countmodshow:
  args:
    - channel
  desc: 'Pokazuje aktualną konfigurację moderacji dla kanału liczenia lub domyślne ustawienia serwera.'
  params:
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
countmodthreshold:
  args:
    - threshold channel
  desc: 'Ustawia próg błędnych liczb dla kanału liczenia.'
  params:
    - desc: 'Liczba błędnych liczb przed karą (1–100).'
      name: threshold
      optional: false
      type: int
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel
countmodunpunish:
  args:
    - count channel
  desc: 'Usuwa stopniową karę dla konkretnej błędnej liczby.'
  params:
    - desc: 'Błędna liczba, dla której usunąć karę.'
      name: count
      optional: false
      type: int
    - desc: 'Kanał liczenia (NULL dla domyślnych ustawień serwera).'
      name: channel
      optional: true
      type: text channel
countmodwindow:
  args:
    - hours channel
  desc: 'Ustawia okno czasowe do śledzenia błędnych liczb.'
  params:
    - desc: 'Okno czasowe w godzinach (1–168).'
      name: hours
      optional: false
      type: int
    - desc: 'Kanał liczenia. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: text channel