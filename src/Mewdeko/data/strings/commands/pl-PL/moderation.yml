banprune:
  args:
    - ''
  desc: 'Pokazuje czyszczenie wiadomości (purge), jakie użyłaby kara banem wydana na tym kanale, wraz z wszystkimi skonfigurowanymi ustawieniami.'
  params:
    - { }
banpruneset:
  args:
    - '<action> <days> [#channel]'
  desc: 'Określa, z ilu dni wiadomości usuwa jedno działanie banem. Użyj „all” dla wszystkich działań, a kanał lub kategorię podaj, aby nadpisać tylko ten zakres.'
  params:
    - desc: 'Klucz działania lub „all”, aby objąć wszystkie działania.'
      name: action
      optional: false
      type: string
    - desc: 'Czyszczenie w dniach, od 0 do 7.'
      name: days
      optional: false
      type: int
    - desc: 'Kanał lub kategoria, do której zawęzić ustawienie, albo nic dla domyślnego ustawienia serwera.'
      name: target
      optional: true
      type: channel
banpruneclear:
  args:
    - '<action> [#channel]'
  desc: 'Usuwa ustawienie czyszczenia, tak aby działanie wróciło do szerszego zakresu lub domyślnego.'
  params:
    - desc: 'Klucz działania lub „all” dla ustawienia obejmującego wszystkie działania.'
      name: action
      optional: false
      type: string
    - desc: 'Kanał lub kategoria, której dotyczy ustawienie, albo nic dla domyślnego ustawienia serwera.'
      name: target
      optional: true
      type: channel
banprunereset:
  args:
    - ''
  desc: 'Usuwa wszystkie ustawienia czyszczenia na serwerze.'
  params:
    - { }
ban:
  args:
    - '<pruneTime> <time> [@user] [msg]'
    - time time
  desc: 'Banuje użytkownika z podanym powodem i liczbą dni wiadomości do usunięcia.'
  params:
    - desc: 'Banuje użytkownika z podanym powodem i liczbą dni wiadomości do usunięcia.'
      name: pruneTime
      optional: false
      type: duration
    - desc: 'Czas, z którego usunąć wiadomości'
      name: time
      optional: false
      type: duration
    - desc: 'Użytkownik do zbanowania'
      name: user
      optional: true
      type: user
    - desc: 'Powód bana'
      name: msg
      optional: true
      type: string
