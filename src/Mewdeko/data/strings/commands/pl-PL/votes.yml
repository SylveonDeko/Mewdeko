votemessage:
  args:
    - '[message]'
  desc: 'Ustawia własną wiadomość wysyłaną, gdy użytkownik zagłosuje, lub wyświetla podgląd obecnej wiadomości o głosowaniu.'
  params:
    - desc: 'Własna wiadomość dla głosów. Użyj "-", aby przywrócić domyślną. Jeśli null, wyświetla podgląd obecnej wiadomości.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: 'Rozpoczyna proces potwierdzenia ustawienia nowego hasła do głosowania i ostrzega użytkownika o jego bezpieczeństwie.'
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: 'Dodaje rolę, która zostanie przyznana użytkownikom po oddaniu głosu, z opcjonalnym czasem trwania, po którym rola zostanie automatycznie usunięta.'
  params:
    - desc: 'Rola do dodania jako nagroda za głosowanie.'
      name: role
      optional: false
      type: role
    - desc: 'Czas, przez jaki rola będzie przyznana. Null oznacza bezterminowo.'
      name: time
      optional: true
      type: duration
