votes:
  args:
    - '[@user]'
  desc: >-
    Wyświetla całkowitą liczbę głosów oddanych przez konkretnego użytkownika
    lub wywołującego polecenie.
  params:
    - desc: 'Użytkownik, którego głosy zliczać. Jeśli null, zlicza głosy wywołującego polecenie.'
      name: user
      optional: true
      type: user
votesleaderboard:
  args:
    - false
  desc: >-
    Wyświetla ranking użytkowników na podstawie liczby głosów, opcjonalnie
    filtrując głosy z bieżącego miesiąca.
