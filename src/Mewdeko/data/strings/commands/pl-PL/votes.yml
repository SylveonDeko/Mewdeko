votechannel:
  args:
    - channel
  desc: >-
    Ustawia wskazany kanał tekstowy jako kanał głosowania, gdzie będą wysyłane
    wszystkie potwierdzenia głosów.
  params:
    - &ref_646
      desc: 'Kanał tekstowy do ustawienia jako kanał głosowania.'
      name: channel
      optional: false
      type: ITextChannel
