votemessage:
  args:
    - '[message]'
  desc: >-
    Ustawia niestandardową wiadomość wysyłaną gdy użytkownik głosuje lub
    podgląda aktualną wiadomość głosowania.
  params:
    - desc: 'Niestandardowa wiadomość dla głosowań. Użyj "-" aby zresetować do domyślnej. Jeśli null, podgląda aktualną wiadomość głosowania.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: >-
    Inicjuje proces potwierdzenia ustawienia nowego hasła głosowania, ostrzegając
    użytkownika o jego bezpieczeństwie.
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: >-
    Dodaje rolę przyznawaną użytkownikom gdy głosują, z opcjonalnym czasem
    trwania do automatycznego usunięcia roli.
  params:
    - desc: 'Rola do dodania jako nagroda za głosowanie.'
      name: role
      optional: false
      type: role
    - desc: 'Czas trwania przyznania roli. Null dla bezterminowego.'
      name: time
      optional: true
      type: duration
