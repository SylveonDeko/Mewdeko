birthdayannouncements:
  args:
    - ''
  desc: 'Przełącza ogłoszenia urodzinowe dla użytkownika.'
  params: [ ]
birthdaychannel:
  args:
    - '#channel'
  desc: 'Ustawia kanał ogłoszeń urodzinowych.'
  params:
    - desc: 'Kanał tekstowy do ogłoszeń. Jeśli nie podano, używany jest bieżący kanał.'
      name: channel
      optional: true
      type: ITextChannel
birthdayconfig:
  args:
    - ''
  desc: 'Wyświetla aktualną konfigurację urodzin.'
  params: [ ]
birthdaylist:
  args:
    - days
  desc: 'Pokazuje nadchodzące urodziny na serwerze.'
  params:
    - desc: 'Ile dni wyprzedzić. Domyślnie 7, maksymalnie 30.'
      name: days
      optional: true
      type: int
birthdaymessage:
  args:
    - message
  desc: 'Ustawia niestandardowy szablon wiadomości urodzinowej.'
  params:
    - desc: 'Szablon wiadomości. Użyj {user}, aby oznaczyć użytkownika. Jeśli pole jest puste, pokazuje aktualną wiadomość.'
      name: message
      optional: true
      type: string
birthdaypingrole:
  args:
    - '@role'
  desc: 'Ustawia rolę, którą oznaczać przy ogłaszaniu urodzin.'
  params:
    - desc: 'Rola do oznaczenia. Nie podawaj roli, aby to wyłączyć.'
      name: role
      optional: true
      type: IRole
birthdayrole:
  args:
    - '@role'
  desc: 'Ustawia rolę urodzinową, którą użytkownicy otrzymują w dniu swoich urodzin.'
  params:
    - desc: 'Rola przypisywana w dniu urodzin użytkownika. Nie podawaj roli, aby to wyłączyć.'
      name: role
      optional: true
      type: IRole
birthdaytimezone:
  args:
    - timezone
  desc: 'Ustawia strefę czasową użytkownika do obliczeń urodzinowych.'
  params:
    - desc: 'Strefa czasowa do ustawienia (np. „America/New_York”).'
      name: timezone
      optional: false
      type: string
birthdaytoday:
  args:
    - ''
  desc: 'Pokazuje dzisiejsze urodziny.'
  params: [ ]