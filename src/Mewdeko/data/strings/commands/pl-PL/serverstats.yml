serveractivity:
  args:
    - '[days]'
    - '7'
    - '0'
  desc: 'Wyświetla podsumowanie aktywności serwera za wskazany okres: wiadomości, czas na kanałach głosowych, współtwórców, dołączenia i opuszczenia oraz najaktywniejszego członka i kanały. Użyj 0 dla całego czasu.'
  params:
    - desc: 'Okres w dniach, 0 dla całego czasu lub pominięte dla domyślnego ustawienia serwera.'
      name: days
      optional: true
      type: int
useractivity:
  args:
    - '[@user] [days]'
    - '@user 30'
  desc: 'Wyświetla podsumowanie aktywności członka za wskazany okres: wiadomości i czas na kanałach głosowych z rankingami, sumy za cały czas i jego najczęściej używane kanały.'
  params:
    - desc: 'Członek lub pominięte, aby wybrać siebie.'
      name: user
      optional: true
      type: IGuildUser
    - desc: 'Okres w dniach, 0 dla całego czasu lub pominięte dla domyślnego ustawienia serwera.'
      name: days
      optional: true
      type: int
channelactivity:
  args:
    - '[#channel] [days]'
  desc: 'Wyświetla podsumowanie aktywności kanału za wskazany okres: wiadomości, czas na kanałach głosowych, współtwórców i jego najaktywniejszych członków.'
  params:
    - desc: 'Kanał lub pominięte dla obecnego.'
      name: channel
      optional: true
      type: IGuildChannel
    - desc: 'Okres w dniach, 0 dla całego czasu lub pominięte dla domyślnego ustawienia serwera.'
      name: days
      optional: true
      type: int
activitytop:
  args:
    - '[Messages|Voice] [days] [@role]'
    - 'Voice 7'
  desc: 'Ustawia członków w rankingu według wiadomości lub czasu na kanałach głosowych w danym okresie, opcjonalnie tylko członków z określoną rolą.'
  params:
    - desc: 'Messages lub Voice.'
      name: kind
      optional: true
      type: StatKind
    - desc: 'Okres w dniach, 0 dla całego czasu lub pominięte dla domyślnego ustawienia serwera.'
      name: days
      optional: true
      type: int
    - desc: 'Uwzględnij tylko członków z tą rolą.'
      name: role
      optional: true
      type: IRole
activitytopchannels:
  args:
    - '[Messages|Voice] [days]'
  desc: 'Ustawia kanały w rankingu według wiadomości lub czasu na kanałach głosowych w danym okresie.'
  params:
    - desc: 'Messages lub Voice.'
      name: kind
      optional: true
      type: StatKind
    - desc: 'Okres w dniach, 0 dla całego czasu lub pominięte dla domyślnego ustawienia serwera.'
      name: days
      optional: true
      type: int
activitychart:
  args:
    - '[Messages|Voice|Members|Status|Joins|Leaves|Growth|InVoice] [days]'
    - 'Members 30'
  desc: 'Rysuje wykres wiadomości, godzin na kanałach głosowych, liczby członków, statusu członków, dołączeń, opuszczeń, wzrostu lub członków na kanałach głosowych w danym okresie.'
  params:
    - desc: 'Co narysować na wykresie.'
      name: kind
      optional: true
      type: StatChartKind
    - desc: 'Okres w dniach, od 1 do 90, lub pominięte dla domyślnego ustawienia serwera.'
      name: days
      optional: true
      type: int
activityexport:
  args:
    - '[Messages|Voice] [days]'
  desc: 'Eksportuje ranking członków według wiadomości lub czasu na kanałach głosowych jako plik CSV.'
  params:
    - desc: 'Messages lub Voice.'
      name: kind
      optional: true
      type: StatKind
    - desc: 'Okres w dniach, 0 dla całego czasu lub pominięte dla domyślnego ustawienia serwera.'
      name: days
      optional: true
      type: int
statssettings:
  args:
    - ''
  desc: 'Wyświetla ustawienia śledzenia statystyk aktywności.'
  params: [ ]
statslookback:
  args:
    - '14'
  desc: 'Ustawia domyślny okres w dniach, używany przez komendy statystyk, gdy nie podano żadnego.'
  params:
    - desc: 'Okres w dniach, od 1 do 90.'
      name: days
      optional: false
      type: int
statscooldown:
  args:
    - '30'
  desc: 'Ustawia, ile sekund musi upłynąć między dwiema liczonymi wiadomościami od tego samego członka. 0 liczy każdą wiadomość.'
  params:
    - desc: 'Czas odnowienia w sekundach, od 0 do 300.'
      name: seconds
      optional: false
      type: int
statstrackvoice:
  args:
    - ''
  desc: 'Przełącza śledzenie czasu na kanałach głosowych w statystykach aktywności.'
  params: [ ]
statstracksnapshots:
  args:
    - ''
  desc: 'Przełącza migawki członków i statusów co godzinę, używane do wykresów członków i statusów.'
  params: [ ]
statscountbots:
  args:
    - ''
  desc: 'Przełącza, czy boty są wliczane do statystyk aktywności.'
  params: [ ]
statsignorevoicestate:
  args:
    - 'SelfMuted'
    - 'Afk'
  desc: 'Przełącza, czy czas spędzony w stanie głosowym (SelfMuted, SelfDeafened, ServerMuted, ServerDeafened, Afk, Alone, Streaming, Video) liczy się do statystyk głosowych.'
  params:
    - desc: 'Stan do przełączenia.'
      name: state
      optional: false
      type: VoiceStateFlags
statsignore:
  args:
    - '#channel'
    - '@role'
    - '@user'
  desc: 'Przełącza, czy kanał, każdy posiadacz roli lub członek są wykluczani ze statystyk aktywności.'
  params:
    - desc: 'Kanał do przełączenia.'
      name: channel
      optional: false
      type: IGuildChannel
    - desc: 'Rola do przełączenia.'
      name: role
      optional: false
      type: IRole
    - desc: 'Członek do przełączenia.'
      name: user
      optional: false
      type: IGuildUser
statsignored:
  args:
    - ''
  desc: 'Wyświetla kanały, role i członków wykluczonych ze statystyk aktywności.'
  params: [ ]
statsprivacy:
  args:
    - ''
  desc: 'Wyłącza Cię ze statystyk aktywności na każdym serwerze, trwale usuwając Twoje zapisane statystyki wiadomości i głosu, lub ponownie Cię włącza.'
  params: [ ]
topgames:
  args:
    - '[days]'
    - '30'
  desc: 'Ranking gier i aplikacji, w których członkowie spędzają najwięcej czasu w danym okresie, wraz z liczbą graczy. Wymaga włączonego śledzenia gier.'
  params:
    - desc: 'Okres w dniach, 0 dla całego czasu lub pominięte dla domyślnego ustawienia serwera.'
      name: days
      optional: true
      type: int
whoplays:
  args:
    - 'Minecraft'
  desc: 'Pokazuje, kto gra w grę lub używa aplikacji: ilu członków jest w niej obecnie i członków z największym czasem spędzonym w niej.'
  params:
    - desc: 'Nazwa gry lub aplikacji.'
      name: game
      optional: false
      type: string
statstrackactivities:
  args:
    - ''
  desc: 'Przełącza śledzenie gier i aplikacji używanych przez członków (grają, streamują, słuchają, oglądają, rywalizują). Domyślnie wyłączone.'
  params: [ ]
statsverifyactivities:
  args:
    - ''
  desc: 'Przełącza, czy liczą się tylko aktywności powiązane z aplikacją Discord, Spotify lub strumieniem, co blokuje statusy podrobione przez niestandardowe klienty.'
  params: [ ]
statsactivityfiltermode:
  args:
    - 'Whitelist'
    - 'Blacklist'
  desc: 'Ustawia, czy lista filtrów aktywności pozwala tylko na wymienione gry (Whitelist), czy je ignoruje (Blacklist).'
  params:
    - desc: 'Whitelist lub Blacklist.'
      name: mode
      optional: false
      type: ActivityFilterMode
statsactivityfilter:
  args:
    - 'Spotify'
  desc: 'Przełącza nazwę gry lub aplikacji na liście filtrów aktywności.'
  params:
    - desc: 'Nazwa aktywności.'
      name: name
      optional: false
      type: string
statsactivityfilters:
  args:
    - ''
  desc: 'Wyświetla filtr aktywności i informację, czy jest to biała, czy czarna lista.'
  params: [ ]
liveboardadd:
  args:
    - '#channel InviteLeaderboard [Weekly] [entries] [intervalMinutes]'
    - '#stats GrowthChart Monthly'
  desc: 'Publikuje tablicę wyników, wykres lub przegląd, który bot stale odświeża i przypina. Rodzaje: InviteLeaderboard, MessageLeaderboard, VoiceLeaderboard, JoinsChart, LeavesChart, GrowthChart, MembersChart, MessagesChart, ServerOverview, InviteStats.'
  params:
    - desc: 'Kanał, na którym opublikować.'
      name: channel
      optional: false
      type: ITextChannel
    - desc: 'Co pokazać.'
      name: kind
      optional: false
      type: LiveBoardKind
    - desc: 'Okres: AllTime, Daily, Weekly lub Monthly.'
      name: range
      optional: true
      type: StatsRange
    - desc: 'Wiersze dla tablic wyników, od 3 do 25.'
      name: entries
      optional: true
      type: int
    - desc: 'Jak często odświeżać, co najmniej 5 minut.'
      name: intervalMinutes
      optional: true
      type: int
liveboardlist:
  args:
    - ''
  desc: 'Wyświetla aktywne tablice.'
  params: [ ]
liveboardremove:
  args:
    - '3'
  desc: 'Usuwa aktywną tablicę i jej wiadomość.'
  params:
    - desc: 'ID tablicy z listy.'
      name: id
      optional: false
      type: int
liveboardrefresh:
  args:
    - ''
  desc: 'Odświeża teraz wszystkie aktywne tablice.'
  params: [ ]
serverreportchannel:
  args:
    - '[#channel]'
  desc: 'Ustawia kanał, który otrzymuje zaplanowane raporty serwera, i je włącza. Pomiń kanał, aby wyłączyć raporty.'
  params:
    - desc: 'Kanał lub pominięte, aby wyłączyć.'
      name: channel
      optional: true
      type: ITextChannel
serverreportfrequency:
  args:
    - 'Weekly'
  desc: 'Ustawia, jak często publikowane są raporty serwera: Daily, Weekly lub Monthly.'
  params:
    - desc: 'Daily, Weekly lub Monthly.'
      name: frequency
      optional: false
      type: ReportFrequency
serverreportnow:
  args:
    - '[Weekly]'
  desc: 'Publikuje raport serwera od razu na obecnym kanale, obejmujący podany okres lub skonfigurowany.'
  params:
    - desc: 'Okres do objęcia lub pominięte dla skonfigurowanego.'
      name: frequency
      optional: true
      type: ReportFrequency
