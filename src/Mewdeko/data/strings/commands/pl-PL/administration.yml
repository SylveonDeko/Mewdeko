adsarm:
  args:
    - ''
  desc: 'Przełącza automatyczne usuwanie wiadomości z reklamami serwerów.'
  params: [ ]
antialt:
  args:
    - ''
  desc: 'Konfiguruje ochronę Anti-Alt dla serwera: minimalny wiek konta oraz działanie karne z karą opartą na roli.'
  params: [ ]
antipattern:
  args:
    - ''
  desc: 'Konfiguruje ochronę Anti-Pattern dla serwera: działanie karne z karą opartą na roli.'
  params: [ ]
antipattern_PunishmentAction_=:
  args:
    - '<action> [punishTime]'
    - action
  desc: 'Konfiguruje ochronę Anti-Pattern dla serwera: działanie karne z karą opartą na roli.'
  params:
    - desc: 'Działanie karne wobec wykrytych dopasowań wzorca.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'Czas trwania kary, jeśli dotyczy.'
      name: punishTime
      optional: true
      type: StoopidTime
antipattern_PunishmentAction_IRole:
  args:
    - action @role
  desc: 'Konfiguruje ochronę Anti-Pattern dla serwera: działanie karne z karą opartą na roli.'
  params:
    - desc: 'Działanie karne wobec wykrytych dopasowań wzorca.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'Rola przypisywana użytkownikom pasującym do wzorców.'
      name: role
      optional: false
      type: IRole
patternadd:
  args:
    - '<pattern> [name] [checkUsername] [checkDisplayName]'
    - pattern
  desc: 'Dodaje wzorzec regex do ochrony Anti-Pattern.'
  params:
    - desc: 'Wzorzec regex, według którego sprawdzane są nazwy użytkowników i wyświetlane nazwy.'
      name: pattern
      optional: false
      type: string
    - desc: 'Opcjonalna nazwa wzorca.'
      name: name
      optional: true
      type: string
    - desc: 'Czy sprawdzać nazwy użytkowników według tego wzorca (domyślnie true).'
      name: checkUsername
      optional: true
      type: bool
    - desc: 'Czy sprawdzać wyświetlane nazwy według tego wzorca (domyślnie true).'
      name: checkDisplayName
      optional: true
      type: bool
patternremove:
  args:
    - number
  desc: 'Usuwa wzorzec z ochrony Anti-Pattern.'
  params:
    - desc: 'ID wzorca do usunięcia.'
      name: patternId
      optional: false
      type: int
patternlist:
  args:
    - ''
  desc: 'Wyświetla wszystkie wzorce skonfigurowane dla ochrony Anti-Pattern.'
  params: [ ]
patternconfig:
  args:
    - ''
  desc: 'Pokazuje aktualną konfigurację anti-pattern.'
  params: [ ]
patternconfig_string_string:
  args:
    - setting value
  desc: 'Pokazuje aktualną konfigurację anti-pattern.'
  params:
    - desc: 'Ustawienie do skonfigurowania.'
      name: setting
      optional: false
      type: string
    - desc: 'Wartość do ustawienia.'
      name: value
      optional: false
      type: string
