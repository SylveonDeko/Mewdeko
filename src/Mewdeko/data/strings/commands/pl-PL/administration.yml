  args:
    - ''
  desc: 'Konfiguruje ochronę Anti-Mass-Mention dla serwera: próg wzmianek w jednej wiadomości, okno czasowe śledzenia wzmianek, maksymalną liczbę wzmianek w tym oknie oraz działanie karne z karą opartą na roli.'
  params: [ ]
antimassmention_int_int_int_bool_PunishmentAction_=:
  args:
    - '<mentionThreshold> <timeWindowSeconds> <maxMentionsInTimeWindow> <ignoreBots> <action> [punishTime]'
    - number number number true|false action
  desc: 'Konfiguruje ochronę Anti-Mass-Mention dla serwera: próg wzmianek w jednej wiadomości, okno czasowe śledzenia wzmianek, maksymalną liczbę wzmianek w tym oknie oraz działanie karne z karą opartą na roli.'
  params:
    - desc: 'Liczba wzmianek dozwolonych w jednej wiadomości, po przekroczeniu której uruchamia się ochrona.'
      name: mentionThreshold
      optional: false
      type: int
    - desc: 'Okno czasowe (w sekundach), w którym obserwowane są wzmianki.'
      name: timeWindowSeconds
      optional: false
      type: int
    - desc: 'Maksymalna liczba wzmianek dozwolona w podanym oknie czasowym.'
      name: maxMentionsInTimeWindow
      optional: false
      type: int
    - desc: 'Czy ignorować konta botów przy śledzeniu wzmianek.'
      name: ignoreBots
      optional: false
      type: bool
    - desc: 'Działanie karne wobec użytkowników przekraczających limity wzmianek.'
      name: action
      optional: false
      type: punishment
    - desc: 'Konfiguruje ochronę Anti-Mass-Mention dla serwera: próg wzmianek w jednej wiadomości, okno czasowe śledzenia wzmianek, maksymalną liczbę wzmianek w tym oknie oraz działanie karne z karą opartą na roli.'
