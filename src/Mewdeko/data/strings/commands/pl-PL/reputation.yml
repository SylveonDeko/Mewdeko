      name: target
      optional: false
      type: string
reprole:
  args:
    - ''
    - detailed
    - '@role'
    - '@role 100'
    - '@role 100 false #channel true 50'
  desc: 'Zarządza nagrodami za kamienie milowe reputacji. Użyj bez parametrów, aby wyświetlić wszystkie nagrody, lub podaj rolę i reputację, aby dodać lub zaktualizować nagrodę z opcjonalnymi ustawieniami zaawansowanymi.'
  params:
    - &ref_437
      desc: 'Rola do przyznania (opcjonalne przy wyświetlaniu listy).'
      name: role
      optional: true
      type: IRole
    - desc: 'Reputacja wymagana do zdobycia tej roli (opcjonalne przy wyświetlaniu listy).'
      name: reputation
      optional: true
      type: int
    - desc: 'Czy usunąć rolę, jeśli reputacja spadnie.'
      name: removeOnDrop
      optional: true
      type: bool
    - desc: 'Opcjonalny kanał do ogłaszania przyznania roli.'
      name: announceChannel
      optional: true
      type: ITextChannel
    - desc: 'Czy wysyłać powiadomienia w wiadomościach prywatnych.'
      name: announceDm
      optional: true
      type: bool
    - desc: 'Opcjonalna nagroda XP za osiągnięcie kamienia milowego.'
      name: xpReward
      optional: true
      type: int
    - desc: 'Pokazuje szczegółowe informacje podczas wyświetlania listy (użyj "detailed" jako pierwszego parametru).'
      name: detailed
      optional: true
      type: string
reprolechannel:
  args:
    - role channel
  desc: 'Ustawia kanał ogłoszeń dla nagrody roli.'
  params:
    - desc: 'Rola do skonfigurowania.'
      name: role
      optional: false
      type: IRole
    - desc: 'Kanał ogłoszeń (null, aby wyłączyć).'
      name: channel
      optional: true
      type: ITextChannel
reproleremove:
  args:
    - '@role'
  desc: 'Usuwa konfigurację nagrody roli.'
  params:
    - desc: 'Rola do usunięcia z nagród.'
      name: role
      optional: true
      type: IRole
