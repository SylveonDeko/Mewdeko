    - commandname 50 helper
    - 'commandname 50 helper #channel1 #channel2'
  desc: 'Ustawia wymagania reputacji dla polecenia, opcjonalnie ograniczone do wybranych kanałów.'
  params:
    - desc: 'Nazwa polecenia.'
      name: commandName
      optional: false
      type: string
    - desc: 'Minimalna wymagana reputacja.'
      name: minReputation
      optional: false
      type: int
    - desc: 'Konkretny wymagany typ reputacji (opcjonalny, domyślnie total).'
      name: repType
      optional: true
      type: string
    - desc: 'Opcjonalne kanały, do których odnosi się wymóg (jeśli nie podano, dotyczy globalnie).'
      name: channels
      optional: true
      type: ITextChannel[]
