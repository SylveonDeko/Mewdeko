customafkmessage:
  args:
    - text
  desc: >-
    Ustawia niestandardowy embed AFK wyswietlany, gdy uzytkownik jest AFK.
    Uzyj "-", aby przywrocic domyslny embed. Sprawdz
    https://eb.mewdeko.tech dla konstruktora embedow i
    http://mewdeko.tech/placeholders dla symboli zastepczych.
  params:
    - &ref_175
      desc: 'Niestandardowa wiadomosc do ustawienia. Uzyj "-", aby przywrocic domyslna wiadomosc.'
      name: embedCode
      optional: false
