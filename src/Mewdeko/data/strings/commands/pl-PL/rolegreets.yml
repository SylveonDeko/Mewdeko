rolegreetadd:
  args:
    - '@role [@channel]'
    - '@role'
  desc: 'Dodaje nową wiadomość powitalną roli dla określonej roli. Jeśli nie podano kanału, używany jest bieżący kanał.'
  params:
    - desc: 'Rola, dla której ustawiana jest wiadomość powitalna.'
      name: role
      optional: false
      type: role
    - desc: 'Kanał tekstowy, na który zostanie wysłana wiadomość powitalna. Opcjonalnie.'
      name: channel
      optional: true
      type: channel
