patreonanalytics:
  args:
    - ''
  desc: 'Pokazuje szczegółową analitykę Patreon'
  params: [ ]
patreonannounce:
  args:
    - ''
  desc: 'Ręcznie uruchamia ogłoszenie Patreon.'
  params: [ ]
patreonch:
  args:
    - '#channel'
  desc: 'Ustawia lub pokazuje kanał ogłoszeń Patreon.'
  params:
    - desc: 'Kanał do ustawienia dla ogłoszeń Patreon. Jeśli null, pokazuje bieżący kanał.'
      name: channel
      optional: true
      type: ITextChannel?
patreonconfig:
  args:
    - ''
  desc: 'Pokazuje aktualną konfigurację Patreon dla tego serwera.'
  params: [ ]
patreonday:
  args:
    - number
  desc: 'Ustawia dzień miesiąca dla ogłoszeń Patreon.'
  params:
    - desc: 'Dzień miesiąca (1–28) dla ogłoszeń. Jeśli null, pokazuje bieżący dzień.'
      name: day
      optional: true
      type: int?
patreondisable:
  args:
    - ''
  desc: 'Wyłącza ogłoszenia Patreon dla tego serwera.'
  params: [ ]
patreonhelp:
  args:
    - ''
  desc: 'Pokazuje informacje o module Patreon i dostępne symbole zastępcze.'
  params: [ ]
patreonlink:
  args:
    - '@user text'
  desc: 'Łączy użytkownika Discorda z supporterem Patreon'
  params:
    - desc: 'Użytkownik Discorda do połączenia.'
      name: user
      optional: false
      type: IGuildUser
    - desc: 'ID użytkownika Patreon do połączenia.'
      name: patreonUserId
      optional: false
      type: string
patreonmsg:
  args:
    - text
  desc: 'Ustawia własną wiadomość dla ogłoszeń Patreon.'
  params:
    - desc: 'Własna wiadomość. Użyj symboli zastępczych, np. %server.name%, %month% itd. Użyj „-”, aby przywrócić domyślną.'
      name: message
      optional: true
      type: string?
patreonrecognize:
  args:
    - '#channel'
  desc: 'Wysyła wiadomości z podziękowaniem dla nowych supporterów'
  params:
    - desc: 'Kanał, na który wysyłać wiadomości z podziękowaniem.'
      name: channel
      optional: true
      type: ITextChannel?
patreonroles:
  args:
    - ''
  desc: 'Wyświetla mapowania poziomów Patreon na role'
  params: [ ]
patreonrolesync:
  args:
    - ''
  desc: 'Przełącza automatyczną synchronizację ról'
  params: [ ]
patreonstats:
  args:
    - ''
  desc: 'Pokazuje statystyki supporterów Patreon'
  params: [ ]
patreonsupporters:
  args:
    - ''
  desc: 'Wyświetla aktywnych supporterów Patreon'
  params: [ ]
patreonsync:
  args:
    - ''
  desc: 'Bezpiecznie konfiguruje integrację OAuth z Patreon'
  params: [ ]
patreonsyncall:
  args:
    - ''
  desc: 'Synchronizuje role wszystkich połączonych supporterów'
  params: [ ]
patreontiermap:
  args:
    - text @role
  desc: 'Mapuje poziom Patreon na rolę Discorda'
  params:
    - desc: 'ID poziomu Patreon.'
      name: tierId
      optional: false
      type: string
    - desc: 'Rola Discorda, na którą zmapować poziom.'
      name: role
      optional: false
      type: IRole
patreontoggle:
  args:
    - ''
  desc: 'Włącza lub wyłącza ogłoszenia Patreon.'
  params: [ ]
patreontop:
  args:
    - number
  desc: 'Pokazuje najlepszych supporterów Patreon'
  params:
    - desc: 'Liczba najlepszych supporterów do pokazania (1–20).'
      name: count
      optional: true
      type: int