mcstatus:
  args:
    - '[server name or address]'
  desc: 'Sprawdza status serwera Minecraft. Użyj zarejestrowanej nazwy serwera, bezpośredniego adresu lub zostaw puste dla domyślnego serwera.'
  params:
    - desc: 'Zarejestrowana nazwa serwera lub bezpośredni adres (np. play.example.com:25565).'
      name: serverName
      optional: true
      type: string
mcadd:
  args:
    - name address
  desc: 'Dodaje serwer Minecraft do tego serwera Discord. Przed adresem wpisz bedrock:, jeśli to serwer Bedrock.'
  params:
    - desc: 'Etykieta serwera.'
      name: name
      optional: false
      type: string
    - desc: 'Adres serwera, opcjonalnie z portem (np. play.example.com:25565 lub bedrock:play.example.com).'
      name: address
      optional: false
      type: string
mcremove:
  args:
    - name
  desc: 'Usuwa serwer Minecraft z tego serwera.'
  params:
    - desc: 'Nazwa serwera do usunięcia.'
      name: name
      optional: false
      type: string
mclist:
  args:
    - ''
  desc: 'Wyświetla wszystkie zarejestrowane serwery Minecraft na tym serwerze.'
  params: [ ]
mcdefault:
  args:
    - name
  desc: 'Ustawia serwer jako domyślny dla poleceń statusu.'
  params:
    - desc: 'Nazwa serwera do ustawienia jako domyślny.'
      name: name
      optional: false
      type: string
mcwatch:
  args:
    - name '#channel'
  desc: 'Ustawia kanał, na którym będą pojawiać się okresowe aktualizacje statusu serwera. Pomiń kanał, aby wyłączyć.'
  params:
    - desc: 'Nazwa serwera do obserwowania.'
      name: serverName
      optional: false
      type: string
    - desc: 'Kanał, na którym publikować aktualizacje.'
      name: channel
      optional: true
      type: ITextChannel
mcwatchmode:
  args:
    - name embed|topic|both
  desc: 'Ustawia sposób wyświetlania statusu serwera: embed (edytowany w miejscu), temat kanału lub oba.'
  params:
    - desc: 'Nazwa serwera.'
      name: serverName
      optional: false
      type: string
    - desc: 'Tryb obserwacji: Embed, ChannelTopic lub Both.'
      name: mode
      optional: false
      type: McWatchMode
mcembed:
  args:
    - name template
  desc: 'Ustawia niestandardowy szablon embeda dla obserwowanego serwera. Użyj „-”, aby zresetować. Symbole zastępcze: %mc.server.name%, %mc.players.online%, %mc.players.max%, %mc.motd%, %mc.version%, %mc.latency%, %mc.online%, %mc.favicon%.'
  params:
    - desc: 'Nazwa serwera.'
      name: serverName
      optional: false
      type: string
    - desc: 'JSON szablonu embeda lub „-”, aby przywrócić domyślny.'
      name: template
      optional: true
      type: string
mcplayer:
  args:
    - username
  desc: 'Wyszukuje gracza Minecraft po nazwie użytkownika i wyświetla jego profil oraz skórkę.'
  params:
    - desc: 'Nazwa użytkownika Minecraft do wyszukania.'
      name: username
      optional: false
      type: string
mcskin:
  args:
    - username
  desc: 'Wyświetla renderowaną skórkę gracza Minecraft.'
  params:
    - desc: 'Nazwa użytkownika Minecraft.'
      name: username
      optional: false
      type: string
mcrcon:
  args:
    - name command
  desc: 'Wysyła polecenie RCON do zarejestrowanego serwera Minecraft. RCON musi być skonfigurowany w panelu.'
  params:
    - desc: 'Nazwa serwera.'
      name: serverName
      optional: false
      type: string
    - desc: 'Polecenie do wykonania na serwerze.'
      name: command
      optional: false
      type: string
mcwhitelist:
  args:
    - name add|remove|list|on|off|reload [player]
  desc: 'Zarządza białą listą na serwerze Minecraft przez RCON. Wymaga skonfigurowanego RCON.'
  params:
    - desc: 'Nazwa serwera.'
      name: serverName
      optional: false
      type: string
    - desc: 'Działanie: add, remove, list, on, off, reload.'
      name: action
      optional: false
      type: string
    - desc: 'Nazwa gracza (dla add/remove).'
      name: playerName
      optional: true
      type: string
