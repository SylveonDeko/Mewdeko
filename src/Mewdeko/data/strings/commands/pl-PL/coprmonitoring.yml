coprmonitoradd:
  args:
    - '<ownerProject> [channel] [packages]'
    - '<ownerProject> [channel] [packages]'
    - ownerProject
  desc: 'Dodaje do serwera monitor projektu COPR.'
  params:
    - desc: 'Projekt COPR w formacie właściciel/projekt (np. linux4switch/l4s).'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Opcjonalny kanał powiadomień. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: ITextChannel
    - desc: 'Opcjonalna lista pakietów do monitorowania, rozdzielona przecinkami (np. mesa,kernel).'
      name: packages
      optional: true
      type: string
coprmonitorremove:
  args:
    - '<ownerProject> [channel]'
    - ownerProject
  desc: 'Usuwa z serwera monitor projektu COPR.'
  params:
    - desc: 'Projekt COPR w formacie właściciel/projekt.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Opcjonalny kanał, z którego usunąć konkretny monitor.'
      name: channel
      optional: true
      type: ITextChannel
coprmonitorlist:
  args:
    - ''
  desc: 'Wyświetla wszystkie monitory COPR skonfigurowane na serwerze.'
  params: [ ]
coprmonitortoggle:
  args:
    - ownerProject
  desc: 'Włącza lub wyłącza monitor COPR.'
  params:
    - desc: 'Projekt COPR w formacie właściciel/projekt.'
      name: ownerProject
      optional: false
      type: string
coprnotify:
  args:
    - ownerProject status enabled
  desc: 'Konfiguruje, które statusy buildów wywołują powiadomienia dla monitora.'
  params:
    - desc: 'Projekt COPR w formacie właściciel/projekt.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Status builda do skonfigurowania.'
      name: status
      optional: false
      type: CoprBuildStatus
    - desc: 'Czy włączyć, czy wyłączyć powiadomienia dla tego statusu.'
      name: enabled
      optional: false
      type: bool
coprfilter:
  args:
    - ownerProject text
  desc: 'Ustawia filtr pakietów dla monitora COPR.'
  params:
    - desc: 'Projekt COPR w formacie właściciel/projekt.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Lista pakietów rozdzielona przecinkami albo „all”, aby monitorować wszystko.'
      name: packages
      optional: false
      type: string
coprsucceededmessage:
