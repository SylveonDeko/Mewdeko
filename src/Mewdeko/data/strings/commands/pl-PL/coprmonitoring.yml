coprmonitoradd:
  args:
    - '<ownerProject> [channel] [packages]'
    - '<ownerProject> [channel] [packages]'
    - ownerProject
  desc: 'Dodaje monitor projektu COPR do serwera.'
  params:
    - desc: 'Projekt COPR w formacie owner/project (np. linux4switch/l4s).'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Opcjonalny kanał dla powiadomień. Domyślnie bieżący kanał.'
      name: channel
      optional: true
      type: ITextChannel
    - desc: 'Opcjonalna lista pakietów do monitorowania oddzielona przecinkami (np. mesa,kernel).'
      name: packages
      optional: true
      type: string
coprmonitorremove:
  args:
    - '<ownerProject> [channel]'
    - ownerProject
  desc: 'Usuwa monitor projektu COPR z serwera.'
  params:
    - desc: 'Projekt COPR w formacie owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Opcjonalny kanał do usunięcia konkretnego monitora.'
      name: channel
      optional: true
      type: ITextChannel
coprmonitorlist:
  args:
    - ''
  desc: 'Wyświetla wszystkie monitory COPR skonfigurowane na serwerze.'
  params: [ ]
coprmonitortoggle:
  args:
    - ownerProject
  desc: 'Włącza lub wyłącza monitor COPR.'
  params:
    - desc: 'Projekt COPR w formacie owner/project.'
      name: ownerProject
      optional: false
      type: string
coprnotify:
  args:
    - ownerProject status enabled
  desc: 'Konfiguruje, które statusy budowania wyzwalają powiadomienia dla monitora.'
  params:
    - desc: 'Projekt COPR w formacie owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Status budowania do skonfigurowania.'
      name: status
      optional: false
      type: CoprBuildStatus
    - desc: 'Czy włączyć lub wyłączyć powiadomienia dla tego statusu.'
      name: enabled
      optional: false
      type: bool
coprfilter:
  args:
    - ownerProject text
  desc: 'Ustawia filtr pakietów dla monitora COPR.'
  params:
    - desc: 'Projekt COPR w formacie owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Lista pakietów oddzielona przecinkami lub "all" aby monitorować wszystko.'
      name: packages
      optional: false
      type: string
coprsucceededmessage:
  args:
    - ownerProject text
  desc: 'Ustawia wiadomość wyświetlaną gdy budowanie COPR zakończy się sukcesem.'
  params:
