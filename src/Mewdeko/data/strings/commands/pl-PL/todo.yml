todoadd:
  args:
    - listId
    - title
    - description
  desc: 'Dodaje nowy element zadania do wskazanej listy'
  params:
    - desc: 'ID listy zadań.'
      name: listId
      optional: false
      type: int
    - desc: 'Tytuł elementu zadania.'
      name: title
      optional: false
      type: string
    - desc: 'Opcjonalny opis elementu.'
      name: description
      optional: true
      type: string
todoaddpriority:
  args:
    - listId
    - priority
    - title
    - description
  desc: 'Dodaje zadanie z priorytetem i opcjonalnym terminem'
  params:
    - desc: 'ID listy zadań.'
      name: listId
      optional: false
      type: int
    - desc: 'Poziom priorytetu (1=Low, 2=Medium, 3=High, 4=Critical).'
      name: priority
      optional: false
      type: int
    - desc: 'Tytuł elementu zadania.'
      name: title
      optional: false
      type: string
    - desc: 'Opcjonalny opis elementu.'
      name: description
      optional: true
      type: string
todoaddtag:
  args:
    - itemId
    - tag
  desc: 'Dodaje tag do elementu zadania'
  params:
    - desc: 'ID elementu zadania.'
      name: itemId
      optional: false
      type: int
    - desc: 'Tag do dodania.'
      name: tag
      optional: false
      type: string
todocleardue:
  args:
    - itemId
  desc: 'Usuwa termin z elementu zadania'
  params:
    - desc: 'ID elementu zadania.'
      name: itemId
      optional: false
      type: int
todoclearreminder:
  args:
    - itemId
  desc: 'Usuwa przypomnienie z elementu zadania'
  params:
    - desc: 'ID elementu zadania.'
      name: itemId
      optional: false
      type: int
todocomplete:
  args:
    - itemId
  desc: 'Oznacza element zadania jako ukończony'
  params:
    - desc: 'ID elementu zadania.'
      name: itemId
      optional: false
      type: int
todocreatelist:
  args:
    - name
    - description
  desc: 'Tworzy nową listę zadań'
  params:
    - desc: 'Nazwa listy zadań.'
      name: name
      optional: false
      type: string
    - desc: 'Opcjonalny opis listy.'
      name: description
      optional: true
      type: string
todocreateserverlist:
  args:
    - name
    - description
  desc: 'Tworzy nową listę zadań dla całego serwera (tylko administrator)'
  params:
    - desc: 'Nazwa listy zadań serwera.'
      name: name
      optional: false
      type: string
    - desc: 'Opcjonalny opis listy.'
      name: description
      optional: true
      type: string
tododelete:
  args:
    - itemId
  desc: 'Usuwa element zadania'
  params:
    - desc: 'ID elementu zadania.'
      name: itemId
      optional: false
      type: int
tododeletelist:
  args:
    - listId
  desc: 'Usuwa całą listę zadań'
  params:
    - desc: 'ID listy zadań.'
      name: listId
      optional: false
      type: int
todoedit:
  args:
    - itemId
    - title
    - description
  desc: 'Edytuje tytuł i opis elementu zadania'
  params:
    - desc: 'ID elementu zadania.'
      name: itemId
      optional: false
      type: int
    - desc: 'Nowy tytuł.'
      name: title
      optional: false
      type: string
    - desc: 'Nowy opis.'
      name: description
      optional: true
      type: string
todofilter:
  args:
    - listId
    - filter
    - value
  desc: 'Filtruje elementy zadań według tagu lub priorytetu'
  params:
    - desc: 'ID listy zadań.'
      name: listId
      optional: false
      type: int
    - desc: 'Typ filtra (tag lub priority).'
      name: filter
      optional: false
      type: string
    - desc: 'Wartość, według której filtrować.'
      name: value
      optional: true
      type: string
todogrant:
  args:
    - listId
    - '@user'
    - permissions
  desc: 'Nadaje użytkownikowi uprawnienia do listy zadań (tylko właściciel listy lub administrator)'
  params:
    - desc: 'ID listy zadań.'
      name: listId
      optional: false
      type: int
    - desc: 'Użytkownik, któremu nadać uprawnienia.'
      name: user
      optional: false
      type: IUser
    - desc: 'Uprawnienia oddzielone przecinkami (view,add,edit,complete,delete,manage,all).'
      name: permissions
      optional: false
      type: string
todolists:
  args:
    - includeServer
  desc: 'Wyświetla wszystkie listy zadań dostępne dla użytkownika'
  params:
    - desc: 'Czy uwzględnić listy serwerowe.'
      name: includeServer
      optional: true
      type: bool
todopermissions:
  args:
    - listId
  desc: 'Wyświetla wszystkie uprawnienia do listy zadań'
  params:
    - desc: 'ID listy zadań.'
      name: listId
      optional: false
      type: int
todoremovetag:
  args:
    - itemId
    - tag
  desc: 'Usuwa tag z elementu zadania'
  params:
    - desc: 'ID elementu zadania.'
      name: itemId
      optional: false
      type: int
    - desc: 'Tag do usunięcia.'
      name: tag
      optional: false
      type: string
todoreorder:
  args:
    - itemId
    - newPosition
  desc: 'Przenosi element zadania na nową pozycję'
  params:
    - desc: 'ID elementu zadania.'
      name: itemId
      optional: false
      type: int
    - desc: 'Nowa pozycja (od 1).'
      name: newPosition
      optional: false
      type: int
todorevoke:
  args:
    - listId
    - '@user'
  desc: 'Odbiera użytkownikowi wszystkie uprawnienia do listy zadań'
  params:
    - desc: 'ID listy zadań.'
      name: listId
      optional: false
      type: int
    - desc: 'Użytkownik, któremu odebrać uprawnienia.'
      name: user
      optional: false
      type: IUser
todosearch:
  args:
    - listId
    - query
  desc: 'Wyszukuje elementy zadań na liście'
  params:
    - desc: 'ID listy zadań.'
      name: listId
      optional: false
      type: int
    - desc: 'Zapytanie wyszukiwania.'
      name: query
      optional: false
      type: string
todosetcolor:
  args:
    - listId
    - color
  desc: 'Ustawia kolor listy zadań'
  params:
    - desc: 'ID listy zadań.'
      name: listId
      optional: false
      type: int
    - desc: 'Kod koloru w formacie hex, np. #ff0000.'
      name: color
      optional: false
      type: string
todosetdue:
  args:
    - itemId
    - dateString
  desc: 'Ustawia termin dla elementu zadania'
  params:
    - desc: 'ID elementu zadania.'
      name: itemId
      optional: false
      type: int
    - desc: 'Termin i godzina.'
      name: dateString
      optional: false
      type: string
todosetreminder:
  args:
    - itemId
    - dateString
  desc: 'Ustawia czas przypomnienia dla elementu zadania'
  params:
    - desc: 'ID elementu zadania.'
      name: itemId
      optional: false
      type: int
    - desc: 'Data i godzina przypomnienia.'
      name: dateString
      optional: false
      type: string
todoshow:
  args:
    - listId
    - includeCompleted
  desc: 'Wyświetla wszystkie elementy listy zadań'
  params:
    - desc: 'ID listy zadań.'
      name: listId
      optional: false
      type: int
    - desc: 'Czy uwzględnić ukończone elementy.'
      name: includeCompleted
      optional: true
      type: bool
todotoggleprivacy:
  args:
    - listId
  desc: 'Przełącza ustawienie prywatności listy zadań'
  params:
    - desc: 'ID listy zadań.'
      name: listId
      optional: false
      type: int