customafkmessage:
  args:
    - text
  desc: >-
    Legt ein benutzerdefiniertes AFK-Embed fest, das angezeigt wird, wenn ein
    Benutzer AFK ist. Verwende "-" zum Zuruecksetzen auf das Standard-Embed.
    Siehe https://eb.mewdeko.tech fuer den Embed-Builder und
    http://mewdeko.tech/placeholders fuer Platzhalter.
  params:
    - &ref_175
