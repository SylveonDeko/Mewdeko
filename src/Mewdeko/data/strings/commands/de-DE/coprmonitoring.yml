coprmonitoradd:
  args:
    - '<ownerProject> [channel] [packages]'
    - '<ownerProject> [channel] [packages]'
    - ownerProject
  desc: 'Fügt dem Server eine COPR-Projektüberwachung hinzu.'
  params:
    - desc: 'Das COPR-Projekt im Format Besitzer/Projekt (z. B. linux4switch/l4s).'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Optionaler Kanal für Benachrichtigungen. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: ITextChannel
    - desc: 'Optionale, durch Kommas getrennte Liste der zu überwachenden Pakete (z. B. mesa,kernel).'
      name: packages
      optional: true
      type: string
coprmonitorremove:
  args:
    - '<ownerProject> [channel]'
    - ownerProject
  desc: 'Entfernt eine COPR-Projektüberwachung vom Server.'
  params:
    - desc: 'Das COPR-Projekt im Format Besitzer/Projekt.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Optionaler Kanal, aus dem eine bestimmte Überwachung entfernt wird.'
      name: channel
      optional: true
      type: ITextChannel
coprmonitorlist:
  args:
    - ''
  desc: 'Listet alle COPR-Überwachungen auf dem Server auf.'
  params: [ ]
coprmonitortoggle:
  args:
    - ownerProject
  desc: 'Schaltet eine COPR-Überwachung ein oder aus.'
  params:
    - desc: 'Das COPR-Projekt im Format Besitzer/Projekt.'
      name: ownerProject
      optional: false
      type: string
coprnotify:
  args:
    - ownerProject status enabled
  desc: 'Legt fest, welche Build-Status für eine Überwachung Benachrichtigungen auslösen.'
  params:
    - desc: 'Das COPR-Projekt im Format Besitzer/Projekt.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Der zu konfigurierende Build-Status.'
      name: status
      optional: false
      type: CoprBuildStatus
    - desc: 'Ob Benachrichtigungen für diesen Status aktiviert oder deaktiviert werden sollen.'
      name: enabled
      optional: false
      type: bool
coprfilter:
  args:
    - ownerProject text
  desc: 'Legt den Paketfilter für eine COPR-Überwachung fest.'
  params:
    - desc: 'Das COPR-Projekt im Format Besitzer/Projekt.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Durch Kommas getrennte Paketliste oder "all", um alles zu überwachen.'
      name: packages
      optional: false
      type: string
coprsucceededmessage:
  args:
    - ownerProject text
  desc: 'Legt die Nachricht fest, die angezeigt wird, wenn ein COPR-Build erfolgreich ist.'
  params:
    - desc: 'Das COPR-Projekt im Format Besitzer/Projekt.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Die Nachricht oder der Embed-Code. Mit "-" wird auf den Standard zurückgesetzt.'
      name: message
      optional: false
      type: string
