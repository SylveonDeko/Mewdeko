votemessage:
  args:
    - '[message]'
  desc: >-
    Legt eine benutzerdefinierte Nachricht fest, die gesendet wird, wenn ein
    Benutzer abstimmt, oder zeigt die aktuelle Abstimmungsnachricht an.
  params:
    - desc: 'Die benutzerdefinierte Nachricht für Abstimmungen. Verwende "-" zum Zurücksetzen auf die Standardnachricht. Wenn null, wird die aktuelle Abstimmungsnachricht angezeigt.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: >-
    Startet einen Bestätigungsprozess zum Festlegen eines neuen
    Abstimmungspassworts und warnt den Benutzer vor dessen Sicherheit.
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: >-
    Fügt eine Rolle hinzu, die Benutzern beim Abstimmen gewährt wird, mit
    einer optionalen Dauer für die automatische Entfernung der Rolle.
  params:
    - desc: 'Die Rolle, die als Abstimmungsbelohnung hinzugefügt werden soll.'
      name: role
      optional: false
      type: role
    - desc: 'Die Dauer, für die die Rolle gewährt wird. Null für unbegrenzt.'
      name: time
      optional: true
      type: duration
