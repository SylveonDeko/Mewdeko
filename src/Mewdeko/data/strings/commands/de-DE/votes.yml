votemessage:
  args:
    - '[message]'
  desc: 'Legt eine benutzerdefinierte Nachricht fest, die gesendet wird, wenn ein User abstimmt, oder zeigt die aktuelle Vote-Nachricht als Vorschau an.'
  params:
    - desc: 'Die benutzerdefinierte Nachricht für Votes. Verwende "-", um auf die Standardnachricht zurückzusetzen. Bei null wird die aktuelle Vote-Nachricht als Vorschau angezeigt.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: 'Startet eine Bestätigung zum Festlegen eines neuen Vote-Passworts und weist den User auf die Sicherheit hin.'
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: 'Fügt eine Rolle hinzu, die Usern bei einem Vote gewährt wird, optional mit einer Dauer, nach der die Rolle automatisch entfernt wird.'
  params:
    - desc: 'Die Rolle, die als Vote-Belohnung hinzugefügt wird.'
      name: role
      optional: false
      type: role
    - desc: 'Die Dauer, für die die Rolle gewährt wird. Null für unbegrenzt.'
      name: time
      optional: true
      type: duration
