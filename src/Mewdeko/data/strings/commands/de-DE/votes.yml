votechannel:
  args:
    - channel
  desc: >-
    Legt den angegebenen Textkanal als Abstimmungskanal fest, in den alle
    Abstimmungsbestätigungen gesendet werden.
  params:
    - &ref_646
      desc: 'Der Textkanal, der als Abstimmungskanal festgelegt werden soll.'
      name: channel
      optional: false
      type: ITextChannel
