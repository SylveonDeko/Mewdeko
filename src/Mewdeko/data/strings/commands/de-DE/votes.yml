  params: [ ]
votes:
  args:
    - '[@user]'
  desc: >-
    Zeigt die Gesamtzahl der Abstimmungen eines bestimmten Benutzers oder des
    Befehlsaufrufers an.
  params:
    - desc: 'Der Benutzer, dessen Abstimmungen gezählt werden sollen. Wenn null, werden die Abstimmungen des Befehlsaufrufers gezählt.'
      name: user
      optional: true
      type: user
votesleaderboard:
  args:
    - false
  desc: >-
    Zeigt eine Rangliste der Benutzer basierend auf ihrer Abstimmungsanzahl an,
    optional gefiltert nach Abstimmungen des aktuellen Monats.
  params:
    - desc: >-
        Zeigt eine Rangliste der Benutzer basierend auf ihrer Abstimmungsanzahl an,
        optional gefiltert nach Abstimmungen des aktuellen Monats.
      name: false
