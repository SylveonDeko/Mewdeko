votes:
  args:
    - '[@user]'
  desc: 'Zeigt die Gesamtzahl der Votes eines bestimmten Users oder des Befehlsausführenden an.'
  params:
    - desc: 'Der User, dessen Votes gezählt werden. Bei null werden die Votes des Befehlsausführenden gezählt.'
      name: user
      optional: true
      type: user
