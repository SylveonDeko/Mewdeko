votechannel:
  args:
    - channel
  desc: 'Legt den angegebenen Textkanal als Vote-Kanal fest, in den alle Vote-Bestätigungen gesendet werden.'
  params:
    - &ref_646
      desc: 'Der Textkanal, der als Vote-Kanal festgelegt wird.'
      name: channel
      optional: false
      type: ITextChannel
