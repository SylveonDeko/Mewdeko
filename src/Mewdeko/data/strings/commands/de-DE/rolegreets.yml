  params:
    - desc: 'Die ID der Rollen-Begrüßung, für die der Webhook konfiguriert wird, basierend auf ihrer Position in der Liste aller Rollen-Begrüßungen.'
      name: id
      optional: false
      type: int
    - desc: 'Der Name des Webhooks. Optional.'
      name: name
      optional: true
      type: string
    - desc: 'Die URL des Avatars für den Webhook. Optional.'
      name: avatar
      optional: true
