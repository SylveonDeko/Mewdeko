    - '<id> [message]'
    - number
  desc: 'Aktualisiert den Nachrichteninhalt einer Rollenbegrüßung. Wenn keine Nachricht angegeben wird, werden Optionen zur Vorschau oder Anzeige als normaler Text angeboten.'
  params:
