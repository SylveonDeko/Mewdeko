rolegreetadd:
  args:
    - '@role [@channel]'
    - '@role'
  desc: 'Fügt eine neue Rollenbegrüßungsnachricht für eine bestimmte Rolle hinzu. Wenn kein Kanal angegeben wird, wird der aktuelle Kanal verwendet.'
  params:
    - desc: 'Die Rolle, für die die Begrüßungsnachricht festgelegt wird.'
      name: role
      optional: false
      type: role
    - desc: 'Der Textkanal, in dem die Begrüßungsnachricht gesendet wird. Optional.'
      name: channel
      optional: true
      type: channel
