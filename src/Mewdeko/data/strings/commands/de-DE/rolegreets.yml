rolegreetwebhook:
  args:
    - '<id> [name] [avatar]'
    - number
  desc: 'Konfiguriert einen Webhook für eine Rollenbegrüßungsnachricht mit benutzerdefiniertem Namen und Avatar. Wenn kein Name angegeben wird, wird der Webhook deaktiviert.'
  params:
    - desc: 'Die ID der Rollenbegrüßung, für die der Webhook konfiguriert werden soll, basierend auf ihrer Position in der Liste aller Rollenbegrüßungen.'
      name: id
      optional: false
      type: int
    - desc: 'Der Name des Webhooks. Optional.'
      name: name
      optional: true
      type: string
    - desc: 'Die Avatar-URL für den Webhook. Optional.'
      name: avatar
      optional: true
      type: string
