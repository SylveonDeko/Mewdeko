  params: [ ]
rolegreetmessage:
  args:
    - '<id> [message]'
    - number
  desc: 'Aktualisiert den Nachrichteninhalt einer Rollen-Begrüßung. Wenn keine Nachricht angegeben wird, kannst du wählen, ob die Vorschau so wie sie ist oder als normaler Text angezeigt wird.'
  params:
    - desc: 'Die ID der Rollen-Begrüßung, die aktualisiert wird, basierend auf ihrer Position in der Liste aller Rollen-Begrüßungen.'
      name: id
      optional: false
      type: int
    - desc: 'Der neue Nachrichteninhalt. Optional.'
      name: message
      optional: true
      type: string
