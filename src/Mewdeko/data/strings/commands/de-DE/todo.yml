todoadd:
  args:
    - listId
    - title
    - description
  desc: 'Fügt einer angegebenen Liste einen neuen To-do-Eintrag hinzu'
  params:
    - desc: 'Die ID der To-do-Liste.'
      name: listId
      optional: false
      type: int
    - desc: 'Der Titel des To-do-Eintrags.'
      name: title
      optional: false
      type: string
    - desc: 'Optionale Beschreibung für den Eintrag.'
      name: description
      optional: true
      type: string
todoaddpriority:
  args:
    - listId
    - priority
    - title
    - description
  desc: 'Fügt einen To-do-Eintrag mit Priorität und optionalem Fälligkeitsdatum hinzu'
  params:
    - desc: 'Die ID der To-do-Liste.'
      name: listId
      optional: false
      type: int
    - desc: 'Prioritätsstufe (1=Niedrig, 2=Mittel, 3=Hoch, 4=Kritisch).'
      name: priority
      optional: false
      type: int
    - desc: 'Der Titel des To-do-Eintrags.'
      name: title
      optional: false
      type: string
    - desc: 'Optionale Beschreibung für den Eintrag.'
      name: description
      optional: true
      type: string
todoaddtag:
  args:
    - itemId
    - tag
  desc: 'Fügt einem To-do-Eintrag einen Tag hinzu'
  params:
    - desc: 'Die ID des To-do-Eintrags.'
      name: itemId
      optional: false
      type: int
    - desc: 'Der Tag, der hinzugefügt wird.'
      name: tag
      optional: false
      type: string
todocleardue:
  args:
    - itemId
  desc: 'Entfernt das Fälligkeitsdatum von einem To-do-Eintrag'
  params:
    - desc: 'Die ID des To-do-Eintrags.'
      name: itemId
      optional: false
      type: int
todoclearreminder:
  args:
    - itemId
  desc: 'Entfernt die Erinnerung von einem To-do-Eintrag'
  params:
    - desc: 'Die ID des To-do-Eintrags.'
      name: itemId
      optional: false
      type: int
todocomplete:
  args:
    - itemId
  desc: 'Schließt einen To-do-Eintrag ab'
  params:
    - desc: 'Die ID des To-do-Eintrags.'
      name: itemId
      optional: false
      type: int
todocreatelist:
  args:
    - name
    - description
  desc: 'Erstellt eine neue To-do-Liste'
  params:
    - desc: 'Der Name der To-do-Liste.'
      name: name
      optional: false
      type: string
    - desc: 'Optionale Beschreibung für die Liste.'
      name: description
      optional: true
      type: string
todocreateserverlist:
  args:
    - name
    - description
  desc: 'Erstellt eine neue serverweite To-do-Liste (nur für Admins)'
  params:
    - desc: 'Der Name der serverweiten To-do-Liste.'
      name: name
      optional: false
      type: string
    - desc: 'Optionale Beschreibung für die Liste.'
      name: description
      optional: true
      type: string
tododelete:
  args:
    - itemId
  desc: 'Löscht einen To-do-Eintrag'
  params:
    - desc: 'Die ID des To-do-Eintrags.'
      name: itemId
      optional: false
      type: int
tododeletelist:
  args:
    - listId
  desc: 'Löscht eine komplette To-do-Liste'
  params:
    - desc: 'Die ID der To-do-Liste.'
      name: listId
      optional: false
      type: int
todoedit:
  args:
    - itemId
    - title
    - description
  desc: 'Bearbeitet Titel und Beschreibung eines To-do-Eintrags'
  params:
    - desc: 'Die ID des To-do-Eintrags.'
      name: itemId
      optional: false
      type: int
    - desc: 'Der neue Titel.'
      name: title
      optional: false
      type: string
    - desc: 'Die neue Beschreibung.'
      name: description
      optional: true
      type: string
todofilter:
  args:
    - listId
    - filter
    - value
  desc: 'Filtert To-do-Einträge nach Tag oder Priorität'
  params:
    - desc: 'Die ID der To-do-Liste.'
      name: listId
      optional: false
      type: int
    - desc: 'Filtertyp (tag oder priority).'
      name: filter
      optional: false
      type: string
    - desc: 'Der Wert, nach dem gefiltert wird.'
      name: value
      optional: true
      type: string
todogrant:
  args:
    - listId
    - '@user'
    - permissions
  desc: 'Gewährt einem User Berechtigungen für eine To-do-Liste (nur Listeninhaber oder Admins)'
  params:
    - desc: 'Die ID der To-do-Liste.'
      name: listId
      optional: false
      type: int
    - desc: 'Der User, dem Berechtigungen gewährt werden.'
      name: user
      optional: false
      type: IUser
    - desc: 'Durch Kommas getrennte Berechtigungen (view,add,edit,complete,delete,manage,all).'
      name: permissions
      optional: false
      type: string
todolists:
  args:
    - includeServer
  desc: 'Listet alle To-do-Listen auf, auf die der User zugreifen kann'
  params:
    - desc: 'Ob serverweite Listen eingeschlossen werden sollen.'
      name: includeServer
      optional: true
      type: bool
todopermissions:
  args:
    - listId
  desc: 'Zeigt alle Berechtigungen für eine To-do-Liste an'
  params:
    - desc: 'Die ID der To-do-Liste.'
      name: listId
      optional: false
      type: int
todoremovetag:
  args:
    - itemId
    - tag
  desc: 'Entfernt einen Tag von einem To-do-Eintrag'
  params:
    - desc: 'Die ID des To-do-Eintrags.'
      name: itemId
      optional: false
      type: int
    - desc: 'Der Tag, der entfernt wird.'
      name: tag
      optional: false
      type: string
todoreorder:
  args:
    - itemId
    - newPosition
  desc: 'Verschiebt einen To-do-Eintrag an eine neue Position'
  params:
    - desc: 'Die ID des To-do-Eintrags.'
      name: itemId
      optional: false
      type: int
    - desc: 'Die neue Position (1-basiert).'
      name: newPosition
      optional: false
      type: int
todorevoke:
  args:
    - listId
    - '@user'
  desc: 'Entzieht einem User alle Berechtigungen für eine To-do-Liste'
  params:
    - desc: 'Die ID der To-do-Liste.'
      name: listId
      optional: false
      type: int
    - desc: 'Der User, dem Berechtigungen entzogen werden.'
      name: user
      optional: false
      type: IUser
todosearch:
  args:
    - listId
    - query
  desc: 'Sucht nach To-do-Einträgen innerhalb einer Liste'
  params:
    - desc: 'Die ID der To-do-Liste.'
      name: listId
      optional: false
      type: int
    - desc: 'Die Suchanfrage.'
      name: query
      optional: false
      type: string
todosetcolor:
  args:
    - listId
    - color
  desc: 'Legt die Farbe für eine To-do-Liste fest'
  params:
    - desc: 'Die ID der To-do-Liste.'
      name: listId
      optional: false
      type: int
    - desc: 'Hex-Farbcode, z. B. #ff0000.'
      name: color
      optional: false
      type: string
todosetdue:
  args:
    - itemId
    - dateString
  desc: 'Legt das Fälligkeitsdatum für einen To-do-Eintrag fest'
  params:
    - desc: 'Die ID des To-do-Eintrags.'
      name: itemId
      optional: false
      type: int
    - desc: 'Das Fälligkeitsdatum und die Uhrzeit.'
      name: dateString
      optional: false
      type: string
todosetreminder:
  args:
    - itemId
    - dateString
  desc: 'Legt eine Erinnerungszeit für einen To-do-Eintrag fest'
  params:
    - desc: 'Die ID des To-do-Eintrags.'
      name: itemId
      optional: false
      type: int
    - desc: 'Das Datum und die Uhrzeit der Erinnerung.'
      name: dateString
      optional: false
      type: string
todoshow:
  args:
    - listId
    - includeCompleted
  desc: 'Zeigt alle Einträge einer To-do-Liste an'
  params:
    - desc: 'Die ID der To-do-Liste.'
      name: listId
      optional: false
      type: int
    - desc: 'Ob abgeschlossene Einträge eingeschlossen werden sollen.'
      name: includeCompleted
      optional: true
      type: bool
todotoggleprivacy:
  args:
    - listId
  desc: 'Schaltet die Datenschutzeinstellung für eine To-do-Liste um'
  params:
    - desc: 'Die ID der To-do-Liste.'
      name: listId
      optional: false
      type: int