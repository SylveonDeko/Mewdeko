highlight:
  args:
    - '<action> [words]'
    - add|list|delete
    - add
    - list
    - delete
  desc: 'Fügt Highlights hinzu, listet sie auf, entfernt sie oder gleicht sie ab.'
  params:
    - desc: '<see cref="HighlightActions" />'
      name: action
      optional: false
      type: highlightactions
    - desc: 'Parameter für die gewählte Aktion'
      name: words
      optional: true
      type: string
