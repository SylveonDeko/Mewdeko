highlight:
  args:
    - '<action> [words]'
    - add|list|delete
    - add
    - list
    - delete
  desc: 'Fügt Hervorhebungen hinzu, listet sie auf, entfernt sie oder findet Treffer.'
  params:
    - desc: 'Die auszuführende Aktion: add, list, delete oder match.'
      name: action
      optional: false
      type: highlightactions
    - desc: 'Parameter für die gewählte Aktion.'
      name: words
      optional: true
      type: string
