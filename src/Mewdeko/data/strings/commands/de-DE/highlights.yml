highlights:
  args:
    - action word
  desc: 'Verwaltet Nutzer-Hervorhebungen.'
  params:
    - desc: 'Die Aktion, die mit Hervorhebungen ausgeführt werden soll.'
      name: action
      optional: false
      type: string
    - desc: 'Das Wort, das hervorgehoben werden soll.'
      name: word
      optional: true
      type: string