banprune:
  args:
    - ''
  desc: 'Zeigt die Nachrichtenlöschung, die ein Bann in diesem Kanal verwenden würde, zusammen mit allen konfigurierten Einstellungen.'
  params:
    - { }
banpruneset:
  args:
    - '<action> <days> [#channel]'
  desc: 'Legt fest, für wie viele Tage Nachrichten bei einer Bann-Aktion gelöscht werden. Mit "all" gilt es für jede Aktion; mit einem Kanal oder einer Kategorie wird nur dieser Bereich überschrieben.'
  params:
    - desc: 'Der Aktionsschlüssel oder "all", um alle Aktionen abzudecken.'
      name: action
      optional: false
      type: string
    - desc: 'Die Löschdauer in Tagen, 0 bis 7.'
      name: days
      optional: false
      type: int
    - desc: 'Ein Kanal oder eine Kategorie, auf den bzw. die die Einstellung begrenzt wird, oder nichts für den Server-Standard.'
      name: target
      optional: true
      type: channel
banpruneclear:
  args:
    - '<action> [#channel]'
  desc: 'Entfernt eine Löscheinstellung, sodass die Aktion auf einen breiteren Bereich oder ihren Standard zurückfällt.'
  params:
    - desc: 'Der Aktionsschlüssel oder "all" für die Einstellung, die alle Aktionen abdeckt.'
      name: action
      optional: false
      type: string
    - desc: 'Der Kanal oder die Kategorie, für die die Einstellung gilt, oder nichts für den Server-Standard.'
      name: target
      optional: true
      type: channel
banprunereset:
  args:
    - ''
  desc: 'Entfernt alle Löscheinstellungen auf dem Server.'
  params:
    - { }
ban:
  args:
    - '<pruneTime> <time> [@user] [msg]'
    - time time
  desc: 'Sperrt einen Nutzer mit angegebenem Grund und einer Anzahl von Tagen, deren Nachrichten gelöscht werden.'
  params:
    - desc: 'Sperrt einen Nutzer mit angegebenem Grund und einer Anzahl von Tagen, deren Nachrichten gelöscht werden.'
      name: pruneTime
      optional: false
      type: duration
    - desc: 'Die Zeitspanne, für die Nachrichten gelöscht werden sollen.'
      name: time
      optional: false
      type: duration
    - desc: 'Der zu sperrende Nutzer.'
      name: user
      optional: true
      type: user
    - desc: 'Der Grund für die Sperre.'
      name: msg
      optional: true
      type: string
