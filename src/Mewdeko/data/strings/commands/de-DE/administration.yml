antiimagehash:
  args:
    - ''
    - 'Ban'
    - 'Delete 31'
    - 'Timeout 31 1d'
  desc: 'Aktiviert den Anti-Image-Hash-Schutz, der jeden sanktioniert, der ein Bild aus der Sperrliste erneut postet, auch verkleinerte, gespiegelte, in geringerer Qualität neu hochgeladene oder umrandete Kopien. Ohne Argumente ausführen, um ihn zu deaktivieren. Die optionale Toleranz (0 bis 64, Standard 31) legt fest, wie stark sich ein gepostetes Bild unterscheiden darf und trotzdem als gesperrtes Bild gilt.'
  params: [ ]
antiimagehashignore:
  args:
    - '<role>'
    - '<channel>'
  desc: 'Schaltet eine Rolle oder einen Kanal von der Ausnahme vom Anti-Image-Hash-Schutz um.'
  params: [ ]
antiexternalapp:
  args:
    - ''
    - 'Timeout'
    - 'Timeout 5 5 1h'
    - 'Kick 3 0'
  desc: 'Aktiviert den Anti-External-App-Schutz, der Nachrichten überwacht, die Mitglieder über Apps senden, die sie ihrem eigenen Account hinzugefügt haben. Eine Nachricht wird entfernt und das Mitglied, das die App ausgeführt hat, bestraft, wenn sie zu viele Personen oder Rollen erwähnt (Standard 5, 0 schaltet es aus), @everyone pingt, einen Einladungslink enthält oder das Mitglied Apps öfter als erlaubt in 10 Sekunden ausführt (Standard 5, 0 schaltet es aus). Apps, die dem Server selbst hinzugefügt wurden, werden nicht geprüft. Ohne Argumente ausführen, um ihn zu deaktivieren.'
  params: [ ]
blockimage:
  args:
    - ''
    - 'mrbeast crypto scam'
    - 'Delete nsfw meme'
    - 'https://example.com/scam.png mrbeast crypto scam'
  desc: 'Sperrt ein Bild, sodass jeder, der es erneut postet, sanktioniert wird, auch verkleinerte, neu komprimierte, gespiegelte und umrandete Kopien. Hänge das Bild an, antworte auf eine Nachricht, die es enthält, oder gib seine URL an. Eine Aktion, die vor der Bezeichnung angegeben wird, überschreibt den Server-Standard nur für dieses Bild.'
  params: [ ]
unblockimage:
  args:
    - '<id>'
  desc: 'Entfernt ein Bild anhand seiner ID aus der Sperrliste, wie in blockedimages angezeigt.'
  params: [ ]
blockedimages:
  args:
    - ''
  desc: 'Listet die gesperrten Bilder auf, samt Anzahl der Treffer pro Bild.'
  params: [ ]
imagehash:
  args:
    - ''
    - 'https://example.com/scam.png'
  desc: 'Zeigt den Wahrnehmungs-Hash eines Bildes, ohne es zu sperren.'
  params: [ ]
antiimagehashpreset:
  args:
    - ''
  desc: 'Schaltet die Liste bekannter Betrugsbilder um, die mit Mewdeko ausgeliefert wird: die gefälschten Krypto-Casino- und Gewinnspiel-Bilder, die gerade auf Discord gespammt werden. Sie werden zusammen mit deiner eigenen Liste gesperrt. Standardmäßig an, wenn Anti-Image-Hash aktiviert ist.'
  params: [ ]
