adsarm:
  args:
    - ''
  desc: 'Schaltet das automatische Löschen von Server-Werbenachrichten um.'
  params: [ ]
antialt:
  args:
    - ''
  desc: 'Konfiguriert den Anti-Alt-Schutz für den Server: legt das Mindestalter der Accounts und die Strafe mit einer rollenbasierten Bestrafung fest.'
  params: [ ]
antipattern:
  args:
    - ''
  desc: 'Konfiguriert den Anti-Pattern-Schutz für den Server und legt die Strafe mit einer rollenbasierten Bestrafung fest.'
  params: [ ]
antipattern_PunishmentAction_=:
  args:
    - '<action> [punishTime]'
    - action
  desc: 'Konfiguriert den Anti-Pattern-Schutz für den Server und legt die Strafe mit einer rollenbasierten Bestrafung fest.'
  params:
    - desc: 'Die Strafe für erkannte Muster-Treffer.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'Die Dauer der Strafe, falls zutreffend.'
      name: punishTime
      optional: true
      type: StoopidTime
antipattern_PunishmentAction_IRole:
  args:
    - action @role
  desc: 'Konfiguriert den Anti-Pattern-Schutz für den Server und legt die Strafe mit einer rollenbasierten Bestrafung fest.'
  params:
    - desc: 'Die Strafe für erkannte Muster-Treffer.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'Die Rolle, die Nutzern mit passenden Mustern zugewiesen wird.'
      name: role
      optional: false
      type: IRole
patternadd:
  args:
    - '<pattern> [name] [checkUsername] [checkDisplayName]'
    - pattern
  desc: 'Fügt dem Anti-Pattern-Schutz ein Regex-Muster hinzu.'
  params:
    - desc: 'Das Regex-Muster, das mit Benutzernamen bzw. Anzeigenamen abgeglichen wird.'
      name: pattern
      optional: false
      type: string
    - desc: 'Optionaler Name für das Muster.'
      name: name
      optional: true
      type: string
    - desc: 'Ob Benutzernamen mit diesem Muster geprüft werden (Standard: true).'
      name: checkUsername
      optional: true
      type: bool
    - desc: 'Ob Anzeigenamen mit diesem Muster geprüft werden (Standard: true).'
      name: checkDisplayName
      optional: true
      type: bool
patternremove:
  args:
    - number
  desc: 'Entfernt ein Muster aus dem Anti-Pattern-Schutz.'
  params:
    - desc: 'Die ID des zu entfernenden Musters.'
      name: patternId
      optional: false
      type: int
patternlist:
  args:
    - ''
  desc: 'Listet alle für den Anti-Pattern-Schutz konfigurierten Muster auf.'
  params: [ ]
patternconfig:
  args:
    - ''
  desc: 'Zeigt die aktuelle Anti-Pattern-Konfiguration.'
  params: [ ]
patternconfig_string_string:
  args:
    - setting value
  desc: 'Zeigt die aktuelle Anti-Pattern-Konfiguration.'
  params:
    - desc: 'Die Einstellung, die konfiguriert werden soll.'
      name: setting
      optional: false
      type: string
    - desc: 'Der Wert, der gesetzt werden soll.'
      name: value
      optional: false
      type: string
