      name: timeWindowSeconds
      optional: false
      type: int
    - desc: 'Die maximal erlaubten Erwähnungen im angegebenen Zeitfenster.'
      name: maxMentionsInTimeWindow
      optional: false
      type: int
    - desc: 'Ob Bot-Accounts bei der Erwähnungszählung ignoriert werden.'
      name: ignoreBots
      optional: false
      type: bool
    - desc: 'Die Strafe für Nutzer, die die Erwähnungsgrenzen überschreiten.'
      name: action
      optional: false
      type: punishment
    - desc: 'Konfiguriert den Anti-Mass-Mention-Schutz für den Server: legt den Erwähnungs-Schwellenwert für eine einzelne Nachricht, das Zeitfenster, die maximal erlaubten Erwähnungen im Zeitfenster und die Strafe mit einer rollenbasierten Bestrafung fest.'
