mcstatus:
  args:
    - '[server name or address]'
  desc: 'Prüft den Status eines Minecraft-Servers. Verwende einen registrierten Servernamen oder eine direkte Adresse, oder lass das Feld leer für den Standardserver.'
  params:
    - desc: 'Der registrierte Servername oder die direkte Adresse (z. B. play.example.com:25565).'
      name: serverName
      optional: true
      type: string
mcadd:
  args:
    - name address
  desc: 'Fügt dem Server einen Minecraft-Server hinzu. Stelle der Adresse bedrock: voran, wenn es ein Bedrock-Server ist.'
  params:
    - desc: 'Eine Bezeichnung für den Server.'
      name: name
      optional: false
      type: string
    - desc: 'Die Serveradresse, optional mit Port (z. B. play.example.com:25565 oder bedrock:play.example.com).'
      name: address
      optional: false
      type: string
mcremove:
  args:
    - name
  desc: 'Entfernt einen Minecraft-Server vom Server.'
  params:
    - desc: 'Der Name des zu entfernenden Servers.'
      name: name
      optional: false
      type: string
mclist:
  args:
    - ''
  desc: 'Listet alle registrierten Minecraft-Server dieses Servers auf.'
  params: [ ]
mcdefault:
  args:
    - name
  desc: 'Legt einen Server als Standard für Status-Befehle fest.'
  params:
    - desc: 'Der Name des Servers, der als Standard gesetzt werden soll.'
      name: name
      optional: false
      type: string
mcwatch:
  args:
    - name '#channel'
  desc: 'Legt einen Kanal fest, der regelmäßige Statusupdates für einen Server erhält. Lass den Kanal weg, um es zu deaktivieren.'
  params:
    - desc: 'Der Name des zu beobachtenden Servers.'
      name: serverName
      optional: false
      type: string
    - desc: 'Der Kanal, in den Updates gepostet werden.'
      name: channel
      optional: true
      type: ITextChannel
mcwatchmode:
  args:
    - name embed|topic|both
  desc: 'Legt fest, wie der Serverstatus angezeigt wird: embed (direkt bearbeitet), Kanalthema oder beides.'
  params:
    - desc: 'Der Name des Servers.'
      name: serverName
      optional: false
      type: string
    - desc: 'Der Beobachtungsmodus: Embed, ChannelTopic oder Both.'
      name: mode
      optional: false
      type: McWatchMode
mcembed:
  args:
    - name template
  desc: 'Legt eine eigene Embed-Vorlage für einen beobachteten Server fest. Mit "-" wird zurückgesetzt. Platzhalter: %mc.server.name%, %mc.players.online%, %mc.players.max%, %mc.motd%, %mc.version%, %mc.latency%, %mc.online%, %mc.favicon%.'
  params:
    - desc: 'Der Name des Servers.'
      name: serverName
      optional: false
      type: string
    - desc: 'Das Embed-Vorlagen-JSON oder "-" für den Standard.'
      name: template
      optional: true
      type: string
mcplayer:
  args:
    - username
  desc: 'Sucht einen Minecraft-Spieler anhand des Nutzernamens und zeigt Profil und Skin an.'
  params:
    - desc: 'Der Minecraft-Nutzername, nach dem gesucht wird.'
      name: username
      optional: false
      type: string
mcskin:
  args:
    - username
  desc: 'Zeigt die Skin-Darstellung eines Minecraft-Spielers.'
  params:
    - desc: 'Der Minecraft-Nutzername.'
      name: username
      optional: false
      type: string
mcrcon:
  args:
    - name command
  desc: 'Sendet einen RCON-Befehl an einen registrierten Minecraft-Server. RCON muss über das Dashboard konfiguriert sein.'
  params:
    - desc: 'Der Name des Servers.'
      name: serverName
      optional: false
      type: string
    - desc: 'Der Befehl, der auf dem Server ausgeführt werden soll.'
      name: command
      optional: false
      type: string
mcwhitelist:
  args:
    - name add|remove|list|on|off|reload [player]
  desc: 'Verwaltet die Whitelist eines Minecraft-Servers über RCON. Erfordert eine RCON-Konfiguration.'
  params:
    - desc: 'Der Name des Servers.'
      name: serverName
      optional: false
      type: string
    - desc: 'Die Aktion: add, remove, list, on, off, reload.'
      name: action
      optional: false
      type: string
    - desc: 'Der Spielername (für add/remove).'
      name: playerName
      optional: true
      type: string
