birthdayannouncements:
  args:
    - ''
  desc: 'Schaltet Geburtstagsankündigungen für den Nutzer um.'
  params: [ ]
birthdaychannel:
  args:
    - '#channel'
  desc: 'Legt den Kanal für Geburtstagsankündigungen fest.'
  params:
    - desc: 'Der Textkanal für Ankündigungen. Ohne Angabe wird der aktuelle Kanal verwendet.'
      name: channel
      optional: true
      type: ITextChannel
birthdayconfig:
  args:
    - ''
  desc: 'Zeigt die aktuelle Geburtstagskonfiguration.'
  params: [ ]
birthdaylist:
  args:
    - days
  desc: 'Zeigt anstehende Geburtstage auf dem Server.'
  params:
    - desc: 'Wie viele Tage im Voraus. Standard ist 7, maximal 30.'
      name: days
      optional: true
      type: int
birthdaymessage:
  args:
    - message
  desc: 'Legt eine eigene Vorlage für die Geburtstagsnachricht fest.'
  params:
    - desc: 'Die Nachrichtenvorlage. Verwende {user}, um den Nutzer zu erwähnen. Ist das Feld leer, wird die aktuelle Nachricht angezeigt.'
      name: message
      optional: true
      type: string
birthdaypingrole:
  args:
    - '@role'
  desc: 'Legt die Rolle fest, die bei Geburtstagsankündigungen gepingt wird.'
  params:
    - desc: 'Die Rolle, die gepingt wird. Ohne Angabe einer Rolle wird dies deaktiviert.'
      name: role
      optional: true
      type: IRole
birthdayrole:
  args:
    - '@role'
  desc: 'Legt die Geburtstagsrolle fest, die Nutzer an ihrem Geburtstag erhalten.'
  params:
    - desc: 'Die Rolle, die am Geburtstag eines Nutzers zugewiesen wird. Ohne Angabe einer Rolle wird dies deaktiviert.'
      name: role
      optional: true
      type: IRole
birthdaytimezone:
  args:
    - timezone
  desc: 'Legt die Zeitzone des Nutzers für Geburtstagsberechnungen fest.'
  params:
    - desc: 'Die festzulegende Zeitzone (z. B. "America/New_York").'
      name: timezone
      optional: false
      type: string
birthdaytoday:
  args:
    - ''
  desc: 'Zeigt die heutigen Geburtstage.'
  params: [ ]