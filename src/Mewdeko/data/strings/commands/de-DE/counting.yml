countingban:
  args:
    - user channel duration reason
  desc: 'Sperrt einen Nutzer vom Zählen in einem bestimmten Kanal.'
  params:
    - desc: 'Der Nutzer, der vom Zählen gesperrt werden soll.'
      name: user
      optional: false
      type: guild user
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Dauer der Sperre (z. B. 1h, 1d). Leer lassen für dauerhaft.'
      name: duration
      optional: true
      type: stoopid time
    - desc: 'Der Grund für die Sperre.'
      name: reason
      optional: true
      type: string
countingconfig:
  args:
    - channel
  desc: 'Konfiguriert die Einstellungen für einen Zähl-Kanal.'
  params:
    - desc: 'Der Kanal, dessen Konfiguration angezeigt werden soll. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
countingcooldown:
  args:
    - channel seconds
  desc: 'Legt die Abklingzeit zwischen den Zählungen eines Nutzers fest.'
  params:
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Abklingzeit in Sekunden (0–300).'
      name: seconds
      optional: true
      type: int
countingdisable:
  args:
    - channel purgeData reason
  desc: 'Deaktiviert das Zählen in einem Kanal und löscht optional alle Daten.'
  params:
    - desc: 'Der Kanal, in dem das Zählen deaktiviert wird. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Ob alle Zähldaten dieses Kanals gelöscht werden sollen. Standard ist false.'
      name: purgeData
      optional: true
      type: bool
    - desc: 'Der Grund, das Zählen zu deaktivieren.'
      name: reason
      optional: true
      type: string
countingfailurechannel:
  args:
    - countingChannel failureChannel
  desc: 'Legt den Kanal fest, in dem fehlgeschlagene Zählungen protokolliert werden.'
  params:
    - desc: 'Der Zähl-Kanal.'
      name: countingChannel
      optional: true
      type: text channel
    - desc: 'Der Kanal für Fehler-Logs. Verwende null, um es zu deaktivieren.'
      name: failureChannel
      optional: true
      type: text channel
countingfailuremessage:
  args:
    - channel embed
  desc: 'Legt eine eigene Nachricht für fehlgeschlagene Zählungen fest.'
  params:
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Die Nachrichtenvorlage. Mit "-" wird auf den Standard zurückgesetzt.'
      name: embed
      optional: true
      type: string
countingfailurethreshold:
  args:
    - channel threshold
  desc: 'Legt den Fehler-Schwellenwert vor Konsequenzen fest.'
  params:
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Anzahl der Fehler vor einer Aktion (1–10).'
      name: threshold
      optional: true
      type: int
countingleaderboard:
  args:
    - type channel
  desc: 'Zeigt die Rangliste eines Zähl-Kanals.'
  params:
    - desc: 'Der Ranglistentyp (contributions, streak, accuracy, totalnumbers).'
      name: type
      optional: true
      type: string
    - desc: 'Der Kanal, dessen Rangliste angezeigt wird. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
countinglist:
  args:
    - ''
  desc: 'Listet alle aktiven Zähl-Kanäle auf dem Server auf.'
  params: [ ]
countingmilestonechannel:
  args:
    - countingChannel milestoneChannel
  desc: 'Legt den Kanal fest, in dem Meilenstein-Erfolge angekündigt werden.'
  params:
    - desc: 'Der Zähl-Kanal.'
      name: countingChannel
      optional: true
      type: text channel
    - desc: 'Der Kanal für Meilenstein-Ankündigungen. Verwende null, um es zu deaktivieren.'
      name: milestoneChannel
      optional: true
      type: text channel
countingmilestonemessage:
  args:
    - channel embed
  desc: 'Legt eine eigene Nachricht für Meilenstein-Erfolge fest.'
  params:
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Die Nachrichtenvorlage. Mit "-" wird auf den Standard zurückgesetzt.'
      name: embed
      optional: true
      type: string
countingmilestones:
  args:
    - channel milestones
  desc: 'Legt eigene Meilensteinzahlen fest.'
  params:
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Durch Kommas getrennte Meilensteinzahlen (z. B. 50,100,250,500,1000).'
      name: milestones
      optional: true
      type: string
countingreset:
  args:
    - channel newNumber reason
  desc: 'Setzt das Zählen in einem Kanal auf eine bestimmte Zahl zurück.'
  params:
    - desc: 'Der zurückzusetzende Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Die Zahl, auf die zurückgesetzt wird. Standard ist 0.'
      name: newNumber
      optional: true
      type: long
    - desc: 'Der Grund für das Zurücksetzen.'
      name: reason
      optional: true
      type: string
countingrestore:
  args:
    - saveId channel
  desc: 'Stellt das Zählen aus einem früheren Speicherpunkt wieder her.'
  params:
    - desc: 'Die ID des Speicherpunkts, aus dem wiederhergestellt wird.'
      name: saveId
      optional: false
      type: int
    - desc: 'Der wiederherzustellende Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
countingsave:
  args:
    - channel reason
  desc: 'Erstellt einen Speicherpunkt für den aktuellen Zählfortschritt.'
  params:
    - desc: 'Der zu speichernde Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Der Grund für den Speicherpunkt.'
      name: reason
      optional: true
      type: string
countingsetup:
  args:
    - channel startNumber increment
  desc: 'Richtet das Zählen im aktuellen oder einem angegebenen Kanal ein.'
  params:
    - desc: 'Der Kanal, in dem das Zählen eingerichtet wird. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Die Zahl, bei der gezählt wird. Standard ist 1.'
      name: startNumber
      optional: true
      type: long
    - desc: 'Die Schrittweite pro Zählung. Standard ist 1.'
      name: increment
      optional: true
      type: int
countingstats:
  args:
    - user channel
  desc: 'Zeigt Zählstatistiken für einen Nutzer oder Kanal.'
  params:
    - desc: 'Der Nutzer, dessen Statistiken angezeigt werden. Standard ist du.'
      name: user
      optional: true
      type: user
    - desc: 'Der Kanal, dessen Statistiken geprüft werden. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
countingstatus:
  args:
    - channel
  desc: 'Zeigt den aktuellen Status des Zählens in einem Kanal.'
  params:
    - desc: 'Der zu prüfende Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
countingsuccessmessage:
  args:
    - channel embed
  desc: 'Legt eine eigene Nachricht für erfolgreiche Zählungen fest.'
  params:
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Die Nachrichtenvorlage. Mit "-" wird auf den Standard zurückgesetzt.'
      name: embed
      optional: true
      type: string
countingtimeout:
  args:
    - user duration channel reason
  desc: 'Schließt einen Nutzer vorübergehend vom Zählen aus (Timeout).'
  params:
    - desc: 'Der Nutzer, der vom Zählen ausgeschlossen werden soll.'
      name: user
      optional: false
      type: guild user
    - desc: 'Dauer des Timeouts (z. B. 30m, 2h).'
      name: duration
      optional: false
      type: stoopid time
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Der Grund für den Timeout.'
      name: reason
      optional: true
      type: string
countingunban:
  args:
    - user channel reason
  desc: 'Hebt die Zählsperre eines Nutzers in einem bestimmten Kanal auf.'
  params:
    - desc: 'Der Nutzer, dessen Zählsperre aufgehoben werden soll.'
      name: user
      optional: false
      type: guild user
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Der Grund für die Aufhebung.'
      name: reason
      optional: true
      type: string
countmodbanned:
  args:
    - channel roles...
  desc: 'Legt Rollen fest, die vom Zählen ausgeschlossen sind.'
  params:
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Vom Zählen ausgeschlossene Rollen.'
      name: roles
      optional: true
      type: role
countmodclear:
  args:
    - user channel
  desc: 'Löscht falsche Zählungen eines Nutzers in einem Zähl-Kanal.'
  params:
    - desc: 'Der Nutzer, dessen falsche Zählungen gelöscht werden sollen.'
      name: user
      optional: false
      type: user
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
countmodclearall:
  args:
    - channel
  desc: 'Löscht falsche Zählungen aller Nutzer in einem Zähl-Kanal.'
  params:
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
countmoddefaults:
  args:
    - enabled threshold windowHours punishment durationMinutes punishmentRole
  desc: 'Legt die serverweiten Standard-Moderationseinstellungen fest.'
  params:
    - desc: 'Ob Moderation standardmäßig aktiviert ist.'
      name: enabled
      optional: false
      type: bool
    - desc: 'Standard-Schwellenwert für falsche Zählungen vor einer Strafe.'
      name: threshold
      optional: true
      type: int
    - desc: 'Standard-Zeitfenster in Stunden für die Erfassung falscher Zählungen.'
      name: windowHours
      optional: true
      type: int
    - desc: 'Die standardmäßig anzuwendende Strafe.'
      name: punishment
      optional: true
      type: punishment action
    - desc: 'Standard-Dauer für zeitlich begrenzte Strafen in Minuten.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Standardrolle für den Strafentyp AddRole.'
      name: punishmentRole
      optional: true
      type: role
countmodedits:
  args:
    - punish delete channel
  desc: 'Konfiguriert den Schutz vor Nachrichtenbearbeitungen für einen Zähl-Kanal.'
  params:
    - desc: 'Ob Bearbeitungen von Nachrichten als Verstöße bestraft werden sollen.'
      name: punish
      optional: false
      type: bool
    - desc: 'Ob bearbeitete Nachrichten gelöscht werden sollen.'
      name: delete
      optional: true
      type: bool
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
countmodenable:
  args:
    - enabled channel
  desc: 'Aktiviert oder deaktiviert die Moderation für einen bestimmten Zähl-Kanal.'
  params:
    - desc: 'Ob die Moderation aktiviert oder deaktiviert werden soll.'
      name: enabled
      optional: false
      type: bool
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
countmodignore:
  args:
    - deleteMessages channel roles...
  desc: 'Legt Rollen fest, die beim Zählen ignoriert werden.'
  params:
    - desc: 'Ob Nachrichten von ignorierten Rollen gelöscht werden sollen.'
      name: deleteMessages
      optional: false
      type: bool
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Rollen, die beim Zählen ignoriert werden.'
      name: roles
      optional: true
      type: role
countmodnonnumbers:
  args:
    - punish delete channel
  desc: 'Konfiguriert den Umgang mit Nicht-Zahl-Nachrichten für einen Zähl-Kanal.'
  params:
    - desc: 'Ob Nicht-Zahl-Nachrichten als Verstöße bestraft werden sollen.'
      name: punish
      optional: false
      type: bool
    - desc: 'Ob Nicht-Zahl-Nachrichten gelöscht werden sollen.'
      name: delete
      optional: true
      type: bool
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
countmodpunish:
  args:
    - count punishment durationMinutes role channel
  desc: 'Legt eine gestaffelte Strafe für eine bestimmte falsche Zahl fest.'
  params:
    - desc: 'Die falsche Zahl, die diese Strafe auslöst.'
      name: count
      optional: false
      type: int
    - desc: 'Die anzuwendende Strafe.'
      name: punishment
      optional: false
      type: punishment action
    - desc: 'Dauer für zeitlich begrenzte Strafen in Minuten.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Rolle für den Strafentyp AddRole.'
      name: role
      optional: true
      type: role
    - desc: 'Der Zähl-Kanal (NULL für die Server-Standards).'
      name: channel
      optional: true
      type: text channel
countmodpunishlist:
  args:
    - channel
  desc: 'Listet alle gestaffelten Strafen für den Server oder einen bestimmten Kanal auf.'
  params:
    - desc: 'Der Zähl-Kanal (NULL für die Server-Standards).'
      name: channel
      optional: true
      type: text channel
countmodpunishment:
  args:
    - punishment durationMinutes role channel
  desc: 'Legt die Strafe für falsche Zählungen fest.'
  params:
    - desc: 'Die anzuwendende Strafe.'
      name: punishment
      optional: false
      type: punishment action
    - desc: 'Dauer für zeitlich begrenzte Strafen in Minuten.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Rolle für den Strafentyp AddRole.'
      name: role
      optional: true
      type: role
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
countmodrequired:
  args:
    - channel roles...
  desc: 'Legt Rollen fest, die zum Zählen benötigt werden.'
  params:
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Rollen, die zum Zählen benötigt werden.'
      name: roles
      optional: true
      type: role
countmodreset:
  args:
    - channel
  desc: 'Setzt einen Kanal auf die Server-Standards zurück.'
  params:
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
countmodshow:
  args:
    - channel
  desc: 'Zeigt die aktuelle Moderationskonfiguration für den Zähl-Kanal oder die Server-Standards.'
  params:
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
countmodthreshold:
  args:
    - threshold channel
  desc: 'Legt den Schwellenwert für falsche Zählungen für einen Zähl-Kanal fest.'
  params:
    - desc: 'Anzahl falscher Zählungen vor einer Strafe (1–100).'
      name: threshold
      optional: false
      type: int
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel
countmodunpunish:
  args:
    - count channel
  desc: 'Entfernt eine gestaffelte Strafe für eine bestimmte falsche Zahl.'
  params:
    - desc: 'Die falsche Zahl, deren Strafe entfernt werden soll.'
      name: count
      optional: false
      type: int
    - desc: 'Der Zähl-Kanal (NULL für die Server-Standards).'
      name: channel
      optional: true
      type: text channel
countmodwindow:
  args:
    - hours channel
  desc: 'Legt das Zeitfenster für die Erfassung falscher Zählungen fest.'
  params:
    - desc: 'Zeitfenster in Stunden (1–168).'
      name: hours
      optional: false
      type: int
    - desc: 'Der Zähl-Kanal. Standard ist der aktuelle Kanal.'
      name: channel
      optional: true
      type: text channel