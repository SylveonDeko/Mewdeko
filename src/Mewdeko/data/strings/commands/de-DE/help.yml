commands:
  args:
    - '[module]'
    - '[module] [search]'
  desc: 'Zeigt Befehle eines bestimmten Moduls, optional gefiltert nach einem Suchbegriff. Ohne Angabe ist dies ein Alias für Module, das wiederum ein Alias für Hilfe ist.'
  params:
    - desc: 'Das Modul, das angezeigt werden soll, optional gefolgt von einem Begriff, nach dem seine Befehle gefiltert werden.'
