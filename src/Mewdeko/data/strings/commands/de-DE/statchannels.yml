statchannelcreate:
  args:
    - 'TotalMembers [template]'
  desc: 'Erstellt einen neuen gesperrten Sprach-Kanal, der eine Server-Statistik anzeigt. Der Bot erstellt den Kanal und verwaltet ihn.'
  params:
    - desc: 'Der Statistiktyp, der angezeigt wird.'
      name: type
      optional: false
      type: StatChannelType
    - desc: 'Die Anzeigevorlage. Verwende %count% für den Wert.'
      name: template
      optional: true
      type: string
statchanneladd:
  args:
    - '#voice-channel TotalMembers [template]'
  desc: 'Fügt einen Sprach-Kanal als Statistik-Kanal hinzu. Typen: TotalMembers, HumanMembers, BotCount, OnlineMembers, ChannelCount, RoleCount, BoostCount, BoostLevel, EmojiCount.'
  params:
    - desc: 'Der Sprach-Kanal, der verwendet wird.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Der Statistiktyp, der angezeigt wird.'
      name: type
      optional: false
      type: StatChannelType
    - desc: 'Die Anzeigevorlage. Verwende %count% für den Wert.'
      name: template
      optional: true
      type: string
statchannelrole:
  args:
    - '#voice-channel @role [template]'
  desc: 'Fügt einen Statistik-Kanal hinzu, der zeigt, wie viele Mitglieder eine bestimmte Rolle haben.'
  params:
    - desc: 'Der Sprach-Kanal, der verwendet wird.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Die Rolle, für die Mitglieder gezählt werden.'
      name: role
      optional: false
      type: IRole
    - desc: 'Die Anzeigevorlage. Verwende %count% und %role.name%.'
      name: template
      optional: true
      type: string
statchannelcountdown:
  args:
    - '#voice-channel 2026-12-31 [template]'
  desc: 'Fügt einen Countdown-Statistik-Kanal hinzu. Verwende die Platzhalter %days% und %hours%.'
  params:
    - desc: 'Der Sprach-Kanal, der verwendet wird.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Das Zieldatum für den Countdown.'
      name: date
      optional: false
      type: DateTime
    - desc: 'Die Anzeigevorlage. Verwende %days% und %hours%.'
      name: template
      optional: true
      type: string
statchannelgoal:
  args:
    - '#voice-channel 1000 [template]'
  desc: 'Fügt einen Statistik-Kanal für ein Mitgliederziel hinzu. Verwende %count%, %goal% und %goal.percent%.'
  params:
    - desc: 'Der Sprach-Kanal, der verwendet wird.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Die Ziel-Mitgliederzahl.'
      name: goal
      optional: false
      type: int
    - desc: 'Die Anzeigevorlage. Verwende %count%, %goal%, %goal.percent%.'
      name: template
      optional: true
      type: string
statchannelremove:
  args:
    - '#voice-channel'
  desc: 'Entfernt einen Statistik-Kanal.'
  params:
    - desc: 'Der Sprach-Kanal, der entfernt wird.'
      name: channel
      optional: false
      type: IVoiceChannel
statchannellist:
  args:
    - ''
  desc: 'Listet alle Statistik-Kanäle dieses Servers auf.'
  params: [ ]
statchanneltwitchcounter:
  args:
    - '#voice-channel counter [template]'
  desc: 'Legt einen Statistik-Kanal fest, der einen Twitch-Zähler anzeigt.'
statchannelmechanism:
  args:
    - '#voice-channel Rename|Recreate|Auto [interval-minutes]'
  desc: 'Legt den Aktualisierungsmechanismus für einen Statistik-Kanal fest.'
statchannelstyle:
  args:
    - '#voice-channel Plain|Comma|Abbreviated|ProgressBar'
  desc: 'Legt den Anzeigestil für einen Statistik-Kanal fest.'
statchanneldefaults:
  args:
    - '[Rename|Recreate|Auto] [interval-minutes] [Plain|Comma|Abbreviated|ProgressBar]'
  desc: 'Zeigt die Standardeinstellungen für Statistik-Kanäle an.'
statchanneltypes:
  args:
    - ''
  desc: 'Listet die verfügbaren Typen von Statistik-Kanälen auf.'
