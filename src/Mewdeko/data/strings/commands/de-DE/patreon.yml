patreonanalytics:
  args:
    - ''
  desc: 'Zeigt detaillierte Patreon-Analysen.'
  params: [ ]
patreonannounce:
  args:
    - ''
  desc: 'Löst manuell eine Patreon-Ankündigung aus.'
  params: [ ]
patreonch:
  args:
    - '#channel'
  desc: 'Legt den Patreon-Ankündigungskanal fest oder zeigt ihn an.'
  params:
    - desc: 'Der Kanal für Patreon-Ankündigungen. Bei null wird der aktuelle Kanal angezeigt.'
      name: channel
      optional: true
      type: ITextChannel?
patreonconfig:
  args:
    - ''
  desc: 'Zeigt die aktuelle Patreon-Konfiguration für diesen Server.'
  params: [ ]
patreonday:
  args:
    - number
  desc: 'Legt den Tag im Monat für Patreon-Ankündigungen fest.'
  params:
    - desc: 'Der Tag im Monat (1–28) für Ankündigungen. Bei null wird der aktuelle Tag angezeigt.'
      name: day
      optional: true
      type: int?
patreondisable:
  args:
    - ''
  desc: 'Deaktiviert Patreon-Ankündigungen für diesen Server.'
  params: [ ]
patreonhelp:
  args:
    - ''
  desc: 'Zeigt Informationen zum Patreon-Modul und die verfügbaren Platzhalter.'
  params: [ ]
patreonlink:
  args:
    - '@user text'
  desc: 'Verknüpft einen Discord-Nutzer mit einem Patreon-Unterstützer.'
  params:
    - desc: 'Der zu verknüpfende Discord-Nutzer.'
      name: user
      optional: false
      type: IGuildUser
    - desc: 'Die Patreon-Nutzer-ID, mit der verknüpft werden soll.'
      name: patreonUserId
      optional: false
      type: string
patreonmsg:
  args:
    - text
  desc: 'Legt eine eigene Nachricht für Patreon-Ankündigungen fest.'
  params:
    - desc: 'Die eigene Nachricht. Verwende Platzhalter wie %server.name%, %month% usw. Mit "-" wird auf den Standard zurückgesetzt.'
      name: message
      optional: true
      type: string?
patreonrecognize:
  args:
    - '#channel'
  desc: 'Sendet Dankesnachrichten für neue Unterstützer.'
  params:
    - desc: 'Der Kanal, in den Dankesnachrichten gesendet werden.'
      name: channel
      optional: true
      type: ITextChannel?
patreonroles:
  args:
    - ''
  desc: 'Listet die Zuordnungen von Patreon-Stufen zu Rollen auf.'
  params: [ ]
patreonrolesync:
  args:
    - ''
  desc: 'Schaltet die automatische Rollensynchronisierung um.'
  params: [ ]
patreonstats:
  args:
    - ''
  desc: 'Zeigt Statistiken zu Patreon-Unterstützern.'
  params: [ ]
patreonsupporters:
  args:
    - ''
  desc: 'Listet aktive Patreon-Unterstützer auf.'
  params: [ ]
patreonsync:
  args:
    - ''
  desc: 'Richtet die Patreon-OAuth-Integration sicher ein.'
  params: [ ]
patreonsyncall:
  args:
    - ''
  desc: 'Synchronisiert die Rollen aller verknüpften Unterstützer.'
  params: [ ]
patreontiermap:
  args:
    - text @role
  desc: 'Ordnet eine Patreon-Stufe einer Discord-Rolle zu.'
  params:
    - desc: 'Die Patreon-Stufen-ID.'
      name: tierId
      optional: false
      type: string
    - desc: 'Die Discord-Rolle, der die Stufe zugeordnet wird.'
      name: role
      optional: false
      type: IRole
patreontoggle:
  args:
    - ''
  desc: 'Schaltet Patreon-Ankündigungen ein oder aus.'
  params: [ ]
patreontop:
  args:
    - number
  desc: 'Zeigt die Top-Patreon-Unterstützer.'
  params:
    - desc: 'Anzahl der anzuzeigenden Top-Unterstützer (1–20).'
      name: count
      optional: true
      type: int