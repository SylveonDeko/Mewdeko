  desc: >-
    Stelt een aangepaste AFK-embed in die wordt weergegeven wanneer een
    gebruiker AFK is. Gebruik "-" om te resetten naar de standaard embed.
    Bekijk https://eb.mewdeko.tech voor de embed-builder en
    http://mewdeko.tech/placeholders voor plaatshouders.
  params:
