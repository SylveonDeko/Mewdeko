votechannel:
  args:
    - channel
  desc: >-
    Stelt het opgegeven tekstkanaal in als stemkanaal waar alle
    stembevestigingen naartoe worden gestuurd.
  params:
    - &ref_646
      desc: 'Het tekstkanaal dat als stemkanaal ingesteld moet worden.'
      name: channel
      optional: false
      type: ITextChannel
