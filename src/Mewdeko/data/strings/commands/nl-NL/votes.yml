votes:
  args:
    - '[@user]'
  desc: >-
    Toont het totale aantal stemmen uitgebracht door een specifieke gebruiker
    of de uitvoerder van het commando.
  params:
    - desc: 'De gebruiker wiens stemmen geteld moeten worden. Als leeg, telt de stemmen van de uitvoerder van het commando.'
      name: user
      optional: true
      type: user
votesleaderboard:
