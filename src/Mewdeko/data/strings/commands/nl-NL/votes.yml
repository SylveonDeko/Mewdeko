votemessage:
  args:
    - '[message]'
  desc: >-
    Stelt een aangepast bericht in dat wordt verzonden wanneer een gebruiker
    stemt, of toont een voorbeeld van het huidige stembericht.
  params:
    - desc: 'Het aangepaste bericht voor stemmen. Gebruik "-" om terug te zetten naar de standaard. Als leeg, toont een voorbeeld van het huidige stembericht.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: >-
    Start een bevestigingsproces voor het instellen van een nieuw stemwachtwoord
    en waarschuwt de gebruiker over de beveiliging.
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: >-
    Voegt een rol toe die wordt toegekend aan gebruikers wanneer ze stemmen,
    met een optionele duur voor automatische verwijdering van de rol.
  params:
    - desc: 'De rol die als stembeloning wordt toegevoegd.'
      name: role
      optional: false
      type: role
    - desc: 'De duur waarvoor de rol wordt toegekend. Null voor onbepaalde tijd.'
      name: time
      optional: true
      type: duration
