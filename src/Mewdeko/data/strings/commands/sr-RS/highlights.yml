highlight:
  args:
    - '<action> [words]'
    - add|list|delete
    - add
    - list
    - delete
  desc: 'Додаје, наводи, уклања или подудара истицања.'
  params:
    - desc: 'The action to perform: add, list, delete or match.'
      name: action
      optional: false
      type: highlightactions
    - desc: 'Параметри за изабрану акцију'
      name: words
      optional: true
      type: string
