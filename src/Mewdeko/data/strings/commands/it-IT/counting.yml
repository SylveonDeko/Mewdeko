countingban:
  args:
    - user channel duration reason
  desc: 'Impedisce a un utente di contare in un canale specifico.'
  params:
    - desc: 'L''utente a cui impedire di contare.'
      name: user
      optional: false
      type: guild user
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Durata del ban (ad esempio 1h, 1d). Lascia vuoto per un ban permanente.'
      name: duration
      optional: true
      type: stoopid time
    - desc: 'Il motivo del ban.'
      name: reason
      optional: true
      type: string
countingconfig:
  args:
    - channel
  desc: 'Configura le impostazioni di un canale del conteggio.'
  params:
    - desc: 'Il canale di cui mostrare la configurazione. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
countingcooldown:
  args:
    - channel seconds
  desc: 'Imposta il cooldown tra un conteggio e l''altro di un utente.'
  params:
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Cooldown in secondi (da 0 a 300).'
      name: seconds
      optional: true
      type: int
countingdisable:
  args:
    - channel purgeData reason
  desc: 'Disattiva il conteggio in un canale ed eventualmente elimina tutti i suoi dati.'
  params:
    - desc: 'Il canale in cui disattivare il conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Se eliminare tutti i dati di conteggio di questo canale. Predefinito: false.'
      name: purgeData
      optional: true
      type: bool
    - desc: 'Il motivo della disattivazione del conteggio.'
      name: reason
      optional: true
      type: string
countingfailurechannel:
  args:
    - countingChannel failureChannel
  desc: 'Imposta il canale in cui vengono registrati gli errori di conteggio.'
  params:
    - desc: 'Il canale del conteggio.'
      name: countingChannel
      optional: true
      type: text channel
    - desc: 'Il canale per i log degli errori. Usa null per disattivarlo.'
      name: failureChannel
      optional: true
      type: text channel
countingfailuremessage:
  args:
    - channel embed
  desc: 'Imposta un messaggio personalizzato per i conteggi errati.'
  params:
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Il modello del messaggio. Usa "-" per ripristinare il valore predefinito.'
      name: embed
      optional: true
      type: string
countingfailurethreshold:
  args:
    - channel threshold
  desc: 'Imposta la soglia di errori prima delle conseguenze.'
  params:
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Numero di errori prima dell''azione (da 1 a 10).'
      name: threshold
      optional: true
      type: int
countingleaderboard:
  args:
    - type channel
  desc: 'Mostra la classifica di un canale del conteggio.'
  params:
    - desc: 'Il tipo di classifica (contributions, streak, accuracy, totalnumbers).'
      name: type
      optional: true
      type: string
    - desc: 'Il canale di cui mostrare la classifica. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
countinglist:
  args:
    - ''
  desc: 'Elenca tutti i canali di conteggio attivi nel server.'
  params: [ ]
countingmilestonechannel:
  args:
    - countingChannel milestoneChannel
  desc: 'Imposta il canale in cui vengono annunciati i traguardi.'
  params:
    - desc: 'Il canale del conteggio.'
      name: countingChannel
      optional: true
      type: text channel
    - desc: 'Il canale per gli annunci dei traguardi. Usa null per disattivarlo.'
      name: milestoneChannel
      optional: true
      type: text channel
countingmilestonemessage:
  args:
    - channel embed
  desc: 'Imposta un messaggio personalizzato per i traguardi.'
  params:
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Il modello del messaggio. Usa "-" per ripristinare il valore predefinito.'
      name: embed
      optional: true
      type: string
countingmilestones:
  args:
    - channel milestones
  desc: 'Imposta numeri personalizzati per i traguardi.'
  params:
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Numeri dei traguardi separati da virgole (ad esempio 50,100,250,500,1000).'
      name: milestones
      optional: true
      type: string
countingreset:
  args:
    - channel newNumber reason
  desc: 'Reimposta il conteggio in un canale a un numero specifico.'
  params:
    - desc: 'Il canale da reimpostare. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Il numero a cui reimpostare. Predefinito: 0.'
      name: newNumber
      optional: true
      type: long
    - desc: 'Il motivo della reimpostazione.'
      name: reason
      optional: true
      type: string
countingrestore:
  args:
    - saveId channel
  desc: 'Ripristina il conteggio da un punto di salvataggio precedente.'
  params:
    - desc: 'L''ID del punto di salvataggio da cui ripristinare.'
      name: saveId
      optional: false
      type: int
    - desc: 'Il canale da ripristinare. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
countingsave:
  args:
    - channel reason
  desc: 'Crea un punto di salvataggio per l''avanzamento attuale del conteggio.'
  params:
    - desc: 'Il canale da salvare. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Il motivo della creazione del punto di salvataggio.'
      name: reason
      optional: true
      type: string
countingsetup:
  args:
    - channel startNumber increment
  desc: 'Imposta il conteggio nel canale attuale o in un canale specificato.'
  params:
    - desc: 'Il canale in cui impostare il conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Il numero da cui iniziare a contare. Predefinito: 1.'
      name: startNumber
      optional: true
      type: long
    - desc: 'L''incremento per ogni conteggio. Predefinito: 1.'
      name: increment
      optional: true
      type: int
countingstats:
  args:
    - user channel
  desc: 'Mostra le statistiche di conteggio per un utente o un canale.'
  params:
    - desc: 'L''utente di cui mostrare le statistiche. Predefinito: tu.'
      name: user
      optional: true
      type: user
    - desc: 'Il canale in cui controllare le statistiche. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
countingstatus:
  args:
    - channel
  desc: 'Mostra lo stato attuale del conteggio in un canale.'
  params:
    - desc: 'Il canale da controllare. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
countingsuccessmessage:
  args:
    - channel embed
  desc: 'Imposta un messaggio personalizzato per i conteggi riusciti.'
  params:
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Il modello del messaggio. Usa "-" per ripristinare il valore predefinito.'
      name: embed
      optional: true
      type: string
countingtimeout:
  args:
    - user duration channel reason
  desc: 'Impedisce temporaneamente a un utente di contare.'
  params:
    - desc: 'L''utente da escludere temporaneamente dal conteggio.'
      name: user
      optional: false
      type: guild user
    - desc: 'Durata del timeout (ad esempio 30m, 2h).'
      name: duration
      optional: false
      type: stoopid time
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Il motivo del timeout.'
      name: reason
      optional: true
      type: string
countingunban:
  args:
    - user channel reason
  desc: 'Rimuove il ban di conteggio di un utente in un canale specifico.'
  params:
    - desc: 'L''utente di cui rimuovere il ban dal conteggio.'
      name: user
      optional: false
      type: guild user
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Il motivo della rimozione del ban.'
      name: reason
      optional: true
      type: string
countmodbanned:
  args:
    - channel roles...
  desc: 'Imposta i ruoli esclusi dal conteggio.'
  params:
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Ruoli esclusi dal conteggio.'
      name: roles
      optional: true
      type: role
countmodclear:
  args:
    - user channel
  desc: 'Cancella i conteggi errati di un utente in un canale del conteggio.'
  params:
    - desc: 'L''utente di cui cancellare i conteggi errati.'
      name: user
      optional: false
      type: user
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
countmodclearall:
  args:
    - channel
  desc: 'Cancella i conteggi errati di tutti gli utenti in un canale del conteggio.'
  params:
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
countmoddefaults:
  args:
    - enabled threshold windowHours punishment durationMinutes punishmentRole
  desc: 'Imposta le impostazioni di moderazione predefinite per tutta la gilda.'
  params:
    - desc: 'Se la moderazione è attiva per impostazione predefinita.'
      name: enabled
      optional: false
      type: bool
    - desc: 'Soglia predefinita di conteggi errati prima della punizione.'
      name: threshold
      optional: true
      type: int
    - desc: 'Finestra temporale predefinita, in ore, per monitorare i conteggi errati.'
      name: windowHours
      optional: true
      type: int
    - desc: 'Azione di punizione predefinita da applicare.'
      name: punishment
      optional: true
      type: punishment action
    - desc: 'Durata predefinita delle punizioni a tempo, in minuti.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Ruolo predefinito per la punizione di tipo AddRole.'
      name: punishmentRole
      optional: true
      type: role
countmodedits:
  args:
    - punish delete channel
  desc: 'Configura la protezione dalle modifiche dei messaggi per un canale del conteggio.'
  params:
    - desc: 'Se punire le modifiche dei messaggi come violazioni.'
      name: punish
      optional: false
      type: bool
    - desc: 'Se eliminare i messaggi modificati.'
      name: delete
      optional: true
      type: bool
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
countmodenable:
  args:
    - enabled channel
  desc: 'Attiva o disattiva la moderazione per un canale del conteggio specifico.'
  params:
    - desc: 'Se attivare o disattivare la moderazione.'
      name: enabled
      optional: false
      type: bool
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
countmodignore:
  args:
    - deleteMessages channel roles...
  desc: 'Imposta i ruoli da ignorare nel conteggio.'
  params:
    - desc: 'Se eliminare i messaggi dei ruoli ignorati.'
      name: deleteMessages
      optional: false
      type: bool
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Ruoli da ignorare nel conteggio.'
      name: roles
      optional: true
      type: role
countmodnonnumbers:
  args:
    - punish delete channel
  desc: 'Configura la gestione dei messaggi che non sono numeri per un canale del conteggio.'
  params:
    - desc: 'Se punire i messaggi che non sono numeri come violazioni.'
      name: punish
      optional: false
      type: bool
    - desc: 'Se eliminare i messaggi che non sono numeri.'
      name: delete
      optional: true
      type: bool
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
countmodpunish:
  args:
    - count punishment durationMinutes role channel
  desc: 'Imposta una punizione a livelli per un numero di conteggio errato specifico.'
  params:
    - desc: 'Il numero di conteggio errato che fa scattare questa punizione.'
      name: count
      optional: false
      type: int
    - desc: 'L''azione di punizione da applicare.'
      name: punishment
      optional: false
      type: punishment action
    - desc: 'Durata delle punizioni a tempo, in minuti.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Ruolo per la punizione di tipo AddRole.'
      name: role
      optional: true
      type: role
    - desc: 'Il canale del conteggio (NULL per i valori predefiniti della gilda).'
      name: channel
      optional: true
      type: text channel
countmodpunishlist:
  args:
    - channel
  desc: 'Elenca tutte le punizioni a livelli per la gilda o per un canale specifico.'
  params:
    - desc: 'Il canale del conteggio (NULL per i valori predefiniti della gilda).'
      name: channel
      optional: true
      type: text channel
countmodpunishment:
  args:
    - punishment durationMinutes role channel
  desc: 'Imposta la punizione per i conteggi errati.'
  params:
    - desc: 'L''azione di punizione da applicare.'
      name: punishment
      optional: false
      type: punishment action
    - desc: 'Durata delle punizioni a tempo, in minuti.'
      name: durationMinutes
      optional: true
      type: int
    - desc: 'Ruolo per la punizione di tipo AddRole.'
      name: role
      optional: true
      type: role
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
countmodrequired:
  args:
    - channel roles...
  desc: 'Imposta i ruoli richiesti per contare.'
  params:
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
    - desc: 'Ruoli richiesti per contare.'
      name: roles
      optional: true
      type: role
countmodreset:
  args:
    - channel
  desc: 'Reimposta un canale in modo che usi i valori predefiniti della gilda.'
  params:
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
countmodshow:
  args:
    - channel
  desc: 'Mostra la configurazione di moderazione attuale per il canale del conteggio o per i valori predefiniti della gilda.'
  params:
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
countmodthreshold:
  args:
    - threshold channel
  desc: 'Imposta la soglia di conteggi errati per un canale del conteggio.'
  params:
    - desc: 'Numero di conteggi errati prima della punizione (da 1 a 100).'
      name: threshold
      optional: false
      type: int
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel
countmodunpunish:
  args:
    - count channel
  desc: 'Rimuove una punizione a livelli per un numero di conteggio errato specifico.'
  params:
    - desc: 'Il numero di conteggio errato di cui rimuovere la punizione.'
      name: count
      optional: false
      type: int
    - desc: 'Il canale del conteggio (NULL per i valori predefiniti della gilda).'
      name: channel
      optional: true
      type: text channel
countmodwindow:
  args:
    - hours channel
  desc: 'Imposta la finestra temporale per monitorare i conteggi errati.'
  params:
    - desc: 'Finestra temporale in ore (da 1 a 168).'
      name: hours
      optional: false
      type: int
    - desc: 'Il canale del conteggio. Predefinito: il canale attuale.'
      name: channel
      optional: true
      type: text channel