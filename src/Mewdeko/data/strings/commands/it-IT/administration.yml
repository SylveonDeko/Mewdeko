adsarm:
  args:
    - ''
  desc: 'Attiva o disattiva l''eliminazione automatica dei messaggi pubblicitari di server.'
  params: [ ]
antialt:
  args:
    - ''
  desc: 'Configura la protezione Anti-Alt della gilda, impostando l''età minima dell''account e l''azione di punizione con un ruolo come punizione.'
  params: [ ]
antipattern:
  args:
    - ''
  desc: 'Configura la protezione Anti-Pattern della gilda, impostando l''azione di punizione con un ruolo come punizione.'
  params: [ ]
antipattern_PunishmentAction_=:
  args:
    - '<action> [punishTime]'
    - action
  desc: 'Configura la protezione Anti-Pattern della gilda, impostando l''azione di punizione con un ruolo come punizione.'
  params:
    - desc: 'L''azione di punizione da applicare alle corrispondenze di pattern rilevate.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'La durata della punizione, se applicabile.'
      name: punishTime
      optional: true
      type: StoopidTime
antipattern_PunishmentAction_IRole:
  args:
    - action @role
  desc: 'Configura la protezione Anti-Pattern della gilda, impostando l''azione di punizione con un ruolo come punizione.'
  params:
    - desc: 'L''azione di punizione da applicare alle corrispondenze di pattern rilevate.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'Il ruolo da assegnare agli utenti che corrispondono ai pattern.'
      name: role
      optional: false
      type: IRole
patternadd:
  args:
    - '<pattern> [name] [checkUsername] [checkDisplayName]'
    - pattern
  desc: 'Aggiunge un pattern regex alla protezione Anti-Pattern.'
  params:
    - desc: 'Il pattern regex da confrontare con i nomi utente o i nomi visualizzati.'
      name: pattern
      optional: false
      type: string
    - desc: 'Nome facoltativo per il pattern.'
      name: name
      optional: true
      type: string
    - desc: 'Se controllare i nomi utente con questo pattern (predefinito: true).'
      name: checkUsername
      optional: true
      type: bool
    - desc: 'Se controllare i nomi visualizzati con questo pattern (predefinito: true).'
      name: checkDisplayName
      optional: true
      type: bool
patternremove:
  args:
    - number
  desc: 'Rimuove un pattern dalla protezione Anti-Pattern.'
  params:
    - desc: 'L''ID del pattern da rimuovere.'
      name: patternId
      optional: false
      type: int
patternlist:
  args:
    - ''
  desc: 'Elenca tutti i pattern configurati per la protezione Anti-Pattern.'
  params: [ ]
patternconfig:
  args:
    - ''
  desc: 'Mostra la configurazione anti-pattern attuale.'
  params: [ ]
patternconfig_string_string:
  args:
    - setting value
  desc: 'Mostra la configurazione anti-pattern attuale.'
  params:
    - desc: 'L''impostazione da configurare.'
      name: setting
      optional: false
      type: string
    - desc: 'Il valore da impostare.'
      name: value
      optional: false
      type: string
