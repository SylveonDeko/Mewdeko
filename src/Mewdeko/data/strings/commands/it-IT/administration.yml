antiimagehash:
  args:
    - ''
    - 'Ban'
    - 'Delete 31'
    - 'Timeout 31 1d'
  desc: 'Attiva la protezione Anti-Image-Hash, che agisce su chiunque ripubblichi un''immagine dalla lista delle immagini bloccate, incluse le copie ridimensionate, capovolte, ricaricate a qualità inferiore o incorniciate. Eseguila senza argomenti per disattivarla. La tolleranza facoltativa (da 0 a 64, predefinita 31) imposta quanto un''immagine pubblicata può differire ed essere comunque considerata bloccata.'
  params: [ ]
antiimagehashignore:
  args:
    - '<role>'
    - '<channel>'
  desc: 'Attiva o disattiva un ruolo o un canale come esente dalla protezione Anti-Image-Hash.'
  params: [ ]
antiexternalapp:
  args:
    - ''
    - 'Timeout'
    - 'Timeout 5 5 1h'
    - 'Kick 3 0'
  desc: 'Attiva la protezione Anti-External-App, che controlla i messaggi che i membri inviano tramite app aggiunte al proprio account. Un messaggio viene rimosso e il membro che ha eseguito l''app viene punito quando menziona troppe persone o ruoli (predefinito: 5, 0 la disattiva), pinga tutti, contiene un link di invito, oppure quando il membro esegue le app più volte del consentito in 10 secondi (predefinito: 5, 0 la disattiva). Le app aggiunte al server stesso non vengono controllate. Eseguila senza argomenti per disattivarla.'
  params: [ ]
blockimage:
  args:
    - ''
    - 'mrbeast crypto scam'
    - 'Delete nsfw meme'
    - 'https://example.com/scam.png mrbeast crypto scam'
  desc: 'Blocca un''immagine così che chiunque la ripubblichi venga sanzionato, incluse le copie ridimensionate, ricompresse, speculari e incorniciate. Allega l''immagine, rispondi a un messaggio che la contiene oppure indica il suo URL. Un''azione indicata prima dell''etichetta sovrascrive il predefinito della gilda solo per questa immagine.'
  params: [ ]
unblockimage:
  args:
    - '<id>'
  desc: 'Rimuove un''immagine dalla lista delle immagini bloccate tramite il suo ID, come mostrato da blockedimages.'
  params: [ ]
blockedimages:
  args:
    - ''
  desc: 'Elenca le immagini bloccate insieme al numero di volte in cui ciascuna è stata intercettata.'
  params: [ ]
imagehash:
  args:
    - ''
    - 'https://example.com/scam.png'
  desc: 'Mostra l''hash percettivo di un''immagine senza bloccarla.'
  params: [ ]
antiimagehashpreset:
  args:
    - ''
  desc: 'Attiva o disattiva la lista delle immagini di truffa note incluse in Mewdeko: i falsi casinò crypto e le immagini di giveaway falsi che attualmente vengono spammati su Discord. Vengono bloccate insieme alla tua lista. Attiva per impostazione predefinita quando Anti-Image-Hash è abilitato.'
  params: [ ]
