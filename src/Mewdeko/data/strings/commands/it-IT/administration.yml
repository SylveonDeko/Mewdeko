  desc: 'Configura la protezione Anti-Mass-Mention della gilda, impostando la soglia di menzioni per un singolo messaggio, la finestra temporale di monitoraggio delle menzioni, il numero massimo di menzioni consentite nella finestra e l''azione di punizione con un ruolo.'
