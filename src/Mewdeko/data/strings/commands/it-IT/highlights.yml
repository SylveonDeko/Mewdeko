highlights:
  args:
    - action word
  desc: 'Gestisce le evidenziazioni degli utenti.'
  params:
    - desc: 'L''azione da eseguire con le evidenziazioni.'
      name: action
      optional: false
      type: string
    - desc: 'La parola da evidenziare.'
      name: word
      optional: true
      type: string