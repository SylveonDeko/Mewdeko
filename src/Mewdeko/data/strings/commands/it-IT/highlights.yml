highlight:
  args:
    - '<action> [words]'
    - add|list|delete
    - add
    - list
    - delete
  desc: 'Aggiunge, elenca, rimuove o verifica le evidenziazioni.'
  params:
    - desc: 'L''azione da eseguire: add, list, delete o match.'
      name: action
      optional: false
      type: highlightactions
    - desc: 'Parametri per l''azione selezionata'
      name: words
      optional: true
      type: string
