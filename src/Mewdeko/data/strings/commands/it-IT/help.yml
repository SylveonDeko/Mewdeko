commands:
  args:
    - '[module]'
    - '[module] [search]'
  desc: 'Mostra i comandi di un modulo specifico, eventualmente filtrati da un termine di ricerca. Se null, è un alias per modules, che è un alias per help.'
  params:
    - desc: 'Il modulo da visualizzare, seguito facoltativamente da un termine per filtrarne i comandi'
      name: module
      optional: true
      type: string
