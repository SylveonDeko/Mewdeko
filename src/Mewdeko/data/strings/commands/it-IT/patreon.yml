patreonanalytics:
  args:
    - ''
  desc: 'Mostra le analisi dettagliate di Patreon'
  params: [ ]
patreonannounce:
  args:
    - ''
  desc: 'Attiva manualmente un annuncio Patreon.'
  params: [ ]
patreonch:
  args:
    - '#channel'
  desc: 'Imposta o mostra il canale per gli annunci Patreon.'
  params:
    - desc: 'Il canale da impostare per gli annunci Patreon. Se null, mostra il canale attuale.'
      name: channel
      optional: true
      type: ITextChannel?
patreonconfig:
  args:
    - ''
  desc: 'Mostra la configurazione Patreon attuale per questo server.'
  params: [ ]
patreonday:
  args:
    - number
  desc: 'Imposta il giorno del mese per gli annunci Patreon.'
  params:
    - desc: 'Il giorno del mese (da 1 a 28) per gli annunci. Se null, mostra il giorno attuale.'
      name: day
      optional: true
      type: int?
patreondisable:
  args:
    - ''
  desc: 'Disattiva gli annunci Patreon per questo server.'
  params: [ ]
patreonhelp:
  args:
    - ''
  desc: 'Mostra le informazioni sul modulo Patreon e i segnaposto disponibili.'
  params: [ ]
patreonlink:
  args:
    - '@user text'
  desc: 'Collega un utente Discord a un sostenitore Patreon'
  params:
    - desc: 'L''utente Discord da collegare.'
      name: user
      optional: false
      type: IGuildUser
    - desc: 'L''ID utente Patreon a cui collegarlo.'
      name: patreonUserId
      optional: false
      type: string
patreonmsg:
  args:
    - text
  desc: 'Imposta un messaggio personalizzato per gli annunci Patreon.'
  params:
    - desc: 'Il messaggio personalizzato. Usa segnaposto come %server.name%, %month%, ecc. Usa "-" per ripristinare il valore predefinito.'
      name: message
      optional: true
      type: string?
patreonrecognize:
  args:
    - '#channel'
  desc: 'Invia messaggi di riconoscimento per i nuovi sostenitori'
  params:
    - desc: 'Il canale in cui inviare i messaggi di riconoscimento.'
      name: channel
      optional: true
      type: ITextChannel?
patreonroles:
  args:
    - ''
  desc: 'Elenca le corrispondenze tra livelli Patreon e ruoli'
  params: [ ]
patreonrolesync:
  args:
    - ''
  desc: 'Attiva o disattiva la sincronizzazione automatica dei ruoli'
  params: [ ]
patreonstats:
  args:
    - ''
  desc: 'Mostra le statistiche dei sostenitori Patreon'
  params: [ ]
patreonsupporters:
  args:
    - ''
  desc: 'Elenca i sostenitori Patreon attivi'
  params: [ ]
patreonsync:
  args:
    - ''
  desc: 'Configura in modo sicuro l''integrazione OAuth di Patreon'
  params: [ ]
patreonsyncall:
  args:
    - ''
  desc: 'Sincronizza i ruoli di tutti i sostenitori collegati'
  params: [ ]
patreontiermap:
  args:
    - text @role
  desc: 'Associa un livello Patreon a un ruolo Discord'
  params:
    - desc: 'L''ID del livello Patreon.'
      name: tierId
      optional: false
      type: string
    - desc: 'Il ruolo Discord da associare al livello.'
      name: role
      optional: false
      type: IRole
patreontoggle:
  args:
    - ''
  desc: 'Attiva o disattiva gli annunci Patreon.'
  params: [ ]
patreontop:
  args:
    - number
  desc: 'Mostra i principali sostenitori Patreon'
  params:
    - desc: 'Numero dei principali sostenitori da mostrare (da 1 a 20).'
      name: count
      optional: true
      type: int