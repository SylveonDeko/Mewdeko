todoadd:
  args:
    - listId
    - title
    - description
  desc: 'Aggiunge un nuovo elemento da fare a un elenco specificato'
  params:
    - desc: 'L''ID della lista delle cose da fare.'
      name: listId
      optional: false
      type: int
    - desc: 'Il titolo dell''elemento.'
      name: title
      optional: false
      type: string
    - desc: 'Descrizione facoltativa per l''elemento.'
      name: description
      optional: true
      type: string
todoaddpriority:
  args:
    - listId
    - priority
    - title
    - description
  desc: 'Aggiunge un elemento da fare con priorità e scadenza facoltativa'
  params:
    - desc: 'L''ID della lista delle cose da fare.'
      name: listId
      optional: false
      type: int
    - desc: 'Livello di priorità (1=Bassa, 2=Media, 3=Alta, 4=Critica).'
      name: priority
      optional: false
      type: int
    - desc: 'Il titolo dell''elemento.'
      name: title
      optional: false
      type: string
    - desc: 'Descrizione facoltativa per l''elemento.'
      name: description
      optional: true
      type: string
todoaddtag:
  args:
    - itemId
    - tag
  desc: 'Aggiunge un''etichetta a un elemento da fare'
  params:
    - desc: 'L''ID dell''elemento da fare.'
      name: itemId
      optional: false
      type: int
    - desc: 'L''etichetta da aggiungere.'
      name: tag
      optional: false
      type: string
todocleardue:
  args:
    - itemId
  desc: 'Rimuove la scadenza da un elemento da fare'
  params:
    - desc: 'L''ID dell''elemento da fare.'
      name: itemId
      optional: false
      type: int
todoclearreminder:
  args:
    - itemId
  desc: 'Rimuove il promemoria da un elemento da fare'
  params:
    - desc: 'L''ID dell''elemento da fare.'
      name: itemId
      optional: false
      type: int
todocomplete:
  args:
    - itemId
  desc: 'Completa un elemento da fare'
  params:
    - desc: 'L''ID dell''elemento da fare.'
      name: itemId
      optional: false
      type: int
todocreatelist:
  args:
    - name
    - description
  desc: 'Crea una nuova lista di cose da fare'
  params:
    - desc: 'Il nome della lista delle cose da fare.'
      name: name
      optional: false
      type: string
    - desc: 'Descrizione facoltativa per la lista.'
      name: description
      optional: true
      type: string
todocreateserverlist:
  args:
    - name
    - description
  desc: 'Crea una nuova lista di cose da fare a livello di server (solo admin)'
  params:
    - desc: 'Il nome della lista di cose da fare del server.'
      name: name
      optional: false
      type: string
    - desc: 'Descrizione facoltativa per la lista.'
      name: description
      optional: true
      type: string
tododelete:
  args:
    - itemId
  desc: 'Elimina un elemento da fare'
  params:
    - desc: 'L''ID dell''elemento da fare.'
      name: itemId
      optional: false
      type: int
tododeletelist:
  args:
    - listId
  desc: 'Elimina un''intera lista di cose da fare'
  params:
    - desc: 'L''ID della lista delle cose da fare.'
      name: listId
      optional: false
      type: int
todoedit:
  args:
    - itemId
    - title
    - description
  desc: 'Modifica il titolo e la descrizione di un elemento da fare'
  params:
    - desc: 'L''ID dell''elemento da fare.'
      name: itemId
      optional: false
      type: int
    - desc: 'Il nuovo titolo.'
      name: title
      optional: false
      type: string
    - desc: 'La nuova descrizione.'
      name: description
      optional: true
      type: string
todofilter:
  args:
    - listId
    - filter
    - value
  desc: 'Filtra gli elementi da fare per etichetta o priorità'
  params:
    - desc: 'L''ID della lista delle cose da fare.'
      name: listId
      optional: false
      type: int
    - desc: 'Tipo di filtro (tag o priorità).'
      name: filter
      optional: false
      type: string
    - desc: 'Il valore con cui filtrare.'
      name: value
      optional: true
      type: string
todogrant:
  args:
    - listId
    - '@user'
    - permissions
  desc: 'Concede permessi a un utente per una lista di cose da fare (solo proprietario o admin della lista)'
  params:
    - desc: 'L''ID della lista delle cose da fare.'
      name: listId
      optional: false
      type: int
    - desc: 'L''utente a cui concedere i permessi.'
      name: user
      optional: false
      type: IUser
    - desc: 'Permessi separati da virgole (view,add,edit,complete,delete,manage,all).'
      name: permissions
      optional: false
      type: string
todolists:
  args:
    - includeServer
  desc: 'Elenca tutte le liste di cose da fare accessibili all''utente'
  params:
    - desc: 'Se includere le liste a livello di server.'
      name: includeServer
      optional: true
      type: bool
todopermissions:
  args:
    - listId
  desc: 'Mostra tutti i permessi di una lista di cose da fare'
  params:
    - desc: 'L''ID della lista delle cose da fare.'
      name: listId
      optional: false
      type: int
todoremovetag:
  args:
    - itemId
    - tag
  desc: 'Rimuove un''etichetta da un elemento da fare'
  params:
    - desc: 'L''ID dell''elemento da fare.'
      name: itemId
      optional: false
      type: int
    - desc: 'L''etichetta da rimuovere.'
      name: tag
      optional: false
      type: string
todoreorder:
  args:
    - itemId
    - newPosition
  desc: 'Sposta un elemento da fare in una nuova posizione'
  params:
    - desc: 'L''ID dell''elemento da fare.'
      name: itemId
      optional: false
      type: int
    - desc: 'La nuova posizione (a partire da 1).'
      name: newPosition
      optional: false
      type: int
todorevoke:
  args:
    - listId
    - '@user'
  desc: 'Revoca tutti i permessi di un utente su una lista di cose da fare'
  params:
    - desc: 'L''ID della lista delle cose da fare.'
      name: listId
      optional: false
      type: int
    - desc: 'L''utente a cui revocare i permessi.'
      name: user
      optional: false
      type: IUser
todosearch:
  args:
    - listId
    - query
  desc: 'Cerca elementi da fare all''interno di una lista'
  params:
    - desc: 'L''ID della lista delle cose da fare.'
      name: listId
      optional: false
      type: int
    - desc: 'La query di ricerca.'
      name: query
      optional: false
      type: string
todosetcolor:
  args:
    - listId
    - color
  desc: 'Imposta il colore per una lista di cose da fare'
  params:
    - desc: 'L''ID della lista delle cose da fare.'
      name: listId
      optional: false
      type: int
    - desc: 'Codice colore esadecimale, ad es. #ff0000.'
      name: color
      optional: false
      type: string
todosetdue:
  args:
    - itemId
    - dateString
  desc: 'Imposta la scadenza per un elemento da fare'
  params:
    - desc: 'L''ID dell''elemento da fare.'
      name: itemId
      optional: false
      type: int
    - desc: 'La data e l''ora di scadenza.'
      name: dateString
      optional: false
      type: string
todosetreminder:
  args:
    - itemId
    - dateString
  desc: 'Imposta un orario di promemoria per un elemento da fare'
  params:
    - desc: 'L''ID dell''elemento da fare.'
      name: itemId
      optional: false
      type: int
    - desc: 'La data e l''ora del promemoria.'
      name: dateString
      optional: false
      type: string
todoshow:
  args:
    - listId
    - includeCompleted
  desc: 'Mostra tutti gli elementi di una lista di cose da fare'
  params:
    - desc: 'L''ID della lista delle cose da fare.'
      name: listId
      optional: false
      type: int
    - desc: 'Se includere gli elementi completati.'
      name: includeCompleted
      optional: true
      type: bool
todotoggleprivacy:
  args:
    - listId
  desc: 'Attiva o disattiva l''impostazione di privacy per una lista di cose da fare'
  params:
    - desc: 'L''ID della lista delle cose da fare.'
      name: listId
      optional: false
      type: int