serveractivity:
  args:
    - '[days]'
    - '7'
    - '0'
  desc: 'Mostra il riepilogo di attività del server per un periodo: messaggi, tempo in vocale, contributori, ingressi e uscite, e il membro e i canali più attivi. Usa 0 per tutto il tempo.'
  params:
    - desc: 'Il periodo in giorni, 0 per tutto il tempo, oppure omesso per il valore predefinito del server.'
      name: days
      optional: true
      type: int
useractivity:
  args:
    - '[@user] [days]'
    - '@user 30'
  desc: 'Mostra il riepilogo di attività di un membro per un periodo: messaggi e tempo in vocale con le classifiche, i totali complessivi e i canali più usati.'
  params:
    - desc: 'Il membro, oppure omesso per te stesso.'
      name: user
      optional: true
      type: IGuildUser
    - desc: 'Il periodo in giorni, 0 per tutto il tempo, oppure omesso per il valore predefinito del server.'
      name: days
      optional: true
      type: int
channelactivity:
  args:
    - '[#channel] [days]'
  desc: 'Mostra il riepilogo di attività di un canale per un periodo: messaggi, tempo in vocale, contributori e i membri più attivi.'
  params:
    - desc: 'Il canale, oppure omesso per quello attuale.'
      name: channel
      optional: true
      type: IGuildChannel
    - desc: 'Il periodo in giorni, 0 per tutto il tempo, oppure omesso per il valore predefinito del server.'
      name: days
      optional: true
      type: int
activitytop:
  args:
    - '[Messages|Voice] [days] [@role]'
    - 'Voice 7'
  desc: 'Classifica i membri per messaggi o tempo in vocale in un periodo, eventualmente solo tra i membri con un ruolo.'
  params:
    - desc: 'Messages o Voice.'
      name: kind
      optional: true
      type: StatKind
    - desc: 'Il periodo in giorni, 0 per tutto il tempo, oppure omesso per il valore predefinito del server.'
      name: days
      optional: true
      type: int
    - desc: 'Includi solo i membri con questo ruolo.'
      name: role
      optional: true
      type: IRole
activitytopchannels:
  args:
    - '[Messages|Voice] [days]'
  desc: 'Classifica i canali per messaggi o tempo in vocale in un periodo.'
  params:
    - desc: 'Messages o Voice.'
      name: kind
      optional: true
      type: StatKind
    - desc: 'Il periodo in giorni, 0 per tutto il tempo, oppure omesso per il valore predefinito del server.'
      name: days
      optional: true
      type: int
activitychart:
  args:
    - '[Messages|Voice|Members|Status|Joins|Leaves|Growth|InVoice] [days]'
    - 'Members 30'
  desc: 'Disegna un grafico di messaggi, ore in vocale, numero di membri, stato dei membri, ingressi, uscite, crescita o membri in vocale in un periodo.'
  params:
    - desc: 'Cosa mostrare nel grafico.'
      name: kind
      optional: true
      type: StatChartKind
    - desc: 'Il periodo in giorni, da 1 a 90, oppure omesso per il valore predefinito del server.'
      name: days
      optional: true
      type: int
activityexport:
  args:
    - '[Messages|Voice] [days]'
  desc: 'Esporta la classifica dei membri per messaggi o tempo in vocale come file CSV.'
  params:
    - desc: 'Messages o Voice.'
      name: kind
      optional: true
      type: StatKind
    - desc: 'Il periodo in giorni, 0 per tutto il tempo, oppure omesso per il valore predefinito del server.'
      name: days
      optional: true
      type: int
statssettings:
  args:
    - ''
  desc: 'Mostra le impostazioni di monitoraggio delle statistiche di attività.'
  params: [ ]
statslookback:
  args:
    - '14'
  desc: 'Imposta il periodo predefinito in giorni che i comandi statistiche usano quando non ne viene indicato uno.'
  params:
    - desc: 'Il periodo in giorni, da 1 a 90.'
      name: days
      optional: false
      type: int
statscooldown:
  args:
    - '30'
  desc: 'Imposta quanti secondi devono passare tra due messaggi conteggiati dello stesso membro. 0 conta ogni messaggio.'
  params:
    - desc: 'Il cooldown in secondi, da 0 a 300.'
      name: seconds
      optional: false
      type: int
statstrackvoice:
  args:
    - ''
  desc: 'Attiva o disattiva il monitoraggio del tempo in vocale per le statistiche di attività.'
  params: [ ]
statstracksnapshots:
  args:
    - ''
  desc: 'Attiva o disattiva le istantanee orarie di membri e stati usate per i grafici di membri e stati.'
  params: [ ]
statscountbots:
  args:
    - ''
  desc: 'Attiva o disattiva il conteggio dei bot nelle statistiche di attività.'
  params: [ ]
statsignorevoicestate:
  args:
    - 'SelfMuted'
    - 'Afk'
  desc: 'Attiva o disattiva il conteggio nelle statistiche vocali del tempo passato in uno stato vocale (SelfMuted, SelfDeafened, ServerMuted, ServerDeafened, Afk, Alone, Streaming, Video).'
  params:
    - desc: 'Lo stato da attivare o disattivare.'
      name: state
      optional: false
      type: VoiceStateFlags
statsignore:
  args:
    - '#channel'
    - '@role'
    - '@user'
  desc: 'Attiva o disattiva l''esclusione di un canale, di ogni possessore di un ruolo o di un membro dalle statistiche di attività.'
  params:
    - desc: 'Il canale da attivare o disattivare.'
      name: channel
      optional: false
      type: IGuildChannel
    - desc: 'Il ruolo da attivare o disattivare.'
      name: role
      optional: false
      type: IRole
    - desc: 'Il membro da attivare o disattivare.'
      name: user
      optional: false
      type: IGuildUser
statsignored:
  args:
    - ''
  desc: 'Elenca i canali, i ruoli e i membri esclusi dalle statistiche di attività.'
  params: [ ]
statsprivacy:
  args:
    - ''
  desc: 'Ti esclude dalle statistiche di attività in ogni server, eliminando in modo permanente le tue statistiche di messaggi e vocali registrate, oppure ti reinserisce.'
  params: [ ]
topgames:
  args:
    - '[days]'
    - '30'
  desc: 'Classifica i giochi e le app in cui i membri passano più tempo in un periodo, con il numero di giocatori. Richiede che il monitoraggio dei giochi sia attivo.'
  params:
    - desc: 'Il periodo in giorni, 0 per tutto il tempo, oppure omesso per il valore predefinito del server.'
      name: days
      optional: true
      type: int
whoplays:
  args:
    - 'Minecraft'
  desc: 'Mostra chi gioca a un gioco o usa un''app: quanti membri ci sono in questo momento e i membri che ci hanno passato più tempo.'
  params:
    - desc: 'Il nome del gioco o dell''app.'
      name: game
      optional: false
      type: string
statstrackactivities:
  args:
    - ''
  desc: 'Attiva o disattiva il monitoraggio dei giochi e delle app usati dai membri (in riproduzione, in streaming, in ascolto, in visione, in competizione). Disattivato di default.'
  params: [ ]
statsverifyactivities:
  args:
    - ''
  desc: 'Attiva o disattiva il conteggio solo delle attività supportate da un''applicazione Discord, Spotify o da uno stream, così da bloccare le presenze falsificate da client personalizzati.'
  params: [ ]
statsactivityfiltermode:
  args:
    - 'Whitelist'
    - 'Blacklist'
  desc: 'Imposta se la lista dei filtri attività consente solo i giochi elencati (Whitelist) o li ignora (Blacklist).'
  params:
    - desc: 'Whitelist o Blacklist.'
      name: mode
      optional: false
      type: ActivityFilterMode
statsactivityfilter:
  args:
    - 'Spotify'
  desc: 'Aggiunge o rimuove un nome di gioco o app dalla lista dei filtri attività.'
  params:
    - desc: 'Il nome dell''attività.'
      name: name
      optional: false
      type: string
statsactivityfilters:
  args:
    - ''
  desc: 'Elenca il filtro attività e indica se è una whitelist o una blacklist.'
  params: [ ]
liveboardadd:
  args:
    - '#channel InviteLeaderboard [Weekly] [entries] [intervalMinutes]'
    - '#stats GrowthChart Monthly'
  desc: 'Pubblica una classifica, un grafico o una panoramica che il bot aggiorna continuamente e fissa in alto. Tipi: InviteLeaderboard, MessageLeaderboard, VoiceLeaderboard, JoinsChart, LeavesChart, GrowthChart, MembersChart, MessagesChart, ServerOverview, InviteStats.'
  params:
    - desc: 'Il canale in cui pubblicare.'
      name: channel
      optional: false
      type: ITextChannel
    - desc: 'Cosa mostrare.'
      name: kind
      optional: false
      type: LiveBoardKind
    - desc: 'Il periodo: AllTime, Daily, Weekly o Monthly.'
      name: range
      optional: true
      type: StatsRange
    - desc: 'Righe per le classifiche, da 3 a 25.'
      name: entries
      optional: true
      type: int
    - desc: 'Ogni quanto aggiornare, almeno 5 minuti.'
      name: intervalMinutes
      optional: true
      type: int
liveboardlist:
  args:
    - ''
  desc: 'Elenca le schede live.'
  params: [ ]
liveboardremove:
  args:
    - '3'
  desc: 'Elimina una scheda live e il suo messaggio.'
  params:
    - desc: 'L''ID della scheda dall''elenco.'
      name: id
      optional: false
      type: int
liveboardrefresh:
  args:
    - ''
  desc: 'Aggiorna subito tutte le schede live.'
  params: [ ]
serverreportchannel:
  args:
    - '[#channel]'
  desc: 'Imposta il canale che riceve i report programmati del server e li attiva. Ometti il canale per disattivare i report.'
  params:
    - desc: 'Il canale, oppure omesso per disattivare.'
      name: channel
      optional: true
      type: ITextChannel
serverreportfrequency:
  args:
    - 'Weekly'
  desc: 'Imposta ogni quanto pubblicare i report del server: Daily, Weekly o Monthly.'
  params:
    - desc: 'Daily, Weekly o Monthly.'
      name: frequency
      optional: false
      type: ReportFrequency
serverreportnow:
  args:
    - '[Weekly]'
  desc: 'Pubblica subito un report del server nel canale attuale, relativo al periodo indicato o a quello configurato.'
  params:
    - desc: 'Il periodo da coprire, oppure omesso per quello configurato.'
      name: frequency
      optional: true
      type: ReportFrequency
