votechannel:
  args:
    - channel
  desc: 'Imposta il canale di testo indicato come canale di voto in cui verranno inviate tutte le conferme dei voti.'
  params:
    - &ref_646
      desc: 'Il canale di testo da impostare come canale di voto.'
      name: channel
      optional: false
      type: ITextChannel
