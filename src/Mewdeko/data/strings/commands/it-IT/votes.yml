votemessage:
  args:
    - '[message]'
  desc: >-
    Imposta un messaggio personalizzato da inviare quando un utente vota o
    visualizza in anteprima il messaggio di voto corrente.
  params:
    - desc: 'Il messaggio personalizzato per i voti. Usa "-" per ripristinare al messaggio predefinito. Se null, mostra in anteprima il messaggio di voto corrente.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: >-
    Avvia un processo di conferma per impostare una nuova password di voto,
    avvertendo l''utente della sua sicurezza.
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: >-
    Aggiunge un ruolo da concedere agli utenti quando votano, con una durata
    opzionale per la rimozione automatica del ruolo.
  params:
    - desc: 'Il ruolo da aggiungere come ricompensa di voto.'
      name: role
      optional: false
      type: role
    - desc: 'La durata per cui il ruolo verrà concesso. Null per indefinito.'
      name: time
      optional: true
      type: duration
