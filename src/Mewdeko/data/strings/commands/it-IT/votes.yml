votechannel:
  args:
    - channel
  desc: >-
    Imposta il canale di testo specificato come canale di voto dove verranno
    inviate tutte le conferme di voto.
  params:
    - &ref_646
      desc: 'Il canale di testo da impostare come canale di voto.'
      name: channel
      optional: false
      type: ITextChannel
