votes:
  args:
    - '[@user]'
  desc: >-
    Mostra il numero totale di voti espressi da un utente specifico o
    dall''invocatore del comando.
  params:
    - desc: 'L''utente di cui contare i voti. Se null, conta i voti dell''invocatore del comando.'
      name: user
      optional: true
      type: user
votesleaderboard:
  args:
    - false
  desc: >-
    Mostra una classifica degli utenti in base al loro numero di voti,
    filtrando opzionalmente i voti del mese corrente.
  params:
