votemessage:
  args:
    - '[message]'
  desc: 'Imposta un messaggio personalizzato da inviare quando un utente vota o per visualizzare in anteprima il messaggio di voto attuale.'
  params:
    - desc: 'Il messaggio personalizzato da impostare per i voti. Usa "-" per ripristinare il messaggio predefinito. Se null, mostra l''anteprima del messaggio di voto attuale.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: 'Avvia una procedura di conferma per impostare una nuova password per i voti, avvisando l''utente della sua sicurezza.'
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: 'Aggiunge un ruolo da assegnare agli utenti quando votano, con una durata facoltativa dopo la quale il ruolo viene rimosso automaticamente.'
  params:
    - desc: 'Il ruolo da aggiungere come ricompensa per il voto.'
      name: role
      optional: false
      type: role
    - desc: 'La durata per cui verrà assegnato il ruolo. Null per una durata indefinita.'
      name: time
      optional: true
      type: duration
