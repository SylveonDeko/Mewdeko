coprmonitoradd:
  args:
    - '<ownerProject> [channel] [packages]'
    - '<ownerProject> [channel] [packages]'
    - ownerProject
  desc: 'Aggiunge un monitor di progetto COPR al server.'
  params:
    - desc: 'Il progetto COPR nel formato owner/project (es. linux4switch/l4s).'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Canale opzionale per le notifiche. Predefinito è il canale corrente.'
      name: channel
      optional: true
      type: ITextChannel
    - desc: 'Lista opzionale di pacchetti da monitorare separati da virgola (es. mesa,kernel).'
      name: packages
      optional: true
      type: string
coprmonitorremove:
  args:
    - '<ownerProject> [channel]'
    - ownerProject
  desc: 'Rimuove un monitor di progetto COPR dal server.'
  params:
    - desc: 'Il progetto COPR nel formato owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Canale opzionale per rimuovere un monitor specifico.'
      name: channel
      optional: true
      type: ITextChannel
coprmonitorlist:
  args:
    - ''
  desc: 'Elenca tutti i monitor COPR configurati nel server.'
  params: [ ]
coprmonitortoggle:
  args:
    - ownerProject
  desc: 'Attiva o disattiva un monitor COPR.'
  params:
    - desc: 'Il progetto COPR nel formato owner/project.'
      name: ownerProject
      optional: false
      type: string
coprnotify:
  args:
    - ownerProject status enabled
  desc: 'Configura quali stati di build attivano notifiche per un monitor.'
  params:
    - desc: 'Il progetto COPR nel formato owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Lo stato di build da configurare.'
      name: status
      optional: false
      type: CoprBuildStatus
    - desc: 'Se abilitare o disabilitare le notifiche per questo stato.'
      name: enabled
      optional: false
      type: bool
coprfilter:
  args:
    - ownerProject text
  desc: 'Imposta il filtro pacchetti per un monitor COPR.'
  params:
    - desc: 'Il progetto COPR nel formato owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Lista di pacchetti separati da virgola, o "all" per monitorare tutto.'
      name: packages
      optional: false
      type: string
coprsucceededmessage:
  args:
    - ownerProject text
  desc: 'Imposta il messaggio mostrato quando una build COPR ha successo.'
  params:
    - desc: 'Il progetto COPR nel formato owner/project.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Il messaggio o codice embed. Usa "-" per ripristinare al predefinito.'
      name: message
      optional: false
      type: string
coprfailedmessage:
