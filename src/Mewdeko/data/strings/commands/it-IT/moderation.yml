banprune:
  args:
    - ''
  desc: 'Mostra la pulizia che un ban emesso in questo canale userebbe, insieme a tutte le impostazioni configurate.'
  params:
    - { }
banpruneset:
  args:
    - '<action> <days> [#channel]'
  desc: 'Imposta quanti giorni di messaggi elimina un''azione di ban. Usa "all" per tutte le azioni, e indica un canale o una categoria per sovrascrivere solo quell''ambito.'
  params:
    - desc: 'La chiave dell''azione, oppure "all" per coprire tutte le azioni'
      name: action
      optional: false
      type: string
    - desc: 'La pulizia in giorni, da 0 a 7'
      name: days
      optional: false
      type: int
    - desc: 'Un canale o una categoria a cui limitare l''impostazione, oppure niente per il valore predefinito del server'
      name: target
      optional: true
      type: channel
banpruneclear:
  args:
    - '<action> [#channel]'
  desc: 'Rimuove un''impostazione di pulizia così che l''azione ricada su un ambito più ampio o sul valore predefinito.'
  params:
    - desc: 'La chiave dell''azione, oppure "all" per l''impostazione che copre tutte le azioni'
      name: action
      optional: false
      type: string
    - desc: 'Il canale o la categoria su cui è impostata l''impostazione, oppure niente per il valore predefinito del server'
      name: target
      optional: true
      type: channel
banprunereset:
  args:
    - ''
  desc: 'Rimuove tutte le impostazioni di pulizia nel server.'
  params:
    - { }
ban:
  args:
    - '<pruneTime> <time> [@user] [msg]'
    - time time
  desc: 'Banna un utente con il motivo indicato e il numero di giorni di messaggi da eliminare.'
  params:
    - desc: 'Banna un utente con il motivo indicato e il numero di giorni di messaggi da eliminare.'
      name: pruneTime
      optional: false
      type: duration
    - desc: 'La durata per cui eliminare i messaggi'
      name: time
      optional: false
      type: duration
    - desc: 'L''utente da bannare'
      name: user
      optional: true
      type: user
    - desc: 'Il motivo del ban'
      name: msg
      optional: true
      type: string
