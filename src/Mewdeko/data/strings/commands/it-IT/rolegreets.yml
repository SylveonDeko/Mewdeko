rolegreetwebhook:
  args:
    - '<id> [name] [avatar]'
    - number
  desc: 'Configura un webhook per un messaggio di benvenuto del ruolo, con nome e avatar personalizzati. Se non viene fornito un nome, il webhook viene disabilitato.'
  params:
    - desc: "L'ID del saluto del ruolo per configurare il webhook, in base alla sua posizione nell'elenco di tutti i saluti dei ruoli."
      name: id
      optional: false
      type: int
    - desc: 'Il nome del webhook. Facoltativo.'
      name: name
      optional: true
      type: string
    - desc: "L'URL dell'avatar per il webhook. Facoltativo."
      name: avatar
      optional: true
