  params: [ ]
rolegreetmessage:
  args:
    - '<id> [message]'
    - number
  desc: 'Aggiorna il contenuto del messaggio di un saluto del ruolo. Se non viene fornito alcun messaggio, presenta opzioni per visualizzare in anteprima il messaggio o vederlo come testo normale.'
  params:
    - desc: "L'ID del saluto del ruolo da aggiornare, in base alla sua posizione nell'elenco di tutti i saluti dei ruoli."
      name: id
      optional: false
      type: int
    - desc: 'Il nuovo contenuto del messaggio. Facoltativo.'
      name: message
      optional: true
      type: string
