rolegreetmessage:
  args:
    - '<id> [message]'
    - number
  desc: 'Aggiorna il contenuto del messaggio di un benvenuto per ruolo. Se non viene fornito alcun messaggio, mostra le opzioni per visualizzarne l''anteprima così com''è o come testo normale.'
  params:
    - desc: 'L''ID del benvenuto per ruolo da aggiornare, in base alla sua posizione nell''elenco di tutti i benvenuti per ruolo.'
      name: id
      optional: false
      type: int
    - desc: 'Il nuovo contenuto del messaggio. Facoltativo.'
      name: message
      optional: true
      type: string
