rolegreetadd:
  args:
    - '@role [@channel]'
    - '@role'
  desc: 'Aggiunge un nuovo messaggio di benvenuto per ruolo per il ruolo indicato. Se non viene specificato un canale, viene usato quello attuale.'
  params:
    - desc: 'Il ruolo per cui viene impostato il messaggio di benvenuto.'
      name: role
      optional: false
      type: role
    - desc: 'Il canale di testo in cui verrà inviato il messaggio di benvenuto. Facoltativo.'
      name: channel
      optional: true
      type: channel
