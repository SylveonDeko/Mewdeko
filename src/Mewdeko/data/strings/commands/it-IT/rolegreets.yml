rolegreetadd:
  args:
    - '@role [@channel]'
    - '@role'
  desc: 'Aggiunge un nuovo messaggio di benvenuto per un ruolo specifico. Se non viene specificato un canale, viene utilizzato il canale corrente.'
  params:
    - desc: 'Il ruolo per cui viene impostato il messaggio di benvenuto.'
      name: role
      optional: false
      type: role
    - desc: 'Il canale di testo in cui verrà inviato il messaggio di benvenuto. Facoltativo.'
      name: channel
      optional: true
      type: channel
