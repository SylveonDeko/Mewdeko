rolegreetwebhook:
  args:
    - '<id> [name] [avatar]'
    - number
  desc: 'Configura un webhook per un messaggio di benvenuto per ruolo, con nome e avatar personalizzati. Se non viene indicato alcun nome, il webhook viene disattivato.'
  params:
    - desc: 'L''ID del benvenuto per ruolo per cui configurare il webhook, in base alla sua posizione nell''elenco di tutti i benvenuti per ruolo.'
      name: id
      optional: false
      type: int
    - desc: 'Il nome del webhook. Facoltativo.'
      name: name
      optional: true
      type: string
    - desc: 'L''URL dell''avatar del webhook. Facoltativo.'
