birthdayannouncements:
  args:
    - ''
  desc: 'Attiva o disattiva gli annunci di compleanno per l''utente.'
  params: [ ]
birthdaychannel:
  args:
    - '#channel'
  desc: 'Imposta il canale per gli annunci di compleanno.'
  params:
    - desc: 'Il canale di testo da usare per gli annunci. Predefinito: il canale attuale, se non specificato.'
      name: channel
      optional: true
      type: ITextChannel
birthdayconfig:
  args:
    - ''
  desc: 'Visualizza la configurazione attuale dei compleanni.'
  params: [ ]
birthdaylist:
  args:
    - days
  desc: 'Mostra i prossimi compleanni nel server.'
  params:
    - desc: 'Quanti giorni guardare avanti. Predefinito: 7, massimo: 30.'
      name: days
      optional: true
      type: int
birthdaymessage:
  args:
    - message
  desc: 'Imposta un modello personalizzato per il messaggio di compleanno.'
  params:
    - desc: 'Il modello del messaggio. Usa {user} per menzionare l''utente. Se lasciato vuoto, mostra il messaggio attuale.'
      name: message
      optional: true
      type: string
birthdaypingrole:
  args:
    - '@role'
  desc: 'Imposta il ruolo da menzionare quando si annunciano i compleanni.'
  params:
    - desc: 'Il ruolo da menzionare. Non indicare alcun ruolo per disattivarlo.'
      name: role
      optional: true
      type: IRole
birthdayrole:
  args:
    - '@role'
  desc: 'Imposta il ruolo di compleanno che gli utenti ricevono il giorno del loro compleanno.'
  params:
    - desc: 'Il ruolo da assegnare nel giorno del compleanno di un utente. Non indicare alcun ruolo per disattivarlo.'
      name: role
      optional: true
      type: IRole
birthdaytimezone:
  args:
    - timezone
  desc: 'Imposta il fuso orario dell''utente per i calcoli dei compleanni.'
  params:
    - desc: 'Il fuso orario da impostare (ad esempio "America/New_York").'
      name: timezone
      optional: false
      type: string
birthdaytoday:
  args:
    - ''
  desc: 'Mostra i compleanni di oggi.'
  params: [ ]