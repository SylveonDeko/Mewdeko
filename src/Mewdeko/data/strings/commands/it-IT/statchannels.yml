statchannelcreate:
  args:
    - 'TotalMembers [template]'
  desc: 'Crea un nuovo canale vocale bloccato che mostra una statistica del server. Il bot creerà e gestirà il canale.'
  params:
    - desc: 'Il tipo di statistica da mostrare.'
      name: type
      optional: false
      type: StatChannelType
    - desc: 'Il template di visualizzazione. Usa %count% per il valore.'
      name: template
      optional: true
      type: string
statchanneladd:
  args:
    - '#voice-channel TotalMembers [template]'
  desc: 'Aggiunge un canale vocale come canale statistiche. Tipi: TotalMembers, HumanMembers, BotCount, OnlineMembers, ChannelCount, RoleCount, BoostCount, BoostLevel, EmojiCount.'
  params:
    - desc: 'Il canale vocale da usare.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Il tipo di statistica da mostrare.'
      name: type
      optional: false
      type: StatChannelType
    - desc: 'Il template di visualizzazione. Usa %count% per il valore.'
      name: template
      optional: true
      type: string
statchannelrole:
  args:
    - '#voice-channel @role [template]'
  desc: 'Aggiunge un canale statistiche che mostra quanti membri hanno un ruolo specifico.'
  params:
    - desc: 'Il canale vocale da usare.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Il ruolo di cui contare i membri.'
      name: role
      optional: false
      type: IRole
    - desc: 'Il template di visualizzazione. Usa %count% e %role.name%.'
      name: template
      optional: true
      type: string
statchannelcountdown:
  args:
    - '#voice-channel 2026-12-31 [template]'
  desc: 'Aggiunge un canale conto alla rovescia. Usa i segnaposto %days% e %hours%.'
  params:
    - desc: 'Il canale vocale da usare.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'La data di destinazione per il conto alla rovescia.'
      name: date
      optional: false
      type: DateTime
    - desc: 'Il template di visualizzazione. Usa %days% e %hours%.'
      name: template
      optional: true
      type: string
statchannelgoal:
  args:
    - '#voice-channel 1000 [template]'
  desc: 'Aggiunge un canale obiettivo membri. Usa %count%, %goal% e %goal.percent%.'
  params:
    - desc: 'Il canale vocale da usare.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'Il numero di membri obiettivo.'
      name: goal
      optional: false
      type: int
    - desc: 'Il template di visualizzazione. Usa %count%, %goal%, %goal.percent%.'
      name: template
      optional: true
      type: string
statchannelremove:
  args:
    - '#voice-channel'
  desc: 'Rimuove un canale statistiche.'
  params:
    - desc: 'Il canale vocale da rimuovere.'
      name: channel
      optional: false
      type: IVoiceChannel
statchannellist:
  args:
    - ''
  desc: 'Elenca tutti i canali statistiche di questo server.'
  params: [ ]
