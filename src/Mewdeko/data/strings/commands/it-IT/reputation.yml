anonrep:
  args:
    - '@user reptype text'
  desc: 'Assegna una reputazione anonima a un utente specificato.'
  params:
    - &ref_228
      desc: 'L''utente a cui assegnare la reputazione.'
      name: target
      optional: true
      type: IGuildUser
    - &ref_229
      desc: 'Il tipo di reputazione da assegnare.'
      name: repType
      optional: true
      type: string
    - &ref_230
      desc: 'Motivo o commento facoltativo per l''assegnazione della reputazione.'
      name: reason
      optional: true
      type: string
checkrep:
  args:
    - '@user'
  desc: 'Controlla la reputazione di un utente.'
  params:
    - &ref_425
      desc: 'L''utente di cui controllare la reputazione.'
      name: target
      optional: true
      type: IGuildUser
giverep:
  args:
    - '@user reptype text'
  desc: 'Assegna reputazione a un utente specificato.'
  params:
    - desc: 'L''utente a cui assegnare la reputazione.'
      name: target
      optional: true
      type: IGuildUser
    - desc: 'Il tipo di reputazione da assegnare.'
      name: repType
      optional: true
      type: string
    - desc: 'Motivo o commento facoltativo per l''assegnazione della reputazione.'
      name: reason
      optional: true
      type: string
myrep:
  args:
    - ''
  desc: 'Controlla la reputazione dell''utente attuale.'
  params: [ ]
rep:
  args:
    - '@user reptype text'
  desc: 'Assegna reputazione a un utente specificato.'
  params:
    - desc: 'L''utente a cui assegnare la reputazione.'
      name: target
      optional: true
      type: IGuildUser
    - desc: 'Il tipo di reputazione da assegnare.'
      name: repType
      optional: true
      type: string
    - desc: 'Motivo o commento facoltativo per l''assegnazione della reputazione.'
