  desc: 'Beállítja a sikeres COPR build esetén megjelenő üzenetet.'
  params:
    - desc: 'A COPR projekt owner/project formátumban.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Az üzenet vagy embed kód. Használj "-"-t az alapértelmezett visszaállításához.'
      name: message
      optional: false
      type: string
