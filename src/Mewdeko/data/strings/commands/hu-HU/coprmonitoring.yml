coprmonitoradd:
  args:
    - '<ownerProject> [channel] [packages]'
    - '<ownerProject> [channel] [packages]'
    - ownerProject
  desc: 'COPR projekt monitort ad a szerverhez.'
  params:
    - desc: 'A COPR projekt owner/project formátumban (pl. linux4switch/l4s).'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Opcionális csatorna értesítésekhez. Alapértelmezett az aktuális csatorna.'
      name: channel
      optional: true
      type: ITextChannel
    - desc: 'Opcionális vesszővel elválasztott csomaglista monitorozáshoz (pl. mesa,kernel).'
      name: packages
      optional: true
      type: string
coprmonitorremove:
  args:
    - '<ownerProject> [channel]'
    - ownerProject
  desc: 'COPR projekt monitort távolít el a szerverről.'
  params:
    - desc: 'A COPR projekt owner/project formátumban.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Opcionális csatorna egy adott monitor eltávolításához.'
      name: channel
      optional: true
      type: ITextChannel
coprmonitorlist:
  args:
    - ''
  desc: 'Felsorolja a szerveren beállított összes COPR monitort.'
  params: [ ]
coprmonitortoggle:
  args:
    - ownerProject
  desc: 'Be- vagy kikapcsol egy COPR monitort.'
  params:
    - desc: 'A COPR projekt owner/project formátumban.'
      name: ownerProject
      optional: false
      type: string
coprnotify:
  args:
    - ownerProject status enabled
  desc: 'Beállítja, mely build állapotok indítanak értesítéseket egy monitorhoz.'
  params:
    - desc: 'A COPR projekt owner/project formátumban.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'A beállítandó build állapot.'
      name: status
      optional: false
      type: CoprBuildStatus
    - desc: 'Értesítések engedélyezése vagy letiltása ennél az állapotnál.'
      name: enabled
      optional: false
      type: bool
coprfilter:
  args:
    - ownerProject text
  desc: 'Beállítja a csomag szűrőt egy COPR monitorhoz.'
  params:
    - desc: 'A COPR projekt owner/project formátumban.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Vesszővel elválasztott csomaglista, vagy "all" minden monitorozásához.'
      name: packages
      optional: false
      type: string
coprsucceededmessage:
  args:
