birthdayannouncements:
  args:
    - ''
  desc: 'Activa o desactiva los anuncios de cumpleaños del usuario.'
  params: [ ]
birthdaychannel:
  args:
    - '#channel'
  desc: 'Define el canal de anuncios de cumpleaños.'
  params:
    - desc: 'El canal de texto para los anuncios. Si no se indica, se usa el canal actual.'
      name: channel
      optional: true
      type: ITextChannel
birthdayconfig:
  args:
    - ''
  desc: 'Muestra la configuración actual de cumpleaños.'
  params: [ ]
birthdaylist:
  args:
    - days
  desc: 'Muestra los próximos cumpleaños del servidor.'
  params:
    - desc: 'Cuántos días hacia adelante mirar. Por defecto, 7; máximo, 30.'
      name: days
      optional: true
      type: int
birthdaymessage:
  args:
    - message
  desc: 'Define una plantilla personalizada de mensaje de cumpleaños.'
  params:
    - desc: 'La plantilla del mensaje. Usa {user} para mencionar al usuario. Si se deja vacía, muestra el mensaje actual.'
      name: message
      optional: true
      type: string
birthdaypingrole:
  args:
    - '@role'
  desc: 'Define el rol a mencionar al anunciar cumpleaños.'
  params:
    - desc: 'El rol a mencionar. No indiques ningún rol para desactivarlo.'
      name: role
      optional: true
      type: IRole
birthdayrole:
  args:
    - '@role'
  desc: 'Define el rol de cumpleaños que obtienen los usuarios en su cumpleaños.'
  params:
    - desc: 'El rol a asignar en el cumpleaños de un usuario. No indiques ningún rol para desactivarlo.'
      name: role
      optional: true
      type: IRole
birthdaytimezone:
  args:
    - timezone
  desc: 'Define la zona horaria del usuario para los cálculos de cumpleaños.'
  params:
    - desc: 'La zona horaria a definir (por ejemplo, "America/New_York").'
      name: timezone
      optional: false
      type: string
birthdaytoday:
  args:
    - ''
  desc: 'Muestra los cumpleaños de hoy.'
  params: [ ]