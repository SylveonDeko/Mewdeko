serveractivity:
  args:
    - '[days]'
    - '7'
    - '0'
  desc: 'Muestra el resumen de actividad del servidor en un periodo: mensajes, tiempo de voz, colaboradores, entradas y salidas, y el miembro y los canales más activos. Usa 0 para todo el tiempo.'
  params:
    - desc: 'El periodo en días, 0 para todo el tiempo, u omitido para el valor predeterminado del servidor.'
      name: days
      optional: true
      type: int
useractivity:
  args:
    - '[@user] [days]'
    - '@user 30'
  desc: 'Muestra el resumen de actividad de un miembro en un periodo: mensajes y tiempo de voz con sus rankings, totales históricos y sus canales más usados.'
  params:
    - desc: 'El miembro, u omitido para ti mismo.'
      name: user
      optional: true
      type: IGuildUser
    - desc: 'El periodo en días, 0 para todo el tiempo, u omitido para el valor predeterminado del servidor.'
      name: days
      optional: true
      type: int
channelactivity:
  args:
    - '[#channel] [days]'
  desc: 'Muestra el resumen de actividad de un canal en un periodo: mensajes, tiempo de voz, colaboradores y sus miembros más activos.'
  params:
    - desc: 'El canal, u omitido para el canal actual.'
      name: channel
      optional: true
      type: IGuildChannel
    - desc: 'El periodo en días, 0 para todo el tiempo, u omitido para el valor predeterminado del servidor.'
      name: days
      optional: true
      type: int
activitytop:
  args:
    - '[Messages|Voice] [days] [@role]'
    - 'Voice 7'
  desc: 'Ordena a los miembros por mensajes o tiempo de voz en un periodo, opcionalmente solo los miembros con un rol.'
  params:
    - desc: 'Messages o Voice.'
      name: kind
      optional: true
      type: StatKind
    - desc: 'El periodo en días, 0 para todo el tiempo, u omitido para el valor predeterminado del servidor.'
      name: days
      optional: true
      type: int
    - desc: 'Incluir solo a los miembros con este rol.'
      name: role
      optional: true
      type: IRole
activitytopchannels:
  args:
    - '[Messages|Voice] [days]'
  desc: 'Ordena los canales por mensajes o tiempo de voz en un periodo.'
  params:
    - desc: 'Messages o Voice.'
      name: kind
      optional: true
      type: StatKind
    - desc: 'El periodo en días, 0 para todo el tiempo, u omitido para el valor predeterminado del servidor.'
      name: days
      optional: true
      type: int
activitychart:
  args:
    - '[Messages|Voice|Members|Status|Joins|Leaves|Growth|InVoice] [days]'
    - 'Members 30'
  desc: 'Dibuja un gráfico de mensajes, horas de voz, número de miembros, estado de los miembros, entradas, salidas, crecimiento o miembros en voz en un periodo.'
  params:
    - desc: 'Lo que se mostrará en el gráfico.'
      name: kind
      optional: true
      type: StatChartKind
    - desc: 'El periodo en días, de 1 a 90, u omitido para el valor predeterminado del servidor.'
      name: days
      optional: true
      type: int
activityexport:
  args:
    - '[Messages|Voice] [days]'
  desc: 'Exporta un ranking de miembros por mensajes o tiempo de voz como archivo CSV.'
  params:
    - desc: 'Messages o Voice.'
      name: kind
      optional: true
      type: StatKind
    - desc: 'El periodo en días, 0 para todo el tiempo, u omitido para el valor predeterminado del servidor.'
      name: days
      optional: true
      type: int
statssettings:
  args:
    - ''
  desc: 'Muestra la configuración del seguimiento de estadísticas de actividad.'
  params: [ ]
statslookback:
  args:
    - '14'
  desc: 'Establece el periodo predeterminado en días que usan los comandos de estadísticas cuando no se indica ninguno.'
  params:
    - desc: 'El periodo en días, de 1 a 90.'
      name: days
      optional: false
      type: int
statscooldown:
  args:
    - '30'
  desc: 'Establece cuántos segundos deben pasar entre dos mensajes contados del mismo miembro. 0 cuenta todos los mensajes.'
  params:
    - desc: 'El tiempo de espera en segundos, de 0 a 300.'
      name: seconds
      optional: false
      type: int
statstrackvoice:
  args:
    - ''
  desc: 'Activa o desactiva el seguimiento del tiempo de voz para las estadísticas de actividad.'
  params: [ ]
statstracksnapshots:
  args:
    - ''
  desc: 'Activa o desactiva las capturas horarias de miembros y estados usadas en los gráficos de miembros y estados.'
  params: [ ]
statscountbots:
  args:
    - ''
  desc: 'Activa o desactiva el cómputo de bots en las estadísticas de actividad.'
  params: [ ]
statsignorevoicestate:
  args:
    - 'SelfMuted'
    - 'Afk'
  desc: 'Activa o desactiva que el tiempo en un estado de voz (SelfMuted, SelfDeafened, ServerMuted, ServerDeafened, Afk, Alone, Streaming, Video) cuente para las estadísticas de voz.'
  params:
    - desc: 'El estado a activar o desactivar.'
      name: state
      optional: false
      type: VoiceStateFlags
statsignore:
  args:
    - '#channel'
    - '@role'
    - '@user'
  desc: 'Activa o desactiva que un canal, todos los poseedores de un rol o un miembro queden excluidos de las estadísticas de actividad.'
  params:
    - desc: 'El canal a activar o desactivar.'
      name: channel
      optional: false
      type: IGuildChannel
    - desc: 'El rol a activar o desactivar.'
      name: role
      optional: false
      type: IRole
    - desc: 'El miembro a activar o desactivar.'
      name: user
      optional: false
      type: IGuildUser
statsignored:
  args:
    - ''
  desc: 'Muestra los canales, roles y miembros excluidos de las estadísticas de actividad.'
  params: [ ]
statsprivacy:
  args:
    - ''
  desc: 'Te excluye de las estadísticas de actividad en todos los servidores, eliminando permanentemente tus estadísticas registradas de mensajes y voz, o te vuelve a incluir.'
  params: [ ]
topgames:
  args:
    - '[days]'
    - '30'
  desc: 'Ordena los juegos y apps en los que los miembros pasan más tiempo en un periodo, con el número de jugadores. Requiere tener activado el seguimiento de juegos.'
  params:
    - desc: 'El periodo en días, 0 para todo el tiempo, u omitido para el valor predeterminado del servidor.'
      name: days
      optional: true
      type: int
whoplays:
  args:
    - 'Minecraft'
  desc: 'Muestra quién juega a un juego o usa una app: cuántos miembros están en ello ahora mismo y los miembros con más tiempo dedicado.'
  params:
    - desc: 'El nombre del juego o app.'
      name: game
      optional: false
      type: string
statstrackactivities:
  args:
    - ''
  desc: 'Activa o desactiva el seguimiento de los juegos y apps que usan los miembros (jugando, transmitiendo, escuchando, viendo, compitiendo). Desactivado por defecto.'
  params: [ ]
statsverifyactivities:
  args:
    - ''
  desc: 'Activa o desactiva que solo se cuenten las actividades respaldadas por una aplicación de Discord, Spotify o un stream, lo que bloquea las presencias falsificadas por clientes personalizados.'
  params: [ ]
statsactivityfiltermode:
  args:
    - 'Whitelist'
    - 'Blacklist'
  desc: 'Establece si la lista de filtros de actividad solo permite los juegos listados (Whitelist) o los ignora (Blacklist).'
  params:
    - desc: 'Whitelist o Blacklist.'
      name: mode
      optional: false
      type: ActivityFilterMode
statsactivityfilter:
  args:
    - 'Spotify'
  desc: 'Añade o quita un nombre de juego o app en la lista de filtros de actividad.'
  params:
    - desc: 'El nombre de la actividad.'
      name: name
      optional: false
      type: string
statsactivityfilters:
  args:
    - ''
  desc: 'Muestra la lista de filtros de actividad y si es una lista blanca o negra.'
  params: [ ]
liveboardadd:
  args:
    - '#channel InviteLeaderboard [Weekly] [entries] [intervalMinutes]'
    - '#stats GrowthChart Monthly'
  desc: 'Publica una clasificación, gráfico o resumen que el bot mantiene actualizado y fija en el canal. Tipos: InviteLeaderboard, MessageLeaderboard, VoiceLeaderboard, JoinsChart, LeavesChart, GrowthChart, MembersChart, MessagesChart, ServerOverview, InviteStats.'
  params:
    - desc: 'El canal donde publicar.'
      name: channel
      optional: false
      type: ITextChannel
    - desc: 'Lo que se mostrará.'
      name: kind
      optional: false
      type: LiveBoardKind
    - desc: 'El periodo: AllTime, Daily, Weekly o Monthly.'
      name: range
      optional: true
      type: StatsRange
    - desc: 'Filas para las clasificaciones, de 3 a 25.'
      name: entries
      optional: true
      type: int
    - desc: 'Con qué frecuencia actualizar, como mínimo 5 minutos.'
      name: intervalMinutes
      optional: true
      type: int
liveboardlist:
  args:
    - ''
  desc: 'Muestra los paneles en directo.'
  params: [ ]
liveboardremove:
  args:
    - '3'
  desc: 'Elimina un panel en directo y su mensaje.'
  params:
    - desc: 'El ID del panel de la lista.'
      name: id
      optional: false
      type: int
liveboardrefresh:
  args:
    - ''
  desc: 'Actualiza ahora mismo todos los paneles en directo.'
  params: [ ]
serverreportchannel:
  args:
    - '[#channel]'
  desc: 'Establece el canal que recibe los informes programados del servidor y los activa. Omite el canal para desactivar los informes.'
  params:
    - desc: 'El canal, u omitido para desactivar.'
      name: channel
      optional: true
      type: ITextChannel
serverreportfrequency:
  args:
    - 'Weekly'
  desc: 'Establece con qué frecuencia se publican los informes del servidor: Daily, Weekly o Monthly.'
  params:
    - desc: 'Daily, Weekly o Monthly.'
      name: frequency
      optional: false
      type: ReportFrequency
serverreportnow:
  args:
    - '[Weekly]'
  desc: 'Publica ahora mismo un informe del servidor en el canal actual, con el periodo indicado o el configurado.'
  params:
    - desc: 'El periodo a cubrir, u omitido para el configurado.'
      name: frequency
      optional: true
      type: ReportFrequency
