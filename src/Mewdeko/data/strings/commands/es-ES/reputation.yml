  args:
    - enabled
  desc: 'Activa o desactiva la reputación negativa.'
  params:
    - desc: 'True para activar la reputación negativa.'
      name: enabled
      optional: false
      type: bool
repnotificationchannel:
  args:
    - channel
  desc: 'Establece el canal de notificaciones para los eventos de reputación.'
  params:
    - desc: 'El canal al que enviar las notificaciones (null para desactivarlo).'
      name: channel
      optional: true
      type: ITextChannel
