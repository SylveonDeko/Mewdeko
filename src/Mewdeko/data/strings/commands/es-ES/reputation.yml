  args:
    - emoji number reptype
  desc: 'Configura la entrega de reputación mediante reacciones.'
  params:
    - desc: 'El emoji que se usará para la reputación.'
      name: emoji
      optional: false
      type: string
    - desc: 'La cantidad de reputación que se otorgará.'
      name: amount
      optional: true
      type: int
    - desc: 'El tipo de reputación (standard, helper, artist, memer).'
      name: repType
      optional: true
      type: string
repreactionlist:
  args:
    - ''
  desc: 'Muestra todas las configuraciones de reputación por reacciones.'
  params: [ ]
repreactionremove:
  args:
    - emoji
  desc: 'Elimina una configuración de reputación por reacciones.'
  params:
    - desc: 'El emoji que se eliminará.'
      name: emoji
      optional: false
      type: string
represet:
  args:
    - text
  desc: 'Restablece la reputación de un usuario o de todos los usuarios del servidor.'
  params:
    - desc: 'El usuario a restablecer, o "all" para restablecer a todos.'
      name: target
      optional: false
      type: string
reprole:
  args:
    - ''
    - detailed
    - '@role'
    - '@role 100'
    - '@role 100 false #channel true 50'
  desc: 'Gestiona las recompensas de rol por hitos de reputación. Úsalo sin parámetros para ver todas las recompensas, o indica un rol y una reputación para añadir o actualizar una recompensa con ajustes avanzados opcionales.'
  params:
    - &ref_437
      desc: 'El rol a otorgar (opcional para listar).'
      name: role
      optional: true
      type: IRole
    - desc: 'La reputación necesaria para obtener este rol (opcional para listar).'
      name: reputation
      optional: true
      type: int
    - desc: 'Si se debe quitar el rol cuando la reputación baje.'
      name: removeOnDrop
      optional: true
      type: bool
    - desc: 'Canal opcional para anunciar la entrega de roles.'
      name: announceChannel
      optional: true
      type: ITextChannel
    - desc: 'Si se deben enviar notificaciones por MD.'
      name: announceDm
      optional: true
      type: bool
    - desc: 'Recompensa de XP opcional al alcanzar el hito.'
      name: xpReward
      optional: true
      type: int
    - desc: 'Muestra información detallada al listar (usa ''detailed'' como primer parámetro).'
      name: detailed
      optional: true
      type: string
reprolechannel:
  args:
    - role channel
  desc: 'Establece el canal de anuncios para una recompensa de rol.'
  params:
    - desc: 'El rol a configurar.'
      name: role
      optional: false
      type: IRole
    - desc: 'El canal para los anuncios (null para desactivarlo).'
      name: channel
      optional: true
      type: ITextChannel
reproleremove:
  args:
    - '@role'
  desc: 'Elimina la configuración de una recompensa de rol.'
  params:
    - desc: 'El rol que se quitará de las recompensas.'
      name: role
      optional: true
      type: IRole
