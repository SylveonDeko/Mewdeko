repanonymous:
  args:
    - enabled
  desc: 'Activa o desactiva la posibilidad de dar reputación de forma anónima.'
  params:
    - desc: 'True para activar la reputación anónima.'
      name: enabled
      optional: false
      type: bool
repchannel:
  args:
    - '#channel state number'
  desc: 'Configura los ajustes de reputación específicos de un canal.'
  params:
    - desc: 'El canal a configurar.'
      name: channel
      optional: false
      type: ITextChannel
    - desc: 'El estado a definir (enabled/disabled/readonly).'
      name: state
      optional: true
      type: string
    - desc: 'El multiplicador de reputación para este canal.'
      name: multiplier
      optional: true
      type: decimal
repcheck:
  args:
    - '@user'
  desc: 'Consulta la reputación de un usuario.'
  params:
    - desc: 'El usuario cuya reputación consultar. Si es null, consulta la reputación de quien ejecuta el comando.'
      name: target
      optional: true
      type: IGuildUser
repcommandbypass:
  args:
    - commandname '@role'
  desc: 'Define roles que eluden el requisito de un comando.'
  params:
    - &ref_426
      desc: 'El nombre del comando.'
      name: commandName
      optional: false
      type: string
    - desc: 'Los roles que pueden eludir el requisito.'
      name: roles
      optional: false
      type: IRole[]
repcommandinfo:
  args:
    - commandname
  desc: 'Muestra los requisitos de reputación de un comando concreto.'
  params:
    - desc: 'El comando a consultar.'
      name: commandName
      optional: false
      type: string
repcommandreq:
  args:
    - commandname 50
    - commandname 50 helper
    - 'commandname 50 helper #channel1 #channel2'
  desc: 'Define requisitos de reputación para un comando, opcionalmente limitados a canales concretos.'
  params:
    - desc: 'El nombre del comando.'
      name: commandName
      optional: false
      type: string
    - desc: 'La reputación mínima requerida.'
      name: minReputation
      optional: false
      type: int
    - desc: 'El tipo de reputación concreto requerido (opcional; por defecto, total).'
      name: repType
      optional: true
      type: string
    - desc: 'Canales opcionales donde se aplica este requisito (si no se indica ninguno, se aplica a todo el servidor).'
      name: channels
      optional: true
      type: ITextChannel[]
repcommandreqlist:
  args:
    - ''
  desc: 'Lista todos los requisitos de comandos del servidor.'
  params: [ ]
repcommandreqremove:
  args:
    - commandname
  desc: 'Elimina los requisitos de reputación de un comando.'
  params:
    - desc: 'El nombre del comando.'
      name: commandName
      optional: false
      type: string
repconfig:
  args:
    - ''
  desc: 'Abre la interfaz interactiva de configuración de reputación.'
  params: [ ]
repcooldown:
  args:
    - minutes
  desc: 'Define el tiempo de espera predeterminado entre dar reputación.'
  params:
    - desc: 'Tiempo de espera en minutos (1-1440).'
      name: minutes
      optional: false
      type: int
repdailylimit:
  args:
    - limit
  desc: 'Define el límite diario para dar reputación.'
  params:
    - desc: 'Límite diario (1-100).'
      name: limit
      optional: false
      type: int
repdecay:
  args:
    - enabled
  desc: 'Activa o desactiva la pérdida gradual de reputación por inactividad.'
  params:
    - desc: 'True para activar la pérdida gradual.'
      name: enabled
      optional: false
      type: bool
repdecayamount:
  args:
    - amount
  desc: 'Define la cantidad de la pérdida gradual.'
  params:
    - desc: 'La cantidad de la pérdida gradual (1-100).'
      name: amount
      optional: false
      type: int
repdecayinactive:
  args:
    - days
  desc: 'Define el número de días de inactividad antes de que empiece la pérdida gradual.'
  params:
    - desc: 'Días de inactividad (1-365).'
      name: days
      optional: false
      type: int
repdecaytype:
  args:
    - type
  desc: 'Define el tipo de pérdida gradual (daily, weekly, monthly).'
  params:
    - desc: 'El tipo de pérdida gradual.'
      name: type
      optional: false
      type: string
repenable:
  args:
    - enabled
  desc: 'Activa o desactiva el sistema de reputación en este servidor.'
  params:
    - desc: 'True para activar, false para desactivar.'
      name: enabled
      optional: true
      type: bool
repeventcreate:
  args:
    - name multiplier duration
  desc: 'Crea un evento de multiplicador de reputación.'
  params:
    - desc: 'Nombre del evento.'
      name: name
      optional: false
      type: string
    - desc: 'Multiplicador de reputación.'
      name: multiplier
      optional: false
      type: decimal
    - desc: 'Duración en horas.'
      name: duration
      optional: false
      type: int
repeventend:
  args:
    - name
  desc: 'Finaliza un evento de reputación antes de tiempo.'
  params:
    - desc: 'Nombre del evento a finalizar.'
      name: name
      optional: false
      type: string
repexport:
  args:
    - ''
  desc: 'Exporta la configuración actual de reputación a JSON.'
  params: [ ]
repfreeze:
  args:
    - '@user'
  desc: 'Congela la reputación de un usuario, impidiendo que gane o pierda reputación.'
  params:
    - &ref_438
      desc: 'El usuario a congelar.'
      name: user
      optional: false
      type: IGuildUser
repgive:
  args:
    - '@user reptype text'
  desc: 'Da reputación a un usuario indicado.'
  params:
    - desc: 'El usuario al que dar reputación.'
      name: target
      optional: true
      type: IGuildUser
    - desc: 'El tipo de reputación a dar.'
      name: repType
      optional: true
      type: string
    - desc: 'Motivo o comentario opcional para dar reputación.'
      name: reason
      optional: true
      type: string
rephistory:
  args:
    - '@user'
  desc: 'Muestra el historial de reputación de un usuario.'
  params:
    - desc: 'El usuario cuyo historial mostrar. Si es null, muestra el historial de quien ejecuta el comando.'
      name: target
      optional: true
      type: IGuildUser
repimport:
  args:
    - ''
  desc: 'Importa la configuración de reputación desde un archivo JSON subido.'
  params: [ ]
replb:
  args:
    - number
  desc: 'Muestra la clasificación de reputación del servidor.'
  params:
    - &ref_436
      desc: 'El número de página a mostrar.'
      name: page
      optional: true
      type: int
repleaderboard:
  args:
    - number
  desc: 'Muestra la clasificación de reputación del servidor.'
  params:
    - desc: 'El número de página a mostrar.'
      name: page
      optional: true
      type: int
