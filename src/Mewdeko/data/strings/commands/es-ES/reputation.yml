      optional: true
      type: int
reptop:
  args:
    - number
  desc: 'Muestra la clasificación de reputación del servidor.'
  params:
    - desc: 'El número de página a mostrar.'
      name: page
      optional: true
      type: int
reptypeadd:
  args:
    - typeName displayName
  desc: 'Añade un tipo de reputación personalizado.'
  params:
    - desc: 'El nombre del tipo de reputación.'
      name: typeName
      optional: false
      type: string
    - desc: 'El nombre que se mostrará para el tipo.'
      name: displayName
      optional: false
      type: string
reptypelist:
  args:
    - ''
  desc: 'Muestra todos los tipos de reputación personalizados de este servidor.'
