      optional: false
      type: string
repunfreeze:
  args:
    - '@user'
  desc: 'Descongela la reputación de un usuario, permitiéndole volver a ganar y perder reputación.'
  params:
    - desc: 'El usuario a descongelar.'
      name: user
      optional: false
