repanon:
  args:
    - '@user reptype text'
  desc: 'Da reputación anónima a un usuario indicado.'
  params:
    - desc: 'El usuario al que dar reputación.'
      name: target
      optional: true
      type: IGuildUser
    - desc: 'El tipo de reputación a dar.'
      name: repType
