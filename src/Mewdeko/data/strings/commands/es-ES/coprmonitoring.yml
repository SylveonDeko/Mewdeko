coprmonitoradd:
  args:
    - '<ownerProject> [channel] [packages]'
    - '<ownerProject> [channel] [packages]'
    - ownerProject
  desc: 'Añade un monitor de proyecto COPR al servidor.'
  params:
    - desc: 'El proyecto COPR en formato propietario/proyecto (por ejemplo, linux4switch/l4s).'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Canal opcional para las notificaciones. Por defecto, el canal actual.'
      name: channel
      optional: true
      type: ITextChannel
    - desc: 'Lista opcional separada por comas de paquetes a vigilar (por ejemplo, mesa,kernel).'
      name: packages
      optional: true
      type: string
coprmonitorremove:
  args:
    - '<ownerProject> [channel]'
    - ownerProject
  desc: 'Elimina un monitor de proyecto COPR del servidor.'
  params:
    - desc: 'El proyecto COPR en formato propietario/proyecto.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Canal opcional del que eliminar un monitor concreto.'
      name: channel
      optional: true
      type: ITextChannel
coprmonitorlist:
  args:
    - ''
  desc: 'Lista todos los monitores COPR configurados en el servidor.'
  params: [ ]
coprmonitortoggle:
  args:
    - ownerProject
  desc: 'Activa o desactiva un monitor COPR.'
  params:
    - desc: 'El proyecto COPR en formato propietario/proyecto.'
      name: ownerProject
      optional: false
      type: string
coprnotify:
  args:
    - ownerProject status enabled
  desc: 'Configura qué estados de compilación activan notificaciones para un monitor.'
  params:
    - desc: 'El proyecto COPR en formato propietario/proyecto.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'El estado de compilación a configurar.'
      name: status
      optional: false
      type: CoprBuildStatus
    - desc: 'Si se activan o desactivan las notificaciones para este estado.'
      name: enabled
      optional: false
      type: bool
coprfilter:
  args:
    - ownerProject text
  desc: 'Define el filtro de paquetes para un monitor COPR.'
  params:
    - desc: 'El proyecto COPR en formato propietario/proyecto.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'Lista de paquetes separada por comas, o "all" para vigilarlos todos.'
      name: packages
      optional: false
      type: string
coprsucceededmessage:
  args:
    - ownerProject text
  desc: 'Define el mensaje que se muestra cuando una compilación COPR tiene éxito.'
  params:
    - desc: 'El proyecto COPR en formato propietario/proyecto.'
      name: ownerProject
      optional: false
      type: string
    - desc: 'El mensaje o código de embed. Usa "-" para volver al predeterminado.'
      name: message
      optional: false
      type: string
