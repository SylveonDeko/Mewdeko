adsarm:
  args:
    - ''
  desc: 'Activa o desactiva el borrado automático de los mensajes de publicidad de servidores.'
  params: [ ]
antialt:
  args:
    - ''
  desc: 'Configura la protección Anti-Alt del servidor, definiendo la antigüedad mínima de la cuenta y la acción de castigo, con un castigo basado en rol.'
  params: [ ]
antipattern:
  args:
    - ''
  desc: 'Configura la protección Anti-Pattern del servidor, definiendo la acción de castigo, con un castigo basado en rol.'
  params: [ ]
antipattern_PunishmentAction_=:
  args:
    - '<action> [punishTime]'
    - action
  desc: 'Configura la protección Anti-Pattern del servidor, definiendo la acción de castigo, con un castigo basado en rol.'
  params:
    - desc: 'La acción de castigo contra las coincidencias de patrón detectadas.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'La duración del castigo, si aplica.'
      name: punishTime
      optional: true
      type: StoopidTime
antipattern_PunishmentAction_IRole:
  args:
    - action @role
  desc: 'Configura la protección Anti-Pattern del servidor, definiendo la acción de castigo, con un castigo basado en rol.'
  params:
    - desc: 'La acción de castigo contra las coincidencias de patrón detectadas.'
      name: action
      optional: false
      type: PunishmentAction
    - desc: 'El rol que se asigna a los usuarios que coinciden con los patrones.'
      name: role
      optional: false
      type: IRole
patternadd:
  args:
    - '<pattern> [name] [checkUsername] [checkDisplayName]'
    - pattern
  desc: 'Añade un patrón regex a la protección Anti-Pattern.'
  params:
    - desc: 'El patrón regex a comparar con los nombres de usuario o nombres visibles.'
      name: pattern
      optional: false
      type: string
    - desc: 'Nombre opcional para el patrón.'
      name: name
      optional: true
      type: string
    - desc: 'Si se comparan los nombres de usuario con este patrón (por defecto, true).'
      name: checkUsername
      optional: true
      type: bool
    - desc: 'Si se comparan los nombres visibles con este patrón (por defecto, true).'
      name: checkDisplayName
      optional: true
      type: bool
patternremove:
  args:
    - number
  desc: 'Elimina un patrón de la protección Anti-Pattern.'
  params:
    - desc: 'El ID del patrón a eliminar.'
      name: patternId
      optional: false
      type: int
patternlist:
  args:
    - ''
  desc: 'Lista todos los patrones configurados para la protección Anti-Pattern.'
  params: [ ]
patternconfig:
  args:
    - ''
  desc: 'Muestra la configuración actual de anti-pattern.'
  params: [ ]
patternconfig_string_string:
  args:
    - setting value
  desc: 'Muestra la configuración actual de anti-pattern.'
  params:
    - desc: 'La opción a configurar.'
      name: setting
      optional: false
      type: string
    - desc: 'El valor a definir.'
      name: value
      optional: false
      type: string
