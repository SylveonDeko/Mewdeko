antiimagehash:
  args:
    - ''
    - 'Ban'
    - 'Delete 31'
    - 'Timeout 31 1d'
  desc: 'Activa la protección Anti-Image-Hash, que sanciona a quien vuelva a publicar una imagen de la lista de imágenes bloqueadas, incluidas las copias redimensionadas, volteadas, resubidas con menor calidad o con borde. Ejecútalo sin argumentos para desactivarla. La tolerancia opcional (de 0 a 64, por defecto 31) define cuánto puede diferir una imagen publicada y seguir contando como bloqueada.'
  params: [ ]
antiimagehashignore:
  args:
    - '<role>'
    - '<channel>'
  desc: 'Activa o desactiva un rol o canal como excluido de la protección Anti-Image-Hash.'
  params: [ ]
antiexternalapp:
  args:
    - ''
    - 'Timeout'
    - 'Timeout 5 5 1h'
    - 'Kick 3 0'
  desc: 'Activa la protección Anti-External-App, que vigila los mensajes que los miembros envían mediante apps que añadieron a su propia cuenta. Un mensaje se elimina y el miembro que ejecutó la app es castigado cuando menciona a demasiadas personas o roles (por defecto 5; 0 lo desactiva), menciona a everyone, contiene un enlace de invitación, o cuando el miembro usa apps más veces de las permitidas en 10 segundos (por defecto 5; 0 lo desactiva). Las apps añadidas al propio servidor no se comprueban. Ejecútalo sin argumentos para desactivarla.'
  params: [ ]
blockimage:
  args:
    - ''
    - 'mrbeast crypto scam'
    - 'Delete nsfw meme'
    - 'https://example.com/scam.png mrbeast crypto scam'
  desc: 'Bloquea una imagen para que cualquiera que la vuelva a publicar sea sancionado, incluidas las copias redimensionadas, recomprimidas, reflejadas o con borde. Adjunta la imagen, responde a un mensaje que la contenga o indica su URL. Una acción indicada antes de la etiqueta sustituye el valor predeterminado del servidor solo para esta imagen.'
  params: [ ]
unblockimage:
  args:
    - '<id>'
  desc: 'Elimina una imagen de la lista de imágenes bloqueadas por su ID, tal como lo muestra blockedimages.'
  params: [ ]
blockedimages:
  args:
    - ''
  desc: 'Lista las imágenes bloqueadas junto con cuántas veces se ha detectado cada una.'
  params: [ ]
imagehash:
  args:
    - ''
    - 'https://example.com/scam.png'
  desc: 'Muestra el hash perceptual de una imagen sin bloquearla.'
  params: [ ]
antiimagehashpreset:
  args:
    - ''
  desc: 'Activa o desactiva la lista de imágenes de estafas conocidas que incluye Mewdeko: los falsos casinos de criptomonedas y sorteos que se están difundiendo actualmente por Discord. Se bloquean junto con tu propia lista. Activado por defecto cuando Anti-Image-Hash está habilitado.'
  params: [ ]
