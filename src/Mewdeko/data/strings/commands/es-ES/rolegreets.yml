rolegreetlist:
  args:
    - ''
  desc: 'Lista todos los saludos de rol configurados en el servidor, proporcionando información detallada de cada uno.'
  params: [ ]
rolegreetmessage:
  args:
    - '<id> [message]'
    - number
  desc: 'Actualiza el contenido del mensaje de un saludo de rol. Si no se proporciona mensaje, muestra opciones para previsualizar el mensaje tal como está o verlo como texto normal.'
  params:
    - desc: 'El ID del saludo de rol a actualizar, según su posición en la lista de todos los saludos de rol.'
      name: id
      optional: false
      type: int
    - desc: 'El nuevo contenido del mensaje. Opcional.'
      name: message
      optional: true
      type: string
