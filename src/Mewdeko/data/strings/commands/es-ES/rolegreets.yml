rolegreetwebhook:
  args:
    - '<id> [name] [avatar]'
    - number
  desc: 'Configura un webhook para un mensaje de bienvenida de rol, permitiendo nombre y avatar personalizados. Si no se proporciona nombre, el webhook se deshabilita.'
  params:
    - desc: 'El ID del saludo de rol para configurar el webhook, según su posición en la lista de todos los saludos de rol.'
      name: id
      optional: false
      type: int
    - desc: 'El nombre del webhook. Opcional.'
      name: name
      optional: true
      type: string
    - desc: 'La URL del avatar para el webhook. Opcional.'
      name: avatar
      optional: true
      type: string
