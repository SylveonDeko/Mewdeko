rolegreetadd:
  args:
    - '@role [@channel]'
    - '@role'
  desc: 'Añade un nuevo mensaje de bienvenida por rol para el rol indicado. Si no se especifica canal, se usa el canal actual.'
  params:
    - desc: 'El rol para el que se establece el mensaje de bienvenida.'
      name: role
      optional: false
      type: role
    - desc: 'El canal de texto donde se enviará el mensaje de bienvenida. Opcional.'
      name: channel
      optional: true
      type: channel
