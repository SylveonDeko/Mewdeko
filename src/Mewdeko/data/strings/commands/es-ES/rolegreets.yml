rolegreetadd:
  args:
    - '@role [@channel]'
    - '@role'
  desc: 'Agrega un nuevo mensaje de bienvenida de rol para un rol específico. Si no se especifica un canal, se utiliza el canal actual.'
  params:
    - desc: 'El rol para el que se establece el mensaje de bienvenida.'
      name: role
      optional: false
      type: role
    - desc: 'El canal de texto donde se enviará el mensaje de bienvenida. Opcional.'
      name: channel
      optional: true
      type: channel
