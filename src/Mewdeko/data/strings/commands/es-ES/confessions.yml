confessionlogchannel:
  args:
    - '[@channel]'
  desc: >-
    Establece el canal de registro de confesiones para registrar confesiones.
    El uso indebido de esta función terminará conmigo a 2m de tu casa.
  params:
    - desc: 'El canal de registro de confesiones (opcional).'
      name: channel
      optional: true
      type: channel
