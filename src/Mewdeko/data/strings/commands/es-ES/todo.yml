todoadd:
  args:
    - listId
    - title
    - description
  desc: 'Añade una nueva tarea pendiente a una lista indicada'
  params:
    - desc: 'El ID de la lista de tareas pendientes.'
      name: listId
      optional: false
      type: int
    - desc: 'El título de la tarea pendiente.'
      name: title
      optional: false
      type: string
    - desc: 'Descripción opcional del elemento.'
      name: description
      optional: true
      type: string
todoaddpriority:
  args:
    - listId
    - priority
    - title
    - description
  desc: 'Añade una tarea pendiente con prioridad y fecha límite opcional'
  params:
    - desc: 'El ID de la lista de tareas pendientes.'
      name: listId
      optional: false
      type: int
    - desc: 'Nivel de prioridad (1=Bajo, 2=Medio, 3=Alto, 4=Crítico).'
      name: priority
      optional: false
      type: int
    - desc: 'El título de la tarea pendiente.'
      name: title
      optional: false
      type: string
    - desc: 'Descripción opcional del elemento.'
      name: description
      optional: true
      type: string
todoaddtag:
  args:
    - itemId
    - tag
  desc: 'Añade una etiqueta a una tarea pendiente'
  params:
    - desc: 'El ID de la tarea pendiente.'
      name: itemId
      optional: false
      type: int
    - desc: 'La etiqueta a añadir.'
      name: tag
      optional: false
      type: string
todocleardue:
  args:
    - itemId
  desc: 'Quita la fecha límite de una tarea pendiente'
  params:
    - desc: 'El ID de la tarea pendiente.'
      name: itemId
      optional: false
      type: int
todoclearreminder:
  args:
    - itemId
  desc: 'Quita el recordatorio de una tarea pendiente'
  params:
    - desc: 'El ID de la tarea pendiente.'
      name: itemId
      optional: false
      type: int
todocomplete:
  args:
    - itemId
  desc: 'Completa una tarea pendiente'
  params:
    - desc: 'El ID de la tarea pendiente.'
      name: itemId
      optional: false
      type: int
todocreatelist:
  args:
    - name
    - description
  desc: 'Crea una nueva lista de tareas pendientes'
  params:
    - desc: 'El nombre de la lista de tareas pendientes.'
      name: name
      optional: false
      type: string
    - desc: 'Descripción opcional de la lista.'
      name: description
      optional: true
      type: string
todocreateserverlist:
  args:
    - name
    - description
  desc: 'Crea una nueva lista de tareas pendientes para todo el servidor (solo administradores)'
  params:
    - desc: 'El nombre de la lista de tareas pendientes del servidor.'
      name: name
      optional: false
      type: string
    - desc: 'Descripción opcional de la lista.'
      name: description
      optional: true
      type: string
tododelete:
  args:
    - itemId
  desc: 'Elimina una tarea pendiente'
  params:
    - desc: 'El ID de la tarea pendiente.'
      name: itemId
      optional: false
      type: int
tododeletelist:
  args:
    - listId
  desc: 'Elimina una lista de tareas pendientes completa'
  params:
    - desc: 'El ID de la lista de tareas pendientes.'
      name: listId
      optional: false
      type: int
todoedit:
  args:
    - itemId
    - title
    - description
  desc: 'Edita el título y la descripción de una tarea pendiente'
  params:
    - desc: 'El ID de la tarea pendiente.'
      name: itemId
      optional: false
      type: int
    - desc: 'El nuevo título.'
      name: title
      optional: false
      type: string
    - desc: 'La nueva descripción.'
      name: description
      optional: true
      type: string
todofilter:
  args:
    - listId
    - filter
    - value
  desc: 'Filtra las tareas pendientes por etiqueta o prioridad'
  params:
    - desc: 'El ID de la lista de tareas pendientes.'
      name: listId
      optional: false
      type: int
    - desc: 'Tipo de filtro (tag o priority).'
      name: filter
      optional: false
      type: string
    - desc: 'El valor por el que filtrar.'
      name: value
      optional: true
      type: string
todogrant:
  args:
    - listId
    - '@user'
    - permissions
  desc: 'Concede permisos a un usuario para una lista de tareas pendientes (solo propietario o administrador de la lista)'
  params:
    - desc: 'El ID de la lista de tareas pendientes.'
      name: listId
      optional: false
      type: int
    - desc: 'El usuario al que conceder permisos.'
      name: user
      optional: false
      type: IUser
    - desc: 'Permisos separados por comas (view,add,edit,complete,delete,manage,all).'
      name: permissions
      optional: false
      type: string
todolists:
  args:
    - includeServer
  desc: 'Muestra todas las listas de tareas pendientes accesibles para el usuario'
  params:
    - desc: 'Si se deben incluir las listas de todo el servidor.'
      name: includeServer
      optional: true
      type: bool
todopermissions:
  args:
    - listId
  desc: 'Muestra todos los permisos de una lista de tareas pendientes'
  params:
    - desc: 'El ID de la lista de tareas pendientes.'
      name: listId
      optional: false
      type: int
todoremovetag:
  args:
    - itemId
    - tag
  desc: 'Elimina una etiqueta de una tarea pendiente'
  params:
    - desc: 'El ID de la tarea pendiente.'
      name: itemId
      optional: false
      type: int
    - desc: 'La etiqueta a eliminar.'
      name: tag
      optional: false
      type: string
todoreorder:
  args:
    - itemId
    - newPosition
  desc: 'Reordena una tarea pendiente a una nueva posición'
  params:
    - desc: 'El ID de la tarea pendiente.'
      name: itemId
      optional: false
      type: int
    - desc: 'La nueva posición (empezando por 1).'
      name: newPosition
      optional: false
      type: int
todorevoke:
  args:
    - listId
    - '@user'
  desc: 'Revoca todos los permisos de un usuario en una lista de tareas pendientes'
  params:
    - desc: 'El ID de la lista de tareas pendientes.'
      name: listId
      optional: false
      type: int
    - desc: 'El usuario al que revocar los permisos.'
      name: user
      optional: false
      type: IUser
todosearch:
  args:
    - listId
    - query
  desc: 'Busca tareas pendientes dentro de una lista'
  params:
    - desc: 'El ID de la lista de tareas pendientes.'
      name: listId
      optional: false
      type: int
    - desc: 'La consulta de búsqueda.'
      name: query
      optional: false
      type: string
todosetcolor:
  args:
    - listId
    - color
  desc: 'Establece el color de una lista de tareas pendientes'
  params:
    - desc: 'El ID de la lista de tareas pendientes.'
      name: listId
      optional: false
      type: int
    - desc: 'Código de color hexadecimal, p. ej. #ff0000.'
      name: color
      optional: false
      type: string
todosetdue:
  args:
    - itemId
    - dateString
  desc: 'Establece la fecha límite de una tarea pendiente'
  params:
    - desc: 'El ID de la tarea pendiente.'
      name: itemId
      optional: false
      type: int
    - desc: 'La fecha y hora límite.'
      name: dateString
      optional: false
      type: string
todosetreminder:
  args:
    - itemId
    - dateString
  desc: 'Establece la hora de un recordatorio para una tarea pendiente'
  params:
    - desc: 'El ID de la tarea pendiente.'
      name: itemId
      optional: false
      type: int
    - desc: 'La fecha y hora del recordatorio.'
      name: dateString
      optional: false
      type: string
todoshow:
  args:
    - listId
    - includeCompleted
  desc: 'Muestra todos los elementos de una lista de tareas pendientes'
  params:
    - desc: 'El ID de la lista de tareas pendientes.'
      name: listId
      optional: false
      type: int
    - desc: 'Si se deben incluir los elementos completados.'
      name: includeCompleted
      optional: true
      type: bool
todotoggleprivacy:
  args:
    - listId
  desc: 'Alterna el ajuste de privacidad de una lista de tareas pendientes'
  params:
    - desc: 'El ID de la lista de tareas pendientes.'
      name: listId
      optional: false
      type: int