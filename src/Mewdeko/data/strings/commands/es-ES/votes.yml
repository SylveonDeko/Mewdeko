votechannel:
  args:
    - channel
  desc: >-
    Establece el canal de texto especificado como canal de votos donde se
    enviarán todas las confirmaciones de voto.
  params:
    - &ref_646
      desc: 'El canal de texto a establecer como canal de votos.'
      name: channel
      optional: false
      type: ITextChannel
