votes:
  args:
    - '[@user]'
  desc: >-
    Muestra el número total de votos emitidos por un usuario específico o el
    invocador del comando.
  params:
    - desc: 'El usuario cuyos votos contar. Si es nulo, cuenta los votos del invocador del comando.'
      name: user
      optional: true
      type: user
votesleaderboard:
  args:
