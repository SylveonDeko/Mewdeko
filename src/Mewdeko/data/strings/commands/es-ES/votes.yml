votemessage:
  args:
    - '[message]'
  desc: 'Establece un mensaje personalizado que se enviará cuando un usuario vote o previsualice el mensaje de voto actual.'
  params:
    - desc: 'El mensaje personalizado de voto que se establecerá. Usa "-" para restablecer el mensaje predeterminado. Si es null, previsualiza el mensaje de voto actual.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: 'Inicia un proceso de confirmación para establecer una nueva contraseña de voto, advirtiendo al usuario sobre su seguridad.'
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: 'Añade un rol que se concederá a los usuarios al votar, con una duración opcional tras la cual el rol se quitará automáticamente.'
  params:
    - desc: 'El rol que se añadirá como recompensa por votar.'
      name: role
      optional: false
      type: role
    - desc: 'La duración durante la cual se concederá el rol. Null para indefinido.'
      name: time
      optional: true
      type: duration
