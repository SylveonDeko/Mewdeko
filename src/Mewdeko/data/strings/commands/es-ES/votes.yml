votemessage:
  args:
    - '[message]'
  desc: >-
    Establece un mensaje personalizado para enviar cuando un usuario vota o
    previsualiza el mensaje de voto actual.
  params:
    - desc: 'El mensaje personalizado para votos. Usa "-" para restablecer al mensaje predeterminado. Si es nulo, previsualiza el mensaje de voto actual.'
      name: message
      optional: true
      type: string
votepassword:
  args:
    - ''
  desc: >-
    Inicia un proceso de confirmación para establecer una nueva contraseña de
    voto, advirtiendo al usuario sobre su seguridad.
  params: [ ]
voteroleadd:
  args:
    - '@role [time]'
    - '@role'
  desc: >-
    Añade un rol que se otorgará a los usuarios cuando voten, con una duración
    opcional para que el rol se elimine automáticamente.
  params:
    - desc: 'El rol a añadir como recompensa de voto.'
      name: role
      optional: false
      type: role
    - desc: 'La duración para la que se otorgará el rol. Nulo para indefinido.'
      name: time
      optional: true
      type: duration
