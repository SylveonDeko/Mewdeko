votechannel:
  args:
    - channel
  desc: 'Establece el canal de texto indicado como canal de votación, donde se enviarán todas las confirmaciones de voto.'
  params:
    - &ref_646
      desc: 'El canal de texto que se establecerá como canal de votación.'
      name: channel
      optional: false
      type: ITextChannel
