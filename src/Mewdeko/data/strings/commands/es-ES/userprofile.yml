deleteuserstatsdata:
  args:
    - ''
  desc: 'Elimina los datos de estadísticas de comandos del usuario.'
  params: [ ]
greetdmoptout:
  args:
    - ''
  desc: 'Permite a un usuario alternar la opción de no recibir mensajes directos de bienvenida. Solo funciona si el servidor al que se une utiliza mewdeko para saludos por DM.'
  params: [ ]
profile:
  args:
    - '[@user]'
  desc: 'Muestra el perfil del usuario o el perfil de otro usuario si se especifica.'
  params:
    - desc: 'El usuario cuyo perfil se mostrará. Si es nulo, muestra el perfil del invocador.'
      name: user
      optional: true
      type: user
