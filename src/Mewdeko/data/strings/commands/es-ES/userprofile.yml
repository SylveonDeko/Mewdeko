      name: user
      optional: true
      type: user
pronounsforceclear:
  args:
    - '@user true|false text'
    - true|false text
  desc: 'Borra forzosamente los pronombres de un usuario por ID, opcionalmente marcándolos como deshabilitados por abuso.'
  params:
    - &ref_356
      desc: 'El ID del usuario cuyos pronombres se borrarán.'
      name: user
      optional: true
      type: IUser
    - &ref_357
      desc: 'Si los pronombres se están deshabilitando por abuso.'
      name: pronounsDisabledAbuse
      optional: false
      type: bool
    - &ref_358
      desc: 'El motivo de la acción.'
      name: reason
      optional: false
      type: string
