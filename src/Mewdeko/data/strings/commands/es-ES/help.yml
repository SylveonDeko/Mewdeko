commands:
  args:
    - '[module]'
    - '[module] [search]'
  desc: >-
    Muestra los comandos de un módulo concreto, opcionalmente acotados por un término de búsqueda. Si es null, es un alias de modules, que a su vez es un alias de help.
  params:
    - desc: 'El módulo que se va a consultar, opcionalmente seguido de un término para filtrar sus comandos'
      name: module
      optional: true
      type: string
