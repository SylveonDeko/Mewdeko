customafkmessage:
  args:
    - text
  desc: >-
    Establece un embed AFK personalizado que se mostrara cuando un usuario este
    AFK. Usa "-" para restablecer al embed predeterminado. Consulta
    https://eb.mewdeko.tech para el constructor de embeds y
    http://mewdeko.tech/placeholders para los marcadores.
  params:
    - &ref_175
      desc: 'El mensaje personalizado a establecer. Usa "-" para restablecer al mensaje predeterminado.'
      name: embedCode
      optional: false
      type: string
