afktimeout:
  args:
    - time
  desc: >-
    Establece la duracion del tiempo de espera antes de que un usuario deje de
    ser considerado AFK. Se activa cuando un usuario envia un mensaje o escribe
    en un canal.
  params:
    - &ref_53
      desc: 'La duracion del tiempo de espera para el estado AFK.'
      name: time
      optional: false
      type: StoopidTime
