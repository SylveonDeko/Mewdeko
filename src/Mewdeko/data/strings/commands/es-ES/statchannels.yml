statchannelcreate:
  args:
    - 'TotalMembers [template]'
  desc: 'Crea un nuevo canal de voz bloqueado que muestra una estadística del servidor. El bot creará y gestionará el canal.'
  params:
    - desc: 'El tipo de estadística a mostrar.'
      name: type
      optional: false
      type: StatChannelType
    - desc: 'La plantilla de visualización. Usa %count% para el valor.'
      name: template
      optional: true
      type: string
statchanneladd:
  args:
    - '#voice-channel TotalMembers [template]'
  desc: 'Añade un canal de voz como canal de estadísticas. Tipos: TotalMembers, HumanMembers, BotCount, OnlineMembers, ChannelCount, RoleCount, BoostCount, BoostLevel, EmojiCount.'
  params:
    - desc: 'El canal de voz a usar.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'El tipo de estadística a mostrar.'
      name: type
      optional: false
      type: StatChannelType
    - desc: 'La plantilla de visualización. Usa %count% para el valor.'
      name: template
      optional: true
      type: string
statchannelrole:
  args:
    - '#voice-channel @role [template]'
  desc: 'Añade un canal de estadísticas que muestra cuántos miembros tienen un rol concreto.'
  params:
    - desc: 'El canal de voz a usar.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'El rol del que contar miembros.'
      name: role
      optional: false
      type: IRole
    - desc: 'La plantilla de visualización. Usa %count% y %role.name%.'
      name: template
      optional: true
      type: string
statchannelcountdown:
  args:
    - '#voice-channel 2026-12-31 [template]'
  desc: 'Añade un canal de estadísticas de cuenta atrás. Usa los marcadores %days% y %hours%.'
  params:
    - desc: 'El canal de voz a usar.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'La fecha objetivo de la cuenta atrás.'
      name: date
      optional: false
      type: DateTime
    - desc: 'La plantilla de visualización. Usa %days% y %hours%.'
      name: template
      optional: true
      type: string
statchannelgoal:
  args:
    - '#voice-channel 1000 [template]'
  desc: 'Añade un canal de estadísticas de objetivo de miembros. Usa %count%, %goal% y %goal.percent%.'
  params:
    - desc: 'El canal de voz a usar.'
      name: channel
      optional: false
      type: IVoiceChannel
    - desc: 'El número objetivo de miembros.'
      name: goal
      optional: false
      type: int
    - desc: 'La plantilla de visualización. Usa %count%, %goal%, %goal.percent%.'
      name: template
      optional: true
      type: string
statchannelremove:
  args:
    - '#voice-channel'
  desc: 'Elimina un canal de estadísticas.'
  params:
    - desc: 'El canal de voz que se eliminará.'
      name: channel
      optional: false
      type: IVoiceChannel
statchannellist:
  args:
    - ''
  desc: 'Muestra todos los canales de estadísticas de este servidor.'
  params: [ ]
statchanneltwitchcounter:
  args:
    - '#voice-channel counter [template]'
  desc: 'Configura un canal de estadísticas para mostrar un contador de Twitch.'
statchannelmechanism:
  args:
    - '#voice-channel Rename|Recreate|Auto [interval-minutes]'
  desc: 'Establece el mecanismo de actualización de un canal de estadísticas.'
statchannelstyle:
  args:
    - '#voice-channel Plain|Comma|Abbreviated|ProgressBar'
  desc: 'Establece el estilo de visualización de un canal de estadísticas.'
statchanneldefaults:
  args:
    - '[Rename|Recreate|Auto] [interval-minutes] [Plain|Comma|Abbreviated|ProgressBar]'
  desc: 'Muestra la configuración predeterminada de los canales de estadísticas.'
statchanneltypes:
  args:
    - ''
  desc: 'Muestra los tipos de canal de estadísticas disponibles.'
