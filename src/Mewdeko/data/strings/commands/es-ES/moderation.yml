banprune:
  args:
    - ''
  desc: 'Muestra la purga que usaría un baneo emitido en este canal, junto con todos los ajustes configurados.'
  params:
    - { }
banpruneset:
  args:
    - '<action> <days> [#channel]'
  desc: 'Define cuántos días de mensajes borra cada acción de baneo. Usa "all" para todas las acciones, y indica un canal o categoría para cambiar solo ese ámbito.'
  params:
    - desc: 'La clave de la acción, o "all" para cubrir todas las acciones'
      name: action
      optional: false
      type: string
    - desc: 'Los días de purga, de 0 a 7'
      name: days
      optional: false
      type: int
    - desc: 'Un canal o categoría al que limitar el ajuste, o nada para el valor predeterminado del servidor'
      name: target
      optional: true
      type: channel
banpruneclear:
  args:
    - '<action> [#channel]'
  desc: 'Elimina un ajuste de purga para que la acción vuelva a un ámbito más amplio o a su valor predeterminado.'
  params:
    - desc: 'La clave de la acción, o "all" para el ajuste que cubre todas las acciones'
      name: action
      optional: false
      type: string
    - desc: 'El canal o categoría donde está el ajuste, o nada para el valor predeterminado del servidor'
      name: target
      optional: true
      type: channel
banprunereset:
  args:
    - ''
  desc: 'Elimina todos los ajustes de purga del servidor.'
  params:
    - { }
ban:
  args:
    - '<pruneTime> <time> [@user] [msg]'
    - time time
  desc: 'Banea a un usuario con el motivo y los días de mensajes a purgar indicados.'
  params:
    - desc: 'Banea a un usuario con el motivo y los días de mensajes a purgar indicados.'
      name: pruneTime
      optional: false
      type: duration
    - desc: 'La cantidad de tiempo para purgar mensajes'
      name: time
      optional: false
      type: duration
    - desc: 'El usuario a banear'
      name: user
      optional: true
      type: user
    - desc: 'El motivo del baneo'
      name: msg
      optional: true
      type: string
